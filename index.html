        notifyStatus: { enabled: false, count: 0, added: 0, pending: 0, noDate: 0, failed: 0, lastScheduled: 0, lastError: '' },
        // 云端代发（P2+）：状态 + 表单字段
        relayStatus: { enabled: false, count: 0, lastRun: 0, lastError: '', backendError: '' },
        relayToken: '', relayVaultId: '',
      };
    },
    mounted() {
      this.loadHealth();
      // 记忆上次筛选状态：选中的习惯 + 月/年切换（仅前端 UI 状态，不改业务数据）
      try {
        const hid = localStorage.getItem('mindpocket:stats:habitId');
        const tb = localStorage.getItem('mindpocket:stats:tab');
        if (tb) this.tab = tb;
        if (hid) this.chartHabitId = hid;
      } catch (e) {}
      if (!this.chartHabitId && this.habits.length) this.chartHabitId = this.habits[0]._id;
      // 板块折叠状态：每次进入页面强制默认展开（全局规则），不读取本地缓存
      // 手机提醒推送：绑定状态到 UI
      if (window.MPNotify) window.MPNotify.onStatus((s) => { this.notifyStatus = Object.assign({}, this.notifyStatus, s); });
      // 云端代发：绑定状态到 UI，并预填已保存配置
      if (window.MPRelay) {
        this.relayToken = window.MPRelay.cfg.token || '';
        this.relayVaultId = window.MPRelay.cfg.id || '';
        window.MPRelay.onStatus((s) => { this.relayStatus = Object.assign({}, this.relayStatus, s); });
      }
    },
    computed: {
      today() { return this.$store.util.todayStr(); },
      habits() { return this.$store.state.habits.filter(h => !h.is_archived); }, // 统计下拉仅展示未归档活跃习惯
      monthGrid() {
        const first = new Date(this.year, this.month - 1, 1);
        const startWeek = first.getDay();
        const daysInMonth = new Date(this.year, this.month, 0).getDate();
        const cells = [];
        for (let i = 0; i < startWeek; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = this.year + '-' + String(this.month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
          cells.push({ date: ds, day: d, pct: this.$store.dayCompletion(ds) });
        }
        return cells;
      },
      yearGrid() {
        const out = [];
        for (let m = 1; m <= 12; m++) {
          let total = 0, cnt = 0;
          const dim = new Date(this.year, m, 0).getDate();
          for (let d = 1; d <= dim; d++) {
            const ds = this.year + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            const p = this.$store.dayCompletion(ds);
            if (p !== null) { total += p; cnt++; }
          }
          out.push({ m, pct: cnt ? Math.round(total / cnt) : null });
        }
        return out;
      },

      // 已归档项目（底层独立表，仅在此 UI 聚合展示；搜索关键词同时匹配项目名称/截止日）
      archivedProjects() {
        const k = (this.archKeyword || '').trim().toLowerCase();
        return this.$store.state.projects.filter(p => p.status === 'archive' && !p.deleted_at &&
          (!k || (p.name || '').toLowerCase().includes(k) || (p.deadline || '').toLowerCase().includes(k)
            || (p.desc || '').toLowerCase().includes(k) || (p.material_notes || '').toLowerCase().includes(k) || (p.material_link || '').toLowerCase().includes(k)
            || (Array.isArray(p.tags) && p.tags.some(tg => String(tg || '').toLowerCase().includes(k) || String(tg || '').replace(/^#+/, '').toLowerCase().includes(k)))));
      },
      // 归档列表（UI 展示）：基础列表 + 日期/区间筛选 + 关键词（关键词已在 buildArchBase 应用）
      archList() {
        let out = this.buildArchBase(this.archKeyword);
        if (this.archSelDate) return out.filter(t => t._date && t._date.startsWith(this.archSelDate));
        if (this.archRange.start && this.archRange.end) return out.filter(t => t._date && t._date >= this.archRange.start && t._date <= this.archRange.end);
        return out;
      },
      // —— 纵向时间线（统计页 · 全局已归档仓库）：选中日期 + 配置了提醒时间的归档任务/子任务 ——
      // 仅当 archSelDate 命中时计算；无提醒时间的归档任务仍只在下方归档列表展示，不进时间线。
      archTimeline() {
        if (!this.archSelDate) return [];
        const sel = this.archSelDate, today = this.today, out = [];
        this.$store.state.tasks.forEach(t => {
          if (!t || !t.is_archived) return;
          if (this.$store.archiveDateOf(t) === sel && this.hasRemind(t)) out.push(this.tlItemOf(t, 'task', null, today));
          (t.sub_tasks || []).forEach(s => {
            if (!s || !s.is_archived) return;
            if (this.$store.archiveDateOf(s) === sel && this.hasRemind(s)) out.push(this.tlItemOf(s, 'subtask', t, today));
          });
        });
        out.sort((a, b) =>
          this.$store.remindMinutes(a.raw) - this.$store.remindMinutes(b.raw) ||
          (a.title < b.title ? -1 : (a.title > b.title ? 1 : 0)));
        return out;
      },
      // 当日总耗时（小时，1 位小数）：时间线全部条目的时长之和
      tlDailyTotal() {
        const mins = this.archTimeline.reduce((a, it) => a + this.tlDurMin(it.raw), 0);
        return (mins / 60).toFixed(1);
      },
      // 时间线中的周期/区间任务（供底部汇总入口）
      tlCycleTasks() { return this.archTimeline.filter(it => it.isCycle); },
      // 归档筛选状态文案：跟随选中时间粒度动态生成
      //   整年(YYYY)   →「YYYY年 全年归档」
      //   月份(YYYY-MM)→「YYYY年M月 当月归档」
      //   日期(YYYY-MM-DD)→「YYYY-MM-DD 当天归档」
      //   空 → 隐藏
      archSelLabel() {
        if (!this.archSelDate) return '';
        const d = this.archSelDate;
        if (d.length <= 4) return '已筛选 ' + d + '年 全年归档';
        if (d.length <= 7) {
          const parts = d.split('-');
          return '已筛选 ' + parts[0] + '年' + parseInt(parts[1], 10) + '月 当月归档';
        }
        return '已筛选 ' + d + ' 当天归档';
      },

      // —— 归档仓库 MiniCal 日历点阵 ——
      // 月视图：当月日历格子，每格含日期和归档条目数
      archMonthGrid() {
        const first = new Date(this.archYear, this.archMonth - 1, 1);
        const startWeek = first.getDay();
        const daysInMonth = new Date(this.archYear, this.archMonth, 0).getDate();
        const today = this.today;
        const cells = [];
        for (let i = 0; i < startWeek; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = this.archYear + '-' + String(this.archMonth).padStart(2, '0') + '-' + String(d).padStart(2, '0');
          cells.push({
            date: ds, day: d,
            count: this.$store.archivedCountOnDate(ds),
            isToday: ds === today,
            isSel: ds === this.archSelDate,
          });
        }
        return cells;
      },
      // 年视图：12 个月热力图，每月显示归档条目总数
      archYearGrid() {
        const out = [];
        for (let m = 1; m <= 12; m++) {
          let total = 0;
          const dim = new Date(this.archYear, m, 0).getDate();
          for (let d = 1; d <= dim; d++) {
            const ds = this.archYear + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            total += this.$store.archivedCountOnDate(ds);
          }
        const ms = this.archYear + '-' + String(m).padStart(2, '0');
        out.push({ m, monthStr: ms, total, isSel: ms === this.archSelDate });
      }
      return out;
    },
    // 年视图选中月份的归档任务：按一级标签分组，累加「完成总时长」统计占比（用于饼图）
    archMonthPieData() {
      if (!this.archSelMonth) return null;
      const palette = ['#6a7bff', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#06b6d4', '#ef4444', '#84cc16'];
      const map = {};
      // 饼图统计不受搜索关键词影响：以空关键词构建归档列表（仅分类/月份筛选），搜索只过滤下方列表 UI
      this.buildArchBase('').filter(t => t._date && t._date.startsWith(this.archSelMonth) && (t._type === 'task' || t._type === 'subtask'))
        .forEach(t => {
          const dur = this.tlDurMin(t);
          if (dur <= 0) return; // ① 无完成时长：不计入饼图，归入"无时长"分类，不混入"无分类"
          // 取一级标签：$archTagList 返回 ['一级│二级│三级']，取第一个 / 前的部分
          const tags = this.$archTagList(t);
          let tag = '无分类'; // ② 无一级标签 → 归类【无分类】，累加自身时长
          if (tags.length && tags[0]) {
            const first = tags[0].split('│')[0].trim();
            if (first) tag = first;
          }
          if (!map[tag]) map[tag] = { duration: 0 };
          map[tag].duration += dur;
        });
      const arr = Object.entries(map).map(([name, v]) => ({ name, duration: v.duration }));
      if (!arr.length) return null; // 空状态：该时间范围内没有带时长的归档任务
      const total = arr.reduce((a, x) => a + x.duration, 0);
      let acc = 0;
      return arr.map((x, i) => {
        const ratio = total > 0 ? x.duration / total : 0;
        const slice = { name: x.name, duration: x.duration, pct: total > 0 ? Math.round(ratio * 100) : 0, color: palette[i % palette.length], ratio };
        acc += ratio; return slice;
      });
    },
    archMonthPieGradient() {
      if (!this.archMonthPieData || !this.archMonthPieData.length) return 'conic-gradient(#eef0f5 0deg 360deg)';
      let acc = 0;
      const parts = this.archMonthPieData.map(s => { const a0 = acc * 360, a1 = (acc + s.ratio) * 360; acc += s.ratio; return s.color + ' ' + a0.toFixed(2) + 'deg ' + a1.toFixed(2) + 'deg'; });
      return 'conic-gradient(' + parts.join(', ') + ')';
    },
    archMonthPieTitle() {
      if (!this.archSelMonth) return '';
      const p = this.archSelMonth.split('-');
      return p[0] + '年' + String(parseInt(p[1], 10)).padStart(2, '0') + '月 归档任务一级标签【完成时长占比分布】';
    },
    // 本周（周一~周日）范围
      weekRange() {
        const today = this.$store.util.todayStr();
        const dow = (new Date().getDay() + 6) % 7; // 周一=0
        const start = this.$store.util.addDays(today, -dow);
        const end = this.$store.util.addDays(start, 6);
        return { start, end };
      },

      // 本周概览聚合数据（演示模式返回示例数据）
      weekOverview() {
        if (this.demoMode) {
          const demo = {
            demo: true, hasData: true,
            weekly: [3, 5, 2, 4, 6, 1, 2], total: 23,
            ringPct: 80, ringX: 8, ringY: 10,
            catDist: [{ name: '习惯', count: 9 }, { name: '项目子任务', count: 7 }, { name: '普通待办', count: 5 }, { name: '临时任务', count: 2 }],
          };
          demo.timeBars = demo.catDist;
          return demo;
        }
        const { start, end } = this.weekRange;
        const byDay = {};
        const QV = this.$store.getQuickViewCatId();
        const inWeek = d => d >= start && d <= end;
        // 四大类完成数量
        let habitDone = 0, subDone = 0, normalDone = 0, quickDone = 0;
        // 习惯：本周内打卡（status=success/record；含已归档习惯的历史记录，完整保留统计）
        this.$store.state.habits.forEach(h => {
          (h.records || []).forEach(r => {
            if (inWeek(r.date) && (r.status === 'success' || r.status === 'record')) habitDone++;
          });
        });
        // 任务：完成 = 归档，按归档日期计入本周；临时任务（category_id=QUICK_VIEW_ID）单列一类
        this.$store.state.tasks.forEach(t => {
          const addDone = () => { if (t.category_id === QV) quickDone++; else normalDone++; };
          if (t.cycle) {
            (t.cycle_history || []).forEach(h => {
              if (h.is_archived && inWeek(h.execute_date)) { addDone(); byDay[h.execute_date] = (byDay[h.execute_date] || 0) + 1; }
            });
          } else if (t.is_archived) {
            const d = this.$store.archiveDateOf(t);
            if (inWeek(d)) { addDone(); byDay[d] = (byDay[d] || 0) + 1; }
          }
        });
        // 项目子任务：已完成数量（sub_done 或 计数达 100%）；无完成日期字段，按当前完成快照计入
        this.$store.state.project_subs.forEach(s => { if (this.$store.isSubComplete(s)) subDone++; });
        const order = [1, 2, 3, 4, 5, 6, 0]; // getDay 值：周一~周日
        const weekly = order.map(ow => {
          let sum = 0;
          for (const ds in byDay) if (this.$store.util.parseDate(ds).getDay() === ow) sum += byDay[ds];
          return sum;
        });
        // 「完成任务 X 件」= 四大类已完成的合计；归档数据同样纳入（上面统计已含归档）
        const total = habitDone + subDone + normalDone + quickDone;
        const catDist = [
          { name: '习惯', count: habitDone },
          { name: '项目子任务', count: subDone },
          { name: '普通待办', count: normalDone },
          { name: '临时任务', count: quickDone },
        ];
        // 今日习惯完成率（x/y 件）
        const today = this.$store.util.todayStr();
        const applicable = this.$store.state.habits.filter(h => !this.$store.util.inHolidayRanges(today, h.holiday_ranges || []));
        let x = 0;
        applicable.forEach(h => {
          const rec = (h.records || []).find(r => r.date === today);
          if (h.type === 'SOP_HABIT') { if (rec && rec.status === 'success') x++; }
          else if (h.type === 'QUIT_HABIT') { if (!rec || rec.status !== 'fail') x++; }
        });
        const y = applicable.length;
        return {
          demo: false, hasData: total > 0,
          weekly, total, ringPct: y ? Math.round(x / y * 100) : 0, ringX: x, ringY: y,
          catDist, timeBars: catDist,
        };
      },
      weeklyMax() { return Math.max(1, ...this.weekOverview.weekly); },
      timeMax() { return Math.max(1, ...this.weekOverview.timeBars.map(c => c.count)); },
      // 任务类型分布：仅展示统计值 > 0 的项（零值不渲染，避免空白占位）；后端四类计算逻辑不变
      catDistShown() { return (this.weekOverview.catDist || []).filter(c => c.count > 0); },
      ringCirc() { return 2 * Math.PI * 24; },
      chartData() {
        if (!this.chartHabitId) return null;
        const h = this.$store.findHabit(this.chartHabitId);
        if (this.tab === 'year') {
          const byMonth = [];
          for (let m = 1; m <= 12; m++) byMonth.push(this.$store.habitCount(this.chartHabitId, this.year, m));
          const annual = byMonth.reduce((a, b) => a + b, 0);
          return { name: h.name, mode: 'year', byMonth, annual };
        }
        // 月视图：按当月每一天统计该习惯的完成次数
        const dim = new Date(this.year, this.month, 0).getDate();
        const byDay = [];
        for (let d = 1; d <= dim; d++) {
          const ds = this.year + '-' + String(this.month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
          byDay.push(this.dayHabitCount(h, ds));
        }
        const monthTotal = byDay.reduce((a, b) => a + b, 0);
        return { name: h.name, mode: 'month', byDay, dim, monthTotal };
      },
      selectedHabit() { return this.chartHabitId ? this.$store.findHabit(this.chartHabitId) : null; },
      // 打卡日期清单：按当前月/年视图筛选选中习惯的已完成日期（只读，不修改原始数据）
      habitCheckinList() {
        const h = this.selectedHabit;
        if (!h || !h.records) return [];
        const set = new Set();
        h.records.forEach(r => {
          let ok = false;
          if (h.type === 'SOP_HABIT') ok = r.status === 'success';
          else if (h.type === 'QUIT_HABIT') ok = r.status !== 'fail';
          else if (h.type === 'RECORD_HABIT') ok = r.status === 'record';
          if (ok) set.add(r.date);
        });
        let list = Array.from(set);
        const prefix = this.tab === 'month'
          ? this.year + '-' + String(this.month).padStart(2, '0') + '-'
          : String(this.year) + '-';
        list = list.filter(d => d.indexOf(prefix) === 0);
        return list.sort();
      },
    },
    watch: {
      // 记忆前端 UI 筛选状态（不改动任何业务数据）
      tab() { this.persistStatsState(); },
      chartHabitId() { this.persistStatsState(); },
    },
    methods: {
      color(p) { if (p === null) return '#eee'; if (p >= 80) return '#2ecc71'; if (p >= 50) return '#f1c40f'; if (p > 0) return '#e67e22'; return '#e74c3c'; },
      // 归档仓库基础列表（任务 / 习惯 / 项目 / 子任务 四表聚合为带类型标记的只读对象）
      // 受「全部类型」折叠筛选与分类筛选约束；关键词模糊匹配（命中即保留，大小写不敏感）
      // 拆出为方法：archList 以搜索关键词构建、archMonthPieData 以空关键词构建（饼图不受搜索框影响）
      buildArchBase(keyword) {
        const out = [];
        const k = (keyword || '').trim().toLowerCase();
        const showTask = this.archType === 'all' || this.archType === 'task';
        const showHabit = this.archType === 'all' || this.archType === 'habit';
        const showProj = this.archType === 'all' || this.archType === 'project';
        const norm = (obj, type) => Object.assign({}, obj, {
          _type: type,
          _id: type === 'project' ? (obj.pid || obj._id) : (obj._id || obj.pid),
          _title: type === 'project' ? (obj.name || '') : (obj.title || ''),
          _typeLabel: type === 'task' ? '任务' : (type === 'habit' ? '习惯' : (type === 'project' ? '项目' : '子任务')),
          _date: type === 'project' ? (obj.archived_at || '') : this.$store.archiveDateOf(obj),
        });
        // 任务 & 子任务（子任务与任务同属「任务」维度）
        if (showTask) {
          this.$store.getArchivedTasks(this.archCat, k)
            .forEach(t => out.push(norm(t, 'task')));
          // 已归档子任务：扁平化并入（沿用父任务分类/标题参与筛选）
          this.$store.getArchivedSubTasks(this.archCat, k)
            .forEach(s => out.push(norm(s, 'subtask')));
        }
        // 习惯：独立筛选，仅在「全部分类」下并入（习惯无分类归属）
        if (showHabit && (!this.archCat || this.archCat === '__all__')) {
          this.$store.getArchivedHabits(k)
            .forEach(h => out.push(norm(h, 'habit')));
        }
        if (showProj) {
          this.$store.state.projects
            .filter(p => p.status === 'archive' && !p.deleted_at &&
              (!k || (p.name || '').toLowerCase().includes(k) || (p.deadline || '').toLowerCase().includes(k)
                || (p.desc || '').toLowerCase().includes(k) || (p.material_notes || '').toLowerCase().includes(k) || (p.material_link || '').toLowerCase().includes(k)
                || (Array.isArray(p.tags) && p.tags.some(tg => String(tg || '').toLowerCase().includes(k) || String(tg || '').replace(/^#+/, '').toLowerCase().includes(k)))))
            .forEach(p => out.push(norm(p, 'project')));
        }
        return out;
      },
      dayHabitCount(h, dateStr) {
        return h.records.filter(r => {
          if (r.date !== dateStr) return false;
          if (h.type === 'SOP_HABIT') return r.status === 'success';
          if (h.type === 'QUIT_HABIT') return r.status !== 'fail';
          if (h.type === 'RECORD_HABIT') return r.status === 'record';
          return false;
        }).length;
      },
      maxMonth() { return this.chartData && this.chartData.byMonth ? Math.max(1, ...this.chartData.byMonth) : 1; },
      maxDay() { return this.chartData && this.chartData.byDay ? Math.max(1, ...this.chartData.byDay) : 1; },
      // 习惯图表顶部时间选择器：左右箭头导航（与全局已归档仓库 MiniCal 头部同逻辑）
      // 月模式：切换月份（跨年自动滚动）；年模式：切换年份；不改变打卡数据与图表渲染逻辑
      navHabit(dir) {
        if (this.tab === 'year') { this.year += dir; return; }
        let y = this.year, m = this.month + dir;
        if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
        this.year = y; this.month = m;
      },
      openChart(h) { this.chartHabitId = h._id; },
      selectHabit(h) { this.chartHabitId = h._id; this.showHabitPicker = false; },
      // 习惯标题（图表区）：单击展开下拉（原行为不变），长按唤起编辑习惯弹窗
      onTitleDown(e) {
        this.suppressTitleClick = false;
        if (this.titleTimer) clearTimeout(this.titleTimer);
        try { if (e && e.currentTarget) e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        this.titleTimer = setTimeout(() => {
          this.suppressTitleClick = true;
          if (this.chartHabitId) { this.editHabitId = this.chartHabitId; this.showHabitEdit = true; }
        }, 500);
      },
      onTitleMove() { if (this.titleTimer) { clearTimeout(this.titleTimer); this.titleTimer = null; } },
      onTitleUp() { if (this.titleTimer) { clearTimeout(this.titleTimer); this.titleTimer = null; } },
      onTitleClick() {
        if (this.suppressTitleClick) { this.suppressTitleClick = false; return; }
        this.showHabitPicker = !this.showHabitPicker;
      },
      // —— 归档仓库统一手势：长按=详情/编辑（项目=操作弹窗）；左滑=撤销归档（形式与项目页已归档 Tab 一致）——
      onArchRowDown(item, ev) {
        if (this.archLongTimer) clearTimeout(this.archLongTimer);
        this.archDragId = item._id;
        this.archStartX = ev.clientX;
        this.archX = 0;
        this.archMoved = false;
        this.archSuppressClick = false;
        this.archHintId = null;
        this.archHintSide = '';
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
        this.archLongTimer = setTimeout(() => {
          this.archSuppressClick = true;
          if (item._type === 'project') this.openArchProjMenu(item);
          else this.openArchDetail(item);
        }, 500);
      },
      onArchRowMove(ev) {
        if (this.archDragId == null) return;
        const dx = ev.clientX - this.archStartX;
        if (Math.abs(dx) > 8) {
          if (this.archLongTimer) { clearTimeout(this.archLongTimer); this.archLongTimer = null; }
          this.archMoved = true;
        }
        if (!this.archMoved) return;
        // 仅支持左滑（撤销归档）：卡片左移，右侧露出绿色提示
        if (dx < 0) { this.archX = Math.max(dx, -88); this.archHintId = this.archDragId; this.archHintSide = 'right'; }
        else { this.archX = 0; this.archHintId = null; this.archHintSide = ''; }
      },
      onArchRowUp() {
        if (this.archLongTimer) { clearTimeout(this.archLongTimer); this.archLongTimer = null; }
        if (this.archDragId == null) return;
        if (this.archMoved) {
          const TH = 44; // 触发阈值：轻微拖动不误触发
          if (Math.abs(this.archX) >= TH) this.execArchUndo(this.archDragId);
          this.archX = 0;
        }
        this.archDragId = null;
        this.archHintId = null;
        this.archHintSide = '';
        if (this.archSuppressClick) setTimeout(() => { this.archSuppressClick = false; }, 0);
      },
      onArchRowMainClick(item) {
        if (this.archMoved) return;                               // 滑动后的附带 click 忽略
        if (this.archSuppressClick) { this.archSuppressClick = false; return; } // 长按已消费，不再触发单击
        // 项目条目：单击打开项目详情页；任务/习惯：单击无额外动作（长按打开详情）
        if (item._type === 'project') location.hash = '#/project/' + item._id;
      },
      archHintDir(id) { return this.archHintId === id ? this.archHintSide : ''; },
      archHintText(id) { if (this.archHintId !== id) return ''; return '撤销归档'; },
      execArchUndo(id) {
        const item = this.findArchItem(id);
        if (!item) return;
        if (item._type === 'task') this.$store.setArchived(item._id, null, false);
        else if (item._type === 'habit') this.$store.unarchiveHabit(item._id);
        else if (item._type === 'subtask') this.$store.setArchived(item._parentId, item._id, false);
        else if (item._type === 'project') this.$store.reopenProject(item._id);
        this.showToast('已撤销归档');
        this.vibrate();
      },
      findArchItem(id) { return this.archList.find(x => x._id === id); },
      openArchDetail(item) {
        if (!item) return;
        if (item._type === 'task') this.detailId = item._id;
        else if (item._type === 'habit') { this.editHabitId = item._id; this.showHabitEdit = true; }
        else if (item._type === 'subtask') this.detailId = item._parentId; // 子任务无独立详情页：长按打开所属父任务详情
        else if (item._type === 'project') location.hash = '#/project/' + item._id;
      },
      // —— 归档仓库：项目条目长按 → 直接进编辑页（与项目页一致；不再唤起浮窗）——
      openArchProjMenu(item) {
        if (!item || item._type !== 'project') return;
        this.editPid = item._id; this.showProjEdit = true;
      },
      // —— 轻提示（与项目页一致，撤销归档后直接提示，不再二次确认）——
      showToast(msg) {
        this.toast = msg;
        if (this.toastTimer) clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => { this.toast = ''; }, 1400);
      },
      vibrate() { try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {} },
      persistStatsState() {
        try {
          localStorage.setItem('mindpocket:stats:habitId', this.chartHabitId || '');
          localStorage.setItem('mindpocket:stats:tab', this.tab);
        } catch (e) {}
      },
      goProject(p) { location.hash = '#/project/' + p.pid; },
      // —— 归档日期筛选 ——
      // 时间线辅助：是否配置提醒时间（有开关 + 有 remind_time）
      hasRemind(x) { return !!(x.enable_remind || x.sub_remind) && !!(x.remind_time || x.sub_remind_time); },
      // 结束时间：显式 remind_end 优先；否则 = 起始 + 30 分钟（满足"默认用时30分钟"）
      tlEndOf(x) {
        const start = x.remind_time || x.sub_remind_time || '';
        const end = x.remind_end || x.sub_remind_end || '';
        if (end) return end;
        if (!start) return '';
        const m = /^(\d{1,2}):(\d{2})$/.exec(start);
        if (!m) return start;
        let mins = Number(m[1]) * 60 + Number(m[2]) + 30;
        const hh = String(Math.floor(mins / 60) % 24).padStart(2, '0');
        const mm = String(mins % 60).padStart(2, '0');
        return hh + ':' + mm;
      },
      // 时长（分钟）：结束 − 起始；跨午夜 +24h
      tlDurMin(x) {
        const start = x.remind_time || x.sub_remind_time || '';
        const end = this.tlEndOf(x);
        const pa = /^(\d{1,2}):(\d{2})$/.exec(start), pb = /^(\d{1,2}):(\d{2})$/.exec(end);
        if (!pa || !pb) return 0;
        let d = (Number(pb[1]) * 60 + Number(pb[2])) - (Number(pa[1]) * 60 + Number(pa[2]));
        if (d < 0) d += 24 * 60;
        return d;
      },
      // 时长（分钟）→ 展示串，如 12h30m / 4h10m / 45m
      fmtDur(min) {
        min = Math.max(0, Math.round(Number(min) || 0));
        const h = Math.floor(min / 60), m = min % 60;
        if (h > 0) return m > 0 ? (h + 'h' + m + 'm') : (h + 'h');
        return m + 'm';
      },
      // 组装时间线单条（统一 tag / 类型 / 是否周期 / 是否当日副本）
      tlItemOf(raw, type, parent, today) {
        const start = raw.remind_time || raw.sub_remind_time || '';
        const end = this.tlEndOf(raw);
        const tagObj = type === 'subtask'
          ? Object.assign({}, raw, { _parentId: parent._id, parentTitle: parent.title, category_id: parent.category_id || null, parent_category: parent.parent_category || '', category: parent.category || '' })
          : raw;
        const isCycle = !!(raw.cycle || raw.time_mode === 'interval');
        const ad = this.$store.archiveDateOf(raw);
        return {
          key: type + ':' + (parent ? parent._id + '.' : '') + raw._id,
          _id: raw._id,
          parentId: parent ? parent._id : null,
          type, title: raw.title || '',
          start, end,
          durH: (this.tlDurMin(raw) / 60).toFixed(1) + ' h',
          tags: this.$archTagList(tagObj),
          isCycle,
          isTodayCopy: ad === today,
          raw,
        };
      },
      openTlEdit(it) { this.tlEditItem = it; },
      openCycleSummary(it) { this.csTasks = [it.raw]; },
      openCycleSummaryAll() { this.csTasks = this.tlCycleTasks.map(it => it.raw); },
      onArchSelect(date) {
        this.archSelDate = (this.archSelDate === date) ? null : date; // 再次点击取消
        if (this.archSelDate) this.archRange = { start: '', end: '' };
      },
      onRangeChange() { if (this.archRange.start || this.archRange.end) this.archSelDate = null; },
      clearArchDate() { this.archSelDate = null; this.archRange = { start: '', end: '' }; },
      // MiniCal 月/年导航（与习惯统计 navHabit 同逻辑）
      navArchCalendar(dir) {
        if (this.archView === 'year') { this.archYear += dir; this.archSelDate = null; this.archSelMonth = null; return; }
        let y = this.archYear, m = this.archMonth + dir;
        if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
        this.archYear = y; this.archMonth = m;
        this.archSelDate = null;
      },
      onYearMonthSelect(m) {
        // 年视图点击月份：仅用于饼图可视化，不影响 archSelDate 和时间线
        this.archSelMonth = (this.archSelMonth === m.monthStr) ? null : m.monthStr;
      },
      // —— 演示数据模式（本地持久化）——
      toggleDemo() {
        this.demoMode = !this.demoMode;
        try { localStorage.setItem('mindpocket:demoMode', this.demoMode ? '1' : '0'); } catch (e) {}
      },
      // —— 数据备份 / 恢复（P0：零依赖本地备份）——
      exportBackup() {
        try {
          const json = this.$store.exportAll();
          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'mindpocket-backup-' + this.$store.util.todayStr() + '.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          this.showToast('已导出备份文件');
        } catch (e) {
          console.error(e);
          this.showToast('导出失败：' + (e && e.message ? e.message : e));
        }
      },
      importBackup() {
        // 触发隐藏的文件选择器
        if (this.$refs.backupFile) this.$refs.backupFile.value = '';
        if (this.$refs.backupFile) this.$refs.backupFile.click();
      },
      onBackupFile(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const ok = window.confirm('导入将覆盖当前全部数据，确定继续？\n建议先点「导出备份」留一份底。');
            if (!ok) return;
            this.$store.importAll(String(reader.result));
            this.showToast('已恢复备份，数据已刷新');
          } catch (err) {
            console.error(err);
            this.showToast('导入失败：' + (err && err.message ? err.message : '文件格式无效'));
          }
        };
        reader.onerror = () => { this.showToast('读取文件失败'); };
        reader.readAsText(file);
      },
      // —— 手机提醒推送（P2：ntfy 延迟消息）——
      notifyGenTopic() {
        var a = new Uint8Array(12); crypto.getRandomValues(a);
        var hex = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
        this.$store.state.settings.notify.topic = hex;
        this.showToast('已生成随机主题');
      },
      notifyEnable() {
        var n = this.$store.state.settings.notify;
        if (!n.topic) this.notifyGenTopic();
        n.enabled = true;
        this.$store.persist();
        if (window.MPNotify) window.MPNotify.scheduleAll();
        this.showToast('已启用手机提醒推送');
      },
      notifyTest() {
        if (window.MPNotify) window.MPNotify.testPush();
        this.showToast('已发送测试推送，手机 ntfy 应收到');
      },
      notifyTestDelay() {
        if (window.MPNotify) window.MPNotify.testDelayed(60);
        this.showToast('已提交定时推送，1 分钟后手机应收到（可关闭应用验证）');
      },
      notifySchedule() {
        if (!window.MPNotify) return;
        this.showToast('正在重新安排…');
        window.MPNotify.scheduleAll().then((n) => {
          const st = this.notifyStatus;
          this.showToast('本次新增安排 ' + (n || 0) + ' 条' + (st.pending ? ('，待排队 ' + st.pending + ' 条') : '') + (st.lastError ? ('；错误：' + st.lastError) : ''));
        });
      },
      notifyDisable() {
        this.$store.state.settings.notify.enabled = false;
        this.$store.persist();
        if (window.MPNotify) window.MPNotify._set({ enabled: false });
        this.showToast('已关闭提醒推送');
      },
      // —— 云端代发（MPRelay）配置 ——
      relayAlive() {
        return !!(this.relayStatus.lastRun && (Date.now() - this.relayStatus.lastRun) < 12 * 3600 * 1000);
      },
      relayEnable() {
        if (!window.MPRelay) { this.showToast('云端代发组件未加载'); return; }
        var cfg = window.MPRelay.cfg;
        if (!this.relayToken) { this.showToast('请填写 GitHub 令牌'); return; }
        cfg.token = this.relayToken.trim();
        cfg.id = (this.relayVaultId || '').trim();
        cfg.owner = '2384714466-collab';
        cfg.repo = 'mindpocket-vaults';
        cfg.enabled = true;
        window.MPRelay.save();
        // 立即排一次，把现有提醒清单上传并触发后端接管
        if (window.MPNotify) window.MPNotify.scheduleAll();
        this.showToast('已启用云端代发');
      },
      relayDisable() {
        if (!window.MPRelay) return;
        window.MPRelay.cfg.enabled = false;
        window.MPRelay.save();
        window.MPRelay.remove(); // 删除清单，避免后端继续投递
        this.showToast('已关闭云端代发');
      },
      // 按月缓存：页面打开直接读 localStorage，避免每次加载都重算；↻ 强制刷新
      loadHealth(force) {
        const ym = this.year + '-' + String(this.month).padStart(2, '0');
        const key = 'mindpocket:health:' + ym;
        this.healthLoading = true;

        navReserved: 84,  // 底部 tab 栏占位高度（约 50px）+ iOS 安全区（~34px），确保悬浮球不遮挡 tab
        startX: null, startY: null,
        pressing: false,
        dragging: false,
        pressTimer: null,
        longFired: false,
        moved: false, suppressClick: false,
      };
    },
    computed: {},
    watch: {
      open(v) { if (v) this.$nextTick(() => { if (this.$refs.inp) this.$refs.inp.focus(); }); },
    },
    created() { this.loadPos(); },
    methods: {
      /* —— 位置记忆 —— */
      loadPos() {
        try {
          const raw = localStorage.getItem('mindpocket:quickentry-pos');
          if (raw) {
            const p = JSON.parse(raw);
            if (typeof p.x === 'number' && typeof p.y === 'number') this.pos = p;
          }
        } catch (e) { /* 忽略损坏数据 */ }
      },
      savePos() {
        try { localStorage.setItem('mindpocket:quickentry-pos', JSON.stringify(this.pos)); } catch (e) { /* 无存储权限时静默 */ }
      },
      ballStyle() {
        const s = {};
        if (this.pos.x != null && this.pos.y != null) { s.left = this.pos.x + 'px'; s.top = this.pos.y + 'px'; }
        else { s.right = '16px'; s.bottom = 'var(--fab-bottom)'; }
        return s;
      },
      /* —— 长按拖拽 / 短按打开 —— */
      onDown(e) {
        try { this.$refs.fab.releasePointerCapture(this.activePointerId); } catch (_) {}
        this.activePointerId = e.pointerId;
        this.pressing = true;
        this.startX = e.clientX; this.startY = e.clientY;
        this.moved = false; this.longFired = false; this.suppressClick = false;
        if (this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; }
        this.pressTimer = setTimeout(() => {
          this.longFired = true; this.suppressClick = true; this.dragging = true;
          this.open = false; // 拖拽时收起弹层，避免遮挡
          // 锁定当前像素坐标，避免被 right/bottom 干扰
          const r = this.$refs.fab.getBoundingClientRect();
          this.pos = { x: r.left, y: r.top };
          // 抓取指针，拖拽期间即使指针离开小球也能继续接收 move/up
          try { this.$refs.fab.setPointerCapture(this.activePointerId); } catch (_) { /* 忽略抓取失败 */ }
        }, 350);
      },
      onMove(e) {
        if (this.dragging) {
          e.preventDefault();
          let nx = e.clientX - this.ballSize / 2;
          let ny = e.clientY - this.ballSize / 2;
          const W = window.innerWidth, H = window.innerHeight;
          const maxY = H - this.ballSize - this.navReserved - 4; // 不挡底栏
          nx = Math.max(4, Math.min(W - this.ballSize - 4, nx));
          ny = Math.max(4, Math.min(maxY, ny));
          this.pos = { x: Math.round(nx), y: Math.round(ny) };
          return;
        }
        // 仅在指针已按下（pressing）时才允许“移动超阈值即拖拽”——避免悬停移动或
        // 上一轮拖拽残留的 startX 误触发拖拽。长按与即时拖拽均可触发，符合直觉手势。
        if (!this.pressing || this.startX == null) return;
        if (Math.abs(e.clientX - this.startX) > 8 || Math.abs(e.clientY - this.startY) > 8) {
          this.moved = true;
          if (this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; }
          this.longFired = true; this.suppressClick = true; this.dragging = true;
          this.open = false; // 拖拽时收起弹层，避免遮挡
          const r = this.$refs.fab.getBoundingClientRect();
          // 以按下点为锚保持小球相对手指位置，避免起步跳变
          this.pos = {
            x: Math.max(4, Math.min(window.innerWidth - this.ballSize - 4, r.left + (e.clientX - this.startX))),
            y: Math.max(4, Math.min(window.innerHeight - this.ballSize - this.navReserved - 4, r.top + (e.clientY - this.startY))),
          };
          try { this.$refs.fab.setPointerCapture(this.activePointerId); } catch (_) { /* 忽略抓取失败 */ }
        }
      },
      onUp() {
        try { this.$refs.fab.releasePointerCapture(this.activePointerId); } catch (_) {}
        this.pressing = false;
        if (this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; }
        if (this.dragging) {
          this.dragging = false;
          // 吸附到最近的屏幕边缘——左右自由吸附；垂直方向仅吸附顶部，避免遮挡底部 tab 栏
          const W = window.innerWidth, H = window.innerHeight, s = this.ballSize, nav = this.navReserved;
          const maxY = H - s - nav - 4;
          const dl = this.pos.x, dr = W - (this.pos.x + s);
          const dt = this.pos.y, db = maxY - this.pos.y;
          const minH = Math.min(dl, dr), minV = Math.min(dt, db);
          if (minH <= minV) { this.pos.x = (dl <= dr) ? 4 : (W - s - 4); }
          else { this.pos.y = 4; }
          this.pos.x = Math.max(4, Math.min(W - s - 4, this.pos.x));
          this.pos.y = Math.max(4, Math.min(maxY, this.pos.y));
          this.savePos();
          return;
        }
        if (this.moved || this.suppressClick) { this.suppressClick = false; return; }
        // 短按：切换弹窗
        this.open = !this.open;
      },
      onCancel() {
        try { this.$refs.fab.releasePointerCapture(this.activePointerId); } catch (_) {}
        this.pressing = false;
        if (this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; }
        if (this.dragging) { this.dragging = false; this.savePos(); }
      },
      // —— 快速标题录入（保留原功能；不调用 AI）——
      save() {
        const t = this.title.trim();
        if (!t) return;
        this.$store.quickAddTask(t, true); // 悬浮球录入始终归入临时任务
        this.title = '';
        this.open = false; // 关闭弹窗，停留在当前页面，不跳转
      },
      // —— AI 批量自然语言解析（第 3 层模块 1：拆条 + 批量预览）——
      async runAi() {
        if (!this.aiText.trim()) return;
        this.aiLoading = true;
        const res = await this.$ai.parseBatch(this.aiText.trim());
        this.aiLoading = false;
        this.open = false;             // 关闭快速录入弹窗
        this.aiItems = res.items;      // 唤起批量预览
        this.aiTruncated = res.truncated;
      },
      confirmAi(ids) {
        // ids：批量生成成功的任务 _id 数组（已在待归档主页生成）
        this.aiItems = null; this.aiTruncated = false; this.aiText = '';
      },
      closePop() { this.open = false; }, // 仅关闭弹层，输入内容不丢失
    },
    template: `
    <div class="quick-entry">
      <transition name="pop">
        <div v-if="open">
          <div class="quick-mask" @click="closePop"></div>
          <div class="quick-pop" @click.stop>
            <div class="qp-section">
              <input ref="inp" v-model="title" @keyup.enter="save" @keyup.esc="closePop" placeholder="快速录入临时待办标题" />
              <div class="qp-actions">
                <button class="btn primary" @click="save">保存</button>
                <button class="btn ghost" @click="closePop">取消</button>
              </div>
            </div>
            <div class="qp-divider">或</div>
            <div class="qp-section">
              <textarea class="ai-text" v-model="aiText" placeholder="用自然语言描述，如：每个月提醒我写月总结 / 想去南昌旅游"></textarea>
              <button class="btn primary" :disabled="aiLoading" @click="runAi">{{ aiLoading ? 'AI 解析中…' : '✨ AI 解析' }}</button>
            </div>
          </div>
        </div>
      </transition>
      <button ref="fab" class="fab" :class="{dragging:dragging}" :style="ballStyle()" title="快速录入" v-show="!aiItems"
        @pointerdown="onDown" @pointermove="onMove" @pointerup="onUp" @pointercancel="onCancel">＋</button>
      <AiTaskPreviewModal v-if="aiItems" :items="aiItems" :truncated="aiTruncated" @close="aiItems=null" @confirm="confirmAi" />
    </div>`,
  };

  /* =====================================================================
   * 项目模块（完全独立，不与普通 task 联动）
   * ===================================================================== */

  /* -------- ProjectEditModal —— 新建/编辑项目 -------- */
  C.ProjectEditModal = {
    name: 'ProjectEditModal',
    props: { pid: { type: String, default: '' } },
    data() { return { name: '', deadline: '', tags: [], tagInput: '', importance: 'normal', showDelConfirm: false }; },
    created() {
      if (this.pid) {
        const p = this.$store.state.projects.find(x => x.pid === this.pid);
        if (p) { this.name = p.name || ''; this.deadline = p.deadline || ''; this.tags = (p.tags || []).slice(); this.importance = p.importance || 'normal'; }
      }
    },
    methods: {
      commitTag() {
        const raw = (this.tagInput || '').trim();
        if (!raw) return;
        raw.split(/[\s,，]+/).forEach(t => {
          const tag = t.replace(/^#+/, '').trim();
          if (tag && !this.tags.includes(tag)) this.tags.push(tag);
        });
        this.tagInput = '';
      },
      // 输入 #xxx 后敲空格自动生成标签
      onTagInput() {
        if (/^#\S+[\s，,]$/.test(this.tagInput)) this.commitTag();
      },
      removeTag(i) { this.tags.splice(i, 1); },
      save() {
        const name = this.name.trim();
        if (!name) { alert('请填写项目名称'); return; }
        this.commitTag(); // 未回车的输入内容一并收集
        const patch = { name, deadline: this.deadline || null, tags: this.tags.slice(), importance: this.importance || 'normal' };
        if (this.pid)         this.$store.updateProject(this.pid, patch);
        else this.$store.addProject(patch);
        this.$emit('close');
      },
      // 删除项目：级联销毁子任务/灵感，回退项目列表
      confirmDelete() {
        if (!this.pid) return;
        this.$store.deleteProject(this.pid);
        this.showDelConfirm = false;
        location.hash = '#/projects';
        this.$emit('close');
      },
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal">
        <div class="modal-head"><h3>{{ pid ? '编辑项目' : '新建项目' }}</h3><button class="x" @click="$emit('close')">✕</button></div>
        <div class="modal-body">
          <label class="fld">项目名称<input v-model="name" @keyup.enter="save" placeholder="如：毕业论文 / 备考雅思" /></label>
          <label class="fld">项目总截止（可选）
            <input type="text" v-model="deadline" placeholder="YYYY-MM-DD" @blur="deadline=$store.util.autoFormatDate(deadline)" :class="{invalid: deadline && !$store.util.validateDateInput(deadline).ok}" />
          </label>
          <label class="fld">项目标签
            <input v-model="tagInput" @input="onTagInput" @keyup.enter="commitTag" placeholder="输入 #标签名 空格/回车生成，如 #论文" />
          </label>
          <div class="tag-edit" v-if="tags.length">
            <span class="ptag" v-for="(t,i) in tags" :key="t">{{ t }}<span class="ptag-x" @click="removeTag(i)">✕</span></span>
          </div>
          <label class="fld">项目重要等级
            <div class="view-toggle imp-select">
              <button type="button" :class="{on: importance==='normal'}" @click="importance='normal'">普通</button>
              <button type="button" :class="{on: importance==='important'}" @click="importance='important'">一般重要</button>
              <button type="button" :class="{on: importance==='high'}" @click="importance='high'">高度重要</button>
            </div>
          </label>
          <div class="modal-actions">
            <button class="btn ghost" @click="$emit('close')">取消</button>
            <button class="btn primary" @click="save">保存</button>
          </div>
          <!-- 删除项目（仅编辑已有项目时出现；与常规编辑分隔，区隔高危操作） -->
          <div class="del-zone" v-if="pid">
            <button class="btn danger-soft" style="width:100%" @click="showDelConfirm=true">删除项目</button>
          </div>
        </div>
      </div>
      <!-- 删除项目二次确认（复用 APP 通用弹窗：圆角/阴影/配色一致；取消 + 确定删除 并排） -->
      <div class="chart-confirm" v-if="showDelConfirm" @click.self="showDelConfirm=false">
        <div class="idea-choice-box" @click.stop>
          <div class="idea-choice-title">确定要删除该项目？</div>
          <p style="font-size:13px;color:var(--sub);line-height:1.5;margin:0 0 14px">删除后该项目下所有数据、任务无法恢复，确认要删除此项目吗？</p>
          <div class="modal-actions">
            <button class="btn ghost" @click="showDelConfirm=false">取消</button>
            <button class="btn danger" @click="confirmDelete">确定删除</button>
          </div>
        </div>
      </div>
    </div>`,
  };

  /* -------- ProjectSubEditModal —— 新增/编辑子任务（可承接灵感领取） -------- */
  C.ProjectSubEditModal = {
    name: 'ProjectSubEditModal',
    props: { pid: { type: String, required: true }, sid: { type: String, default: '' }, ideaId: { type: String, default: '' }, seedTitle: { type: String, default: '' }, seedTags: { type: Array, default: () => [] } },
    data() { return { title: '', unit: '页', customUnit: '', planDaily: 0, enableTotal: false, total: '', sub_start: '', sub_end: '', status: '进行中', newStatus: '', tags: [], tagInput: '', estH: 0, estM: 0, isEmergency: false, showDelConfirm: false }; },
    computed: {
      // 本项目已有的子任务标签，作为快捷选择项（排除已选），减少重复手输
      tagSuggestions() {
        return this.$store.getSubTags(this.pid).filter(t => this.tags.indexOf(t) < 0);
      },
      estMinInput() { return Math.max(0, (Number(this.estH) || 0) * 60 + (Number(this.estM) || 0)); },
      // 展示用单位：自定义时取 customUnit 文本（缺省回退「页」），预设时取原值
      dispUnit() { return this.unit === '__custom' ? (((this.customUnit || '').trim()) || '') : (this.unit || ''); },
      // 状态可选项：内置 进行中 / 已完成 + 用户自定义状态（均为非完成状态）
      statusOptions() {
        const builtin = ['进行中', '已完成'];
        const custom = (this.$store.state.sub_custom_statuses || []).slice();
        return builtin.concat(custom);
      },
    },
    created() {
      this.tags = (this.seedTags || []).slice();
      if (this.sid) {
        const s = this.$store.state.project_subs.find(x => x.sid === this.sid);
        if (s) {
          this.title = s.title || '';
          // 旧数据兼容：单位若不在预设列表（页/题/篇/节/次）内，视为自定义单位回填
          const PRESET_UNITS = ['页', '题', '篇', '节', '次'];
          if (s.unit && PRESET_UNITS.indexOf(s.unit) < 0) { this.unit = '__custom'; this.customUnit = s.unit; }
          else { this.unit = s.unit || '页'; }
          this.tags = (s.tags || []).slice();
          const em = Number(s.estMin) || 0;
          this.estH = Math.floor(em / 60); this.estM = em % 60;
          this.planDaily = s.planDaily;
          this.enableTotal = !!s.enableTotal;
          this.total = (s.total == null ? '' : s.total);
          this.isEmergency = !!s.isEmergency;
          // 工作流状态：已完成 ↔ sub_done；其余 ↔ 进行中 / 自定义状态
          this.status = s.status || (s.sub_done ? '已完成' : '进行中');
          // 旧数据兼容：仅有单个截止 sub_deadline 时，映射为 结束=原截止、开始=空
          if (s.sub_start !== undefined || s.sub_end !== undefined) {
            this.sub_start = s.sub_start || '';
            this.sub_end = s.sub_end || '';
          } else if (s.sub_deadline != null) {
            this.sub_start = '';
            this.sub_end = s.sub_deadline;
          } else {
            this.sub_start = '';
            this.sub_end = '';
          }
        }
      } else {
        this.title = this.seedTitle || '';
      }
    },
    methods: {
      save() {
        const title = this.title.trim();
        if (!title) { alert('请填写子任务名称'); return; }
        // 结束日期必须 >= 开始日期（两者均填写时校验）
        if (this.sub_start && this.sub_end && this.sub_end < this.sub_start) {
          alert('结束日期不能早于开始日期');
          return;
        }
        const cur = this.sid ? this.$store.state.project_subs.find(x => x.sid === this.sid) : null;
        const wasDone = !!(cur && cur.sub_done);
        const nowDone = this.status === '已完成';
        const patch = {
          title,
          unit: this.unit === '__custom' ? (((this.customUnit || '').trim()) || '页') : (this.unit || '页'),
          // 每日计划：未开启目标计划则该字段不参与任何计算（存 0）；开启即自带每日计划能力
          planDaily: this.enableTotal ? (Number(this.planDaily) || 0) : 0,
          enableTotal: this.enableTotal,
          total: this.enableTotal ? (Number(this.total) || 0) : null,
          // 时间跨度：开始 / 结束；缺省置空（null）不参与任何逻辑
          sub_start: this.sub_start || null,
          sub_end: this.sub_end || null,
          tags: this.tags.slice(),
          // 预计耗时：0 = 未设置，此时时间进度条改用项目内相对刻度展示
          estMin: this.estMinInput,
          isEmergency: !!this.isEmergency, // 紧急标记：强制置顶今日Tab
          // 工作流状态：选「已完成」即标记完成（sub_done=true），否则为非完成（含自定义状态）
          status: this.status || '进行中',
          sub_done: nowDone,
        };
        // 完成态切换时同步完成时间戳与紧急标记（与 toggleSubDone 口径一致）
        if (nowDone && !wasDone) { patch.done_at = Date.now(); patch.isEmergency = false; }
        else if (!nowDone && wasDone) { patch.done_at = null; }
        if (this.sid) this.$store.updateSub(this.sid, patch);
        else this.$store.addSub(this.pid, patch);
        if (this.ideaId) this.$store.pickIdea(this.ideaId);
        this.$emit('close');
      },
      removeTag(i) { this.tags.splice(i, 1); },
      // 新增标签：去掉前缀 #、去空白、去重；支持逗号 / 空格一次输入多个
      addTag() {
        const raw = (this.tagInput || '').trim();
        if (!raw) return;
        raw.split(/[,，\s]+/).forEach(seg => {
          const t = seg.replace(/^#+/, '').trim();
          if (t && this.tags.indexOf(t) < 0) this.tags.push(t);
        });
        this.tagInput = '';
      },
      pickSuggest(t) { if (this.tags.indexOf(t) < 0) this.tags.push(t); },
      // 状态类型判断：内置状态之外即为自定义（非完成）状态
      isCustomStatus(opt) { return opt !== '进行中' && opt !== '已完成'; },
      // 新增自定义状态：写入全局清单并立即选中（内置状态 / 空 / 重复 均拦截）
      addCustomStatus() {
        const v = (this.newStatus || '').trim();
        if (!v) return;
        if (v === '进行中' || v === '已完成') { alert('「进行中 / 已完成」为内置状态，无需添加'); this.newStatus = ''; return; }
        if ((this.$store.state.sub_custom_statuses || []).indexOf(v) >= 0) { alert('该状态已存在'); this.newStatus = ''; return; }
        if (this.$store.addCustomSubStatus(v)) { this.status = v; this.newStatus = ''; }
      },
      confirmDelete() {
        if (!this.sid) return;
        this.$store.removeSub(this.sid);
        this.showDelConfirm = false;
        this.$emit('close');
      },
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal">
        <div class="modal-head"><h3>{{ sid ? '编辑子任务' : '新增子任务' }}</h3><button class="x" @click="$emit('close')">✕</button></div>
        <div class="modal-body">
          <div class="fld fld-emergency">
            <span class="fld-cap">子任务名称
              <span class="emg-check"><input type="checkbox" v-model="isEmergency" id="emgSubChk" /><label for="emgSubChk" class="emg-label">🚨 紧急任务</label></span>
            </span>
            <input v-model="title" @keyup.enter="save" placeholder="如：查阅文献 / 写框架" />
          </div>
          <p class="tip emg-tip" v-if="isEmergency">勾选后无视所有日期、周期排序规则，固定放在今日Tab首位，需优先完成。</p>
          <!-- 工作流状态：内置 进行中 / 已完成，可自定非完成状态；选「已完成」即标记完成 -->
          <label class="fld">状态
            <div class="status-pick">
              <button type="button" v-for="opt in statusOptions" :key="opt" class="status-chip"
                :class="{ on: status===opt, done: opt==='已完成', custom: isCustomStatus(opt) }"
                @click="status = opt">{{ opt }}</button>
            </div>
            <div class="status-add">
              <input v-model="newStatus" placeholder="新增自定义状态，如：待审核 / 受阻" @keyup.enter.stop="addCustomStatus" />
              <button type="button" class="btn-mini" @click="addCustomStatus">＋ 添加</button>
            </div>
          </label>
          <label class="fld check"><input type="checkbox" v-model="enableTotal" /> 开启目标计划</label>
          <template v-if="enableTotal">
            <div class="fld-row">
              <label class="fld">单位
                <select v-model="unit">
                  <option>页</option><option>题</option><option>篇</option><option>节</option><option>次</option>
                  <option value="__custom">自定义…</option>
                </select>
              </label>
              <label class="fld" v-if="unit==='__custom'">自定义单位
                <input v-model="customUnit" placeholder="如：张 / 个 / 组" />

  /* -------- ProjectRecordModal —— 填报（累加 finished + 生成留痕） -------- */
  C.ProjectRecordModal = {
    name: 'ProjectRecordModal',
    props: { sid: { type: String, required: true } },
    data() { return { actualNum: 0, recordDate: '', spentH: 0, spentM: 0, note: '', undoTarget: null, showChart: false, chartTab: 0, dragStartX: 0, draggingChart: false }; },
    computed: {
      sub() { return this.$store.state.project_subs.find(x => x.sid === this.sid) || null; },
      history() { return this.$store.getRecords(this.sid); },
      unit() { return this.sub ? this.sub.unit : ''; },
      // —— 本次填报花费时间（xx h xx min → 分钟）——
      spentMinInput() {
        return Math.max(0, (Number(this.spentH) || 0) * 60 + (Number(this.spentM) || 0));
      },
      spentInputLabel() { return this.$store.fmtSpent(this.spentMinInput); },
      // 该子任务累计已花费时间
      totalSpent() { return this.sub ? this.$store.subSpentMin(this.sub) : 0; },
      totalSpentLabel() { return this.$store.fmtSpent(this.totalSpent); },
      // 预计耗时（未设置为 0）与剩余可用时间提示
      estMin() { return this.sub ? (Number(this.sub.estMin) || 0) : 0; },
      estLabel() { return this.$store.fmtSpent(this.estMin); },
      // 周 / 全周期耗时合计（与完成量同口径聚合）
      weekSpentTotal() { return this.weekDays.reduce((a, d) => a + (d.spent || 0), 0); },
      spanSpentTotal() { return this.spanDays.reduce((a, d) => a + (d.spent || 0), 0); },
      // —— 本周（周一~周日）——
      weekRange() {
        const t = this.$store.util.parseDate(this.$store.util.todayStr());
        const dow = t.getDay();
        const off = (dow === 0 ? -6 : 1 - dow); // 周一为一周起点
        const mon = new Date(t); mon.setDate(t.getDate() + off);
        const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
        return { mon, sun };
      },
      weekRangeLabel() { const { mon, sun } = this.weekRange; return this.mmdd(mon) + '~' + this.mmdd(sun); },
      // 本周 7 天聚合：按周一至周日顺序，每天累加有效填报数值
      weekDays() {
        const { mon } = this.weekRange;
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(mon); d.setDate(mon.getDate() + i);
          const ds = this.fmtYMD(d);
          const of = this.history.filter(r => r.recordDate === ds);
          const sum = of.reduce((a, r) => a + (Number(r.actualNum) || 0), 0);
          const spent = of.reduce((a, r) => a + (Number(r.spentMin) || 0), 0);
          days.push({ date: ds, label: this.mmdd(d), val: sum, spent });
        }
        return days;
      },
      weekTotal() { return this.weekDays.reduce((a, d) => a + d.val, 0); },
      weekMax() { return this.weekDays.reduce((m, d) => Math.max(m, d.val), 0); },
      // —— 任务全周期（第一条有效填报日 ~ 最新一条有效填报日）——
      spanDays() {
        if (!this.history.length) return [];
        // 全部有效填报日期，升序
        const dates = this.history.map(r => r.recordDate).sort((a, b) => a < b ? -1 : (a > b ? 1 : 0));
        const start = this.$store.util.parseDate(dates[0]);
        const end = this.$store.util.parseDate(dates[dates.length - 1]);
        const days = [];
        const cur = new Date(start);
        while (cur <= end) {
          const ds = this.fmtYMD(cur);
          const of = this.history.filter(r => r.recordDate === ds);
          const sum = of.reduce((a, r) => a + (Number(r.actualNum) || 0), 0);
          const spent = of.reduce((a, r) => a + (Number(r.spentMin) || 0), 0);
          days.push({ date: ds, label: this.mmdd(cur), val: sum, spent });
          cur.setDate(cur.getDate() + 1);
        }
        return days;
      },
      spanRangeLabel() {
        if (!this.spanDays.length) return '';
        return this.spanDays[0].label + '~' + this.spanDays[this.spanDays.length - 1].label;
      },
      spanTotal() { return this.spanDays.reduce((a, d) => a + d.val, 0); },
      spanMax() { return this.spanDays.reduce((m, d) => Math.max(m, d.val), 0); },
    },
    created() {
      this.recordDate = this.$store.util.todayStr();
      if (this.sub) this.actualNum = this.sub.planDaily;
    },
    methods: {
      mmdd(d) {
        let y, m, day;
        if (typeof d === 'string') { const p = d.split('-'); y = +p[0]; m = +p[1]; day = +p[2]; }
        else { y = d.getFullYear(); m = d.getMonth() + 1; day = d.getDate(); }
        const pad = n => String(n).padStart(2, '0');
        return y + '-' + pad(m) + '-' + pad(day);
      },
      fmtYMD(d) { const pad = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); },
      barH(v, max) { return max > 0 ? Math.round((Number(v) || 0) / max * 110) : 0; },
      // —— 图表弹窗左右滑动切换 ——
      onChartDown(e) { this.dragStartX = e.clientX; this.draggingChart = true; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} },
      onChartMove(e) { if (!this.draggingChart) return; /* 不做实时位移，松手后判定 */ },
      onChartUp(e) {
        if (!this.draggingChart) return;
        const dx = e.clientX - this.dragStartX;
        this.draggingChart = false;
        if (dx < -50 && this.chartTab === 0) this.chartTab = 1;       // 左滑 → 月统计
        else if (dx > 50 && this.chartTab === 1) this.chartTab = 0;   // 右滑 → 周统计
      },
      openChart() { this.chartTab = 0; this.showChart = true; }, // 默认定位在左侧周统计页
      fmtSpent(m) { return this.$store.fmtSpent(m); },
      save() {
        // 完成量与花费时间彼此独立：允许只记时间（完成量 0）或只记完成量（时间 0），但不允许两者皆空的空记录
        if ((Number(this.actualNum) || 0) === 0 && this.spentMinInput === 0) {
          alert('请至少填写「完成量」或「本次花费时间」其中一项');
          return;
        }
        this.$store.addRecord(this.sid, this.recordDate || this.$store.util.todayStr(), this.actualNum, this.spentMinInput, this.note);
        if (this.sub) this.actualNum = this.sub.planDaily; // 重置为默认，便于连续填报
        this.spentH = 0; this.spentM = 0;                  // 耗时归零，避免下一次误重复计时
        this.note = '';                                    // 备注清空，避免串到下一笔填报
      },
      // 请求撤销单条填报：先校验扣减后不为负，否则提示并阻止；否则弹出二次确认
      askUndo(r) {
        const amt = Number(r.actualNum) || 0;
        if ((Number(this.sub.finished) || 0) - amt < 0) { alert('撤销后完成量不能小于 0'); return; }
        this.undoTarget = r;
      },
      confirmUndo() {
        if (!this.undoTarget) return;
        this.$store.deleteRecord(this.sid, this.undoTarget.rid);
        this.undoTarget = null;
      },
      cancelUndo() { this.undoTarget = null; },
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal">
        <div class="modal-head"><h3>填报 · {{ sub ? sub.title : '' }}</h3><button class="x" @click="$emit('close')">✕</button></div>
        <div class="modal-body">
          <div class="fld-row">
            <label class="fld">日期<input type="text" v-model="recordDate" placeholder="YYYY-MM-DD" @blur="recordDate=$store.util.autoFormatDate(recordDate)" :class="{invalid: recordDate && !$store.util.validateDateInput(recordDate).ok}" /></label>
            <label class="fld">完成量（{{ sub ? sub.unit : '' }}）
              <input type="number" min="0" v-model="actualNum" @keyup.enter="save" />
            </label>
          </div>
          <!-- 单次填报耗时：xx h xx min，与完成量并列录入，保存后累加进子任务已花费时间 -->
          <div class="spent-row">
            <label class="fld">本次花费 · 小时<input type="number" min="0" max="99" v-model="spentH" @keyup.enter="save" /></label>
            <label class="fld">分钟<input type="number" min="0" max="59" step="5" v-model="spentM" @keyup.enter="save" /></label>
          </div>
          <p class="spent-sum">
            ⏱ 本次记为 <b>{{ spentInputLabel }}</b> · 该子任务累计已花费 <b>{{ totalSpentLabel }}</b>
            <template v-if="estMin > 0"> / 预计 {{ estLabel }}</template>
          </p>
          <!-- 填报备注：可选，随填报留痕一并保存并在填报历史中展示 -->
          <label class="fld">备注（可选）
            <textarea v-model="note" rows="2" placeholder="本次填报说明，如：完成第 3 章 / 遇到阻塞待协调…"></textarea>
          </label>
          <button class="btn primary" @click="save">保存填报</button>
          <div class="rec-head">
            <h4>填报历史（{{ history.length }}）</h4>
            <button class="rec-chart" title="滑动查看填报统计" @click="openChart">📊</button>
          </div>
          <div class="rec-hist">
            <div class="rec-row" v-for="r in history" :key="r.rid">
              <span class="rec-main">
                <span>{{ r.recordDate }}</span>
                <b v-if="r.actualNum">+{{ r.actualNum }} {{ sub ? sub.unit : '' }}</b>
                <span class="rec-spent" v-if="r.spentMin">⏱ {{ fmtSpent(r.spentMin) }}</span>
                <span class="rec-note" v-if="r.note">{{ r.note }}</span>
              </span>
              <button class="rec-undo" @click="askUndo(r)">撤销</button>
            </div>
            <p v-if="!history.length" class="empty-tip">暂无填报记录</p>
          </div>
          <div class="modal-actions">
            <button class="btn ghost" @click="$emit('close')">关闭</button>
          </div>
        </div>
        <div class="undo-confirm" v-if="undoTarget">
          <div class="undo-box">
            <p class="undo-text">是否撤销本条填报？完成量与已花费时间将同步扣减对应数值，不可恢复</p>
            <div class="undo-actions">
              <button class="btn ghost" @click="cancelUndo">取消</button>
              <button class="btn danger" @click="confirmUndo">确认撤销</button>
            </div>
          </div>
        </div>
        <div class="chart-confirm" v-if="showChart">
          <div class="chart-box" @pointerdown="onChartDown" @pointermove="onChartMove" @pointerup="onChartUp" @pointercancel="onChartUp">
            <div class="chart-head">
              <h3>填报统计</h3>
              <button class="x" @click="showChart=false">✕</button>
            </div>
            <div class="chart-viewport">
              <div class="chart-track" :style="{ transform: 'translateX(-' + (chartTab * 100) + '%)' }">
                <!-- 左页：周统计 -->
                <div class="chart-page">
                  <div class="chart-sec-title">本周填报（{{ weekRangeLabel }}）</div>
                  <div v-if="!weekTotal" class="empty-tip">暂无填报统计数据</div>

                      <div class="chart-bar" v-for="d in weekDays" :key="d.date">

                        <div class="bar-label">{{ d.label }}</div>
                      </div>
                    </div>
                    <div class="chart-sum">
                      <div class="sum-item">📅 本周合计 <b>{{ weekTotal }} {{ unit }}</b></div>
                      <div class="sum-item">⏱ 本周花费 <b>{{ fmtSpent(weekSpentTotal) }}</b></div>
                    </div>
                  </template>
                </div>
                <!-- 右页：任务周期统计 -->
                <div class="chart-page">
                  <div class="chart-sec-title">任务周期填报（{{ spanRangeLabel || '无数据' }}）</div>
                  <div v-if="!spanTotal" class="empty-tip">暂无填报统计数据</div>
                  <template v-else>
                    <div class="chart-bars">
                      <div class="chart-bar" v-for="d in spanDays" :key="d.date">

                    </div>
                    <div class="chart-sum">
                      <div class="sum-item">📊 任务周期合计 <b>{{ spanTotal }} {{ unit }}</b></div>
                      <div class="sum-item">⏱ 累计花费 <b>{{ fmtSpent(totalSpent) }}</b><template v-if="estMin > 0"> / 预计 {{ estLabel }}</template></div>

        </div>

  C.ProjectIdeaEditModal = {

    mixins: [C.MaterialLinkMixin], // 素材链接识别：与待归档任务共用同一实现

      this._overlayDismiss = () => this.$emit('close');
      this.$root.pushOverlay(this._overlayDismiss);
    },
    methods: {
      save() {
        const title = this.title.trim();
        if (!title) { alert('请填写素材标题'); return; }

        if (this.ideaId) this.$store.updateIdea(this.ideaId, { title, content: this.content, link });
        else this.$store.addIdea(this.pid, { title, content: this.content, link });

      // 全屏输入：确认回填，取消丢弃改动（小输入框内容不受影响）
      openFull() { this.fullDraft = this.content; this.showFull = true; },
      confirmFull() { this.content = this.fullDraft; this.showFull = false; },
      cancelFull() { this.showFull = false; this.fullDraft = ''; },

      del() { this.showDelConfirm = true; },

    watch: {

      showFull(v) {
        if (v) { this._fullDismiss = () => { this.showFull = false; this.fullDraft = ''; }; this.$root.pushOverlay(this._fullDismiss); }

    },

        </div>
