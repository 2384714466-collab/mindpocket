  /* ============================ 习惯相关方法 ============================ */
  function findHabit(id) { return state.habits.find(h => h._id === id); }

  function getHabitRecord(id, date) {
    const h = findHabit(id);
    if (!h) return null;
    return h.records.find(r => r.date === date) || null;
  }

  // 写入某日记录（success/fail/record/holiday）
  // 积分联动：写记录后触发当日结算（settleHabitPoints），由结算函数统一处理积分逻辑
  function markHabitRecord(id, date, status, note) {
    const h = findHabit(id);
    if (!h) return;
    let rec = h.records.find(r => r.date === date);
    const prevStatus = rec ? rec.status : '';
    const isNew = !rec;
    if (!rec) { rec = { date, status, note: note || '' }; h.records.push(rec); }
    else { rec.status = status; if (note !== undefined) rec.note = note; }
    // —— 状态实质变更 → 先清算该日旧积分，再按新状态重新结算 ——
    // 缺此步骤即为「撤销打卡积分不回滚」的根因：settleHabitPoints 有幂等门
    // （该日已存在 status='normal' 的结算记录时直接 return），
    // 若不先把旧记录置为 reversed，改状态后既扣不回旧分、也算不出新分。
    if (prevStatus && prevStatus !== status) {
      reverseHabitDayPoints(h, date, prevStatus, status);
    } else if (isNew) {
      // 新打卡 / 补卡：若该日此前已被结算（如漏完成 -5、破戒 -10），先回滚旧结算再按新状态重算；
      // 否则「已完成」会被幂等门挡住、旧的漏扣记录残留 → 已完成仍被记成漏完成、积分被错误扣减
      reverseHabitDayPoints(h, date, '', status);
    }
    persist();
    // 触发当日结算（幂等：同一天重复调用不会重复积分）
    settleHabitPoints(date);
  }

  /* ============ 习惯单日积分撤销（含明细流水留痕） ============
   * 触发时机：某日打卡状态被改写或清除（完成→未完成 / 完成→跳过 / 破戒→未破戒 / 清除记录）。
   * 设计要点：
   *   1) 旧记录必须置为 'reversed' —— 既让余额自动回退（三个汇总口径均只统计 normal），
   *      也解除 settleHabitPoints 的幂等门，使「再次完成」能重新正常结算。
   *   2) 另写一条撤销流水（category='habit_undo'），满足「积分明细可见撤销记录」。
   *      该流水 recordType='undo'，不被 getPointsEarned/Penalty/Spent 任何一个统计到，
   *      因此纯展示留痕、绝不与步骤 1 的余额回退重复计算。
   *   3) 无历史积分可撤时返回 null 且不写流水，避免明细被无意义空记录污染
   *      （如 SOP 习惯 fail→success：fail 本就不产生积分记录）。
   *   4) 跳过（holiday）本身不加不扣：settleHabitPoints 遇 isHoliday 直接 return；
   *      此处仅清算「改为跳过之前」已获得的积分，不会因跳过而新增任何扣分。
   */
  function reverseHabitDayPoints(habit, date, fromStatus, toStatus) {
    if (!habit) return null;
    const refId = habit._id + '_' + date;
    const hits = state.wish_records.filter(r =>
      r.refId === refId && r.category === 'habit' && r.status === 'normal'
    );
    if (!hits.length) return null;
    let earn = 0, penalty = 0;
    hits.forEach(r => {
      const v = Number(r.cost) || 0;
      if (r.recordType === 'earn') earn += v;
      else if (r.recordType === 'penalty') penalty += v;
    });
    // 净额：正 = 此前净得分（本次撤销即扣回）；负 = 此前净失分（本次撤销即返还）
    const net = Math.round((earn - penalty) * 10) / 10;
    hits.forEach(r => { r.status = 'reversed'; });
    if (net === 0) { persist(); return { net: 0, count: hits.length, recordId: null }; }
    const STATUS_LABEL = { success: '已完成', record: '已打卡', fail: '未完成', holiday: '跳过', none: '未打卡', '': '未打卡' };
    const toLabel = STATUS_LABEL[toStatus] || '未打卡';
    const nm = (habit.name || '').trim() || '未命名';
    const recordId = uid('wrec');
    const desc = '撤销' + (STATUS_LABEL[fromStatus] || '打卡') + '｜习惯「' + nm + '」'
      + (net > 0 ? '扣回 ' + net + ' 积分' : '返还 ' + Math.abs(net) + ' 积分')
      + '（' + date + ' 改为' + toLabel + '）';
    state.wish_records.push({
      _id: recordId, wish_id: '', wish_name: desc, cost: Math.abs(net),
      time: new Date().toISOString(), status: 'normal',
      recordType: 'undo',              // 关键：不参与任何余额统计口径，纯流水留痕
      category: 'habit_undo',
      detail: desc, refId: 'habitundo_' + refId, focusMin: 0,
      isHabitUndo: true, undoNet: net, undoEarn: earn, undoPenalty: penalty,
      habitName: nm, habitDate: date, fromStatus: fromStatus || '', toStatus: toStatus || '',
      undoOf: hits.map(r => r._id),    // 审计溯源：本次撤销覆盖的原始积分记录
    });
    persist();
    return { recordId, net, count: hits.length };
  }

  // 习惯每日积分结算（幂等：refId = habitId + '_' + date，同一天仅结算一次）
  function settleHabitPoints(date) {
    state.habits.forEach(h => {
      if (h.is_archived) return;                           // 已归档习惯不参与每日结算
      if (isHoliday(h._id, date)) return;                  // 请假/假期：不加不扣

      const refId = h._id + '_' + date;

      // 幂等检查：是否已有该日期的正常结算记录
      const alreadySettled = state.wish_records.some(r =>
        r.refId === refId && r.category === 'habit' && r.status === 'normal'
      );
      if (alreadySettled) return;

      const rec = getHabitRecord(h._id, date);

      if (h.type === 'RECORD_HABIT') {
        if (rec && rec.status === 'record') {
          addPoints(3, 'habit', '记录打卡: ' + h.name, refId);
        }
      } else if (h.type === 'QUIT_HABIT') {
        if (rec && rec.status === 'fail') {
          addPoints(-10, 'habit', '破戒: ' + h.name, refId);
        }
        // QUIT_HABIT 未破戒（无记录或非 fail）= 不加分不扣分（默认成功）
      } else if (h.type === 'SOP_HABIT') {
        if (rec && rec.status === 'success') {
          addPoints(8, 'habit', '完成: ' + h.name, refId);
        } else if (!rec) {
          // 无打卡记录 = 漏完成，扣基础分（仅结算历史日期时触发；今天不扣，给用户机会）
          if (date < todayStr()) {
            addPoints(-5, 'habit', '漏完成: ' + h.name, refId);
          }
        }
        // fail 状态：已由手动标记处理（不额外扣分，避免与漏扣重叠）
      }
    });
  }

  // 撤销习惯打卡并重新结算该日积分
  function removeHabitRecord(id, date) {
    const h = findHabit(id);
    if (!h) return;
    // 撤销该日已结算积分（含日期维度，精准撤销，不影响其他日期）
    // 与 markHabitRecord 改状态共用同一清算入口，保证两条撤销路径行为一致、均产生明细流水
    const rec = h.records.find(r => r.date === date);
    reverseHabitDayPoints(h, date, rec ? rec.status : '', 'none');
    h.records = h.records.filter(r => r.date !== date);
    persist();
    // 重新结算该日（如已无记录且非今天 → 触发漏扣）
    settleHabitPoints(date);
  }

  // 懒结算：对历史日期批量结算习惯积分（load 时调用一次，幂等安全）
  function lazySettleHabits() {
    const today = todayStr();
    // 找到最早的习惯创建日期作为结算起点
    let earliest = today;
    state.habits.forEach(h => {
      if (h.create_at) {
        const cd = fmt(new Date(h.create_at));
        if (cd < earliest) earliest = cd;
      }
    });
    // 逐日结算（settleHabitPoints 内部幂等，重复调用无副作用）
    let cursor = earliest;
    while (cursor <= today) {
      settleHabitPoints(cursor);
      // 日期递增（简单字符串比较在 YYYY-MM-DD 格式下等同于字典序递增）
      const d = new Date(cursor + 'T00:00:00');
      d.setDate(d.getDate() + 1);
      cursor = fmt(d);
    }
  }

  function setHolidayRange(id, start, end) {
    const h = findHabit(id);
    if (!h) return;
    h.holiday_ranges.push({ start, end });
    // 区间内已有的 success/fail 记录改为 holiday，并撤销对应日期积分
    h.records.forEach(r => {
      if (inHolidayRanges(r.date, [{ start, end }]) && (r.status === 'success' || r.status === 'fail')) {
        // 批量转跳过：同样走统一清算入口（跳过本身不加不扣，此处仅清退改为跳过前已得积分）
        reverseHabitDayPoints(h, r.date, r.status, 'holiday');
        r.status = 'holiday';
      }
    });
    persist();
  }

  function removeHolidayRange(id, index) {
    const h = findHabit(id);
    if (!h) return;
    h.holiday_ranges.splice(index, 1);
    persist();
  }

  // 新增习惯（create_at 默认当前时间，records/holiday_ranges 初始为空）
  function addHabit(partial) {
    const h = Object.assign({
      _id: uid('habit'), name: '新习惯', type: 'SOP_HABIT',
      enable_remind: false, remind_time: '09:00', plan_time: '', holiday_ranges: [], records: [],
      create_at: Date.now(), unit: '次', is_archived: false, archived_at: '',
    }, partial || {});
    state.habits.push(h);
    persist();
    return h;
  }
  function updateHabit(id, patch) {
    const h = findHabit(id);
    if (!h) return;
    Object.assign(h, patch);
    persist();
  }
  // 永久删除习惯：连带回滚其全部历史积分（每日结算 refId = habitId_date，按 id 前缀族整体清算）
  // 注意与 archiveHabit 的区别：归档保留全部历史打卡与积分，不做任何回滚
  function deleteHabit(id) {
    const h = findHabit(id);
    if (!h) return;
    rollbackEntityPoints([id], 'habit', h.name);
    state.habits = state.habits.filter(x => x._id !== id); // 打卡记录随习惯一并移除
    persist();
  }
  // 任务转习惯：由「每天」周期触发。新建记录型习惯，并从任务夹/看板移除原任务（deleteTask）。
  function convertTaskToHabit(draft, taskId) {
    const h = addHabit({
      name: (draft && draft.title ? String(draft.title).trim() : '') || '新习惯',
      type: 'RECORD_HABIT',
      desc: (draft && draft.desc) || '',
      enable_remind: !!(draft && draft.enable_remind),
      remind_time: (draft && draft.remind_time) || '09:00',
    });
    // 转习惯 = 实体迁移而非销毁，历史积分随语义延续，不触发删除回滚
    if (taskId) deleteTask(taskId, true);
    return h;
  }
  // 归档习惯（归档 ≠ 删除：保留全部历史打卡记录，不在今日页渲染，可在全局归档仓库检索）
  function archiveHabit(id) {
    const h = findHabit(id);
    if (!h) return;
    h.is_archived = true;
    h.archived_at = todayStr();
    persist();
  }
  // 习惯反归档（撤销归档：恢复至今日页，保留全部历史打卡记录）
  function unarchiveHabit(id) {
    const h = findHabit(id);
    if (!h) return;
    h.is_archived = false;
    h.archived_at = '';
    persist();
    // 反归档后重新结算该习惯所有历史日期的积分
    const dates = new Set();
    h.records.forEach(r => dates.add(r.date));
    dates.forEach(date => settleHabitPoints(date));
  }
  // 全局归档仓库检索：已归档习惯（keyword 匹配名称/描述/备注；习惯本身无 tags 字段，但预留兼容）
  function getArchivedHabits(keyword) {
    let list = state.habits.filter(h => h.is_archived);
    if (keyword) {
      const k = keyword.toLowerCase();
      list = list.filter(h => (h.name || '').toLowerCase().includes(k)
        || (h.desc || '').toLowerCase().includes(k)
        || (h.notes || '').toLowerCase().includes(k)
        || (Array.isArray(h.tags) && h.tags.some(tg => String(tg || '').toLowerCase().includes(k) || String(tg || '').replace(/^#+/, '').toLowerCase().includes(k))));
    }
    return list.map(h => Object.assign({}, h, { isHabit: true, title: h.name, category_id: null }));
  }

  // 该习惯某日是否处于请假状态
  function isHoliday(id, date) {
    const h = findHabit(id);
    if (!h) return false;
    const rec = h.records.find(r => r.date === date);
    if (rec && rec.status === 'holiday') return true;
    return inHolidayRanges(date, h.holiday_ranges);
  }

  /* ============================ 任务相关方法 ============================ */
  function findTask(id) { return state.tasks.find(t => t._id === id); }

  function addTask(partial) {
    const t = Object.assign({
      _id: uid('task'), title: '新任务', desc: '', category_id: null,
      // —— 分类双层结构（第 1 层改造）：category 为当前分类名，parent_category 为一级父分类（仅二级时填写）——
      parent_category: '', category: '',
      is_archived: false, execute_date: null, cycle: null, enable_remind: false,
      deadline_time: '', remind_option: 'none', add_to_calendar: false,
      // —— 时间线结束时间（可选）：缺省时展示 = remind_time + 30 分钟，由统计页时间线面板编辑/展示 ——
      remind_end: '',
      // —— 日期双模式（第 1 层改造）：date_mode=single 单点 / range 区间；区间用 date_start~date_end ——
      date_mode: 'single', date_start: '', date_end: '',
      sub_tasks: [], progress_info: { enable: false, media_type: 'book', progress_value: '' },
      material_notes: '', cycle_history: [], expect_hint_date: null, create_at: Date.now(),
      plan_year: null, plan_month: null, plan_week: null, time_mode: null,
      week_offset: null, cycle_end_date: '',
      // —— 周期结束方式：''（默认，永久循环）/ 'date'（按结束日期）/ 'count'（打卡 N 次后结束）——
      cycle_end_mode: '', cycle_end_count: 0,
      doneDates: [],
      doneOverdueDates: [],
      is_template: false, is_collection: false,
      material_link: '',
      // —— 紧急任务标记：勾选后无视所有日期/周期排序，强制置顶今日Tab，需优先完成 ——
      isEmergency: false,
    }, partial || {});
    // 临时任务强制无时间：清除所有日期/周期/提醒字段，保持「无时间待归档」语义
    if (t.category_id === QUICK_VIEW_ID) {
      t.execute_date = null; t.cycle = null; t.enable_remind = false; t.remind_time = '';
      t.date_mode = 'single'; t.date_start = ''; t.date_end = '';
      t.plan_year = null; t.plan_month = null; t.plan_week = null; t.time_mode = null;
      t.deadline_time = ''; t.remind_option = 'none'; t.add_to_calendar = false;
    }
    // 收藏夹任务强制无时间：无法绑定日期 / 周期 / 指定周（与时间选择器无效规则一致）
    if (t.is_collection) {
      t.execute_date = null; t.cycle = null; t.enable_remind = false; t.remind_time = '';
      t.date_mode = 'single'; t.date_start = ''; t.date_end = '';
      t.plan_year = null; t.plan_month = null; t.plan_week = null; t.time_mode = null;
      t.week_offset = null; t.cycle_end_date = '';
      t.cycle_end_mode = ''; t.cycle_end_count = 0;
      t.deadline_time = ''; t.remind_option = 'none'; t.add_to_calendar = false;
    }
    state.tasks.unshift(t);
    if (t.cycle && !t.cycle._base) t.cycle._base = todayStr(); // 周期锚定创建日，保证「每 N 天 / 每月指定日」投射正确
    persist();
    return t;
  }

  function updateTask(id, patch) {
    const t = findTask(id);
    if (!t) return;
    const oldEnd = t.cycle_end_date || '';
    // 规则③（模板专属）：先快照时间配置，稍后判定是否发生变更
    const schedKeys = ['cycle', 'cycle_end_date', 'date_mode', 'date_start', 'date_end', 'execute_date', 'plan_year', 'plan_month', 'plan_week', 'time_mode', 'week_offset'];
    const oldSched = {}; schedKeys.forEach(k => { oldSched[k] = t[k]; });
    Object.assign(t, patch);
    // 编辑后若标签变为临时任务，强制清除所有时间字段
    if (t.category_id === QUICK_VIEW_ID) {
      t.execute_date = null; t.cycle = null; t.enable_remind = false; t.remind_time = '';
      t.date_mode = 'single'; t.date_start = ''; t.date_end = '';
      t.plan_year = null; t.plan_month = null; t.plan_week = null; t.time_mode = null;
      t.deadline_time = ''; t.remind_option = 'none'; t.add_to_calendar = false;
    }
    // 编辑后若标记为收藏夹任务，强制清除所有时间字段（无法绑定日期 / 周期 / 指定周）
    if (t.is_collection) {
      t.execute_date = null; t.cycle = null; t.enable_remind = false; t.remind_time = '';
      t.date_mode = 'single'; t.date_start = ''; t.date_end = '';
      t.plan_year = null; t.plan_month = null; t.plan_week = null; t.time_mode = null;
      t.week_offset = null; t.cycle_end_date = '';
      t.cycle_end_mode = ''; t.cycle_end_count = 0;
      t.deadline_time = ''; t.remind_option = 'none'; t.add_to_calendar = false;
    }
    if (t.cycle && !t.cycle._base) t.cycle._base = todayStr(); // 编辑时补锚点
    // 规则③（模板专属）：时间配置变更 → 先回收全部旧副本（清空打卡历史/失效标记），再由虚拟投射自动生成新副本
    if (t.is_template) {
      const schedEq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
      const schedChanged = schedKeys.some(k => !schedEq(oldSched[k], t[k]));
      if (schedChanged) {
        t.cycle_history = []; t.doneDates = []; t.doneOverdueDates = []; t.archived_copies = [];
        (t.sub_tasks || []).forEach(s => { s.cycle_history = []; s.doneDates = []; s.doneOverdueDates = []; s.archived_copies = []; });
        delete t.archive_snapshot;
        t.is_archived = false; t.autoArchivedByCopies = false;
      }
    } else {
      // 规则②：母本结束日缩短（或新设）后，批量清理所有晚于结束日的副本
      const newEnd = t.cycle_end_date || '';
      if (newEnd && (!oldEnd || newEnd < oldEnd)) trimCycleCopiesAfterEnd(t, newEnd);
      // 规则②(次数模式)：结束方式改为「打卡 N 次后结束」时，按 N 个执行日的末日清理超出副本
      if (t.cycle && t.cycle_end_mode === 'count' && t.cycle_end_count > 0) {
        const cEnd = cycleCountEndDate(t);
        if (cEnd) trimCycleCopiesAfterEnd(t, cEnd);
      }
    }
    persist();
  }

  // 紧急置顶：仅翻转 isEmergency 标记，绝不触碰任何日期 / 周期 / 提醒字段。
  // 用于看板 / 今日列表的一键「设紧急 / 取消紧急」：执行时间、周期配置、提醒等全部原样保留。
  function toggleEmergency(id, val) {
    const t = findTask(id);
    if (!t) return;
    t.isEmergency = (val == null) ? !t.isEmergency : !!val;
    persist();
  }

  // 子任务紧急置顶：仅翻转 isEmergency，不动任何日期/周期/提醒字段。
  function toggleSubEmergency(parentId, subId) {
    const t = findTask(parentId);
    if (!t) return;
    const s = (t.sub_tasks || []).find(x => x._id === subId);
    if (!s) return;
    s.isEmergency = !s.isEmergency;
    persist();
  }

  // 某日期是否已「本条打卡完成」（周期 / 自定义区间任务共用 cycle_history 逐日记录）
  function cycleArchivedToday(t, date) {
    if (!t) return false;
    return (t.cycle_history || []).some(h => h.execute_date === date && h.is_archived);
  }

  // 枚举周期任务在 [start, end] 内的全部命中日期（用于「执行历史」全量展示）
  // opts.base：day/interval 类型缺 _base 时的兜底锚点（ISO 日期）；
  // opts.hist/opts.fut：无限循环（无 cycle_end_date）时界定的历史/未来展示窗口天数；
  // opts.max：单次枚举上限，防止极端长区间卡顿。
  function cycleOccurrenceDates(cycle, end, opts) {
    if (!cycle) return [];
    const o = opts || {};
    const today = todayStr();
    let start = cycle._base || o.base || today;
    let finish = end || '';
    if (!finish) {
      // 无限循环：以今天为锚界定展示窗口（过去 hist 天 + 未来 fut 天）
      const from = addDays(today, -(o.hist != null ? o.hist : 30));
      if (start < from) start = from;
      finish = addDays(today, (o.fut != null ? o.fut : 60));
    }
    // 有限周期：若锚点晚于结束日（如 _base 在 cycle_end_date 之后），
    // 从结束日往前回溯 4000 天查找有效起点，确保枚举不落空
    if (end && start > finish) {
      let probe = finish, n = 0;
      while (probe >= '2000-01-01' && n < 4000) {
        if (cycleHits(cycle, probe)) { start = probe; break; }
        probe = addDays(probe, -1); n++;
      }
      if (start > finish) start = finish;
    }
    const out = [];
    let ds = start;
    const maxN = o.max != null ? o.max : 4000;
    let n = 0;
    while (ds <= finish && n < maxN) {
      if (cycleHits(cycle, ds)) out.push(ds);
      ds = addDays(ds, 1);
      n++;
    }
    return out;
  }

  // 次数模式：按周期规则从锚点向前推算，取前 cycle_end_count 个执行日（执行历史即「正常按周期推算」）
  // 锚点缺失时回退创建日；cycle_end_count 非法（<=0）返回空（退化为无限循环口径）
  function cycleCountDates(t) {
    if (!t || !t.cycle || t.cycle_end_mode !== 'count' || !(t.cycle_end_count > 0)) return [];
    const base = t.cycle._base || (t.create_at ? fmt(new Date(t.create_at)) : todayStr());
    const N = t.cycle_end_count;
    const out = []; let ds = base, guard = 0;
    while (out.length < N && guard < 100000) {
      if (cycleHits(t.cycle, ds)) out.push(ds);
      ds = addDays(ds, 1); guard++;
    }
    return out;
  }
  // 次数模式：N 个执行日中的最末一日（用于副本投射上界；无则返回 ''）
  function cycleCountEndDate(t) {
    const arr = cycleCountDates(t);
    return arr.length ? arr[arr.length - 1] : '';
  }
  // 次数模式：已打卡次数（cycle_history 中 is_archived 的条数）
  function cycleDoneCount(t) {
    return (t.cycle_history || []).filter(h => h.is_archived).length;
  }

  // 全部执行日期是否都已打卡完成（用于「全部日期完成自动归档母本」）
  // 周期·次数模式（cycle_end_mode==='count'）：已打卡次数 >= cycle_end_count 即视为完成（结束于第 N 次打卡）
  // 周期·日期模式（有 cycle_end_date）：有限周期逐日判定；无限循环（无结束日）恒返回 false
  // 自定义区间：有 date_end 时逐日判定；无结束日的无限区间恒返回 false
  function allOccurrencesDone(t) {
    if (!t) return false;
    if (t.cycle && t.cycle_end_mode === 'count' && t.cycle_end_count > 0) {
      if (t.is_template) return false; // 模板任务不靠次数归档（仅手动按钮可归档）
      return cycleDoneCount(t) >= t.cycle_end_count;
    }
    const done = (t.cycle_history || []).filter(h => h.is_archived).map(h => h.execute_date);
    if (t.cycle) {
      if (!t.cycle_end_date) return false;
      const dates = cycleOccurrenceDates(t.cycle, t.cycle_end_date, { base: t.cycle._base || (t.create_at ? fmt(new Date(t.create_at)) : '') });
      return dates.length > 0 && dates.every(d => done.indexOf(d) >= 0);
    }
    if (t.date_mode === 'range' && t.date_start) {
      const e = t.date_end || '';
      if (!e) return false; // 无限区间无「全部」
      let cur = parseDate(t.date_start), end = parseDate(e), n = 0; const maxN = 4000;
      while (cur.getTime() <= end.getTime() && n < maxN) {
        if (done.indexOf(fmt(cur)) < 0) return false;
        cur = parseDate(addDays(fmt(cur), 1)); n++;
      }
      return true;
    }
    return false;
  }

  // 执行历史：标记 / 撤销某次出现日期（母本长按编辑页统一入口）
  // 适用：周期任务（每日/每周/每月/间隔）与 自定义区间（range）任务，逐日打卡，共用 cycle_history
  // - 允许对「已归档母本」操作（满足：已归档母本仍可正常操作打卡记录）
  // - 全部日期完成 → 自动归档母本；撤销任一打卡使未全完成时 → 母本退回待归档
  // - 手动归档（archiveTaskFull）/到期归档（autoArchiveExpiredCycles）不受此撤销影响
  function toggleOccurrence(id, date, done) {
    const t = findTask(id);
    if (!t) return;
    // 仅周期 / 自定义区间任务支持逐日打卡（单点任务走 doneDates）
    if (!t.cycle && !(t.date_mode === 'range' && t.date_start)) return;
    if (done) {
      if (!cycleArchivedToday(t, date)) {
        t.cycle_history.push({ execute_date: date, is_archived: true, overdue: date < todayStr() });
      }
    } else {
      const idx = t.cycle_history.map(h => h.execute_date).lastIndexOf(date);
      if (idx >= 0) t.cycle_history.splice(idx, 1);
    }
    // 全部完成 → 自动归档母本（模版任务禁用：仅手动按钮可归档母本）
    if (allOccurrencesDone(t) && !t.is_archived && !t.is_template) { t.is_archived = true; t.autoArchivedByCopies = true; }
    else if (t.is_template && allOccurrencesDone(t)) { resetTemplate(t._id); } // 模板：副本全完成→统一重置（清空时间+回收副本+重置子任务），不归档
    // 撤销后未全完成 → 母本退回待归档（仅自动归档情形，手动归档不受影响；模版任务不触发）
    if (!done && t.is_archived && t.autoArchivedByCopies && !allOccurrencesDone(t) && !t.is_template) { t.is_archived = false; t.autoArchivedByCopies = false; }
    persist();
  }

  // 归档完成（核心：归档 ≠ 删除）
  function archiveTask(id) {
    const t = findTask(id);
    if (!t) return;
    const wasArchived = !!t.is_archived;
    if (t.cycle) {
      const today = todayStr();
      if (!cycleArchivedToday(t, today)) {
        t.cycle_history.push({ execute_date: today, is_archived: true });
      }
    } else {
      t.is_archived = true;
    }
    t.isEmergency = false;
    persist();
    // 积分联动：收藏夹归档 +9；临时任务完成 +5（仅「未归档→归档」单向任务计分，避免重复完成重复加分）
    if (!wasArchived && !t.cycle) {
      if (isCollectionTask(t)) addPoints(9, 'collection', '归档: ' + t.title, t._id);
      else if (t.category_id === QUICK_VIEW_ID) addPoints(5, 'temp_task', '完成临时任务: ' + t.title, t._id);
    }
  }

  function archiveTaskFull(id) {
    const t = findTask(id);
    if (!t || t.is_archived) return;
    archiveMasterCopies(t);
    t.is_archived = true;
    t.isEmergency = false;
    persist();
    // 积分联动：收藏夹彻底归档 +9；临时任务完成 +5
    if (!t.cycle) {
      if (isCollectionTask(t)) addPoints(9, 'collection', '归档: ' + t.title, t._id);
      else if (t.category_id === QUICK_VIEW_ID) addPoints(5, 'temp_task', '完成临时任务: ' + t.title, t._id);
    }
  }

  function undoArchive(id) {
    const t = findTask(id);
    if (!t) return;
    // 积分联动：撤销收藏归档 / 撤销临时任务完成
    if (isCollectionTask(t)) { reversePoints(id, 'collection'); }
    else if (t.category_id === QUICK_VIEW_ID) { reversePoints(id, 'temp_task'); }
    if (t.is_archived) {
      t.is_archived = false;
      t.autoArchivedByCopies = false;
      restoreArchiveSnapshot(t);
      // restoreArchiveSnapshot 已从快照恢复 cycle_history，无需额外清空
    } else if (t.cycle) {
      const today = todayStr();
      const idx = (t.cycle_history || []).map(h => h.execute_date).lastIndexOf(today);
      if (idx >= 0) t.cycle_history.splice(idx, 1);
    }
    persist();
  }

  function undoCycleCheckIn(id, date) {
    const t = findTask(id);
    if (!t || !t.cycle) return;
    const h = (t.cycle_history || []).find(x => x.execute_date === date);
    if (h && h.is_archived) { h.is_archived = false; persist(); }
    if (t.is_archived && (t.autoArchivedByCopies || (t.cycle_end_date && t.cycle_end_date < todayStr()))) {
      const stillOpen = (t.cycle_history || []).some(x => !x.is_archived) || !t.cycle_end_date || t.cycle_end_date >= todayStr();
      if (stillOpen) { t.is_archived = false; t.autoArchivedByCopies = false; }
    }
    // 积分联动：撤销周期打卡
    reversePoints(id, 'cycle_task');
  }

  /* ============ 周期副本：失效标记 / 渲染三重校验（母本—副本联动） ============
   * 副本为虚拟投射（依据母本 cycle / cycle_end_date 逐日生成），这里补充「副本级失效标记」
   * 与「渲染三重校验」，落实三条规则：
   *   ① 滑动归档周期母本 → 批量标记其全部关联副本失效（写入 archived_copies）
   *   ② 副本编辑页允许直接改周期结束日 / 区间起止日（改动同步母本）；母本改结束日 / 终止周期 → 批量清理晚于结束日的副本
   *   ③ 副本渲染需同时满足：副本本身未失效 ∧ 母本未归档 ∧ 副本日期 ≤ 母本周期结束日
   */
  // 副本是否被显式标记失效 / 归档（date 在该母本 archived_copies 集合中）
  function isCopyArchived(t, date) {
    if (!t || !date) return false;
    return Array.isArray(t.archived_copies) && t.archived_copies.indexOf(date) >= 0;
  }
  // 副本是否应渲染（三重校验）：母本未归档 ∧ 副本本身未失效 ∧ 副本日期 ≤ 母本周期结束日
  function copyShouldRender(t, date) {
    if (!t) return false;
    if (t.is_archived) return false;                                  // 母本未归档
    if (isCopyArchived(t, date)) return false;                        // 副本本身未失效
    if (t.cycle_end_date && date > t.cycle_end_date) return false;     // 副本日期 ≤ 母本周期结束日（按日期结束）
    // 次数模式：副本日期不得超出 N 个执行日的末日（结束于第 N 次打卡）
    if (t.cycle && t.cycle_end_mode === 'count' && t.cycle_end_count > 0) {
      const cEnd = cycleCountEndDate(t);
      if (cEnd && date > cEnd) return false;
    }
    return true;
  }
  // 计算某实体（母本或子任务）的副本发生日列表：
  // 子任务优先用自身 cycle / 区间；若无则跟随母本周期规则生成（统一规范③：子任务跟随母本周期）。
  function entityOccurrenceDates(e, parent) {
    if (e.cycle) {
      // 次数模式：按周期推算前 N 个执行日（执行历史正常按周期推算，结束于第 N 次打卡）
      if (e.cycle_end_mode === 'count' && e.cycle_end_count > 0) return cycleCountDates(e);
      return cycleOccurrenceDates(e.cycle, e.cycle_end_date || '', { base: e.cycle._base || (e.create_at ? fmt(new Date(e.create_at)) : ''), fut: 365, hist: 0 });
    }
    if (e.date_mode === 'range' && e.date_start) {
      const out = []; let cur = parseDate(e.date_start);
      const end = e.date_end ? parseDate(e.date_end) : parseDate(addDays(e.date_start, 365));
      while (cur.getTime() <= end.getTime() && out.length < 4000) { out.push(fmt(cur)); cur = parseDate(addDays(fmt(cur), 1)); }
      return out;
    }
    if (parent && parent.cycle) {
      // 次数模式跟随母本：按母本 N 个执行日上界
      if (parent.cycle_end_mode === 'count' && parent.cycle_end_count > 0) return cycleCountDates(parent);
      return cycleOccurrenceDates(parent.cycle, parent.cycle_end_date || '', { base: parent.cycle._base || (parent.create_at ? fmt(new Date(parent.create_at)) : ''), fut: 365, hist: 0 });
    }
    if (parent && parent.date_mode === 'range' && parent.date_start) {
      const out = []; let cur = parseDate(parent.date_start);
      const end = parent.date_end ? parseDate(parent.date_end) : parseDate(addDays(parent.date_start, 365));
      while (cur.getTime() <= end.getTime() && out.length < 4000) { out.push(fmt(cur)); cur = parseDate(addDays(fmt(cur), 1)); }
      return out;
    }
    return [];
  }
  // 归档周期母本：原子事务第一步 —— 母本 is_archived 由调用方设置；
  // 此处：(a) 存【归档快照】= 母本全部副本（发生日）+ 打卡数据（cycle_history）+ 归档前副本失效标记；
  //       (b) 批量标记母本全部关联副本失效（写入 archived_copies），使所有副本 archived=true；
  //       (c) 统一规范①③：批量同步所有子任务，全部子副本失效（子任务无自身周期时跟随母本周期生成）。
  // 快照用于撤销归档时完整回滚，保证「母本归档 / 撤销归档」是一对原子事务。
  function archiveMasterCopies(t) {
    if (!t) return;
    const hasOwn = !!(t.cycle || (t.date_mode === 'range' && t.date_start));
    const hasSubs = !!(t.sub_tasks && t.sub_tasks.length);
    if (!hasOwn && !hasSubs) return; // 无副本且无子任务：无需快照 / 同步
    // —— 归档快照：母本副本 + 打卡数据 + 归档前失效标记 + 子任务快照 ——
    const snap = {
      ts: Date.now(),
      copies: hasOwn ? entityOccurrenceDates(t, null) : [],
      history: (t.cycle_history || []).map(h => Object.assign({}, h)),
      archived_copies: Array.isArray(t.archived_copies) ? t.archived_copies.slice() : [],
      doneDates: Array.isArray(t.doneDates) ? t.doneDates.slice() : [],
      doneOverdueDates: Array.isArray(t.doneOverdueDates) ? t.doneOverdueDates.slice() : [],
      subSnaps: [],
    };
    // 母本全部关联副本标记失效（所有副本 archived=true）
    const set = new Set(t.archived_copies || []);
    snap.copies.forEach(d => set.add(d));
    t.archived_copies = Array.from(set);
    // 统一规范①③：母本归档 → 批量同步所有子任务，全部子副本失效
    (t.sub_tasks || []).forEach(s => {
      const sdates = entityOccurrenceDates(s, t);
      snap.subSnaps.push({
        _id: s._id,
        archived_copies: Array.isArray(s.archived_copies) ? s.archived_copies.slice() : [],
        cycle_history: (s.cycle_history || []).map(h => Object.assign({}, h)),
      });
      const sset = new Set(s.archived_copies || []);
      sdates.forEach(d => sset.add(d));
      s.archived_copies = Array.from(sset);
    });
    t.archive_snapshot = snap;
  }
  // 撤销归档：恢复母本与全部副本（清空副本失效标记），并清空所有副本打卡历史
  // （cycle_history / doneDates / doneOverdueDates），使被撤销归档的任务以「全新活跃态」重生——
  // 所有副本恢复可见，且不再带有任何已完成记录。快照仅用于归档时记录，撤销时不再回滚历史。
  function restoreArchiveSnapshot(t) {
    if (!t) return;
    const snap = t.archive_snapshot;
    if (snap) {
      // 从快照恢复归档前的打卡记录和失效标记
      t.archived_copies = snap.archived_copies || [];
      t.cycle_history = snap.history || [];
      t.doneDates = snap.doneDates || [];
      t.doneOverdueDates = snap.doneOverdueDates || [];
      // 子任务：从 subSnaps 恢复各自的数据
      if (snap.subSnaps && snap.subSnaps.length) {
        (t.sub_tasks || []).forEach(s => {
          const ss = snap.subSnaps.find(x => x._id === s._id);
          if (ss) {
            s.archived_copies = ss.archived_copies || [];
            s.cycle_history = ss.cycle_history || [];
          }
        });
      }
    } else {
      // 无快照时兜底清空（旧数据兼容）
      t.archived_copies = [];
      t.cycle_history = [];
      t.doneDates = [];
      t.doneOverdueDates = [];
      (t.sub_tasks || []).forEach(s => {
        s.archived_copies = [];
        s.cycle_history = [];
        s.doneDates = [];
        s.doneOverdueDates = [];
        s.finishHistory = [];
      });
    }
    delete t.archive_snapshot;
  }
  // 母本结束日缩短（或新设）后，批量清理所有晚于结束日的副本（移除其打卡记录与失效标记）；
  // 统一规范①：同时批量同步所有子任务，清理其子副本中晚于结束日者。
  function trimCycleCopiesAfterEnd(t, newEnd) {
    if (!t || !newEnd) return;
    const clean = (e) => {
      if (e.cycle_history && e.cycle_history.length) {
        e.cycle_history = e.cycle_history.filter(h => !(h.execute_date && h.execute_date > newEnd));
      }
      if (Array.isArray(e.archived_copies) && e.archived_copies.length) {
        e.archived_copies = e.archived_copies.filter(d => !(d && d > newEnd));
      }
    };
    clean(t);
    (t.sub_tasks || []).forEach(clean);
  }

  // 彻底删除任务（与归档区分：归档保留记录+积分、删除物理移除并回滚积分）
  // 回滚范围：该任务本体（cycle_task / study_work / collection，refId = taskId）
  //           + 其名下全部子任务（study_work，refId = taskId_subId）—— 由 id 前缀族一次性覆盖
  // skipRollback：内部迁移场景专用（如「任务转习惯」，实体是转移而非销毁，不应清算积分）
  function deleteTask(id, skipRollback) {
    const t = findTask(id);
    if (!t) return;
    if (!skipRollback) {
      const subCnt = (t.sub_tasks || []).length;
      rollbackEntityPoints([id], 'task', t.title, subCnt > 0 ? '连带 ' + subCnt + ' 个子任务' : '');
    }
    state.tasks = state.tasks.filter(x => x._id !== id);
    persist();
  }

  function addSubTask(id, title, deadline, extra) {
    const t = findTask(id);
    if (!t) return null;
    // sub_deadline：子任务自己的截止日期，可选；null = 不设置，仅展示不触发任何逻辑
    const s = Object.assign({
      _id: uid('sub'), title, is_done: false, sub_deadline: deadline || null,
      desc: '', material_notes: '', material_link: '',
      category_id: null, parent_category: '',
      cycle: null, is_archived: false,
      // 主任务时间体系字段（与任务一致：仅年月 / 年月日 / 自定义区间 + 周期）
      date_mode: '', plan_year: null, plan_month: null, execute_date: null, date_start: '', date_end: '',
      progress_info: { enable: false, media_type: 'book', progress_value: '' },
      enable_remind: false, remind_time: '',
      sub_remind: false, sub_remind_time: '',
      // 时间线结束时间（可选）：缺省时展示 = 起始 + 30 分钟，由统计页时间线面板编辑/展示
      sub_remind_end: '',
      // 执行历史：每次「打卡完成」追加一条时间记录（查看过往完成记录用）
      finishHistory: [],
      // 周期 / 区间打卡逐日记录（与主任务 cycle_history 同款，子任务副本滑动完成写入）
      cycle_history: [],
      // 非周期副本打卡记录（单点 / 区间窗口键，与主任务 doneDates 同款）
      doneDates: [], doneOverdueDates: [],
      // 副本失效标记（归档 / 终止周期时批量写入，控制副本显隐）
      archived_copies: [],
      // 周期结束日期（可选）：限制周期任务执行历史的日期范围；留空=无限循环
      cycle_end_date: '',
      // 周期结束方式：''（默认，永久循环）/ 'date'（按结束日期）/ 'count'（打卡 N 次后结束）
      cycle_end_mode: '', cycle_end_count: 0,
      // 紧急标记：子任务同样支持强制置顶（今日子任务列表）
      isEmergency: false,
    }, extra || {});
    if (s.cycle && !s.cycle._base) s.cycle._base = todayStr(); // 周期锚定创建日（与主任务 addTask 一致），保证「每 N 天」投射正确
    t.sub_tasks.push(s);
    persist();
    return s;
  }
  function toggleSubTask(id, subId) {
    const t = findTask(id);
    if (!t) return;
    const s = t.sub_tasks.find(s => s._id === subId);
    if (!s) return;
    s.is_done = !s.is_done;
    // 执行历史：打卡完成时写入时间戳；取消完成则移除「当日」最近一条（避免误触脏记录），保留过往历史
    s.finishHistory = s.finishHistory || [];
    if (s.is_done) {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      s.finishHistory.push({ date: todayStr(), time: hh + ':' + mm, ts: now.getTime() });
      s.isEmergency = false; // 打卡完成即清空紧急标记
    } else {
      const i = s.finishHistory.length - 1;
      if (i >= 0 && s.finishHistory[i].date === todayStr()) s.finishHistory.splice(i, 1);
    }
    persist();
  }
  // 编辑子任务：patch 可含 { title, desc, material_notes, category_id, parent_category, cycle, progress_info, sub_deadline, enable_remind, remind_time, sub_remind, sub_remind_time, remind_end, sub_remind_end }；只更新传入字段，其余逻辑不受影响
  function updateSubTask(id, subId, patch) {
    const t = findTask(id);
    if (!t) return;
    const s = t.sub_tasks.find(s => s._id === subId);
    if (!s) return;
    if (patch && patch.title !== undefined) s.title = patch.title;
    if (patch && 'desc' in patch) s.desc = patch.desc || '';
    if (patch && 'material_notes' in patch) s.material_notes = patch.material_notes || '';
    if (patch && 'material_link' in patch) s.material_link = patch.material_link || '';
    if (patch && 'category_id' in patch) s.category_id = patch.category_id || null;
    if (patch && 'parent_category' in patch) s.parent_category = patch.parent_category || '';
    if (patch && 'cycle' in patch) s.cycle = patch.cycle || null;
    if (s.cycle && !s.cycle._base) s.cycle._base = todayStr(); // 周期锚点缺失时补建（与主任务 updateTask 一致），保证「每 N 天」投射正确
    if (patch && 'isEmergency' in patch) s.isEmergency = !!patch.isEmergency; // 紧急标记：与 addSubTask / 主任务 updateTask 口径一致，编辑子任务紧急标签可正常持久化
    if (patch && 'progress_info' in patch) s.progress_info = patch.progress_info || { enable: false, media_type: 'book', progress_value: '' };
    if (patch && 'sub_deadline' in patch) s.sub_deadline = patch.sub_deadline || null;
    // 主任务时间体系字段（与任务一致）
    if (patch && 'date_mode' in patch) s.date_mode = patch.date_mode || '';
    if (patch && 'plan_year' in patch) s.plan_year = patch.plan_year || null;
    if (patch && 'plan_month' in patch) s.plan_month = patch.plan_month || null;
    if (patch && 'plan_week' in patch) s.plan_week = patch.plan_week || null;
    if (patch && 'execute_date' in patch) s.execute_date = patch.execute_date || null;
    if (patch && 'date_start' in patch) s.date_start = patch.date_start || '';
    if (patch && 'date_end' in patch) s.date_end = patch.date_end || '';
    if (patch && 'time_mode' in patch) s.time_mode = patch.time_mode || null;
    if (patch && 'week_offset' in patch) s.week_offset = (patch.week_offset != null) ? patch.week_offset : null;
    if (patch && 'cycle_end_mode' in patch) s.cycle_end_mode = patch.cycle_end_mode || '';
    if (patch && 'cycle_end_count' in patch) s.cycle_end_count = Number(patch.cycle_end_count) || 0;
    if (patch && 'cycle_end_date' in patch) {
      const oldEnd = s.cycle_end_date || '';
      const newEnd = patch.cycle_end_date || '';
      s.cycle_end_date = newEnd;
      // cycle_end_date 缩短时，清理超出范围的打卡记录和失效标记（与主任务 trimCycleCopiesAfterEnd 一致）
      if (oldEnd && newEnd && newEnd < oldEnd) {
        if (s.cycle_history && s.cycle_history.length) {
          s.cycle_history = s.cycle_history.filter(h => !(h.execute_date && h.execute_date > newEnd));
        }
        if (Array.isArray(s.archived_copies) && s.archived_copies.length) {
          s.archived_copies = s.archived_copies.filter(d => !(d && d > newEnd));
        }
      }
    }
    // 次数模式：按 N 个执行日的末日清理超出的打卡记录与失效标记（与主任务 updateTask 一致）
    if (s.cycle && s.cycle_end_mode === 'count' && s.cycle_end_count > 0) {
      const cEnd = cycleCountEndDate(s);
      if (cEnd) {
        if (s.cycle_history && s.cycle_history.length) {
          s.cycle_history = s.cycle_history.filter(h => !(h.execute_date && h.execute_date > cEnd));
        }
        if (Array.isArray(s.archived_copies) && s.archived_copies.length) {
          s.archived_copies = s.archived_copies.filter(d => !(d && d > cEnd));
        }
      }
    }
    // 子任务提醒（独立配置，不继承父任务）：兼容 enable_remind / sub_remind 两套字段
    if (patch && 'enable_remind' in patch) { s.enable_remind = !!patch.enable_remind; s.sub_remind = !!patch.enable_remind; }
    if (patch && 'sub_remind' in patch) { s.sub_remind = !!patch.sub_remind; s.enable_remind = !!patch.sub_remind; }
    if (patch && 'remind_time' in patch) { s.remind_time = patch.remind_time || ''; s.sub_remind_time = patch.remind_time || ''; }
    if (patch && 'sub_remind_time' in patch) { s.sub_remind_time = patch.sub_remind_time || ''; s.remind_time = patch.sub_remind_time || ''; }
    // 时间线结束时间（主/子双写，与 remind_time / sub_remind_time 同模式）
    if (patch && 'remind_end' in patch) { s.remind_end = patch.remind_end || ''; s.sub_remind_end = patch.remind_end || ''; }
    if (patch && 'sub_remind_end' in patch) { s.sub_remind_end = patch.sub_remind_end || ''; s.remind_end = patch.sub_remind_end || ''; }
    persist();
  }
  // 永久删除子任务：回滚其历史积分（study_work，refId = taskId_subId）
  // 与 archiveSubTask 区别：归档仅置失效标记，积分完整保留
  function removeSubTask(id, subId) {
    const t = findTask(id);
    if (!t) return;
    const s = (t.sub_tasks || []).find(x => x._id === subId);
    if (s) rollbackEntityPoints([id + '_' + subId], 'subtask', s.title);
    t.sub_tasks = t.sub_tasks.filter(s => s._id !== subId);
    persist();
  }
  // 子任务归档 / 撤销归档（与父任务已归档一致：仅改状态，不物理删除）
  function archiveSubTask(id, subId) {
    const t = findTask(id);
    if (!t) return;
    const s = t.sub_tasks.find(s => s._id === subId);
    if (s) { s.is_archived = true; s.archived_at = todayStr(); s.isEmergency = false; persist(); }
  }
  function undoArchiveSubTask(id, subId) {
    const t = findTask(id);
    if (!t) return;
    const s = t.sub_tasks.find(s => s._id === subId);
    if (s) {
      s.is_archived = false;
      s.archived_at = '';
      s.is_done = false;
      // 尝试从父任务归档快照中恢复子任务的打卡记录
      const snap = t.archive_snapshot;
      if (snap && snap.subSnaps) {
        const ss = snap.subSnaps.find(x => x._id === subId);
        if (ss) {
          s.archived_copies = ss.archived_copies || [];
          s.cycle_history = ss.cycle_history || [];
          s.doneDates = [];
          s.doneOverdueDates = [];
          s.finishHistory = [];
          // 保留提醒字段
          persist();
          return;
        }
      }
      // 无快照时兜底清空
      s.finishHistory = [];
      s.cycle_history = [];
      s.doneDates = [];
      s.doneOverdueDates = [];
      s.archived_copies = [];
      persist();
    }
  }
  // 统一归档 / 撤销（主任务、子任务共用）：任意页面调用本方法，数据变更经 persist → notifyChange 全局广播
  //   archived=true → 归档；false → 撤销归档
  //   - 子任务归档：标记该子任务失效；若母本全部子任务均归档，则同步自动归档母本（含其全部周期副本）
  //   - 主任务归档：归档母本 + 批量失效其全部关联周期副本（archiveMasterCopies），同步所有副本 archived 状态
  function setArchived(id, subId, archived) {
    const t = findTask(id);
    if (!t) return;
    if (subId) {
      if (archived) {
        archiveSubTask(id, subId);
        // 规则③：仅【普通任务】子任务全部完成(归档) → 母本自动归档；模版任务禁用此逻辑（仅手动按钮可归档母本）
        if (!t.is_template && t.sub_tasks.length && t.sub_tasks.every(s => s.is_archived) && !t.is_archived) {
          archiveMasterCopies(t); t.is_archived = true; persist();
        }
      } else {
        undoArchiveSubTask(id, subId);
      }
    } else {
      // 母本归档/撤销：模版任务走专属原子方法（撤销时批量恢复全部关联副本）；否则走通用归档
      if (t.is_template) { setTemplateArchived(id, archived); return; }
      if (archived) archiveTaskFull(id);
      else undoArchive(id);
    }
  }
  // 模版任务专属归档 / 撤销原子方法
  //   - 模版夹母本仅支持手动归档按钮变更归档状态；副本滑动完成（markCopyDone 等）不会自动归档母本
  //   - 撤销归档时批量恢复该母本全部关联副本（周期母本从快照回滚；无快照则清空副本失效标记），触发看板重新渲染
  function setTemplateArchived(id, archived) {
    const t = findTask(id);
    if (!t || !t.is_template) return;            // 仅作用于模版任务
    if (archived) {
      archiveTaskFull(id);                        // 手动归档：母本 + 全部关联副本失效（等同 archiveTaskFull）
    } else {
      t.is_archived = false;
      t.autoArchivedByCopies = false;
      restoreArchiveSnapshot(t);                  // 批量恢复全部关联副本（周期母本从快照回滚；无快照则清空 archived_copies）
      persist();
    }
  }
  // 模板循环复用：一键重置所有子任务打卡状态（清空 is_done 并恢复被归档的子任务），母本排期与描述不变
  function resetTemplateSubTasks(id) {
    const t = findTask(id);
    if (!t) return;
    t.sub_tasks.forEach(s => { s.is_done = false; s.is_archived = false; s.finishHistory = []; });
    persist();
  }
  // 模板循环复用：重置母本时间（=【一键清空 / 恢复打卡】对母本的核心动作）
  // ① 回收全部旧副本：清空打卡历史与副本失效标记（母本 + 子任务），使旧副本全部回收；
  // ② 清空所有时间配置（date_start / date_end / execute_date / cycle_end_date / cycle._base 等），
  //    模板回到「待启用」无排期状态，重新配置时间即由虚拟投射生成全新副本，支持反复复用。
  // 母本保持非归档活跃态（不触发自动归档）。
  function resetTemplateTime(id) {
    const t = findTask(id);
    if (!t || !t.is_template) return;
    // ① 回收全部旧副本：清空打卡历史与副本失效标记（母本 + 子任务），同时清空子任务自身时间
    t.cycle_history = [];
    t.doneDates = [];
    t.doneOverdueDates = [];
    t.archived_copies = [];
    (t.sub_tasks || []).forEach(s => {
      s.cycle_history = []; s.doneDates = []; s.doneOverdueDates = []; s.archived_copies = [];
      // 同步清空子任务自身时间（避免子任务仍投射副本）
      s.execute_date = null; s.date_start = ''; s.date_end = '';
      if (s.cycle) s.cycle._base = '';
      s.cycle_end_date = ''; s.plan_year = null; s.plan_month = null; s.plan_week = null;
      s.time_mode = null; s.week_offset = null;
    });
    // ② 清空所有时间字段（模板回到待启用状态，重新配置时间才生成新副本）
    t.date_start = '';
    t.date_end = '';
    t.execute_date = null;
    t.cycle_end_date = '';
    if (t.cycle) t.cycle._base = '';   // cycle 保留但 _base 清空
    t.plan_year = null; t.plan_month = null; t.plan_week = null;
    t.time_mode = null; t.week_offset = null;
    // 母本保持活跃（待启用，不归档）
    t.is_archived = false;
    t.autoArchivedByCopies = false;
    delete t.archive_snapshot;
    persist();
  }
  // 模板循环复用：统一「一键清空 / 恢复打卡」——清空所有子任务状态 + 重置母本时间（= 同步清空父任务时间）
  // 供详情页 🔄 按钮调用；副本滑动完成（markCopyDone）亦调用同一 resetTemplate，两条入口行为完全统一。
  function resetTemplate(id) {
    const t = findTask(id);
    if (!t || !t.is_template) return;
    resetTemplateSubTasks(id);   // 清空子任务 is_done / is_archived / finishHistory
    resetTemplateTime(id);       // 清空母本时间 + 回收全部旧副本（母本+子任务）
    persist();
  }
  // 子任务拖拽排序：按给定 id 顺序重排某一类（active / archived）子任务；另一类位置保持不变
  function setSubTasksOrder(id, ids, archivedOnly) {
    const t = findTask(id);
    if (!t) return;
    const isArch = !!archivedOnly;
    const matched = t.sub_tasks.filter(s => !!s.is_archived === isArch);
    const reordered = matched.slice().sort((a, b) => ids.indexOf(a._id) - ids.indexOf(b._id));
    let ai = 0;
    t.sub_tasks = t.sub_tasks.map(s => ( !!s.is_archived === isArch && ids.indexOf(s._id) >= 0 ? reordered[ai++] : s ));
    persist();
  }

  // —— 副本「本条完成」：仅记录某次出现窗口为已完成，绝不归档母本 ——
  // 周期任务复用 cycle_history 打卡（与 archiveTask 周期分支一致，母本 is_archived 不变）；
  // 非周期任务记录 doneDates：
  //   单点任务以 execute_date 为键（今日页与周/月看板同一天共享同一键，状态一致）；
  //   区间/指定周/指定月以窗口首日 ws 为键（跨周区间每周独立，操作一个副本不影响其余副本与母本）。
  function copyKey(t, ws) {
    if (t && t.date_mode === 'single' && t.execute_date) return t.execute_date;
    return ws;
  }
  function markCopyDone(id, ws, we) {
    const t = findTask(id);
    if (!t || t.is_archived) return;
    // 模板任务：副本左滑完成 = 立即统一重置（等同一键清空），不等 allOccurrencesDone
    if (t.is_template) { resetTemplate(id); return; }
    const today = todayStr();
    if (t.cycle) {
      let cur = parseDate(ws), end = parseDate(we);
      while (cur.getTime() <= end.getTime()) {
        const ds = fmt(cur);
        if (cycleHits(t.cycle, ds) && !cycleArchivedToday(t, ds)) {
          // overdue：本次出现日早于今天（过期单次记录）→ 打「延期未完成」标记
          t.cycle_history.push({ execute_date: ds, is_archived: true, overdue: ds < today });
        }
        cur = parseDate(addDays(fmt(cur), 1));
      }
      // 周期母本归档判定（与 toggleOccurrence 执行历史页同一套语义，消除两条路径行为不一致）：
      //   · 单条副本打卡「绝不」让母本消失 —— allOccurrencesDone 内部要求
      //     有 cycle_end_date 且已到期、且全部出现日均有完成记录（任一日期被跳过即 false）；
      //     无限循环周期（无结束日）恒为 false → 母本永久展示，仅手动归档/删除才隐藏。
      //   · 仅当「最后一条副本」完成、凑齐全部出现日时才即时触发归档 → 母本移入归档 Tab。
      //   · 不调用 archiveMasterCopies：自动归档须可被撤销还原，故只置标志位；
      //     copyShouldRender 依据 is_archived 即可停止生成新周期副本。
      if (allOccurrencesDone(t) && !t.is_archived && !t.is_template) {
        t.is_archived = true; t.autoArchivedByCopies = true;
      }
    } else if (t.date_mode === 'range' && t.date_start) {
      // 自定义区间：按「具体日期」逐日打卡（与周期同款 cycle_history 逐日记录，今日/看板逐日隐藏）
      if (!cycleArchivedToday(t, ws)) {
        t.cycle_history.push({ execute_date: ws, is_archived: true, overdue: ws < today });
      }
      if (allOccurrencesDone(t)) { t.is_archived = true; t.autoArchivedByCopies = true; }
    } else {
      const key = copyKey(t, ws);
      const overdue = isOverdueTask(t); // 单点过期日 / 区间结束日已过 → 过期单次记录
      t.doneDates = t.doneDates || [];
      if (!t.doneDates.includes(key)) t.doneDates.push(key);
      if (overdue) {
        t.doneOverdueDates = t.doneOverdueDates || [];
        if (!t.doneOverdueDates.includes(key)) t.doneOverdueDates.push(key);
      }
      // 「所有日期副本全部完成自动归档母本」：非周期任务全部窗口副本完成后归档母本
      if (copiesAllDone(t)) { t.is_archived = true; t.autoArchivedByCopies = true; }
    }
    persist();
    // 积分联动：任务完成
    // 规则优先级（独立并行，互不互斥）：
    //   ① 周期任务/自定义区间 → cycle_task（12/4 分）
    //   ② 学习工作类标签任务 → study_work（有时长：25min=7分线性；无时长：按时+7/延期+2）
    //   ③ 项目子任务 → project_sub（25min=6分线性，由 addRecord 独立发放）
    // 收藏夹归档、习惯模块积分保持原有逻辑不变
    if (!t.is_template && !isCollectionTask(t)) {
      const today = todayStr();
      // ① 周期/区间任务积分（独立发放）
      if (t.cycle || (t.date_mode === 'range' && t.date_start)) {
        const isOverdue = ws < today;
        addPoints(isOverdue ? 4 : 12, 'cycle_task', (isOverdue ? '延期完成' : '正常完成') + ': ' + t.title, t._id);
      }
      // ② 学习工作类标签任务积分（独立发放，与①并行不互斥）
      if (isStudyWorkTask(t)) {
        const focusMin = getTaskFocusMin(t);
        if (focusMin > 0) {
          // 有专注时长：按时长线性换算，基准 25分钟 = +7积分
          const pts = Math.round(focusMin / 25 * 7 * 10) / 10; // 保留一位小数
          if (pts > 0) {
            addPoints(pts, 'study_work', '专注完成: ' + t.title + ' (' + focusMin + '分钟)', t._id, focusMin);
          }
        } else {
          // 无专注时长：按时完成 +7，延期完成 +2
          const overdue = isOverdueTask(t);
          addPoints(overdue ? 2 : 7, 'study_work', (overdue ? '延期完成' : '按时完成') + ': ' + t.title, t._id);
        }

    }
  }
  function markCopyUndone(id, ws, we) {
    const t = findTask(id);
    if (!t) return;
    // 积分联动：撤销任务完成（两类积分分别独立收回）
    if (t.cycle || (t.date_mode === 'range' && t.date_start)) {
      reversePoints(t._id, 'cycle_task');
    }
    if (isStudyWorkTask(t)) {
      reversePoints(t._id, 'study_work');
    }
    if (t.cycle) {
      let cur = parseDate(ws), end = parseDate(we);
      while (cur.getTime() <= end.getTime()) {
        const ds = fmt(cur);
        if (cycleHits(t.cycle, ds)) {
          const idx = t.cycle_history.map(h => h.execute_date).lastIndexOf(ds);
          if (idx >= 0) t.cycle_history.splice(idx, 1);
        }
        cur = parseDate(addDays(fmt(cur), 1));
      }
      if (t.autoArchivedByCopies && t.is_archived && !allOccurrencesDone(t) && !t.is_template) { t.is_archived = false; t.autoArchivedByCopies = false; }
    } else if (t.date_mode === 'range' && t.date_start) {
      // 自定义区间：撤销该具体日期打卡（逐日恢复，今日/看板逐日重现）
      const idx = t.cycle_history.map(h => h.execute_date).lastIndexOf(ws);
      if (idx >= 0) t.cycle_history.splice(idx, 1);
      if (t.autoArchivedByCopies && t.is_archived && !allOccurrencesDone(t) && !t.is_template) { t.is_archived = false; t.autoArchivedByCopies = false; }
    } else if (t.doneDates) {
      const key = copyKey(t, ws);
      t.doneDates = t.doneDates.filter(d => d !== key);
      if (t.doneOverdueDates) t.doneOverdueDates = t.doneOverdueDates.filter(d => d !== key);
    }
    // 「撤销后副本恢复、已归档母本退回待归档」：若母本因副本全完成被归档，撤销使其重现开放副本则回退归档
    if (t.autoArchivedByCopies && t.is_archived && !copiesAllDone(t) && !(t.date_mode === 'range') && !t.is_template) { t.is_archived = false; t.autoArchivedByCopies = false; }
    persist();
  }
  // —— 子任务副本逐日打卡（与父任务 markCopyDone/markCopyUndone 对齐） ——
  // 子任务副本左滑完成 → 打卡 cycle_history，不归档子任务母本
  function subCopyDone(id, subId, ws, we) {
    const t = findTask(id);
    if (!t) return;
    const s = t.sub_tasks.find(x => x._id === subId);
    if (!s || s.is_archived) return;
    const today = todayStr();
    if (s.cycle) {
      let cur = parseDate(ws), end = parseDate(we);
      while (cur.getTime() <= end.getTime()) {
        const ds = fmt(cur);
        if (cycleHits(s.cycle, ds) && !cycleArchivedToday(s, ds)) {
          s.cycle_history.push({ execute_date: ds, is_archived: true, overdue: ds < today });
        }
        cur = parseDate(addDays(fmt(cur), 1));
      }
      // 子任务母本自动归档：与顶层任务口径一致 —— 有限周期全部出现日打卡完成 → 子任务母本自动归档
      // 父任务不受影响（父子时间独立，规范⑥）；无限循环周期（无结束日）恒为 false，仅手动归档
      if (allOccurrencesDone(s) && !s.is_archived) { s.is_archived = true; s.autoArchivedByCopies = true; }
    } else if (s.date_mode === 'range' && s.date_start) {
      if (!cycleArchivedToday(s, ws)) {
        s.cycle_history.push({ execute_date: ws, is_archived: true, overdue: ws < today });
      }
      if (allOccurrencesDone(s) && !s.is_archived) { s.is_archived = true; s.autoArchivedByCopies = true; }
    } else {
      const key = copyKey(s, ws);
      s.doneDates = s.doneDates || [];
      if (!s.doneDates.includes(key)) s.doneDates.push(key);
      // 子任务全部日期副本完成 → 自动归档子任务母本（与主任务 markCopyDone 口径一致）
      if (copiesAllDone(s) && !s.is_archived) { s.is_archived = true; s.autoArchivedByCopies = true; }
    }
    persist();
    // 积分联动：子任务副本完成（学习工作类标签 → study_work 积分）
    // 子任务标签：优先使用子任务自身标签，若子任务无标签则向上追溯父任务标签
    if (isStudyWorkTask(s) || isStudyWorkTask(t)) {
      const focusMin = getTaskFocusMin(s);
      if (focusMin > 0) {
        const pts = Math.round(focusMin / 25 * 7 * 10) / 10;
        if (pts > 0) {
          addPoints(pts, 'study_work', '子任务专注完成: ' + s.title + ' (' + focusMin + '分钟)', t._id + '_' + subId, focusMin);
        }
      } else {
        // 子任务延期判定：按子任务自身截止日判定
        const subOverdue = s.sub_deadline ? (s.sub_deadline < today) : false;
        addPoints(subOverdue ? 2 : 7, 'study_work', (subOverdue ? '子任务延期完成' : '子任务按时完成') + ': ' + s.title, t._id + '_' + subId);
      }
    }
  }
  function subCopyUndone(id, subId, ws, we) {
    const t = findTask(id);
    if (!t) return;
    const s = t.sub_tasks.find(x => x._id === subId);
    if (!s) return;
    // 积分联动：撤销子任务完成
    if (isStudyWorkTask(s) || isStudyWorkTask(t)) {
      reversePoints(t._id + '_' + subId, 'study_work');
    }
    if (s.cycle) {
      let cur = parseDate(ws), end = parseDate(we);
      while (cur.getTime() <= end.getTime()) {
        const ds = fmt(cur);
        if (cycleHits(s.cycle, ds)) {
          const idx = s.cycle_history.map(h => h.execute_date).lastIndexOf(ds);
          if (idx >= 0) s.cycle_history.splice(idx, 1);
        }
        cur = parseDate(addDays(fmt(cur), 1));
      }
      if (s.autoArchivedByCopies && s.is_archived && !allOccurrencesDone(s)) { s.is_archived = false; s.autoArchivedByCopies = false; }
    } else if (s.date_mode === 'range' && s.date_start) {
      const idx = s.cycle_history.map(h => h.execute_date).lastIndexOf(ws);
      if (idx >= 0) s.cycle_history.splice(idx, 1);
      if (s.autoArchivedByCopies && s.is_archived && !allOccurrencesDone(s)) { s.is_archived = false; s.autoArchivedByCopies = false; }
    } else if (s.doneDates) {
      const key = copyKey(s, ws);
      s.doneDates = s.doneDates.filter(d => d !== key);
      // 撤销打卡后未全完成 → 子任务母本退回活跃态（仅自动归档情形）
      if (s.autoArchivedByCopies && s.is_archived && !copiesAllDone(s)) { s.is_archived = false; s.autoArchivedByCopies = false; }
    }
    persist();
  }
  // 周期任务是否存在「已过期的单次出现」尚未完成（用于今日页「延期未完成」标识；仅展示，不影响同步）
  function hasOverdueCycle(t) {
    if (!t || !t.cycle) return false;
    const today = todayStr();
    let cur = parseDate(addDays(today, -30)), end = parseDate(addDays(today, -1));
    while (cur.getTime() <= end.getTime()) {
      const ds = fmt(cur);
      if (cycleHits(t.cycle, ds) && !cycleArchivedToday(t, ds)) return true;
      cur = parseDate(addDays(fmt(cur), 1));
    }
    return false;
  }
  // 某次出现窗口是否已「本条完成」：
  //   周期：窗口内任一命中日已打卡；
  //   自定义区间：单日窗口(ws===we)看当天是否已打卡，多日窗口(周/月看板)看区间内全部命中日是否都已打卡（用于分组隐藏）；
  //   单点：窗口键是否在 doneDates。
  function copyDoneForWindow(t, ws, we) {
    if (!t) return false;
    if (t.cycle) {
      let cur = parseDate(ws), end = parseDate(we);
      while (cur.getTime() <= end.getTime()) {
        const ds = fmt(cur);
        if (cycleHits(t.cycle, ds) && cycleArchivedToday(t, ds)) return true;
        cur = parseDate(addDays(fmt(cur), 1));
      }
      return false;
    }
    if (t.date_mode === 'range' && t.date_start) {
      if (ws === we) return cycleArchivedToday(t, ws); // 单日：该日打卡即完成
      // 多日窗口（周/月看板分组）：区间内全部命中日完成才视为该分组副本消失
      const s = t.date_start, e = t.date_end || t.date_start;
      let cur = parseDate(s < ws ? ws : s), end = parseDate(e > we ? we : e);
      while (cur.getTime() <= end.getTime()) {
        if (!cycleArchivedToday(t, fmt(cur))) return false;
        cur = parseDate(addDays(fmt(cur), 1));
      }
      return true;
    }
    const key = copyKey(t, ws);
    return !!(t.doneDates && t.doneDates.includes(key));
  }
  // 任务在某窗口 [ws,we] 是否会出现副本（非周期；单点命中 / 区间相交）
  function taskActiveOnWindow(t, ws, we) {
    if (!t || t.cycle) return false;
    if (t.date_mode === 'range' || (t.date_start && !t.execute_date)) {
      if (!t.date_start) return false;
      const s = t.date_start, e = t.date_end || t.date_start;
      return !(e < ws || s > we);
    }
    if (t.execute_date) return t.execute_date >= ws && t.execute_date <= we;
    return false;
  }
  // 任务的全部副本（今日 + 周/月看板窗口）是否都已「本条完成」；周期任务返回 false（仅到期归档）
  // 用于「所有日期副本全部完成自动归档母本」判定
  function copiesAllDone(t) {
    if (!t || t.is_archived || t.cycle) return false;
    const pad = n => String(n).padStart(2, '0');
    const windows = [];
    const today = todayStr();
    windows.push([today, today]);
    const base = parseDate(today);
    for (let i = 0; i < 3; i++) {
      const d = new Date(base); d.setDate(d.getDate() + i * 7);
      const w = isoWeek(d); const r = weekRange(w.year, w.week);
      windows.push([fmt(r.start), fmt(r.end)]);
    }
    const now = new Date();
    for (let off = 0; off < 6; off++) {
      const d = new Date(now.getFullYear(), now.getMonth() + off, 1);
      const y = d.getFullYear(), m = d.getMonth() + 1;
      const ws = y + '-' + pad(m) + '-01';
      const we = y + '-' + pad(m) + '-' + pad(new Date(y, m, 0).getDate());
      windows.push([ws, we]);
    }
    for (const [ws, we] of windows) {
      if (taskActiveOnWindow(t, ws, we) && !copyDoneForWindow(t, ws, we)) return false;
    }
    return true;
  }
  function setProgress(id, info) {
    const t = findTask(id);
    if (!t) return;
    // 合并已有进度数值（done/total），避免编辑时丢失已读页数
    const cur = t.progress_info || {};
    t.progress_info = Object.assign({ enable: false, media_type: 'book', progress_value: '', done: 0, total: 0 }, cur, info);
    persist();
  }
  function appendMaterial(id, text) {
    const t = findTask(id);
    if (!t) return;
    t.material_notes = (t.material_notes ? t.material_notes + '\n' : '') + text;
    persist();
  }

  // —— 阅读习惯 → 书籍进度同步 ——
  // 是否为「阅读」习惯（名称包含 阅读 / 读书）
  function isReadingHabit(id) {
    const h = findHabit(id);
    if (!h) return false;
    return /阅读|读书/.test(h.name || '');
  }

  // 拉取全部「书籍任务」：仅展示分类标签等于「书籍」的任务（不含项目子任务）
  function getBookTasks() {
    // 书籍分类 id 集合（分类 name === '书籍'）
    const bookCatIds = state.categories.filter(c => c.name === '书籍').map(c => c._id);
    const isBookCategory = id => bookCatIds.indexOf(id) >= 0;
    const list = [];
    state.tasks.forEach(t => {
      const p = t.progress_info || {};
      // 仅保留：未归档 + 进度开启 + 媒体类型为书籍 + 分类标签等于「书籍」
      if (p.enable && p.media_type === 'book' && !t.is_archived && isBookCategory(t.category_id)) {
        const done = Number(p.done) || 0;
        const total = Number(p.total) || 0;
        list.push({
          kind: 'task', id: t._id, title: t.title, done, total,
          reached: total > 0 && done >= total,
          label: (total > 0 ? done + '/' + total : done) + ' 页',
        });
      }
    });
    // 注：项目子任务（project_subs）不纳入阅读同步下拉，仅展示「书籍」分类的待办任务
    return list;
  }

  // 阅读习惯打卡时，若命中书籍任务则请求弹出同步弹窗（返回 true 表示需弹窗，调用方暂停标记习惯）
  function requestReadingSync(habitId, date) {
    if (!isReadingHabit(habitId)) return false;     // 仅阅读习惯生效
    // 阅读习惯一律尝试弹出同步弹窗（有书籍任务则选择同步，无书籍任务则展示占位提示）
    return true;
  }

  // 累加阅读进度到选中书籍任务（task 或 sub）
  function syncBookProgress(book, pages, date) {
    const n = Number(pages) || 0;
    if (!book || !(n > 0)) return;
    if (book.kind === 'task') {
      const t = findTask(book.id);
      if (!t) return;
      const info = t.progress_info || {};
      const total = Number(info.total) || 0;
      if (total > 0 && (Number(info.done) || 0) >= total) return; // 已达 100%，不再累加
      let done = (Number(info.done) || 0) + n;
      if (total > 0 && done > total) done = total; // 封顶
      info.done = done;
      info.progress_value = total > 0 ? ('已读至 ' + done + '/' + total + ' 页') : ('已读 ' + done + ' 页');
      t.progress_info = info;
    } else {
      const s = state.project_subs.find(x => x.sid === book.id);
      if (!s) return;
      if (s.enableTotal && Number(s.total) > 0 && (Number(s.finished) || 0) >= Number(s.total)) return; // 已达 100%
      // 等价于执行一次填报操作（生成填报历史记录），并自动累加至项目整体进度
      addRecord(s.sid, date, n);
    }
    persist();
  }

  // 确认同步：先累加进度（如有），再标记习惯完成
  function applyReadingSync(pr, selectedId, pages) {
    const book = (pr.books || []).find(b => b.id === selectedId);
    if (book) syncBookProgress(book, Number(pages) || 0, pr.date);
    markHabitRecord(pr.habitId, pr.date, 'success');
  }

  // 跳过同步：直接标记习惯完成，不改动任何任务数据
  function skipReadingSync(pr) {
    markHabitRecord(pr.habitId, pr.date, 'success');
  }

  // 任务在指定日期是否「应出现在今日页」：单点执行日期命中 / 时间区间[start,end]包含该日
  // 第 1 层改造：执行日期（含区间）控制今日页出现；提醒仅负责消息推送，二者解耦
  function taskActiveOnDate(t, date) {
    if (!t || t.is_archived || t.cycle) return false;
    if (t.date_mode === 'range') {
      const s = t.date_start || '', e = t.date_end || '';
      if (!s && !e) return false;
      if (s && date < s) return false;
      if (e && date > e) return false;
      return !cycleArchivedToday(t, date); // 已打卡的当日不出现在今日（逐日隐藏）
    }
    // 单点（含历史 execute_date）：精确命中当天
    return t.execute_date === date;
  }

  // 统一「副本是否应在日期 d 显示」判定：主任务与子任务共用同一套规则（消除两套代码分支）
  //   t          : 待判定实体（主任务 or 子任务）
  //   d          : 目标日期
  //   master     : 母本（子任务传父任务；主任务传 null → 自身即母本）
  //   allowOverdue: 是否允许「逾期滞留」（仅主任务待办页；且仅当 viewDate === 系统真实今日 才滞留，浏览其它日期不滞留；今日页子任务副本严格要求日期命中，传 false）
  // 统一约束：① 副本未归档 ② 副本 date 严格等于 d（单点精确 / 区间含该日 / 周期命中当日）③ 母本未归档且副本未失效
  function taskCopyVisibleOnDate(t, d, master, allowOverdue) {
    if (!t || t.is_archived) return false;                                    // ① 副本未归档
    if (!copyShouldRender(master || t, d)) return false;                      // ③ 母本未归档 + 母本副本未失效
    // 子任务自身 cycle_end_date 独立约束：即使父任务未设结束日，子任务结束日后也不应生成副本
    if (master && t.cycle_end_date && d > t.cycle_end_date) return false;
    if (taskActiveOnDate(t, d)) return true;                                  // ② 单点精确命中 / 区间含该日
    if (t.cycle && cycleHits(t.cycle, d) && !cycleArchivedToday(t, d)) return true; // ② 周期命中当日
    // 主任务专用：逾期停留——仅允许在真实当日视图展示（viewDate === 系统真实今日），浏览其它日期（含未来）不滞留
    if (allowOverdue && isOverdueTask(t, d) && d === todayStr()) return true;
    return false;
  }

  // 今日待办（视图投射：单点执行日期命中 / 时间区间包含今日 / 周期命中且今日未归档 / 逾期滞留）
  // 今日待办（视图投射：单点执行日期命中 / 时间区间包含该日 / 周期命中且当日未归档 / 逾期滞留）
  // date 为空时等同今日；传入具体日期即「按日查看」该日任务（用于今日页合并区块的昨日/次日切换）
  // 副本所带「具体日期」排序键：周期取当日、单点取执行日、区间取起始日；用于今日待办 / 周看板由早到晚排序
  function copyDateKey(t, d) {
    if (t.cycle) return d;
    if (t.execute_date) return t.execute_date;
    if (t.date_start) return t.date_start;
    return d;
  }
  // 提醒时间排序键：开启提醒且设置了时刻 → 当日分钟数（用于升序）；否则 Infinity（无提醒时间后置）
  function remindMinutes(t) {
    const on = !!(t.enable_remind || t.sub_remind);
    const rt = t.remind_time || t.sub_remind_time || '';
    if (!on || !rt) return Infinity;
    const m = /^(\d{1,2}):(\d{2})$/.exec(rt);
    if (!m) return Infinity;
    return Number(m[1]) * 60 + Number(m[2]);
  }
  // 周看板分组内「任务日期」排序键：取出该周窗口内的首个有效日期（周期取首命中日；区间取相交起始；单点取执行日；无则取周起点）
  function weekDateKey(t, ws, we) {
    if (t.cycle) {
      const start = parseDate(ws), end = parseDate(we);
      for (let cur = start; cur.getTime() <= end.getTime(); cur = parseDate(addDays(fmt(cur), 1))) {
        const ds = fmt(cur);
        if (cycleHits(t.cycle, ds)) return ds;
      }
      return ws;
    }
    if (t.date_mode === 'range' && t.date_start) return t.date_start < ws ? ws : t.date_start;
    return t.execute_date || t.date_start || ws;
  }
  // —— 紧急任务判定（任务 / 子任务通用）——
  function isEmergency(t) { return !!(t && t.isEmergency); }
  function isSubEmergency(s) { return !!(s && s.isEmergency); }
  // 紧急任务排序键：用于紧急组内「截止时间从近到远」依次排列；无日期/无周期置最大（排末尾）
  function emergencyKey(t, d) {
    const key = (t && copyDateKey(t, d)) || '';
    return key || '9999-12-31';
  }

  function getTodayTasks(date) {
    const d = date || todayStr();
    const list = state.tasks.filter(t => {
      if (isCollectionTask(t)) return false; // 收藏夹任务不参与今日副本同步
      if (copyDoneForWindow(t, d, d)) return false; // 副本「本条完成」后当前副本消失，母本与其它副本不受影响
      // 复用统一可见性规则（主任务允许逾期停留）
      return taskCopyVisibleOnDate(t, d, null, true);
    });
    // 今日待办排序：紧急任务最高优先级强制置顶（无视日期/周期）；其余维持原提醒时间+日期排序
    // 排序权重：紧急 > 过期 > 今日到期 > 周期常规 > 未来（原逻辑日期升序天然满足）；紧急组内按截止时间从近到远
    return list.slice().sort((a, b) => {
      const ea = isEmergency(a), eb = isEmergency(b);
      if (ea !== eb) return ea ? -1 : 1;            // 紧急一律置顶
      if (ea && eb) {                                // 多条紧急：按日期/周期截止由近到远
        const ka = emergencyKey(a, d), kb = emergencyKey(b, d);
        if (ka !== kb) return ka < kb ? -1 : ka > kb ? 1 : 0;
      }
      const ra = remindMinutes(a), rb = remindMinutes(b);
      if (ra !== rb) return ra - rb;
      const ka = copyDateKey(a, d), kb = copyDateKey(b, d);
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
  }

  // 子任务「副本」：带时间的子任务按父任务日期体系，同步投射到今日 / 看板（与父任务共用同一母本数据）
  function subHasDate(s) {
    if (!s) return false;
    if (s.cycle) return true;
    if (s.date_mode === 'month' && s.plan_year && s.plan_month) return true;
    if (s.date_mode === 'range' && s.date_start) return true;
    if (s.date_mode === 'single' && s.execute_date) return true;
    if (s.date_mode === 'week' && s.time_mode === 'week' && s.week_offset != null) return true;
    return false;
  }
  // 将子任务扁平化为带父任务引用的副本代理（沿用父任务分类参与筛选；其余字段原样携带供看板分组/卡片渲染）
  function mkSubProxy(s, t) {
    return Object.assign({}, s, { _parentId: t._id, _isSub: true, parentTitle: t.title || '' });
  }
  // 今日待办中的子任务副本：与 getTodayTasks 同口径（单点命中 / 区间含该日 / 周期命中且当日未归档 / 逾期滞留）
  // date 为空时等同今日；传入具体日期即「按日查看」该日子任务副本
  function getTodaySubTasks(date) {
    const d = date || todayStr();
    const out = [];
    state.tasks.forEach(t => {
      if (t.is_archived) return;
      if (isCollectionTask(t)) return; // 收藏夹任务（含子任务）不参与今日副本同步
      (t.sub_tasks || []).forEach(s => {
        if (copyDoneForWindow(s, d, d)) return;            // 子任务副本「本条完成」也消失（与主任务一致）
        // 复用统一可见性规则：严格日期命中，不含逾期（allowOverdue=false）
        if (taskCopyVisibleOnDate(s, d, t, false)) out.push(mkSubProxy(s, t));
      });
    });
    // 子任务副本：紧急同样强制置顶，其余维持原优先级（提醒时间升序 → 任务日期由早到晚）
    return out.sort((a, b) => {
      const ea = isSubEmergency(a), eb = isSubEmergency(b);
      if (ea !== eb) return ea ? -1 : 1;
      if (ea && eb) {
        const ea2 = emergencyKey(a, d), eb2 = emergencyKey(b, d);
        if (ea2 !== eb2) return ea2 < eb2 ? -1 : 1;
      }
      const ra = remindMinutes(a), rb = remindMinutes(b);
      if (ra !== rb) return ra - rb;
      const ka = copyDateKey(a, d), kb = copyDateKey(b, d);
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
  }
  // 看板（周/月计划）中的子任务副本：仅含带时间且归类为 month/week 的子任务
  function getBoardSubTasks() {
    const out = [];
    state.tasks.forEach(t => {
      if (t.is_archived) return;
      if (isCollectionTask(t)) return; // 收藏夹任务（含子任务）不参与看板副本同步
      // 周期任务母本：其【自身】副本由 boardWeekGroups/boardMonthGroups 直接生成（仅今日Tab/看板专属副本）；
      // 但母本下的「周/月循环子任务」仍纳入对应看板（按子任务自身周期归类，与母本周期相互独立）
      (t.sub_tasks || []).forEach(s => {
        if (s.is_archived) return;
        // 普通（非周/月循环）子任务：仅跟随非周期母本进入看板；周期母本下的普通子任务仍只走今日Tab
        if (t.cycle && !(s.cycle && (s.cycle.type === 'week' || s.cycle.type === 'month'))) return;
        // 周期子任务：周/月循环纳入对应看板（与母本一致，classifyMode 按 cycle.type 归类为 week/month）；
        // 每天/间隔循环仍仅【今日Tab】/【习惯】展示（沿用原设计，不进看板）
        if (s.cycle && s.cycle.type !== 'week' && s.cycle.type !== 'month') return;
        if (s.date_mode === 'range' && s.date_start) return; // 区间子任务副本禁止进入周/月看板（仅【今日Tab】展示）
        if (!subHasDate(s)) return;
        const m = classifyMode(s);
        if (m === 'month' || m === 'week') out.push(mkSubProxy(s, t));
      });
    });
    // 紧急子任务副本强制置顶（与今日Tab / 父任务详情口径一致），其余维持原有顺序
    return out.slice().sort((a, b) => (b.isEmergency ? 1 : 0) - (a.isEmergency ? 1 : 0));
  }

  // 任务是否逾期（非周期、未归档、区间结束日或单点执行日期早于 ref；周期任务每日循环不视为逾期）
  // ref 为空时取今天；传入具体日期即「相对该日」判定逾期（用于按日查看）
  function isOverdueTask(t, date) {
    if (!t || t.is_archived || t.cycle) return false;
    const ref = date || todayStr();
    if (t.date_mode === 'range') {
      const e = t.date_end || '';
      // 区间模式：有结束日且早于 ref → 逾期；无结束日（无限期）不视为逾期
      return !!e && e < ref;
    }
    if (!t.execute_date) return false;
    return t.execute_date < ref;
  }

  // 过期任务自动延期：开关开启时，将逾期且未被手动改过截止日期的任务推延到今天
  function autoExtendOverdue() {
    if (!state.settings.autoExtend) return;
    const today = todayStr();
    let changed = false;
    state.tasks.forEach(t => {
      if (isOverdueTask(t) && !t.deadline_manual) {
        if (t.date_mode === 'range' && t.date_start && t.date_end) {
          const span = dateDiffDays(t.date_start, t.date_end);
          t.date_start = today; t.date_end = addDays(today, span); t.execute_date = today;
        } else {
          t.execute_date = today; t.date_start = today; t.date_end = today;
        }
        changed = true;
      }
    });
    if (changed) persist();
  }

  // 手动延期：修改截止日期为指定日期，并标记已手动修改（此后不再自动推延该任务）
  function extendDeadline(id, date) {
    const t = findTask(id);
    if (!t || !date) return;
    if (t.date_mode === 'range' && t.date_start && t.date_end) {
      const span = dateDiffDays(t.date_start, t.date_end);
      t.date_start = date; t.date_end = addDays(date, span);
    }
    t.execute_date = date; t.date_start = date; t.date_end = date;
    t.deadline_manual = true; // 用户手动修改后，停止对该任务自动推延
    persist();
  }

  // 设置「过期任务自动延期」开关
  function setAutoExtend(v) { state.settings.autoExtend = !!v; persist(); }

  // 周期任务到期自动归档：cycle_end_date 非空且早于今天 → 母本归档，停止生成所有副本（永久终止同步）
  function autoArchiveExpiredCycles() {
    const today = todayStr();
    let changed = false;
    state.tasks.forEach(t => {
      if (t.is_archived || !t.cycle || t.is_template) return;
      if (t.cycle_end_date && t.cycle_end_date < today) { archiveMasterCopies(t); t.is_archived = true; changed = true; }
    });
    if (changed) persist();
  }

  // 周期母本「副本全完成」批量校验（打开页面时兜底扫描一次）
  // 与 markCopyDone / toggleOccurrence 的即时触发互补：
  //   即时触发覆盖「最后一条副本刚完成」的当下；本函数覆盖跨天后才达成条件的场景
  //   （如结束日当天之前已打满全部副本，次日打开应用时结束日已到期 → 此刻才满足归档条件）。
  // 判定完全复用 allOccurrencesDone（要求全部出现日均完成、无任一跳过），
  // 模板任务与已归档母本跳过；同样只置标志位，保证撤销可还原。
  function autoArchiveCompletedCycles() {
    let changed = false;
    state.tasks.forEach(t => {
      if (!t || t.is_archived || t.is_template || !t.cycle) return;
      if (allOccurrencesDone(t)) { t.is_archived = true; t.autoArchivedByCopies = true; changed = true; }
    });
    if (changed) persist();
  }

  // 待归档池（inbox）：按分类筛选，含已归档折叠分组逻辑由组件处理
  function getInboxTasks(categoryId) {
    let list = state.tasks.slice();
    if (categoryId && categoryId !== '__all__') {
      list = list.filter(t => matchCategory(t, categoryId));
    }
    // 未归档在前，已归档在后
    return list.sort((a, b) => (a.is_archived === b.is_archived) ? 0 : a.is_archived ? 1 : -1);
  }

  // 归档仓库关键词检索：标题/描述/素材 + 一级/二级分类（标签）；二级支持「父>子」格式
  // 关键：真实任务仅存 category_id / parent_category（均为分类 _id），category 名称字符串常为空；
  //       故标签匹配需由 _id 反查分类名称，兼容 category 直接存名称的旧数据。
  function taskMatchesKeyword(t, keyword) {
    const k = (keyword || '').trim().toLowerCase();
    if (!k) return true;
    const base = (t.title + ' ' + (t.desc || '') + ' ' + (t.material_notes || '') + ' ' + (t.material_link || '')).toLowerCase();
    if (base.includes(k)) return true;
    // 自由标签匹配（兼容两种数据形态：任务 t.tags 为字符串「#一级##二级」，子任务 s.tags 为字符串数组）
    // 既要支持整串包含（如「#学习##阅读」），也要支持单标签包含（如「阅读」命中数组中的「#阅读」）
    const rawTags = t.tags;
    let tagsHay = '';
    if (Array.isArray(rawTags)) tagsHay = rawTags.join(' ').toLowerCase();
    else if (typeof rawTags === 'string') tagsHay = rawTags.toLowerCase();
    if (tagsHay && tagsHay.includes(k)) return true;
    if (Array.isArray(rawTags)) {
      for (const tg of rawTags) {
        if (!tg) continue;
        // 去前缀 # / ## / ### 后再做包含匹配，覆盖「输入"阅读"命中"#阅读"」
        const tn = String(tg).replace(/^#+/, '').toLowerCase();
        if (tn && tn.includes(k)) return true;
      }
    }
    // 反查分类名称：优先用已存名称，缺失时由 _id 解析（parent_category 存的是 L1 _id）
    const resolveName = (idOrName) => {
      if (!idOrName) return '';
      const c = findCategory(idOrName);
      return c ? c.name : idOrName;
    };
    const catName = (t.category || resolveName(t.category_id) || '').toLowerCase();
    const parentName = resolveName(t.parent_category).toLowerCase();
    if (k.indexOf('>') >= 0) {
      // 二级标签「父>子」：父分类名 + 子分类名同时命中
      const parts = k.split('>').map(s => s.trim()).filter(Boolean);
      if (parts.length === 2) {
        if (parentName.includes(parts[0]) && catName.includes(parts[1])) return true;
      } else {
        const all = parentName + ' ' + catName;
        if (parts.every(p => all.includes(p))) return true;
      }
      return false;
    }
    // 单级标签：一级或二级分类名命中即匹配该分类下全部已归档条目
    if (parentName.includes(k) || catName.includes(k)) return true;
    return false;
  }
  function getArchivedTasks(categoryId, keyword) {
    let list = state.tasks.filter(t => t.is_archived);
    if (categoryId && categoryId !== '__all__') list = list.filter(t => matchCategory(t, categoryId));
    if (keyword) list = list.filter(t => taskMatchesKeyword(t, keyword));
    return list;
  }

  // 全局已归档仓库：扁平化所有「已归档子任务」（嵌套在 task.sub_tasks 内），统一聚合展示
  function getArchivedSubTasks(categoryId, keyword) {
    const out = [];
    const k = (keyword || '').trim().toLowerCase();
    state.tasks.forEach(t => {
      (t.sub_tasks || []).forEach(s => {
        if (!s.is_archived) return;
        // 子任务沿用父任务分类参与筛选
        if (categoryId && categoryId !== '__all__' && !matchCategory(t, categoryId)) return;
        // 关键词筛选：子任务自身字段（标题/描述/素材/一级·二级标签）命中即保留；否则沿用父任务标题参与筛选
        if (k) {
          const hit = taskMatchesKeyword(s, keyword) || (t.title || '').toLowerCase().includes(k);
          if (!hit) return;
        }
        out.push(Object.assign({}, s, {
          _parentId: t._id,
          parentTitle: t.title || '',
          category_id: t.category_id || null,
          parent_category: t.parent_category || '',
          category: t.category || '',
        }));
      });
    });
    return out;
  }

  // 归档条目的「归属日期」：归档时间 > 任务完成时间 > 创建时间
  // 说明：当前数据模型未单独存 archived_at；其余字段按此优先级映射
  function archiveDateOf(t) {
    if (t.cycle && t.cycle_history && t.cycle_history.length) {
      const arch = t.cycle_history.filter(h => h.is_archived).map(h => h.execute_date).sort();
      if (arch.length) return arch[arch.length - 1];
    }
    if (t.execute_date) return t.execute_date;
    if (t.archived_at) return t.archived_at; // 习惯归档：以归档日作为归属日期
    if (t.create_at) return fmt(new Date(t.create_at));
    return null;
  }

  // 归档仓库日历点阵：某日归档条目总数（任务 + 习惯 + 项目），统一展示所有类型
  function archivedCountOnDate(date) {
    let n = 0;
    state.tasks.forEach(t => {
      if (t.is_archived && archiveDateOf(t) === date) n++;
      // 已归档子任务（沿用父任务归档日）一并计入日历点阵
      (t.sub_tasks || []).forEach(s => { if (s.is_archived && archiveDateOf(s) === date) n++; });
    });
    state.habits.forEach(h => { if (h.is_archived && archiveDateOf(h) === date) n++; });
    state.projects.forEach(p => { if (p.status === 'archive' && !p.deleted_at && (p.archived_at || '') === date) n++; });
    return n;
  }

  /* ============================ 分类相关方法（第 3 层模块 2：支持一级+二级层级） ============================ */
  function findCategory(id) { return state.categories.find(c => c._id === id); }
  // 第 3 层模块 2：新增分类，parent 为一级分类 _id（为空=一级分类）；仅允许两级嵌套
  function addCategory(name, parent) {
    const c = { _id: uid('cat'), name: (name || '').trim() || '未命名', is_system: false, parent: parent || null };
    state.categories.push(c);
    persist();
    return c;
  }
  // 收藏判定（含祖先继承）：自身或任一祖先 is_collection，或 name 在收藏四类 → true
  function isCollCat(catId) {
    let c = findCategory(catId);
    while (c) {
      if (c.is_collection || COLLECTION_CATS.indexOf(c.name) >= 0) return true;
      c = c.parent ? findCategory(c.parent) : null;
    }
    return false;
  }
  // 查重复用 / 新建分类：同名同父级即视为同一标签（跨「任务夹/收藏夹」自动合并，避免同名标签割裂）；
  // 任一入口要求收藏（isColl）则把已存在的分类升级为收藏（不降级）。
  function ensureCategory(name, parent, isColl) {
    const nm = (name || '').trim();
    if (!nm) return null;

  // 标签串统一解析（#一级 ##二级 ###三级）：返回解析结果 + 绑定字段 + 三级链；手动输入与 AI 自然语言共用
  // 标签串统一解析（#一级 ##二级 ###三级）：解析模块独立封装，所有新建入口（手动 / AI / 批量）共用，行为一致
  // 语义规则（长期规范）：# / ## = 分类标签系统；### = 快捷创建父任务语法糖（不纳入标签体系，仅作为创建指令）

  function parseTagString(text, isColl) {
    const out = { parsed: [], category_id: null, parent_category: '', hasLevel3: false, level3Chain: null };
    const s = (text || '').trim();

    const tokens = s.split(/\s+/).filter(Boolean);

    let curL1 = '', curL2 = '';
    let level3Used = false;   // 多条 ### 时仅首条生效
    let level3Name = '';      // 父任务名（来自首条有效 ###）
    for (const tok of tokens) {
      if (tok.indexOf('#') === -1) continue; // 纯文本跳过
      if (tok.startsWith('###')) { // 三级标签：快捷创建父任务语法糖（不建三级分类）
        const name = extractLevel3Name(tok);
        if (level3Used) continue;            // 后续 ### 仅当普通文本
        level3Used = true;
        if (curL1 && curL2 && name) { level3Name = name; }                 // 已有 #一级##二级 → 记录父任务名
        else if (curL1 && !curL2 && name) { level3Name = name; }           // 已有 #一级（无二级）→ 记录父任务名（一级下建父任务）
        else if (name) { curL1 = name; pairs.push({ l1: name, l2: '', l3: '' }); } // 无层级上下文 → 当作普通一级标签
        continue;
      }
      if (tok.startsWith('##')) { // 二级标签
        const name = tok.slice(2).replace(/^#+/, '').replace(/#+$/, '').trim();
        if (curL1 && name) { pairs.push({ l1: curL1, l2: name, l3: '' }); curL2 = name; }

      const tIdx = rest.indexOf('###');
      if (tIdx >= 0) {
        inlineL3 = extractLevel3Name(rest.slice(tIdx));
        rest = rest.slice(0, tIdx);
      }
      const parts = rest.split('##').map(x => x.replace(/^#+/, '').replace(/#+$/, '').trim()).filter(Boolean);
      if (!parts.length) {
        if (inlineL3 && !level3Used) { level3Used = true; level3Name = inlineL3; }

      const l1 = parts[0], l2 = parts.length > 1 ? parts[1] : '';
      curL1 = l1; curL2 = l2;
      pairs.push({ l1, l2, l3: '' });
      if (inlineL3 && l1 && !level3Used) { level3Used = true; level3Name = inlineL3; }

      let l2 = null; if (p.l2) l2 = ensureCategory(p.l2, l1._id, isColl);
      // 注意：### 不再创建三级分类，l3 统一为 null（仅为创建指令，非标签体系）
      parsed.push({ l1: { _id: l1._id, name: l1.name }, l2: l2 ? { _id: l2._id, name: l2.name } : null, l3: null });

    out.parent_category = last.l2 ? last.l1._id : '';

  function folderOfCat(catId) {

  // 某分类归属于哪个文件夹（与待归档文件夹视图 folderTopCats / inScope 同一套判定）：
  //   collection：isCollCat 或被任一「收藏夹任务」引用（按顶层 parent 归属，子标签归入其父一级）
  //   template：被任一「模版任务」引用

  // 用于「删除标签 → 迁移至其他文件夹 / 成为二级标签」的候选目标列表，
  // 必须与看板实际展示的文件夹标签一致，否则选中的目标漏掉看板上真实存在的标签。
  function catInFolder(catId, folder) {

        const c = findCategory(t.category_id);

    if (folder === 'template') {

  function dupeNameInFolder(name, parent, folder, exceptId) {

  function descendantCategoryIds(pid) {

    direct.forEach(d => { all = all.concat(descendantCategoryIds(d)); });
    return all;

  function matchCategory(t, catId) {

      return t.category_id === catId || t.parent_category === catId || t.category === cat.name;

  // 单个分类字段值是否引用了待删除 / 迁移集合：

  function fieldHitsDeleted(val, idset, nameset) {

    const segs = String(val).split(/\s+/).filter(Boolean); // ③ 编码串逐段解析
    for (const seg of segs) {

  function deleteCategory(id) {

    // 递归收集该分类及其全部后代（任意层级）的 id（不含自身）
    const collectDescendants = (pid) => {

      return all;

    allIds.forEach(i => { idset[i] = true; const cc = findCategory(i); if (cc && cc.name) nameset[cc.name] = true; });
    // 任务退回到被删对象的直属父级（一级删除则清空为 null / ''）
    const fallbackPid = c.parent || null;
    const fallbackCat = fallbackPid ? findCategory(fallbackPid) : null;
    state.categories = state.categories.filter(c => allIds.indexOf(c._id) < 0);
    state.tasks.forEach(t => {
      const hit = fieldHitsDeleted(t.category_id, idset, nameset)
        || fieldHitsDeleted(t.category, idset, nameset)
        || fieldHitsDeleted(t.parent_category, idset, nameset);

        t.category_id = fallbackPid;
        t.category = fallbackCat ? fallbackCat.name : '';

  }
  // 迁移某分类子树下的全部任务到目标分类（dstId 为 null 表示未分类），随后删除该分类及其后代分类。
  // 用于「删除一级/二级标签 → 迁移任务」分支：迁移直接执行，无需二次确认。
  // 兼容两种任务归属写法：① 按 id（category_id / parent_category 存分类 _id）；
  // ② 按名称（category / parent_category 存分类名，老数据 / 导入数据常见）。
  // 修复：旧实现只匹配 id，导致「按名称存储」的任务迁移后未更新（bug：迁移至其他文件夹的条目没有实施更新）。
  function migrateCategoryTasks(srcId, dstId) {

      fieldHitsDeleted(catName, idset, nameset) ||

        t.category = dst ? dst.name : '';
        if (t.parent_category != null && (idset[t.parent_category] || nameset[t.parent_category])) t.parent_category = dstId || '';

  /* ============================ 项目模块（完全独立，不与普通 task 联动） ============================
