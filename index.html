    </div>`,
  };

  /* -------- ProjectTagPie —— 子任务标签耗时分布（甘特图视图下的完成情况可视化） --------
   * 两级下钻：
   *   一级 = 按子任务「首个标签」归类（如 考研 → 英语 / 数学），未打标签归入「未分类」
   *   二级 = 点击某标签后，展示该标签下各子任务的耗时占比（如 英语 → 听力 / 阅读）
   * 仅做只读可视化，不修改任何数据；环形图用 stroke-dasharray 绘制，单扇区 100% 也能正确渲染 */
  C.ProjectTagPie = {
    name: 'ProjectTagPie',
    props: { pid: { type: String, required: true } },
    data() { return { drillTag: null, palette: ['#6a7bff', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#06b6d4', '#ef4444', '#84cc16', '#f97316', '#14b8a6'] }; },
    computed: {
      subs() { return this.$store.getSubsOrdered(this.pid); },
      // 一级：按首个标签归类，聚合耗时与完成情况
      tagGroups() {
        const map = {}, order = [];
        this.subs.forEach(s => {
          const key = (s.tags && s.tags.length) ? s.tags[0] : '未分类';
          if (!map[key]) { map[key] = { name: key, spent: 0, total: 0, done: 0, subs: [] }; order.push(key); }
          const g = map[key];
          g.spent += this.$store.subSpentMin(s);
          g.total += 1;
          if (this.$store.isSubComplete(s)) g.done += 1;
          g.subs.push(s);
        });
        return order.map(k => map[k]);
      },
      // 二级：下钻标签内的各子任务
      drillGroups() {
        const g = this.tagGroups.find(x => x.name === this.drillTag);
        if (!g) return [];
        return g.subs.map(s => ({
          name: s.title,
          spent: this.$store.subSpentMin(s),
          total: 1,
          done: this.$store.isSubComplete(s) ? 1 : 0,
          sid: s.sid,
        }));
      },
      groups() { return this.drillTag ? this.drillGroups : this.tagGroups; },
      totalSpent() { return this.groups.reduce((a, g) => a + g.spent, 0); },
      // 环形图扇区：用 stroke-dasharray 沿周长分配，避免单扇区 100% 时路径退化
      slices() {
        const C = 2 * Math.PI * 42; // 半径 42 的周长
        const tot = this.totalSpent;
        let acc = 0;
        return this.groups.map((g, i) => {
          const ratio = tot > 0 ? g.spent / tot : 0;
          const len = ratio * C;
          const s = {
            name: g.name, spent: g.spent, done: g.done, total: g.total, sid: g.sid,
            color: this.palette[i % this.palette.length],
            pct: tot > 0 ? Math.round(ratio * 100) : 0,
            dash: len + ' ' + (C - len),
            offset: -acc,
          };
          acc += len;
          return s;
        });
      },
      // 有耗时数据的扇区（0 耗时不画，但仍在图例中列出，便于看到「还没投入时间」的任务）
      drawSlices() { return this.slices.filter(s => s.spent > 0); },
      hasData() { return this.totalSpent > 0; },
      centerMain() { return this.$store.fmtSpent(this.totalSpent); },
      centerSub() { return this.drillTag ? this.drillTag : '总耗时'; }, // 标签名直出，全站统一无 # 前缀
      doneAll() { return this.groups.reduce((a, g) => a + g.done, 0); },
      totalAll() { return this.groups.reduce((a, g) => a + g.total, 0); },
    },
    methods: {
      fmt(m) { return this.$store.fmtSpent(m); },
      // 一级图例可下钻（未分类除外，无二级意义时也允许查看内部构成）
      canDrill(s) { return !this.drillTag && this.tagGroups.some(g => g.name === s.name && g.subs.length > 0); },
      onSliceClick(s) {
        if (this.drillTag) { if (s.sid) this.$emit('open-sub', s.sid); return; }
        this.drillTag = s.name;
      },
      backToTop() { this.drillTag = null; },
    },
    template: `
    <div class="tagpie">
      <div class="tagpie-head">
        <span class="tagpie-title">🥧 标签耗时分布</span>
        <span class="tagpie-pct" v-if="totalAll">完成 {{ doneAll }}/{{ totalAll }}</span>
      </div>
      <div class="tagpie-crumb">
        <button class="crumb-link" v-if="drillTag" @click="backToTop">全部标签</button>
        <span v-if="drillTag">›</span>
        <span class="crumb-cur">{{ drillTag ? drillTag + ' 内部构成' : '按子任务标签归类' }}</span>
      </div>

      <div v-if="!subs.length" class="tagpie-empty">还没有子任务，先添加子任务并打上标签吧</div>
      <div v-else-if="!hasData" class="tagpie-empty">
        暂无耗时数据<br />
        在子任务卡片点「填报」记录每次花费的时间，这里就会生成分布图
      </div>
      <template v-else>
        <div class="tagpie-body">
          <svg class="tagpie-svg" width="130" height="130" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="none" stroke="#eef0f5" stroke-width="15" />
            <circle v-for="s in drawSlices" :key="'sl'+s.name" class="tagpie-slice"
                    cx="50" cy="50" r="42" fill="none"
                    :stroke="s.color" stroke-width="15"
                    :stroke-dasharray="s.dash" :stroke-dashoffset="s.offset"
                    transform="rotate(-90 50 50)"
                    @click="onSliceClick(s)">
              <title>{{ s.name }} · {{ fmt(s.spent) }}（{{ s.pct }}%）</title>
            </circle>
            <text x="50" y="48" text-anchor="middle" class="tagpie-center-main">{{ centerMain }}</text>
            <text x="50" y="60" text-anchor="middle" class="tagpie-center-sub">{{ centerSub }}</text>
          </svg>
          <div class="tagpie-legend">
            <button class="tagpie-item" v-for="s in slices" :key="'lg'+s.name"
                    :class="canDrill(s) ? 'drillable' : 'flat'" @click="onSliceClick(s)">
              <span class="tagpie-dot" :style="{background: s.color}"></span>
              <span class="tagpie-info">
                <span class="tagpie-name">{{ s.name }}</span>
                <span class="tagpie-meta">
                  <b>{{ fmt(s.spent) }}</b> · 完成 {{ s.done }}/{{ s.total }}
                  <span class="tagpie-done" v-if="s.total && s.done === s.total">已全部完成</span>
                </span>
              </span>
              <span class="tagpie-pct">{{ s.pct }}%</span>
              <span class="tagpie-arrow" v-if="canDrill(s)">›</span>
            </button>
          </div>
        </div>
        <p class="tip tagpie-tip">
          按子任务的<b>首个标签</b>归类统计耗时；点击标签可下钻查看该标签下各子任务的时间分布，二级列表点击可直接编辑子任务。
        </p>
      </template>
    </div>`,
  };

  /* -------- ProjectGantt —— 项目子任务甘特图（只读可视化，不修改任何数据） -------- */
  C.ProjectGantt = {
    name: 'ProjectGantt',
    props: { pid: { type: String, required: true }, filterTag: { type: String, default: '' } },
    computed: {
      project() { return this.$store.state.projects.find(x => x.pid === this.pid) || null; },
      // 已完成自动置后 + 跟随标签筛选（与列表视图口径完全一致）
      rawSubs() {
        const list = this.$store.getSubsOrdered(this.pid);
        if (!this.filterTag) return list;
        return list.filter(s => (s.tags || []).indexOf(this.filterTag) >= 0);
      },
      // 每个子任务的甘特数据：优先子任务自身时间跨度（开始/结束）；仅结束无开始时退化为单日
      rows() {
        const projArchived = this.project && this.project.status !== 'running';
        return this.rawSubs.map(s => {
          const start = s.sub_start || s.sub_end || null;
          const end = s.sub_end || null;
          const archived = !!projArchived || this.$store.isSubComplete(s);
          return { sid: s.sid, title: s.title, start, end, hasBar: !!(start && end), archived, emg: !!s.isEmergency && !archived, pct: s.enableTotal ? this.$store.subProgress(s) : null };
        });
      },
      hasData() { return this.rows.some(r => r.hasBar); },
      noData() { return this.rawSubs.length > 0 && !this.hasData; },
      // 时间轴范围
      range() {
        const bars = this.rows.filter(r => r.hasBar);
        if (!bars.length) return null;
        let min = bars[0].start, max = bars[0].end;
        bars.forEach(r => { if (r.start < min) min = r.start; if (r.end > max) max = r.end; });
        return { min, max };
      },
      dayWidth() { return 18; },
      trackWidth() {
        const rg = this.range; if (!rg) return 0;
        return (this.dayDiff(rg.min, rg.max) + 1) * this.dayWidth;
      },
      // 每行条形的像素位置
      positioned() {
        const rg = this.range; if (!rg) return [];
        const DW = this.dayWidth;
        return this.rows.map(r => ({
          ...r,
          left: r.hasBar ? this.dayDiff(rg.min, r.start) * DW : 0,
          width: r.hasBar ? (this.dayDiff(r.start, r.end) + 1) * DW : 0,
        }));
      },
      // 时间轴刻度（每 7 天一个）
      ticks() {
        const rg = this.range; if (!rg) return [];
        const DW = this.dayWidth; const out = [];
        let cur = rg.min;
        while (cur <= rg.max) {
          const p = cur.split('-');
          out.push({ left: this.dayDiff(rg.min, cur) * DW, label: p[1] + '/' + p[2] });
          // +7 天
          const d = this.$store.util.parseDate(cur); d.setDate(d.getDate() + 7);
          const pp = n => String(n).padStart(2, '0');
          cur = d.getFullYear() + '-' + pp(d.getMonth() + 1) + '-' + pp(d.getDate());
        }
        return out;
      },
    },
    methods: {
      parse(d) { return this.$store.util.parseDate(d); },
      dayDiff(a, b) { return Math.round((this.parse(b).getTime() - this.parse(a).getTime()) / 86400000); },
      creationDate(s) {
        const d = new Date(s.last_modified_at || Date.now());
        const p = n => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
      },
    },
    template: `
    <div class="gantt">
      <div v-if="!rawSubs.length && filterTag" class="empty-tip">「{{ filterTag }}」标签下暂无子任务</div>
      <div v-else-if="!rawSubs.length" class="empty-tip">还没有子任务，点「新增子任务」添加（全部平级，不支持多级嵌套）</div>
      <div v-else-if="noData" class="empty-tip gantt-empty">暂无时间数据，请给子任务设置开始 / 结束日期</div>
      <div v-else class="gantt-scroll">
        <div class="gantt-inner" :style="{width: (88 + trackWidth) + 'px'}">
          <div class="gantt-head">
            <div class="gantt-label gantt-corner">子任务</div>
            <div class="gantt-track-head" :style="{width: trackWidth + 'px'}">
              <span v-for="t in ticks" :key="t.left" class="gantt-tick" :style="{left: t.left + 'px'}">{{ t.label }}</span>
            </div>
          </div>
          <div class="gantt-body">
            <div class="gantt-row" v-for="r in positioned" :key="r.sid">
              <div class="gantt-label" :class="{emg: r.emg}" :title="(r.emg ? '【紧急】' : '') + r.title"><span v-if="r.emg" class="gantt-emg">🚨</span>{{ r.title }}</div>
              <div class="gantt-track" :style="{width: trackWidth + 'px'}">
                <div v-if="r.hasBar" class="gantt-bar" :class="{done: r.archived}" :style="{left: r.left + 'px', width: r.width + 'px'}" @click="$emit('open-sub', r.sid)">
                  <span v-if="r.pct !== null" class="gantt-pct">{{ r.pct }}%</span>
                </div>
                <span v-else class="gantt-none">无截止时间</span>
              </div>
            </div>
          </div>
        </div>
        <p class="tip gantt-tip">甘特图仅可视化展示，点击色块可编辑子任务；子任务全部平级，不支持多层嵌套。</p>
      </div>
    </div>`,
  };

  /* -------- ProjectsPage —— 项目总览页 -------- */
  C.ProjectsPage = {
    name: 'ProjectsPage',
    components: { ProjectEditModal: C.ProjectEditModal },
    data() {
      return {
        tab: 'running', showEdit: false, editPid: '',
        // 标签筛选栏（默认折叠）
        tagbarOpen: false, filterTag: '',
        // 文件夹展开 / 新建重命名
        openFids: [], showFolderEdit: false, folderFid: '', folderName: '',
        // 长按操作菜单
        menu: { type: null, id: null },
        // 删除二次确认
        delFid: '',
        // 移动弹窗（项目 / 文件夹）
        moveDlgPid: '', moveFolderDlgFid: '',
        // 排序菜单弹窗
        showSortMenu: false,
        // 手势 / 滑动状态（同一时刻仅一项手势，全局复用）
        drag: { id: null, type: null, startX: 0, x: 0, moved: false, suppress: false, longTimer: null, hintId: null, hintDir: '' },
        // 顶部搜索（不持久化；切Tab/刷新自动清空）
        searchKeyword: '',
        // Toast
        toast: '', toastTimer: null,
        // 专注时长可视化模块（默认折叠；维度 日/周/月；本地缓存，切 Tab 保留）
        vizOpen: false, vizDim: 'day',
        // 饼图下钻：当前选中的标签（null = 标签总览，非 null = 该标签下各项目分布）
        vizDrillTag: null,
        // 项目重要等级排序（默认关；本地缓存）
        importanceSort: false,
      };
    },
    computed: {
      running() { return this.$store.getProjects('running'); },
      // 已归档模块合并展示「已归档 + 已完成」数据（存储逻辑不变，仅展示合并）
      archived() { return [...this.$store.getProjects('archive'), ...this.$store.getProjects('finish')]; },
      baseList() { return this.tab === 'running' ? this.running : this.archived; },
      list() {
        if (!this.filterTag) return this.baseList;
        return this.baseList.filter(p => (p.tags || []).indexOf(this.filterTag) >= 0);
      },
      allTags() {
        const set = [];
        this.baseList.forEach(p => (p.tags || []).forEach(t => { if (t && set.indexOf(t) < 0) set.push(t); }));
        return set;
      },
      foldersAll() {
        try { return this.$store.getFolders() || []; }
        catch (e) { this._errToast('文件夹数据读取失败'); return []; }
      },
      // 顶层文件夹（parent 为空），按当前 Tab 状态过滤；历史文件夹无 status 视为 archive
      topFolders() {
        try {
          const want = this.tab === 'running' ? 'running' : 'archive';
          return (this.foldersAll || []).filter(f => f && !f.parent && (f.status || 'archive') === want);
        } catch (e) { this._errToast('文件夹列表读取失败'); return []; }
      },
      // 已归档：不在任何文件夹里的项目
      // 散落项目（不在任何文件夹里的项目）：开启重要等级排序时随 sortedList 一起排序
      looseList() { return this.sortedList.filter(p => !p.folder_id || !this.foldersAll.some(f => f.fid === p.folder_id)); },
      moveDlgProject() { return this.baseList.find(p => p.pid === this.moveDlgPid) || null; },
      menuProj() { return this.menu.type === 'proj' ? this.baseList.find(p => p.pid === this.menu.id) : null; },
      menuFolder() { return this.menu.type === 'folder' ? this.foldersAll.find(f => f.fid === this.menu.id) : null; },
      menuProjArchived() { const p = this.menuProj; return p && (p.status === 'archive' || p.status === 'finish'); },
      menuTitle() {
        if (this.menu.type === 'proj') return '项目：' + (this.menuProj ? this.menuProj.name : '');
        if (this.menu.type === 'folder') return '文件夹：' + (this.menuFolder ? this.menuFolder.name : '');
        return '';
      },
      // 文件夹移动目标：顶层文件夹（parent 为空）且非自身，且自身不含子文件夹（否则会超两层）
      moveFolderTargets() {
        const self = this.foldersAll.find(f => f.fid === this.moveFolderDlgFid);
        if (!self) return [];
        if (this.childFolders(self.fid).length > 0) return [];
        return this.foldersAll.filter(f => !f.parent && f.fid !== self.fid);
      },
      moveFolderName() { const f = this.foldersAll.find(x => x.fid === this.moveFolderDlgFid); return f ? f.name : ''; },
      // —— 顶部搜索：当前 Tab 下全部项目（父任务）+ 子任务，多字段模糊匹配 ——
      // 匹配字段：标题 / 描述 / 素材备注 / 灵感素材 / 一级#标签（项目）/ 二级##标签（子任务）。
      // 约束：仅母本（项目模块无副本概念）；结果不持久化；切 Tab 清空由 watch 统一处理。
      searchResults() {
        const kw = (this.searchKeyword || '').trim().toLowerCase().replace(/^#+/, '');
        if (!kw) return [];
        const out = [];
        this.baseList.forEach(p => {
          const hay = [ p.name || '', p.desc || '', p.material_notes || '', p.material_link || '' ];
          (p.tags || []).forEach(t => hay.push(t || ''));
          this.$store.getIdeas(p.pid).forEach(i => { hay.push(i.title || ''); hay.push(i.content || ''); hay.push(i.link || ''); });
          if (hay.join(' ').toLowerCase().indexOf(kw) >= 0) out.push({ type: 'project', p });
          this.$store.getSubs(p.pid).forEach(s => {
            const shay = [ s.title || '', s.desc || '', s.material_notes || '', s.material_link || '' ];
            (s.tags || []).forEach(t => shay.push(t || ''));
            if (shay.join(' ').toLowerCase().indexOf(kw) >= 0) out.push({ type: 'sub', p, s });
          });
        });
        return out;
      },
      searchProjects() { return this.searchResults.filter(r => r.type === 'project'); },
      searchSubs() { return this.searchResults.filter(r => r.type === 'sub'); },
      // —— 项目重要等级排序：开启后按 高度重要 > 一般重要 > 普通 降序；同级保持原有顺序（稳定排序）——
      sortedList() {
        if (!this.importanceSort) return this.list;
        const rank = p => ({ high: 3, important: 2, normal: 1 }[(p && p.importance) || 'normal'] || 1);
        return this.list.map((p, i) => ({ p, i }))
          .sort((a, b) => { const d = rank(b.p) - rank(a.p); return d !== 0 ? d : a.i - b.i; })
          .map(x => x.p);
      },
      // 当前列表内最大专注总时长（用于项目卡片时间条的相对刻度；无记录则为 0）
      maxProjFocus() {
        let m = 0;
        this.list.forEach(p => { const v = this.projFocusMin(p); if (v > m) m = v; });
        return m;
      },
      // —— 专注时长可视化：仅统计当前 Tab 内各项目填报的 project_records（不含其它页面数据）——
      focusRecords() {
        const sids = {};
        this.baseList.forEach(p => this.$store.getSubs(p.pid).forEach(s => { sids[s.sid] = true; }));
        return (this.$store.state.project_records || []).filter(r => !r.deleted_at && sids[r.sid]);
      },
      vizDimLabel() { return this.vizDim === 'day' ? '日' : (this.vizDim === 'month' ? '月' : '周'); },
      // 柱状图：按 日 / 周 / 月 分桶聚合专注总时长
      barBuckets() {
        const dim = this.vizDim;
        const map = {}, order = [];
        this.focusRecords.forEach(r => {
          const k = this.bucketKey(r.recordDate, dim);
          if (!map[k]) { map[k] = 0; order.push(k); }
          map[k] += (Number(r.spentMin) || 0);
        });
        const max = order.reduce((m, k) => Math.max(m, map[k]), 0);
        return order.slice().sort().map(k => ({
          key: k, label: this.bucketLabel(k, dim), min: map[k],
          pct: max > 0 ? Math.round(map[k] / max * 100) : 0,
        }));
      },
      // 饼图：各项目占用专注时长占比分布
      pieData() {
        const palette = ['#6a7bff', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#06b6d4', '#ef4444', '#84cc16', '#f97316', '#14b8a6'];
        const arr = this.baseList.map(p => ({ pid: p.pid, name: p.name || '未命名', min: this.projFocusMin(p) }))
          .filter(x => x.min > 0);
        const total = arr.reduce((a, x) => a + x.min, 0);
        let acc = 0;
        return arr.map((x, i) => {
          const ratio = total > 0 ? x.min / total : 0;
          const slice = { name: x.name, min: x.min, pct: total > 0 ? Math.round(ratio * 100) : 0, color: palette[i % palette.length], from: acc, ratio };
          acc += ratio;
          return slice;
        });
      },
      vizHasData() { return this.focusRecords.length > 0; },
      // 饼图（层级1）：按项目标签聚合专注时长分布
      pieByTag() {
        const palette = ['#6a7bff', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#06b6d4', '#ef4444', '#84cc16', '#f97316', '#14b8a6'];
        const map = {};
        this.baseList.forEach(p => {
          const tags = (p.tags && p.tags.length) ? p.tags : ['未标签'];
          const min = this.projFocusMin(p);
          if (min <= 0) return;
          tags.forEach(t => { map[t] = (map[t] || 0) + min; });
        });
        const arr = Object.keys(map).map(t => ({ name: t, min: map[t] })).filter(x => x.min > 0);
        const total = arr.reduce((a, x) => a + x.min, 0);
        let acc = 0;
        return arr.sort((a, b) => b.min - a.min).map((x, i) => {
          const ratio = total > 0 ? x.min / total : 0;
          const slice = { name: x.name, min: x.min, pct: total > 0 ? Math.round(ratio * 100) : 0, color: palette[i % palette.length], from: acc, ratio };
          acc += ratio;
          return slice;
        });
      },
      // 饼图（层级2）：某标签下各项目专注时长分布（下钻）
      pieByProject() {
        if (!this.vizDrillTag) return [];
        const palette = ['#6a7bff', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#06b6d4', '#ef4444', '#84cc16', '#f97316', '#14b8a6'];
        const arr = this.baseList
          .filter(p => (p.tags || []).indexOf(this.vizDrillTag) >= 0)
          .map(p => ({ pid: p.pid, name: p.name || '未命名', min: this.projFocusMin(p) }))
          .filter(x => x.min > 0);
        const total = arr.reduce((a, x) => a + x.min, 0);
        let acc = 0;
        return arr.sort((a, b) => b.min - a.min).map((x, i) => {
          const ratio = total > 0 ? x.min / total : 0;
          const slice = { name: x.name, min: x.min, pct: total > 0 ? Math.round(ratio * 100) : 0, color: palette[i % palette.length], from: acc, ratio };
          acc += ratio;
          return slice;
        });
      },
      pieData() { return this.vizDrillTag ? this.pieByProject : this.pieByTag; },
      // 饼图 conic-gradient（复用项目标签分布图已有配色；无数据时为灰底）
      pieGradient() {
        if (!this.pieData.length) return 'conic-gradient(#eef0f5 0deg 360deg)';
        let acc = 0;
        const parts = this.pieData.map(s => {
          const a0 = acc * 360, a1 = (acc + s.ratio) * 360; acc += s.ratio;
          return s.color + ' ' + a0.toFixed(2) + 'deg ' + a1.toFixed(2) + 'deg';
        });
        return 'conic-gradient(' + parts.join(', ') + ')';
      },
      // 饼图 conic-gradient（复用项目标签分布图已有配色；无数据时为灰底）
      pieGradient() {
        if (!this.pieData.length) return 'conic-gradient(#eef0f5 0deg 360deg)';
        let acc = 0;
        const parts = this.pieData.map(s => {
          const a0 = acc * 360, a1 = (acc + s.ratio) * 360; acc += s.ratio;
          return s.color + ' ' + a0.toFixed(2) + 'deg ' + a1.toFixed(2) + 'deg';
        });
        return 'conic-gradient(' + parts.join(', ') + ')';
      },
    },
    watch: {
      // 约束③：切换 进行中 / 已归档 Tab 自动清空搜索词（刷新由 data 初始化 '' 保证）
      tab() { this.searchKeyword = ''; },
    },
    created() { this.restoreTab(); },
    beforeUnmount() { this.saveTab(); },
    methods: {
      // —— 项目列表 UI 状态缓存（进行中 / 已归档 分区），随路由栈返回时还原 ——
      saveTab() {
        try { localStorage.setItem('mindpocket:projectsTab', this.tab); } catch (e) {}
        try { localStorage.setItem('mindpocket:projVizDim', this.vizDim); } catch (e) {}
        // 折叠状态不持久化（全局规则）
      },
      restoreTab() {
        // 折叠状态不持久化：每次进入页面默认折叠（全局规则）
        // vizDim 和 tab 保留本地记忆（用户偏好，非折叠状态）
        try { const t = localStorage.getItem('mindpocket:projectsTab'); if (t) this.tab = t; } catch (e) {}
        try { const d = localStorage.getItem('mindpocket:projVizDim'); if (d === 'day' || d === 'week' || d === 'month') this.vizDim = d; } catch (e) {}
      },
      go(p) { location.hash = '#/project/' + p.pid; },
      openNew() { this.editPid = ''; this.showEdit = true; },
      openEdit(p) { this.editPid = p.pid; this.showEdit = true; },
      openEditById(pid) {
        const p = (this.running || []).concat(this.archived || []).find(x => x.pid === pid);
        if (p) this.openEdit(p);
      },
      doReopen(p) { this.$store.reopenProject(p.pid); },
      countdown(p) { const d = this.$store.projectCountdown(p.deadline); return d; },
      progressOf(p) { return this.$store.projectProgress(p.pid); },
      preview(p) { return this.$store.getSubs(p.pid).slice(0, 3).map(s => s.title); },
      subCount(p) { return this.$store.getSubs(p.pid).length; },
      // 项目累计专注总时长（分钟）
      projFocusMin(p) { return this.$store.projectFocusMin(p.pid); },
      // 重要等级文案
      impLabel(p) { return ({ high: '高度重要', important: '一般重要', normal: '普通' }[(p && p.importance) || 'normal']) || '普通'; },
      // 稳定排序：按重要等级降序，同级保持原有顺序
      stableSortByImportance(arr) {
        const rank = p => ({ high: 3, important: 2, normal: 1 }[(p && p.importance) || 'normal'] || 1);
        return arr.map((p, i) => ({ p, i }))
          .sort((a, b) => { const d = rank(b.p) - rank(a.p); return d !== 0 ? d : a.i - b.i; })
          .map(x => x.p);
      },
      toggleImportanceSort() { this.importanceSort = !this.importanceSort; this.saveTab(); },
      // 排序菜单弹窗
      toggleSortMenu() { this.showSortMenu = !this.showSortMenu; },
      selectSort(mode) { this.importanceSort = (mode === 'importance'); this.showSortMenu = false; this.saveTab(); },
      // —— 专注时长可视化模块 ——
      toggleViz() { this.vizOpen = !this.vizOpen; this.saveTab(); },
      setVizDim(d) { this.vizDim = d; this.saveTab(); },
      // 饼图下钻：点击标签进入该标签下各项目分布
      drillTag(tag) { this.vizDrillTag = tag; },
      // 返回标签总览
      drillBack() { this.vizDrillTag = null; },
      // 点击饼图本体：进入占比最大的标签下钻
      drillFirstTag() { if (this.pieByTag.length) this.vizDrillTag = this.pieByTag[0].name; },
      // 时间分桶：日=原日期；周=所在周周一；月=YYYY-MM
      bucketKey(dateStr, dim) {
        if (!dateStr) return '';
        if (dim === 'month') return dateStr.slice(0, 7);
        if (dim === 'week') {
          const d = this.$store.util.parseDate(dateStr);
          const off = (d.getDay() + 6) % 7; // 周一为 0
          const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - off);
          const p = n => String(n).padStart(2, '0');
          return mon.getFullYear() + '-' + p(mon.getMonth() + 1) + '-' + p(mon.getDate());
        }
        return dateStr;
      },
      bucketLabel(k, dim) {
        if (!k) return '';
        if (dim === 'month') return k.slice(0,7) + '月';
        if (dim === 'week') return k + ' 周';
        return k; // YYYY-MM-DD
      },
      // 项目卡片紧急汇总：项目下存在未完成的紧急子任务时，卡片同步展示红色角标
      emgCount(p) { return this.$store.getSubs(p.pid).filter(s => s.isEmergency && !this.$store.isSubComplete(s)).length; },
      // —— 标签筛选 ——
      toggleTagbar() { this.tagbarOpen = !this.tagbarOpen; },
      pickTag(t) { this.filterTag = this.filterTag === t ? '' : t; },
      // —— 文件夹 ——（展示文件夹内全部项目，不按 Tab 过滤，避免项目"消失"）
      folderProjects(f) {
        try {
          if (!f || !f.fid) return [];
          const base = (this.running || []).concat(this.archived || []);
          let arr = base.filter(p => p && p.folder_id === f.fid);
          if (this.importanceSort) arr = this.stableSortByImportance(arr);
          return arr;
        } catch (e) { this._errToast('文件夹数据读取异常'); return []; }
      },
      // 取某文件夹下的子文件夹（带参数方法，非 computed；含防御避免白屏）
      childFolders(parentFid) {
        try { return (this.foldersAll || []).filter(f => f && f.parent === parentFid); }
        catch (e) { this._errToast('子文件夹读取失败'); return []; }
      },
      isFolderOpen(f) { return this.openFids.indexOf(f.fid) >= 0; },
      toggleFolder(f) {
        const i = this.openFids.indexOf(f.fid);
        if (i >= 0) this.openFids.splice(i, 1); else this.openFids.push(f.fid);
      },
      openFolderNew() { this.folderFid = ''; this.folderName = ''; this.showFolderEdit = true; },
      openFolderRename(f) { this.folderFid = f.fid; this.folderName = f.name; this.showFolderEdit = true; },
      saveFolder() {
        const n = (this.folderName || '').trim();
        if (!n) { alert('请输入文件夹名称'); return; }
        if (this.folderFid) this.$store.renameFolder(this.folderFid, n);
        else this.$store.addFolder(n);
        this.showFolderEdit = false;
      },
      confirmDeleteFolder() {
        if (this.delFid) this.$store.deleteFolder(this.delFid);
        this.delFid = '';
      },
      // —— 移动项目到文件夹 ——
      openMoveDlg(p) { this.moveDlgPid = p.pid; },
      doMove(fid) {
        if (this.moveDlgPid) this.$store.moveProjectToFolder(this.moveDlgPid, fid || null);
        this.moveDlgPid = '';
      },
      // —— 移动文件夹（最多两层）——
      doMoveFolder(parentFid) {
        const self = this.foldersAll.find(f => f.fid === this.moveFolderDlgFid);
        this.moveFolderDlgFid = '';
        if (!self) return;
        // 禁止移动到自身
        if (parentFid && parentFid === self.fid) { this.showToast('不能移动到自身'); return; }
        // 禁止三级嵌套：目标必须是顶层文件夹（无 parent）或根目录
        if (parentFid) {
          const target = this.foldersAll.find(f => f.fid === parentFid);
          if (target && target.parent) { this.showToast('最多两层嵌套，无法再深入'); return; }
        }
        // 含子文件夹的文件夹不能再被嵌套到其它文件夹
        if (this.childFolders(self.fid).length > 0) { this.showToast('该文件夹含子文件夹，无法再嵌套'); return; }
        this.$store.moveFolderToFolder(self.fid, parentFid || null);
      },
      // ===== 卡片手势（项目卡 / 文件夹卡 通用）=====
      onCardDown(type, id, ev) {
        const d = this.drag;
        d.id = id; d.type = type; d.startX = ev.clientX; d.x = 0; d.moved = false; d.suppress = false; d.hintId = null; d.hintDir = '';
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
        if (d.longTimer) clearTimeout(d.longTimer);
        d.longTimer = setTimeout(() => {
          d.suppress = true;
          // 项目长按 → 直接进编辑页（不再唤起浮窗）；文件夹保留长按菜单
          if (type === 'proj') this.openEditById(id);
          else this.openCardMenu(type, id);
        }, 480);
      },
      onCardMove(ev) {
        const d = this.drag;
        if (!d.id) return;
        // 已归档页的文件夹条目：彻底禁用左右滑动手势（文件夹不能手势撤销归档）；
        // 仅项目条目保留滑动撤销归档。点击展开与长按菜单不受影响。
        if (d.type === 'folder' && this.tab === 'archive') {
          d.moved = false; d.x = 0; d.hintId = null; d.hintDir = '';
          return;
        }
        const dx = ev.clientX - d.startX;
        if (Math.abs(dx) > 8) {
          if (d.longTimer) { clearTimeout(d.longTimer); d.longTimer = null; }
          d.moved = true;
        }
        if (!d.moved) return;
        // 允许方向：进行中 Tab 仅左滑；已归档 Tab 仅右滑
        const allowLeft = this.tab === 'running';
        const allowRight = this.tab === 'archive';
        if (allowLeft && dx < 0) { d.x = Math.max(dx, -110); d.hintId = d.id; d.hintDir = 'left'; }
        else if (allowRight && dx > 0) { d.x = Math.min(dx, 110); d.hintId = d.id; d.hintDir = 'right'; }
        else { d.x = 0; d.hintId = null; d.hintDir = ''; }
      },
      onCardUp() {
        const d = this.drag;
        if (d.longTimer) { clearTimeout(d.longTimer); d.longTimer = null; }
        if (!d.id) return;
        if (d.moved) {
          const TH = 72; // 触发阈值：轻微拖动不误触发
          if (Math.abs(d.x) >= TH) this.execSwipe(d.type, d.id, d.hintDir);
          d.x = 0; // 回弹（不足阈值不执行）
        }
      },
      resetDrag() {
        const d = this.drag;
        d.id = null; d.type = null; d.x = 0; d.moved = false; d.suppress = false; d.hintId = null; d.hintDir = '';
        if (d.longTimer) { clearTimeout(d.longTimer); d.longTimer = null; }
      },
      onCardClick(type, payload) {
        const d = this.drag;
        if (d.suppress || d.moved) { this.resetDrag(); return; } // 长按 / 滑动后不触发点击
        if (type === 'proj') this.go(payload);
        else this.toggleFolder(payload);
      },
      execSwipe(type, id, dir) {
        if (type === 'proj') {
          if (dir === 'left') { this.$store.archiveProject(id); this.showToast('已归档'); }
          else { this.$store.reopenProject(id); this.showToast('已撤销归档'); }
        } else {
          if (dir === 'left') { this.$store.archiveFolder(id); this.showToast('已归档'); }
          else { this.$store.reopenFolder(id); this.showToast('已撤销归档'); }
        }
        this.vibrate();
      },
      vibrate() { try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {} },
      showToast(msg) {
        this.toast = msg;
        if (this.toastTimer) clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => { this.toast = ''; }, 1400);
      },
      // 错误信息 toast（与原 toast 复用同一展示）
      _errToast(msg) { this.showToast(msg || '数据读取失败'); },
      cardX(id) { return this.drag.id === id ? this.drag.x : 0; },
      cardHintDir(id) { return this.drag.hintId === id ? this.drag.hintDir : ''; },
      cardHintText(id) { if (this.drag.hintId !== id) return ''; return this.drag.hintDir === 'left' ? '归档' : '撤销归档'; },
      // ===== 长按操作菜单（仅文件夹使用；项目长按已改为直接进编辑页）=====
      openCardMenu(type, id) { this.menu = { type, id }; },
      menuClose() { this.menu = { type: null, id: null }; },
      menuRenameFolder() { const f = this.menuFolder; this.menuClose(); if (f) this.openFolderRename(f); },
      menuMoveFolder() { const f = this.menuFolder; this.menuClose(); if (f) this.moveFolderDlgFid = f.fid; },
      menuDelFolder() { const f = this.menuFolder; this.menuClose(); if (f) this.delFid = f.fid; },
    },
    template: `
    <div class="page">
      <h2 class="page-title">项目</h2>
      <div class="tabs">
        <button :class="{on:tab==='running'}" @click="tab='running'">进行中（{{ running.length }}）</button>
        <button :class="{on:tab==='archive'}" @click="tab='archive'">已归档（{{ archived.length }}）</button>
      </div>
      <!-- 顶部搜索框（复用待归档列表搜索样式；不持久化，切Tab/刷新清空） -->
      <div class="inbox-search">
        <div class="arch-filter">
          <input v-model="searchKeyword" placeholder="搜索项目/子任务：标题/描述/素材/灵感/标签…" />
          <button v-if="searchKeyword" class="search-clear" @click="searchKeyword=''" title="清空搜索">✕</button>
        </div>
      </div>
      <!-- 重要等级排序切换（默认关；偏好本地缓存，切 Tab 保留） -->
      <!-- 排序开关改为图标按钮，与新建项目同行，靠右布局 -->

      <!-- 专注时长可视化模块（默认折叠；仅统计项目 Tab 内各项目填报的 project_records） -->
      <div class="viz-module" v-if="vizOpen && !searchKeyword.trim()">
        <div class="view-toggle">
          <button :class="{on: vizDim==='day'}" @click="setVizDim('day')">日</button>
          <button :class="{on: vizDim==='week'}" @click="setVizDim('week')">周</button>
          <button :class="{on: vizDim==='month'}" @click="setVizDim('month')">月</button>
        </div>
        <template v-if="vizHasData">
          <div class="viz-sec-title">⏱ 各{{ vizDimLabel }}专注时长</div>
          <div class="chart-bars">
            <div class="chart-bar" v-for="b in barBuckets" :key="b.key">
              <div class="bar-val">{{ $store.fmtSpent(b.min) }}</div>
              <div class="bar-col" :style="{height: b.pct + '%'}"></div>
              <div class="bar-label">{{ b.label }}</div>
            </div>
          </div>
          <div class="viz-sec-title">
            🥧 {{ vizDrillTag ? '标签「' + vizDrillTag + '」下各项目专注占比' : '各标签专注占比' }}
            <button v-if="vizDrillTag" class="viz-drill-back" @click="drillBack">← 返回标签总览</button>
          </div>
          <div class="viz-pie-wrap">
            <div class="viz-pie" :class="{clickable: !vizDrillTag}" :style="{background: pieGradient}" @click="vizDrillTag ? null : drillFirstTag()"></div>
            <div class="viz-legend">
              <div class="viz-leg-item" v-for="s in pieData" :key="s.name" :class="{clickable: !vizDrillTag}" @click="vizDrillTag ? null : drillTag(s.name)">
                <span class="viz-dot" :style="{background: s.color}"></span>
                <span class="viz-leg-name">{{ s.name }}</span>
                <span class="viz-leg-pct">{{ s.pct }}% · {{ $store.fmtSpent(s.min) }}</span>
                <span v-if="!vizDrillTag" class="viz-drill-icon">›</span>
              </div>
            </div>
          </div>
        </template>
        <p v-else class="empty-tip">暂无专注时长记录，在子任务卡片点「填报」记录专注时长后这里会生成可视化</p>
      </div>
      <!-- 可折叠标签筛选栏（默认折叠；搜索激活时整段隐藏） -->
      <template v-if="!searchKeyword.trim()">
      <div class="tagbar" v-if="allTags.length">
        <button class="tagbar-toggle" @click="toggleTagbar">
          🏷 标签筛选{{ filterTag ? '：' + filterTag : '' }}　{{ tagbarOpen ? '▼ 收起' : '▶ 展开' }}
        </button>
        <div class="tagbar-list" v-if="tagbarOpen">
          <span class="ptag" :class="{on: filterTag===t}" v-for="t in allTags" :key="t" @click="pickTag(t)">{{ t }}</span>
          <span class="ptag" v-if="filterTag" @click="filterTag=''">✕ 清除筛选</span>
        </div>
      </div>
      <div class="proj-top-actions" style="display:flex;align-items:center;gap:8px;margin-bottom:14px;position:relative;">
        <button class="btn primary" style="flex:1;" v-if="tab==='running'" @click="openNew">＋ 新建项目</button>
        <button class="btn primary" style="flex:1;" v-else @click="openFolderNew">＋ 创建文件夹</button>
        <button class="icon-btn" :class="{on: importanceSort}" @click="toggleSortMenu" title="排序方式" style="flex:0 0 auto;padding:6px 10px;font-size:16px;">⚖️</button>
        <button class="icon-btn" :class="{on: vizOpen}" @click="toggleViz" title="专注时长可视化" style="flex:0 0 auto;padding:6px 10px;font-size:16px;">📊</button>
        <div class="sort-menu" v-if="showSortMenu" style="position:absolute;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.1);min-width:140px;">
          <div class="sort-item" :class="{on: !importanceSort}" @click="selectSort('default')" style="padding:9px 12px;font-size:13px;border-radius:8px;cursor:pointer;color:var(--text);">📋 默认排序</div>
          <div class="sort-item" :class="{on: importanceSort}" @click="selectSort('importance')" style="padding:9px 12px;font-size:13px;border-radius:8px;cursor:pointer;color:var(--text);">🔥 按重要等级</div>
        </div>
      </div>

      <!-- 文件夹列表（顶层，按 Tab 状态展示） -->
      <div class="proj-list" v-if="topFolders.length" style="margin-bottom:12px">
        <div class="folder-card" v-for="f in topFolders" :key="f.fid">
          <div class="folder-head swipe-card"
               @pointerdown="onCardDown('folder', f.fid, $event)"

               @pointerup="onCardUp($event)"
               @pointercancel="onCardUp($event)"
               @click="onCardClick('folder', f)">
            <div class="swipe-hint" :class="cardHintDir(f.fid)" v-if="cardHintDir(f.fid)">{{ cardHintText(f.fid) }}</div>
            <div class="folder-inner" :class="{dragging: drag.id===f.fid && drag.moved}" :style="{transform: 'translateX('+cardX(f.fid)+'px)'}">
              <span>{{ isFolderOpen(f) ? '📂' : '📁' }}</span>
              <span class="folder-name">{{ f.name }}</span>
              <span class="folder-cnt">{{ folderProjects(f).length }} 个项目</span>
            </div>
          </div>
          <div class="folder-body" v-if="isFolderOpen(f)">
            <!-- 二级子文件夹 -->
            <div class="folder-card sub" v-for="sf in childFolders(f.fid)" :key="sf.fid">
              <div class="folder-head swipe-card"
                   @pointerdown.stop="onCardDown('folder', sf.fid, $event)"
                   @pointermove.stop="onCardMove($event)"

  /* -------- ProjectDetailPage —— 项目详情页（子任务 / 选题灵感库） -------- */
  C.ProjectDetailPage = {
    name: 'ProjectDetailPage',
    mixins: [C.MaterialLinkMixin], // 素材链接识别：与待归档任务共用同一实现
    components: { ProjectEditModal: C.ProjectEditModal, ProjectSubEditModal: C.ProjectSubEditModal, ProjectRecordModal: C.ProjectRecordModal, ProjectIdeaEditModal: C.ProjectIdeaEditModal, ProjectGantt: C.ProjectGantt, ProjectTagPie: C.ProjectTagPie },
    props: { pid: { type: String, required: true } },
    data() {
      return {
        tab: 'sub', view: 'list',
        // 子任务标签筛选（默认折叠，选中标签后列表与甘特图同步生效）
        tagbarOpen: false, filterTag: '',
        showProjEdit: false,
        showSubEdit: false, editSid: '', seedTitle: '', pickIdeaId: '', subSeedTags: [],
        showRecord: false, recordSid: '',
        showIdeaEdit: false, editIdeaId: '',
        // 子任务卡片手势
        subDragId: null, subStartX: 0, subX: 0, subMoved: false, subSuppress: false, subLongTimer: null,
        // 灵感素材卡片手势
        ideaDragId: null, ideaStartX: 0, ideaX: 0, ideaMoved: false, ideaSuppress: false, ideaLongTimer: null,
        ideaChoiceId: null,
        // 二次确认状态（子任务删除 / 灵感删除 / 项目归档）
        confirmDelSub: null, confirmDelIdea: null, confirmArchiveProj: false,
      };
    },
    computed: {
      project() { return this.$store.state.projects.find(x => x.pid === this.pid) || null; },
      // 全部子任务（已完成自动置后），用于计数与标签汇总
      allSubs() { return this.$store.getSubsOrdered(this.pid); },
      // 当前展示的子任务：叠加标签筛选
      subs() {
        if (!this.filterTag) return this.allSubs;
        return this.allSubs.filter(s => (s.tags || []).indexOf(this.filterTag) >= 0);
      },
      subTags() { return this.$store.getSubTags(this.pid); },
      // 时间进度条相对刻度：未设预计耗时的子任务，按项目内最大耗时做横向对比
      maxSpent() {
        return this.allSubs.reduce((m, s) => Math.max(m, this.$store.subSpentMin(s)), 0);
      },
      ideas() { return this.$store.getIdeas(this.pid); },
      ideaChoiceTitle() { const i = this.ideas.find(x => x.idea_id === this.ideaChoiceId); return i ? i.title : ''; },
      progress() { return this.$store.projectProgress(this.pid); },
      countdown() { return this.project ? this.$store.projectCountdown(this.project.deadline) : null; },
      today() { return this.$store.util.todayStr(); },
      // 所有子任务时间跨度的参考窗口（用于卡片内区间色块定位）；无时间数据则 null
      subWindow() {
        const ds = [];
        this.allSubs.forEach(s => {
          if (s.sub_start) ds.push(s.sub_start);
          if (s.sub_end) ds.push(s.sub_end);
        });
        if (!ds.length) return null;
        let min = ds[0], max = ds[0];
        ds.forEach(d => { if (d < min) min = d; if (d > max) max = d; });
        return { min, max };
      },
    },
    created() { this.restoreUiState(); },
    beforeUnmount() { this.saveUiState(); },
    methods: {
      // —— 页面 UI 状态缓存（进行中 / 灵感库 标签），随路由栈返回时自动还原 ——
      saveUiState() {
        try { localStorage.setItem('mindpocket:projUi:' + this.pid, JSON.stringify({ tab: this.tab, view: this.view, tagbarOpen: this.tagbarOpen, filterTag: this.filterTag })); } catch (e) {}
      },
      restoreUiState() {
        try {
          const raw = localStorage.getItem('mindpocket:projUi:' + this.pid);
          if (!raw) return;
          const s = JSON.parse(raw);
          if (s.tab) this.tab = s.tab;
          if (s.view) this.view = s.view;
          // tagbarOpen 不持久化：每次进入页面默认折叠（全局规则）
          // 标签可能已被删除：仅在标签仍存在时还原筛选，避免出现「空列表但查不到原因」
          if (s.filterTag && this.$store.getSubTags(this.pid).indexOf(s.filterTag) >= 0) this.filterTag = s.filterTag;
        } catch (e) {}
      },
      // —— 子任务标签筛选 ——
      toggleTagbar() { this.tagbarOpen = !this.tagbarOpen; },
      pickTag(t) { this.filterTag = this.filterTag === t ? '' : t; },
      clearTag() { this.filterTag = ''; },
      tagCount(t) { return this.allSubs.filter(s => (s.tags || []).indexOf(t) >= 0).length; },
      // 统一依靠浏览器历史栈原路返回（与手机系统返回键一致）；深链无历史时兜底回项目列表
      back() { if (window.history.length > 1) history.back(); else location.hash = '#/projects'; },
      toggleGantt() { this.view = this.view === 'gantt' ? 'list' : 'gantt'; },
      openSubNew() { this.editSid = ''; this.seedTitle = ''; this.pickIdeaId = ''; this.subSeedTags = []; this.showSubEdit = true; },
      openSubEdit(s) { this.editSid = s.sid; this.seedTitle = ''; this.pickIdeaId = ''; this.subSeedTags = (s.tags || []).slice(); this.showSubEdit = true; },
      openSubEditById(sid) { const s = this.$store.state.project_subs.find(x => x.sid === sid); if (s) this.openSubEdit(s); },
      openRecord(s) { this.recordSid = s.sid; this.showRecord = true; },
      openIdeaNew() { this.editIdeaId = ''; this.showIdeaEdit = true; },
      openIdeaEdit(i) { this.editIdeaId = i.idea_id; this.showIdeaEdit = true; },
      pickIdea(i) { this.editSid = ''; this.seedTitle = i.title; this.pickIdeaId = i.idea_id; this.subSeedTags = []; this.showSubEdit = true; },
      // 子任务卡片：长按=编辑；左滑=标记完成；右滑=撤销完成
      onSubDown(s, ev) {
        this.subDragId = s.sid;
        this.subStartX = ev.clientX;
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
        this.subX = 0; this.subMoved = false; this.subSuppress = false;
        if (this.subLongTimer) clearTimeout(this.subLongTimer);
        this.subLongTimer = setTimeout(() => { this.subSuppress = true; this.openSubEdit(s); }, 500);
      },
      onSubMove(ev) {
        if (this.subDragId == null) return;
        const dx = ev.clientX - this.subStartX;
        if (Math.abs(dx) > 8) {
          if (this.subLongTimer) { clearTimeout(this.subLongTimer); this.subLongTimer = null; }
          this.subMoved = true; this.subX = dx;
        }
      },
      onSubUp() {
        if (this.subLongTimer) { clearTimeout(this.subLongTimer); this.subLongTimer = null; }
        if (this.subDragId == null) return;
        const dx = this.subX, TH = 40;
        if (Math.abs(dx) >= TH) {
          const s = this.subs.find(x => x.sid === this.subDragId);
          if (s) this.setSubDone(s, dx < 0); // 左滑完成 / 右滑撤销
        }
        this.subX = 0; this.subDragId = null;
        if (this.subSuppress) setTimeout(() => { this.subSuppress = false; }, 0);
      },
      onSubMainClick(s) {
        if (this.subMoved) return;
        if (!this.subSuppress) this.openSubEdit(s);
      },
      setSubDone(s, val) {
        const done = this.isSubComplete(s);
        if (val && !done) this.toggleDone(s);
        else if (!val && done) this.toggleDone(s);
      },
      // 灵感素材卡片：长按=编辑；左滑=生成二选一；右滑=无变更
      onIdeaDown(i, ev) {
        this.ideaDragId = i.idea_id;
        this.ideaStartX = ev.clientX;
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
        this.ideaX = 0; this.ideaMoved = false; this.ideaSuppress = false;
        if (this.ideaLongTimer) clearTimeout(this.ideaLongTimer);
        this.ideaLongTimer = setTimeout(() => { this.ideaSuppress = true; this.openIdeaEdit(i); }, 500);
      },
      onIdeaMove(ev) {
        if (this.ideaDragId == null) return;
        const dx = ev.clientX - this.ideaStartX;
        if (Math.abs(dx) > 8) {
          if (this.ideaLongTimer) { clearTimeout(this.ideaLongTimer); this.ideaLongTimer = null; }
          this.ideaMoved = true; this.ideaX = Math.max(-150, Math.min(0, dx));
        }
      },
      onIdeaUp() {
        if (this.ideaLongTimer) { clearTimeout(this.ideaLongTimer); this.ideaLongTimer = null; }
        if (this.ideaDragId == null) return;
        const dx = this.ideaX, TH = 40;
        if (dx <= -TH) this.ideaChoiceId = this.ideaDragId; // 左滑 → 二选一
        this.ideaX = 0; this.ideaDragId = null;
        if (this.ideaSuppress) setTimeout(() => { this.ideaSuppress = false; }, 0);
      },
      onIdeaMainClick(i) {
        if (this.ideaMoved) return;
        if (!this.ideaSuppress) this.openIdeaEdit(i);
      },
      chooseIdeaToSub() {
        const i = this.ideas.find(x => x.idea_id === this.ideaChoiceId);
        this.ideaChoiceId = null;

        this.editSid = ''; this.seedTitle = i.title; this.pickIdeaId = i.idea_id;

      },
      chooseIdeaToProject() {
        const i = this.ideas.find(x => x.idea_id === this.ideaChoiceId);
        this.ideaChoiceId = null;
        if (!i) return;
        const raw = (i.content && i.content.trim()) || i.title || '灵感项目';
        const name = raw.split('\n')[0].trim().slice(0, 40) || '灵感项目';
        const p = this.$store.addProject({ name, tags: ['素材'], status: 'running' });
        this.$store.pickIdea(i.idea_id);
        location.hash = '#/project/' + p.pid;
      },
      cancelIdeaChoice() { this.ideaChoiceId = null; },
      // 选题灵感库：领取生成「进行中的项目」，灵感内容填充到项目（仅 name 文本字段可用），其余字段置空
      pickAsProject(i) {
        const raw = (i.content && i.content.trim()) || i.title || '灵感项目';
        const name = raw.split('\n')[0].trim().slice(0, 40) || '灵感项目';
        const p = this.$store.addProject({ name, deadline: null, status: 'running' });
        this.$store.pickIdea(i.idea_id);
        location.hash = '#/project/' + p.pid;
      },
      delSub(s) { this.confirmDelSub = s; },
      confirmDeleteSub() { if (this.confirmDelSub) { this.$store.removeSub(this.confirmDelSub.sid); this.confirmDelSub = null; } },
      delIdea(i) { this.confirmDelIdea = i; },
      confirmDeleteIdea() { if (this.confirmDelIdea) { this.$store.removeIdea(this.confirmDelIdea.idea_id); this.confirmDelIdea = null; } },
      doArchive() { this.confirmArchiveProj = true; },
      confirmArchiveProject() { this.$store.archiveProject(this.pid); this.confirmArchiveProj = false; },
      subPct(s) { return this.$store.subProgress(s); },
      isSubComplete(s) { return this.$store.isSubComplete(s); },
      toggleDone(s) { this.$store.toggleSubDone(s.sid); },
      // 工作流状态标签：已完成→「已完成」；否则展示其状态（进行中 / 自定义非完成状态）
      subStatusLabel(s) { return this.isSubComplete(s) ? '已完成' : (s.status || '进行中'); },
      // 工作流状态样式类：已完成→done；自定义非完成状态→custom；进行中→默认
      subStatusClass(s) {
        if (this.isSubComplete(s)) return 'done';
        return (s.status && s.status !== '进行中') ? 'custom' : '';
      },
      // —— 已花费时间：数值 / 文案 / 进度条宽度 ——
      spentMin(s) { return this.$store.subSpentMin(s); },
      spentText(s) { return this.$store.fmtSpent(this.spentMin(s)); },
      estMin(s) { return Number(s.estMin) || 0; },
      estText(s) { return this.$store.fmtSpent(this.estMin(s)); },
      // 有预计耗时 → 按 已花费/预计 占比；无预计耗时 → 按项目内最长耗时做相对刻度
      spentPct(s) {
        const sp = this.spentMin(s);
        if (sp <= 0) return 0;
        const est = this.estMin(s);
        if (est > 0) return Math.min(100, Math.round(sp / est * 100));
        return this.maxSpent > 0 ? Math.max(6, Math.round(sp / this.maxSpent * 100)) : 0;
      },
      // 超出预计耗时：进度条转暖色告警，仅提示不拦截
      isOverEst(s) { const est = this.estMin(s); return est > 0 && this.spentMin(s) > est; },

      showTimeBar(s) { return this.spentMin(s) > 0 || this.estMin(s) > 0; },

      isEmg(s) { return !!s.isEmergency && !this.$store.isSubComplete(s); },

      subRemain(s) { if (!s.sub_end) return null; return this.dayDiff(this.today, s.sub_end); },

      // - 从子任务/项目详情页返回（原路返回）时，恢复目标路由的滚动位置，避免「返回后跳到顶部」
      // - 常规 Tab 切换仍回到顶部：各 Tab 独立滚动位置，避免「统计滑到底、切回今日也到底」的串台问题
      route(newRoute, oldRoute) {
        this._scrollCache = this._scrollCache || {};
        if (oldRoute) this._scrollCache[oldRoute] = { win: window.scrollY || window.pageYOffset || 0 };
        this.$nextTick(() => {
          const isChildReturn = oldRoute && (oldRoute.indexOf('/subtask/') === 0 || oldRoute.indexOf('/project/') === 0);
          if (isChildReturn && this._scrollCache[newRoute]) {
            window.scrollTo(0, this._scrollCache[newRoute].win || 0);   // 原路返回：恢复进入子任务页时的滑动位置
          } else {
            const main = this.$el && this.$el.querySelector ? this.$el.querySelector('.app-main') : null;
            if (main) main.scrollTop = 0;          // 兜底：若 .app-main 本身是滚动容器

        if (this.overlayStack.length) {

      // 浮层栈：全屏输入 / 弹窗 打开时压入 dismiss；系统返回优先关闭顶层浮层，不导航路由
      pushOverlay(dismiss) { this.overlayStack.push(dismiss); },
      popOverlay(dismiss) {
        const i = this.overlayStack.lastIndexOf(dismiss);
        if (i >= 0) this.overlayStack.splice(i, 1);
      },
      // 返回键：按路由栈原路返回上一级页面（进入路径）；深链无历史时兜底回待归档
      back() {
        const target = (this.prevRoute && this.prevRoute !== this.route) ? this.prevRoute : '/inbox';
        location.hash = target;
      },
    },
    mounted() {
      window.addEventListener('hashchange', this.onHash);
      // 冷启动强制进入「今日」tab：移动端「退出 App 再进入」时，部分浏览器会恢复上次访问的
      // 哈希（如 #/projects）导致误入「项目」tab；这里统一把地址栏规范为 #/today 并切到今日，
      // 同时避免地址栏为空/残留哈希造成后续导航错位。
      if (location.hash.replace('#', '') !== '/today') {
        try { history.replaceState(null, '', '#/today'); } catch (_) {}
      }
      this.route = '/today';
    },
    beforeUnmount() { window.removeEventListener('hashchange', this.onHash); },
    template: `
    <div class="app-shell">
      <main class="app-main">
        <component :is="page" :pid="routePid" :tid="routeSubTid" />
      </main>

          <span class="nav-ico">{{ n.icon }}</span><span class="nav-txt">{{ n.label }}</span>
        </button>
      </nav>
      <QuickEntry />
    </div>`,
  };

  const app = createApp(App);
  // 全局注册项目编辑弹窗：C.StatsPage 在 C.ProjectEditModal 定义之前声明，
  // 其本地 components 注册捕获到 undefined；此处全局兜底，使归档仓库长按项目可正常打开编辑页
  app.component('ProjectEditModal', C.ProjectEditModal);
  app.config.globalProperties.$store = window.MPStore;
  app.config.globalProperties.$ai = window.MPAI;
  app.config.globalProperties.$catName = function (id) {
    if (!id) return '无分类';
    const c = window.MPStore.findCategory(id);
    return c ? c.name : '无分类';
  };
  // 标签友好展示：解析底层存储（_id 或编码串）为可读文本
  // 格式全站统一为「一级│二级│三级」，一律不带 # 前缀（例：书籍│文学、旅游）
  // 注意：录入框语法「#一级##二级」属于输入表示法，与此展示层无关，保持原样
  // 底层存储结构不变（_id 或 ##cat_xxx>name），仅展示层格式化，绝不直出原始编码
  function friendlyName(s) {
    if (!s) return '';
    let x = String(s).trim();
    const gt = x.lastIndexOf('>');
    if (gt >= 0) x = x.slice(gt + 1).trim(); // 编码串 "##cat_id>name" → 取末段名
    x = x.replace(/^#+/, '');                 // 去掉多余 # 前缀
    return x;
  }
  app.config.globalProperties.$catLabel = function (t) {
    if (!t) return '';
    let leaf = '';
    if (t.category_id) { const c = window.MPStore.findCategory(t.category_id); if (c) leaf = c.name; }
    if (!leaf && t.category) leaf = friendlyName(t.category);
    let parent = '';
    if (t.parent_category) {
      const c = window.MPStore.findCategory(t.parent_category);
      parent = c ? c.name : friendlyName(t.parent_category); // 兼容旧数据以名称存 parent_category
    }
    if (!leaf && !parent) return '';
    const l1 = parent || leaf;
    const l2 = parent ? leaf : '';
    if (l2) return l1 + '│' + l2;
    return l1; // 一级标签直出名称，不再拼接 # 前缀
  };
  // 多条标签：逐个格式化、空格分隔展示（兼容底层多标签编码串）
  app.config.globalProperties.$catTagList = function (t) {
    if (!t) return [];
    const out = [];
    if (t.category_id || t.parent_category) {
      // 新模型：parent_category + category_id 唯一表示一条（可能两级）标签
      const main = this.$catLabel(t);
      if (main) out.push(main);
    } else if (t.category) {
      // 后台/旧数据：category 字段可能是多条编码串（##id>name）空格分隔
      t.category.split(/\s+/).forEach(seg => {
        const nm = friendlyName(seg);
        if (nm) out.push(nm); // 单级同样直出名称，与多级「一级│二级」格式统一
      });
    }
    // 自动去重：重复 #标签只保留一个（卡片展示层统一保障）
    return Array.from(new Set(out));
  };
  /* ================== 进度记录同步信息 $progressSync ==================
   * 统一用于在「全部任务卡片」展示进度记录同步信息（📊）。
   * 规则：开启进度记录(progress_info.enable) 且 progress_value 非空时才返回文本；
   *       关闭进度记录 / 进度为空 → 返回 ''（卡片用 v-if 隐藏该行）。
   * 母本 / 副本 / 子任务 / 看板 共用同一判定，进度更新随响应式自动实时刷新。
   *
   * 展示格式：📊 进度已同步至：{progress_value}（{media_type}）
   *   - 必须携带填报时选择的进度单位（media_type）
   *   - progress_value 为本次填报的进度数值
   *   - 图标、文字、单位完整渲染，不可缺失单位、缺失前缀标识
   *   - 多次填报时仅展示最新一条同步文案（progress_value 本身即最新值）
   *   - 删除进度记录（progress_info.enable=false）后，条目同步移除该展示行 */
  app.config.globalProperties.$progressSync = function (t) {
    if (!t) return '';
    const pi = t.progress_info;
    if (!pi || !pi.enable) return '';
    const pv = (pi.progress_value || '').trim();
    if (!pv) return '';
    // 获取单位文案（media_type → 中文映射 + 自定义兜底）
    const UNIT_MAP = { book: '页码', drama: '集', course: '节', video: '集', pages: '页', hour: '小时' };
    const unitLabel = UNIT_MAP[pi.media_type] || pi.media_type || '';
    return '进度已同步至：' + pv + (unitLabel ? '（' + unitLabel + '）' : '');
  };
  /* ================== 归档仓库专用标签渲染 $archTagList ==================
   * 作用域严格限定：「统计页 · 全局已归档仓库」与「待归档页 · 各文件夹 📦已归档 折叠栏」。
   * 其余页面一律继续走 $catTagList，展示规则完全不变。
   * 归档态展示规则：
   *   ① 去掉 # 前缀，一级标签直出名称；
   *   ② 层级统一用「│」连接，最多呈现 一级│二级│三级；
   *   ③ 子任务的父任务名并入第三级，不再单列「↩ 父任务」归属标识；
   *   ④ 项目条目完整携带原有 tags，归档文件夹作为上层前缀；
   *   ⑤ 全部输出为绿色胶囊（模板侧统一 class="tag cat"）。
   * 仅格式化展示层，不改动任何底层分类/标签存储结构。 */
  app.config.globalProperties.$archTagList = function (t) {
    if (!t) return [];
    const S = window.MPStore;
    const clean = v => friendlyName(v).replace(/^#+/, '').trim();
    const join = arr => Array.from(new Set(arr.map(clean).filter(Boolean))).join('│');

    // —— 项目：tags 为扁平数组，逐条成链；有归档文件夹则作为一级前缀 ——
    if (t._type === 'project' || (t.pid && t.name !== undefined && t.title === undefined)) {
      let top = '';
      if (t.folder_id) {
        const f = (S.getFolders() || []).find(x => x.fid === t.folder_id);
        if (f) top = clean(f.name);
      }
      const tags = (t.tags || []).map(clean).filter(Boolean);
      if (!tags.length) return top ? [top] : [];
      return Array.from(new Set(tags.map(tg => (top && top !== tg ? top + '│' + tg : tg))));
    }

    // —— 任务 / 习惯 / 子任务：分类链（一级→二级…）——
    let chain = (S.categoryChainNames(t) || []).map(clean).filter(Boolean);
    // 旧数据兼容：parent_category 单独存一级，且叶子分类未挂 parent 时手动补齐
    if (t.parent_category) {
      const pc = S.findCategory(t.parent_category);
      const pn = clean(pc ? pc.name : t.parent_category);
      if (pn && chain.indexOf(pn) < 0) chain.unshift(pn);
    }
    // 更旧的数据：仅有 category 编码串，退回 $catLabel 结果再拆链
    if (!chain.length) {
      const legacy = this.$catLabel(t);
      if (legacy) chain = legacy.split('│').map(clean).filter(Boolean);
    }
    // 子任务：父任务名即第三级层级，替代原「↩ 父任务」独立标识
    const pt = clean(t.parentTitle || '');
    if (pt && chain.indexOf(pt) < 0) chain.push(pt);

    const label = join(chain);
    return label ? [label] : [];
  };
  // 父任务是否含子任务：用于父任务卡片淡黄底色判定（任意 Tab 统一）
  app.config.globalProperties.$hasSub = function (t) {
    return !!(t && (t.sub_tasks || []).length);
  };
  app.component('TodayPage', C.TodayPage);
  app.component('InboxPage', C.InboxPage);
  app.component('StatsPage', C.StatsPage);
  app.component('ProjectsPage', C.ProjectsPage);
  app.component('ProjectDetailPage', C.ProjectDetailPage);
  app.component('InboxSubPage', C.InboxSubPage);
  app.component('QuickEntry', C.QuickEntry);
  app.component('WishPool', C.WishPool);
  app.mount('#app');

  /* 全局拦截「长按呼出菜单 / 右键菜单」：保证手机端长按手势（编辑、详情、归档操作）
   * 与桌面端都不会被原生上下文菜单劫持，提升长按交互的准确与灵敏。
   * 表单输入控件（INPUT / TEXTAREA / contenteditable）放行，不影响正常文本操作。 */
  document.addEventListener('contextmenu', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    e.preventDefault();
  }, true);
})();

/* To Do —— PWA 安装脚本
 * 1) 注册 Service Worker（仅 https 或 localhost 生效，file:// 下静默跳过）
 * 2) 捕获 beforeinstallprompt，显示「安装到主屏幕」入口
 * 3) iOS 无自动安装事件，点击后给出手动引导
 * 4) 新版本 Service Worker 接管页面后自动刷新，确保用户立即看到最新内容 */
(function () {
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker
        .register('./sw.js', { updateViaCache: 'none' })
        .then(function (reg) {
          // 仅在检测到「新版本」时刷新一次，避免首次加载即刷新
          reg.addEventListener('updatefound', function () {
            var installing = reg.installing;
            installing.addEventListener('statechange', function () {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                location.reload();
              }
            });
          });
        })
        .catch(function () { /* 离线/非安全上下文忽略 */ });
    });
  }

  var deferred = null;
  var pill = document.getElementById('install-pill');

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    if (pill) pill.hidden = false;
  });

  if (pill) {
    if (isIOS) pill.hidden = false; // iOS 无法触发 prompt，常驻引导
    pill.addEventListener('click', function () {
      if (deferred) {
        deferred.prompt();
        deferred.userChoice.finally(function () { deferred = null; pill.hidden = true; });
      } else if (isIOS) {
        alert('iOS 安装：点击 Safari 底部「分享」按钮 ➜ 选择「添加到主屏幕」即可。');
      } else {
        alert('请通过浏览器菜单的「安装应用 / 添加到主屏幕」完成安装。');
      }
    });
  }

  window.addEventListener('appinstalled', function () { if (pill) pill.hidden = true; });
})();

  <script>
  /* ===== 云端代发客户端（P2+：突破 ntfy 3 天投递窗口） =====
   * 问题：ntfy.sh 免费服务只接受约 3 天内的定时消息，更远的提醒浏览器发不出去，
   *       必须等用户再次打开应用才能补排 —— 长期不开应用就会漏提醒。
   * 方案：浏览器把「超出投递窗口」的提醒写成清单上传到私有仓库，
   *       GitHub Actions 每 6 小时把即将到期的那批补投给 ntfy。
   *  - 浏览器是唯一真相源：清单里的 ts 由浏览器算好（含本地时区），后端只做哑投递，
   *    日期 / 周期规则永不出现第二份实现，从根上杜绝前后端漂移。
   *  - 凭据：细粒度 PAT（仅需 mindpocket-vaults 仓库 contents:write），在「云端代发」里单独填写。
   *  - 清单不含 ntfy 令牌；仓库为 PRIVATE。*/
  (function () {
    'use strict';
    var API = 'https://api.github.com';
    var DEFAULT_OWNER = '2384714466-collab';
    var DEFAULT_REPO = 'mindpocket-vaults';
    var LS_KEY = 'mindpocket:relay';
    var TTL_DAYS = 45; // 清单兜底有效期：长期不更新则由后端清理，避免废弃清单被永远投递

    function randHex(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
    // 轻量内容摘要：清单未变化时跳过上传，避免 15 分钟的定时重排造成 commit 洪水
    function digest(s) { var h = 5381, i = s.length; while (i) h = (h * 33) ^ s.charCodeAt(--i); return (h >>> 0).toString(36); }

    var MPRelay = {
      cfg: null,
      status: { enabled: false, count: 0, lastPush: 0, lastError: '', lastRun: 0, lastSent: 0, backendError: '' },
      _cb: null, _sha: {}, _lastDigest: '',

      onStatus: function (cb) { this._cb = cb; this._emit(); },
      _emit: function () { if (this._cb) this._cb(Object.assign({}, this.status)); },
      _set: function (p) { Object.assign(this.status, p); this._emit(); },

      load: function () {
        try { this.cfg = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { this.cfg = null; }
        if (!this.cfg) this.cfg = { enabled: false, token: '', owner: DEFAULT_OWNER, repo: DEFAULT_REPO, id: '' };
        if (!this.cfg.owner) this.cfg.owner = DEFAULT_OWNER;
        if (!this.cfg.repo) this.cfg.repo = DEFAULT_REPO;
        this.status.enabled = this.ready();
        return this.cfg;
      },
      save: function () { try { localStorage.setItem(LS_KEY, JSON.stringify(this.cfg)); } catch (e) {} this._set({ enabled: this.ready() }); },

      token: function () {
        if (this.cfg && this.cfg.token) return this.cfg.token;
        return '';
      },
      // 清单 ID 即保险库 ID，保证同一用户多设备写同一份清单（不会各写各的造成重复投递）
      vaultId: function () {
        if (this.cfg && this.cfg.id) return this.cfg.id;
        return '';
      },
      ready: function () { return !!(this.cfg && this.cfg.enabled && this.token() && this.vaultId()); },
      path: function (suffix) { return 'schedules/' + this.vaultId() + (suffix || '') + '.json'; },

      _api: function (method, file, body) {
        var url = API + '/repos/' + this.cfg.owner + '/' + this.cfg.repo + '/contents/' + encodeURIComponent(file);
        // cache:'no-store' 不能省：GitHub API 响应带 max-age，浏览器会缓存 GET 结果，
        // 导致读到陈旧的 sent.json，把后端已投递的提醒当成没投过而重复投一次。
        var opt = {
          method: method, cache: 'no-store',
          headers: { 'Authorization': 'Bearer ' + this.token(), 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
        };
        if (body) opt.body = JSON.stringify(body);
        return fetch(url, opt);
      },

      // 读取后端的投递记录：既拿到已投 mid（防重复投递），也拿到 last_run 心跳（判断后端死活）
      fetchSent: function () {
        var self = this;
        if (!this.ready()) return Promise.resolve(null);
        return this._api('GET', this.path('.sent')).then(function (r) {
          if (r.status === 404) { self._set({ lastRun: 0 }); return null; }
          if (!r.ok) throw new Error('sent ' + r.status);
          return r.json();
        }).then(function (meta) {
          if (!meta) return null;
          var txt = decodeURIComponent(escape(atob((meta.content || '').replace(/\s/g, ''))));
          var obj = JSON.parse(txt);
          self._sha['.sent'] = meta.sha;
          self._set({
            lastRun: Date.parse(obj.last_run || '') || 0,
            lastSent: obj.last_sent || 0,
            backendError: obj.last_error || '',
          });
          return obj;
        }).catch(function (e) { self._set({ lastError: '读取投递记录失败：' + e.message }); return null; });
      },

      pushSchedule: function (items, c, click) {
        var self = this;
        if (!this.ready()) return Promise.resolve(false);
        var server = (c && c.server || 'https://ntfy.sh').replace(/\/+$/, '');
        var topic = (c && c.topic) || '';
        var now = Date.now();
        var payload = {
          v: 1,
          updated: new Date(now).toISOString(),
          expires: new Date(now + TTL_DAYS * 86400000).toISOString(),
          server: server, topic: topic, click: click || '',
          items: items.map(function (j) { return { mid: j.mid, ts: j.ts, title: j.title || '提醒' }; }),
        };
        // 只对实质内容做摘要（不含 updated），内容没变就不写仓库
        var d = digest(JSON.stringify({ s: server, t: topic, i: payload.items }));
        if (d === this._lastDigest) { self._set({ count: payload.items.length }); return Promise.resolve(false); }

        var file = this.path('');
        var content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
        var put = function (sha) {
          var body = { message: 'relay: 更新提醒清单（' + payload.items.length + ' 条）', content: content, branch: 'main' };
          if (sha) body.sha = sha;
          return self._api('PUT', file, body);
        };
        return put(this._sha[''] || null).then(function (r) {
          // 409/422 = sha 过期（其它设备同时写过），重新取 sha 再试一次
          if (r.status === 409 || r.status === 422) {
            return self._api('GET', file).then(function (g) { return g.ok ? g.json() : null; })
              .then(function (meta) { return put(meta ? meta.sha : null); });
          }
          return r;
        }).then(function (r) {
          if (!r.ok) return r.text().then(function (t) { throw new Error(r.status + ' ' + t.slice(0, 120)); });
          return r.json();
        }).then(function (meta) {
          if (meta && meta.content) self._sha[''] = meta.content.sha;
          self._lastDigest = d;
          self._set({ count: payload.items.length, lastPush: Date.now(), lastError: '' });
          self.dispatch();
          return true;
        }).catch(function (e) { self._set({ lastError: String(e && e.message ? e.message : e) }); return false; });
      },

      // 触发后端立即跑一次：既即时补发，也顺带给仓库"续活"
      //（GitHub 会停用 60 天无活动仓库的定时任务，dispatch 事件可以避免这一点）
      dispatch: function () {
        if (!this.ready()) return;
        var url = API + '/repos/' + this.cfg.owner + '/' + this.cfg.repo + '/dispatches';
        fetch(url, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + this.token(), 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ event_type: 'mindpocket-relay' }),
        }).catch(function () {});
      },

      // 关闭代发时删除清单，否则后端会继续按旧清单投递
      remove: function () {
        var self = this;
        if (!this.token() || !this.vaultId()) return Promise.resolve();
        var file = this.path('');
        return this._api('GET', file).then(function (r) { return r.ok ? r.json() : null; }).then(function (meta) {
          if (!meta) return null;
          return self._api('DELETE', file, { message: 'relay: 关闭云端代发', sha: meta.sha, branch: 'main' });
        }).then(function () { self._sha = {}; self._lastDigest = ''; self._set({ count: 0 }); })
          .catch(function () {});
      },

      // 后端心跳是否新鲜：不新鲜说明 Actions 停了，此时浏览器要退回自催兜底
      backendAlive: function () {
        return !!(this.status.lastRun && (Date.now() - this.status.lastRun) < 12 * 3600 * 1000);
      },
    };

    (function () { MPRelay.load(); window.MPRelay = MPRelay; })();
  })();
  </script>
  <script>
  /* ===== 手机提醒推送引擎（P2：ntfy.sh 延迟消息，免费、iOS/安卓官方 App） =====
   * 原理：应用把每条未来提醒作为「延迟消息」POST 给 ntfy（Delay 头指定送达时刻），
   *       ntfy 在到点时把推送发到订阅该主题的设备 → 手机弹窗 + 铃声 + 震动。
   *  - 无需后端计算：浏览器在设置提醒 / 本地变更时即按需发布延迟消息（serverless 调度）。
   *  - 周期任务：枚举未来 30 天内的命中日，逐条发布；Message-ID 稳定，重复发布幂等。
   *  - ntfy 仅转发提醒标题，看不到完整数据；主题用随机串，不可猜测。*/
  (function () {
    'use strict';
    var HORIZON = 30;            // 扫描未来天数（超出投递窗口的只计数，不发送）
    var LS_KEY = 'mindpocket:notify:scheduled';
    var DEBOUNCE = 2000;
    var TICK = 15 * 60 * 1000;   // 定时重排：把刚进入投递窗口的提醒补发出去
    var MAX_PER_RUN = 60;        // 单轮最多发布条数，避免一次性刷爆服务端
    var MIN_LEAD_MS = 15000;     // ntfy 最小延迟约 10s，留 15s 余量
    var NUDGE_MAX_MS = 2.5 * 24 * 3600 * 1000; // 自催消息最远排到 2.5 天（留在 ntfy 3 天窗口内）
    var HEARTBEAT_FRESH_MS = 12 * 3600 * 1000; // 后端心跳新鲜度阈值

    function cfg() { return (window.MPStore && window.MPStore.state.settings.notify) || { enabled: false, server: 'https://ntfy.sh', topic: '', token: '' }; }
    function appUrl() {
      try {
        var u = new URL(location.href);
        if (window.MPRelay && window.MPRelay.cfg && window.MPRelay.cfg.id) u.searchParams.set('vault', window.MPRelay.cfg.id); else u.search = '';
        return u.toString();
      } catch (e) { return location.origin + location.pathname; }
    }
    function b64url(s) {
      return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    // 幂等表 v2：绑定「服务器+主题」签名（换主题自动作废重发），且只记录服务端确认成功的消息，
    // 失败的下一轮会自动重试（v1 是「先记账再发送」，一次失败即永久漏发，是本次没通知的元凶之一）
    function sigOf(c) { return (c.server || '') + '|' + (c.topic || ''); }
    function loadSet(sig) {
      try {
        var raw = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
        if (!raw || raw.v !== 2 || raw.sig !== sig) return [];
        return raw.items || [];
      } catch (e) { return []; }
    }
    function saveSet(sig, items) { try { localStorage.setItem(LS_KEY, JSON.stringify({ v: 2, sig: sig, items: items })); } catch (e) {} }

    var MPNotify = {
      status: { enabled: false, count: 0, added: 0, pending: 0, noDate: 0, failed: 0, lastScheduled: 0, lastError: '' },
      _cb: null, _timer: null, _deb: null, _running: null, _again: false, _bound: false,
      onStatus: function (cb) { this._cb = cb; this._emit(); },
      _emit: function () { if (this._cb) this._cb(Object.assign({}, this.status)); },
      _set: function (p) { Object.assign(this.status, p); this._emit(); },

      /* 以 JSON 形式 POST 到服务器根路径：
       *  - 不带任何自定义请求头 → 浏览器不触发 CORS 预检，令牌走 ?auth= 查询参数；
       *  - delay 必须是「Unix 秒 / 时长 / 自然语言」，ISO8601 会被 ntfy 判为 40004 直接丢弃。
       * 返回 Promise<{ok, reason, err}>，调用方据此决定记账与重试。 */
      publish: function (title, date, time, msgId, immediate, opts) {
        var c = cfg();
        if (!c.enabled) return Promise.resolve({ ok: false, reason: 'off' });
        if (!c.topic) return Promise.resolve({ ok: false, reason: 'off' });
        var when = null;
        if (!immediate) {
          when = new Date((date || '') + 'T' + (time || '09:00'));
          if (isNaN(when.getTime())) return Promise.resolve({ ok: false, reason: 'baddate' });
          if (when.getTime() <= Date.now() + MIN_LEAD_MS) return Promise.resolve({ ok: false, reason: 'past' });
        }
        var server = (c.server || 'https://ntfy.sh').replace(/\/+$/, '');
        var url = server + '/';
        if (c.token) { try { url += '?auth=' + b64url('Bearer ' + c.token); } catch (e) {} }
        var o = opts || {};
        var body = {
          topic: c.topic,
          title: o.title || (immediate ? '🔔 MindPocket' : ('⏰ ' + (title || '提醒'))),
          message: o.message || (immediate ? (title || '测试推送') : (((date || '') + ' ' + (time || '')).trim() + ' 提醒时间到')),
          tags: o.tags || ['alarm'],
          priority: o.priority || 4,
          click: appUrl(),
        };
        if (!immediate) body.delay = String(Math.floor(when.getTime() / 1000));
        return fetch(url, { method: 'POST', body: JSON.stringify(body) })
          .then(function (r) {
            return r.text().then(function (txt) {
              if (r.ok) return { ok: true };
              var code = 0; try { code = (JSON.parse(txt) || {}).code || 0; } catch (e) {}
              // 40006 = 延迟超出服务端上限（ntfy.sh 免费服务为 3 天）：不算失败，等进入窗口再发
              if (code === 40006) return { ok: false, reason: 'window' };
              return { ok: false, reason: 'http', err: 'ntfy ' + r.status + (txt ? ' ' + txt.slice(0, 120) : '') };
            });
          })
          .catch(function (e) { return { ok: false, reason: 'net', err: String(e && e.message ? e.message : e) }; });
      },

      scheduleAll: function () {
        var self = this;
        var c = cfg();
        if (!c.enabled || !c.topic) { this._set({ enabled: false }); return Promise.resolve(0); }
        if (this._running) { this._again = true; return this._running; }
        // 先取回后端的投递记录，再排程。这一步不能省：本地账本与后端 sent 互不可见时，
        // 远期提醒会被后端投一次、用户打开应用又投一次，手机响两次。
        this._running = (window.MPRelay ? window.MPRelay.fetchSent() : Promise.resolve(null))
          .catch(function () { return null; })   // 取不到就照常发：漏发比重复更糟
          .then(function (remoteSent) { return self._run(c, remoteSent); });
        return this._running;
      },

      _run: function (c, remoteSent) {
        var self = this;
        var U = window.MPStore.util; var today = U.todayStr(); var end = U.addDays(today, HORIZON);
        var sig = sigOf(c);
        var kept = loadSet(sig).filter(function (x) { return x.date >= today; });
        var seen = {}; kept.forEach(function (x) { seen[x.id] = true; });
        // 后端已代投的并入去重集合
        if (remoteSent && remoteSent.sent) Object.keys(remoteSent.sent).forEach(function (mid) { seen[mid] = true; });

        // 1) 汇总候选（本轮去重、剔除已过期），按时间升序，近的先发
        var jobs = [];
        function collect(id, date, time, title) {
          if (!date || date < today || date > end) return;
          var mid = 'mp-' + id + '-' + date + '-' + time;
          if (seen[mid]) return;
          seen[mid] = true;
          var ts = new Date(date + 'T' + (time || '09:00')).getTime();
          if (isNaN(ts) || ts <= Date.now() + MIN_LEAD_MS) return;
          jobs.push({ mid: mid, date: date, time: time, title: title, ts: ts });
        }
        var tasks = window.MPStore.state.tasks || [];
        var noDate = 0;
        for (var i = 0; i < tasks.length; i++) {
          var t = tasks[i]; if (t.is_archived) continue;
          if (t.enable_remind && t.remind_time) {
            if (t.cycle && t.cycle.type && t.cycle.type !== 'none') {
              var ds = today; while (ds <= end) { if (U.cycleHits(t.cycle, ds)) collect(t._id, ds, t.remind_time, t.title); ds = U.addDays(ds, 1); }
            } else {
              // 无执行日期时回落到区间起始日，避免「设了提醒却永远排不上」；仍无日期则计数提示用户
              var d0 = t.execute_date || t.date_start || '';
              if (d0) collect(t._id, d0, t.remind_time, t.title); else noDate++;
            }
          }
          var subs = t.sub_tasks || [];
          for (var j = 0; j < subs.length; j++) {
            var s = subs[j]; if (s.is_done) continue;
            if (s.sub_remind && s.sub_remind_time && s.sub_deadline) collect(t._id + ':' + s._id, s.sub_deadline, s.sub_remind_time, (t.title || '') + ' / ' + (s.title || ''));
          }
        }
        jobs.sort(function (a, b) { return a.ts - b.ts; });

        // 2) 顺序发布；一旦触到服务端延迟上限，后面（更远）的必然也超窗，直接留到下一轮。
        //    所有没发成功的（超窗 / 限流 / 网络失败）都收进 overflow 交给云端代发，
        //    否则 ntfy 抖动时这批提醒会就地蒸发。
        var overflow = [], failed = 0, lastErr = '', added = 0, idx = 0, windowFull = false;
        function step() {
          if (idx >= jobs.length) return Promise.resolve();
          if (windowFull || added >= MAX_PER_RUN) { while (idx < jobs.length) overflow.push(jobs[idx++]); return Promise.resolve(); }
          var j = jobs[idx++];
          return self.publish(j.title, j.date, j.time, j.mid, false).then(function (r) {
            if (r.ok) { kept.push({ id: j.mid, date: j.date }); added++; }
            else if (r.reason === 'window') { windowFull = true; overflow.push(j); }
            else if (r.reason === 'http' || r.reason === 'net') { failed++; lastErr = r.err || '推送失败'; overflow.push(j); }
            return step();
          });
        }
        return step().then(function () {
          // 3) 超窗部分交给云端代发；未配置代发时排一条自催消息兜底
          var relayed = false;
          if (window.MPRelay && window.MPRelay.ready()) {
            relayed = true;
            window.MPRelay.pushSchedule(overflow, c, appUrl());
          }
          // 必须等自催消息发完再落盘：否则它的幂等记录写在 saveSet 之后，
          // 永远进不了本地账本，每轮排程都会重发一次自催。
          return self._nudge(overflow, kept, seen).then(function () {
            saveSet(sig, kept);
            self._set({
              enabled: true, count: kept.length, added: added, pending: overflow.length,
              noDate: noDate, failed: failed, lastScheduled: Date.now(), relayed: relayed,
              lastError: failed ? lastErr : '',
            });
            self._running = null;
            if (self._again) { self._again = false; return self.scheduleAll(); }
            return added;
          });
        });
      },

      /* 自催兜底：有提醒因超出 ntfy 投递窗口而没发出去时，排一条低优先级消息
       * 提醒用户打开应用续排。这是没配云端代发时唯一的保险，也是代发挂掉后的最后防线。
       * 时刻取「2.5 天后」与「最早未投提醒前 1 小时」的较早者，mid 按小时取整保证幂等。*/
      _nudge: function (overflow, kept, seen) {
        if (!overflow.length) return Promise.resolve();
        if (window.MPRelay && window.MPRelay.ready() && window.MPRelay.backendAlive()) return Promise.resolve(); // 后端还活着，无需打扰
        var target = Math.min(Date.now() + NUDGE_MAX_MS, overflow[0].ts - 3600000);
        if (target <= Date.now() + MIN_LEAD_MS) return Promise.resolve();
        var d = new Date(target), p2 = function (n) { return ('0' + n).slice(-2); };
        var date = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
        var time = p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
        var mid = 'mp-nudge-' + Math.floor(target / 3600000);
        if (seen[mid]) return Promise.resolve();
        seen[mid] = true;
        // 返回 Promise（await 后才落盘），确保幂等记录进本地账本，避免每轮重发。
        return this.publish('打开 MindPocket 续排提醒', date, time, mid, false, {
          title: '📮 MindPocket',
          message: '还有 ' + overflow.length + ' 条提醒排在更远的日期，打开应用即可续排',
          priority: 2,
        }).then(function (r) { if (r.ok) kept.push({ id: mid, date: date }); });
      },

      testPush: function () {
        var c = cfg(); if (!c.enabled) { this._set({ lastError: '请先启用提醒推送' }); return; }
        var self = this;
        if (!c.topic) { this._set({ lastError: '请先填写 ntfy 主题' }); return; }
        this.publish('这是一条测试提醒（应立即送达）', null, null, 'mp-test-' + Date.now(), true)
          .then(function (r) { self._set({ lastError: r.ok ? '' : (r.err || '推送失败') }); });
      },

      // 定时链路自检：60 秒后由服务端投递，用来验证「关闭应用也能准时收到」
      testDelayed: function (sec) {
        var c = cfg(); if (!c.enabled) { this._set({ lastError: '请先启用提醒推送' }); return; }
        var self = this;
        if (!c.topic) { this._set({ lastError: '请先填写 ntfy 主题' }); return; }
        var d = new Date(Date.now() + (sec || 60) * 1000);
        var p2 = function (n) { return ('0' + n).slice(-2); };
        var date = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
        var time = p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
        this.publish('定时推送自检', date, time, 'mp-testdelay-' + Date.now(), false)
          .then(function (r) { self._set({ lastError: r.ok ? '' : (r.err || '定时推送被服务端拒绝') }); });
      },

      onChange: function () {
        if (!cfg().enabled) return;
        var self = this;
        if (this._deb) clearTimeout(this._deb);
        this._deb = setTimeout(function () { self.scheduleAll(); }, DEBOUNCE);
      },

      init: function () {
        var c = cfg();
        var ready = c.enabled && c.topic;
        if (ready) {
          this.scheduleAll();
          if (!this._timer) this._timer = setInterval(function () { MPNotify.scheduleAll(); }, TICK);
          this._set({ enabled: true });
        } else this._set({ enabled: false });
        if (!this._bound) {
          this._bound = true;
          // 回到前台 / 网络恢复时补排：把已进入投递窗口、或上一轮失败的提醒重新发出去
          document.addEventListener('visibilitychange', function () { if (!document.hidden) MPNotify.onChange(); });
          window.addEventListener('online', function () { MPNotify.onChange(); });
        }
      },
    };

    (function () { window.MPNotify = MPNotify; MPNotify.init(); })();
  })();
  </script>

</body>
