            if (ka !== kb) return ka < kb ? -1 : ka > kb ? 1 : 0;
          }
          const ra = this.$store.remindMinutes(a.data), rb = this.$store.remindMinutes(b.data);
          if (ra !== rb) return ra - rb;
          const ka = this.$store.copyDateKey(a.data, d), kb = this.$store.copyDateKey(b.data, d);
          return ka < kb ? -1 : ka > kb ? 1 : 0;
        });
        return list;
      },

      /* ==================================================================
       * 今日待办 A/B 分区（按「是否配置提醒时间」拆分，数据源同为 mergedDateItems）
       * A 区 = 带提醒时间 → 复用统计页纵向时间线 UI（.tl-panel/.tl-list/.tl-item/.tl-axis）
       * B 区 = 无提醒时间 → 沿用原有任务条目样式（.list/.row.task-row/SubTaskCopyCard）
       * ================================================================== */
      // A 区条目（带提醒时间的主任务 + 子任务副本）
      timedItems() { return this.mergedDateItems.filter(it => this.hasRemindTime(it.data)); },
      // B 区条目（未配置提醒时间的主任务 + 子任务副本）
      untimedItems() { return this.mergedDateItems.filter(it => !this.hasRemindTime(it.data)); },
      // A 区时间轴节点：以「提醒时刻」聚合，同一时刻下堆叠多条父/子任务；节点按时刻升序
      timedGroups() {
        const map = new Map();
        this.timedItems.forEach(it => {
          const k = String(it.data.remind_time || it.data.sub_remind_time || '').slice(0, 5);
          if (!map.has(k)) map.set(k, []);
          map.get(k).push(it);   // 组内维持 mergedDateItems 原顺序（紧急置顶）
        });
        const toMin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : Infinity; };
        return Array.from(map.keys()).sort((a, b) => toMin(a) - toMin(b)).map(k => ({ time: k, items: map.get(k) }));
      },

      /* ==================================================================
       * 本周 / 本月待办折叠模块
       * 本周 = 当前 ISO 周内「指定周」类型主/子任务副本
       * 本月 = 当前月份「仅年月」类型主/子任务副本
       * 周期副本、自定义区间副本沿用旧版看板显示约束，不进入这两张卡片
       * ================================================================== */
      // 本周窗口（ISO 周起止日，用于副本完成态判定与滑动打卡窗口）
      weekWin() {
        const U = this.$store.util;
        const w = U.isoWeek(U.parseDate(this.today));
        const r = U.weekRange(w.year, w.week);
        const ymd = d => d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
        const f = d => (d.getUTCMonth() + 1) + '/' + d.getUTCDate();
        return { y: w.year, w: w.week, ws: ymd(r.start), we: ymd(r.end), label: '本周 · ' + w.year + ' 年第 ' + w.week + ' 周（' + f(r.start) + '-' + f(r.end) + '）' };
      },
      // 本月窗口（自然月起止日）
      monthWin() {
        const now = new Date(); const y = now.getFullYear(), m = now.getMonth() + 1;
        const pad = n => String(n).padStart(2, '0');
        return { y, m, ws: y + '-' + pad(m) + '-01', we: y + '-' + pad(m) + '-' + pad(new Date(y, m, 0).getDate()), label: '本月 · ' + y + ' 年 ' + m + ' 月' };
      },
      // 本周待办：「指定周」类型（week_offset=本周 或 plan_year/plan_week 命中当前周）的主任务 + 子任务副本
      weekPlanItems() {
        const S = this.$store, win = this.weekWin;
        const ok = t => {
          if (!t || t.is_archived) return false;
          if (S.isCollectionTask(t)) return false;                      // 收藏夹任务不参与副本同步
          if (t.cycle) return false;                                     // 周期副本沿用旧版看板约束，不进本周卡片
          if (t.date_mode === 'range' && t.date_start) return false;     // 自定义区间副本同上
          if (t.time_mode !== 'week') return false;                      // 仅「指定周」类型
          if (S.classifyMode(t) !== 'week') return false;
          if (S.copyDoneForWindow(t, win.ws, win.we)) return false;      // 本条已完成 → 该副本消失，母本不受影响
          if (t.cycle_end_date && win.ws > t.cycle_end_date) return false;
          if (t.week_offset != null) return t.week_offset === 0;         // 本周 / 下周 / 下下周 → 仅取本周
          return t.plan_year === win.y && t.plan_week === win.w;
        };
        const tasks = (S.state.tasks || []).filter(ok).map(t => ({ type: 'task', data: t, _key: 'wt' + t._id }));
        const subs = S.getBoardSubTasks().filter(s => s._isSub && ok(s)).map(s => ({ type: 'sub', data: s, _key: 'ws' + s._id }));
        return this.sortPlanItems(tasks.concat(subs));
      },
      // 本月待办：「仅年月」类型（plan_year/plan_month 命中当前月、无具体执行日/区间）的主任务 + 子任务副本
      monthPlanItems() {
        const S = this.$store, win = this.monthWin;
        const ok = t => {
          if (!t || t.is_archived) return false;
          if (S.isCollectionTask(t)) return false;
          if (t.cycle) return false;                                     // 周期副本不进本月卡片
          if (t.date_mode === 'range' && t.date_start) return false;     // 区间副本不进本月卡片
          if (t.execute_date) return false;                              // 「仅年月」= 无具体执行日
          if (t.time_mode !== 'month') return false;
          if (S.classifyMode(t) !== 'month') return false;
          if (S.copyDoneForWindow(t, win.ws, win.we)) return false;
          if (t.cycle_end_date && win.ws > t.cycle_end_date) return false;
          return t.plan_year === win.y && t.plan_month === win.m;
        };
        const tasks = (S.state.tasks || []).filter(ok).map(t => ({ type: 'task', data: t, _key: 'mt' + t._id }));
        const subs = S.getBoardSubTasks().filter(s => s._isSub && ok(s)).map(s => ({ type: 'sub', data: s, _key: 'ms' + s._id }));
        return this.sortPlanItems(tasks.concat(subs));
      },
      // 本周 / 本月两张折叠卡片的统一描述（同一套模板渲染，避免重复控件）
      planBlocks() {
        return [
          { key: 'week', icon: '📆', win: this.weekWin, items: this.weekPlanItems, inWeek: true, empty: '本周暂无「指定周」待办' },
          { key: 'month', icon: '📅', win: this.monthWin, items: this.monthPlanItems, inWeek: false, empty: '本月暂无「仅年月」待办' },
        ];
      },
      // 养成手牌：按「计划执行时间」排序（有时间：由早到晚；无时间：统一排末尾）；相对顺序稳定
      sopHabits() {
        const list = this.$store.state.habits.filter(h => h.type === 'SOP_HABIT' && !h.is_archived);
        const toMin = s => {
          if (!s) return null;
          const p = String(s).split(':');
          if (p.length < 2) return null;
          const m = (+p[0]) * 60 + (+p[1]);
          return isNaN(m) ? null : m;
        };
        return list.slice().sort((a, b) => {
          const ta = toMin(a.plan_time), tb = toMin(b.plan_time);
          if (ta === null && tb === null) return 0;   // 都无时间：保持原序
          if (ta === null) return 1;                   // a 无时间 -> 靠后
          if (tb === null) return -1;                  // b 无时间 -> 靠后
          return ta - tb;                              // 有时间：由早到晚
        });
      },
      recordHabits() { return this.$store.state.habits.filter(h => h.type === 'RECORD_HABIT' && !h.is_archived); },
      quitHabits() { return this.$store.state.habits.filter(h => h.type === 'QUIT_HABIT' && !h.is_archived); },
      quickViewTasks() { return this.$store.getQuickViewTasks(); },
    },
    methods: {
      // 全局标准时间标签（仅展示文本，浅绿色）
      timeLabel(t) { return this.$store.formatTimeLabel(t); },
      // 习惯 / 闲趣随机卡 区块折叠：切换 tab 重新挂载即回到默认折叠态（与统计页 toggleCol 同款）
      toggleCol(key) { if (!this.collapsed.hasOwnProperty(key)) return; this.collapsed = { ...this.collapsed, [key]: !this.collapsed[key] }; },
      weekLabel(t) { return this.$store.weekLabel(t); },
      cap(t) { return this.$store.capsuleOf(t, { isCopy: true, windowStart: this.today, windowEnd: this.today }); },
      // 合并区块任务胶囊：按选中日期投射（与日期切换联动），临时任务仍用 cap(t)
      capOn(t) { return this.$store.capsuleOf(t, { isCopy: true, windowStart: this.selectedDate, windowEnd: this.selectedDate }); },
      // 本周 / 本月区块胶囊：按所在周期窗口投射（沿用看板副本口径）
      capWin(t, win) { return this.$store.capsuleOf(t, { isCopy: true, windowStart: win.ws, windowEnd: win.we }); },
      // 是否配置了提醒时间（主/子任务双字段兼容）—— 今日待办 A/B 分区的唯一判定依据
      hasRemindTime(x) { return !!(x && (x.enable_remind || x.sub_remind)) && !!(x.remind_time || x.sub_remind_time); },
      // 本周 / 本月区块排序：紧急置顶 → 提醒时间升序（无提醒后置） → 标题稳定序
      sortPlanItems(list) {
        return list.slice().sort((a, b) => {
          const ea = a.data.isEmergency ? 0 : 1, eb = b.data.isEmergency ? 0 : 1;
          if (ea !== eb) return ea - eb;
          const ra = this.$store.remindMinutes(a.data), rb = this.$store.remindMinutes(b.data);
          if (ra !== rb) return ra - rb;
          return String(a.data.title || '').localeCompare(String(b.data.title || ''));
        });
      },
      // 合并区块日期切换：上一日 / 下一日（仅刷新本区块任务）
      prevDay() { this.selectedDate = this.$store.util.addDays(this.selectedDate, -1); },
      nextDay() { this.selectedDate = this.$store.util.addDays(this.selectedDate, 1); },
      // 一键回到今日：复位选中日期为本日（当前非今日时按钮可点）
      backToToday() { this.selectedDate = this.today; },
      // 习惯网格：读取今日打卡状态
      statusOf(h) { const r = this.$store.getHabitRecord(h._id, this.today); return r ? r.status : null; },
      // 记录型习惯今日是否已打卡（普通打卡记 record，阅读习惯同步/跳过记 success）
      isRecordDone(h) { return this.statusOf(h) != null; },
      // 单击：记录型直接打卡（阅读习惯弹同步弹窗）；戒掉型记录破戒；已打卡再单击 = 直接撤销
      onHabitTap(h) {
        const st = this.statusOf(h);
        // 已打卡：记录型习惯撤销需二次确认；其余类型（戒掉型等）直接撤销，保持原交互
        if (st) {
          // 已打卡：记录型 / 戒掉型 撤销均需二次确认；其余类型（如养成型重复打卡）直接撤销，保持原交互
          if (h.type === 'RECORD_HABIT' || h.type === 'QUIT_HABIT') { this.pendingUndo = h._id; return; }
          this.$store.removeHabitRecord(h._id, this.today); return;
        }
        if (h.type === 'RECORD_HABIT') {
          if (this.$store.isReadingHabit(h._id)) {
            // 阅读习惯特例：弹出阅读进度同步弹窗；无书籍任务则直接完成
            if (this.$store.requestReadingSync(h._id, this.today)) {
              this.pendingReading = { habitId: h._id, date: this.today, books: this.$store.getBookTasks() };
            } else {
              this.$store.markHabitRecord(h._id, this.today, 'success');
            }
            return;
          }
          this.$store.markHabitRecord(h._id, this.today, 'record'); // 直接打卡，无数值弹窗
        } else if (h.type === 'QUIT_HABIT') {
          this.$store.markHabitRecord(h._id, this.today, 'fail', '破戒'); // 破戒
        } else {
          this.$store.markHabitRecord(h._id, this.today, 'success');
        }
      },
      confirmUndo() {
        if (this.pendingUndo) this.$store.removeHabitRecord(this.pendingUndo, this.today);
        this.pendingUndo = null;
      },
      // 网格按钮手势：长按唤起编辑，单击打卡/撤销
      habitDown(e, h) {
        this.pressId = h._id; this.startX = e.clientX; this.startY = e.clientY;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        this.moved = false; this.longFired = false; this.suppressClick = false;
        if (this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; }
        // 长按触发延时降到 350ms，提升识别灵敏度（整张卡片区域均已绑定 pointerdown）
        this.pressTimer = setTimeout(() => {
          this.longFired = true; this.suppressClick = true;
          this.openEdit(h._id);
          this.pressId = null;
        }, 350);
      },
      habitMove(e) {
        if (this.pressId === null) return;
        const dx = e.clientX - this.startX, dy = e.clientY - this.startY;
        // 防误触：轻微滑动（<30px）仍判定为长按；滑动过大则取消长按、交予页面滚动
        if (Math.hypot(dx, dy) > 30 && this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; this.moved = true; }
      },
      habitUp(e, h) {
        if (this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; }
        if (this.longFired) { this.resetPress(); return; }
        if (this.moved) this.suppressClick = true;
        const fire = !this.suppressClick;
        this.resetPress();
        if (fire) this.onHabitTap(h);
      },
      resetPress() { this.pressId = null; this.longFired = false; this.moved = false; this.suppressClick = false; },
      archive(t) { this.$store.archiveTask(t._id); },
      undo(t) { this.$store.setArchived(t._id, null, false); },
      isArchived(t) { return t.cycle ? this.$store.cycleArchivedToday(t, this.selectedDate) : t.is_archived; },
      openEdit(id) { this.editHabitId = id; this.showHabitEdit = true; },
      // 习惯模块统一「＋新增习惯」：先选类型，再进入对应表单
      openAddType() { this.showTypeChoose = true; },
      // 今日待办右上角【＋添加】：唤起新增待办弹窗
      openTaskAdd() { this.showTaskAdd = true; },
      // 一键「设紧急 / 取消紧急」：仅翻转 isEmergency 标记，原执行时间 / 周期 / 提醒配置全部保持不变
      toggleEmergency(t) { this.$store.toggleEmergency(t._id); },
      // 日计划任务 → 退回周计划（清除日期，变为当前周任务，回到周看板对应分组）
      canBackToWeek(t) { return !t.cycle && !this.isArchived(t) && this.$store.classifyMode(t) === 'day'; },
      backToWeek(t) { this.$store.backToWeek(t._id); },
      onChooseType(t) {
        this.showTypeChoose = false;
        this.addType = t; this.editHabitId = null; this.showHabitEdit = true;
      },
      // —— 滑动手势：与待归档页 / HandCards 方向定义统一 ——
      // 左滑 = 标记已完成（归档）；右滑 = 标记未完成（今日项→移出今日回待归档池；临时任务→转普通任务回待归档池）；长按 = 详情
      // 全局互斥锁：动画与数据同步期间禁止重复触发，防止快速连续滑动导致手势卡死
      // win（可选）：本周 / 本月区块传入所在周期窗口 { ws, we }；今日区块不传，回落 selectedDate
      rowDown(e, t, win) {
        // 点击紧急置顶按钮时不触发滑动/长按手势
        if (e.target.closest('.row-emg-btn')) return;
        // 获取互斥锁（失败则忽略本次手势，防止快速连续操作堆积）
        if (!this.$store.swipeLock('today_' + t._id)) return;
        this.dragWin = win || null;
        this.dragId = t._id; this.startX = e.clientX; this.dragX = 0;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        this.dragging = true; this.moved = false; this.longFired = false; this.suppressClick = false;
        if (this.longTimer) { clearTimeout(this.longTimer); this.longTimer = null; }
        this.longTimer = setTimeout(() => {
          // 长按触发前检查锁是否仍有效
          if (this.dragId !== t._id) return;
          this.longFired = true; this.suppressClick = true; this.detailId = t._id;
          this.dragId = null; this.dragging = false; this.dragX = 0;
          this.$store.swipeUnlock('today_' + t._id);
        }, 450);
      },
      rowMove(e, t) {
        if (this.dragId !== t._id) return;
        this.dragX = e.clientX - this.startX;
        if (Math.abs(this.dragX) > this.$store.SWIPE_ACTIVATE_PX && this.longTimer) { clearTimeout(this.longTimer); this.longTimer = null; this.moved = true; }
      },
      rowUp(e, t) {
        if (this.dragId !== t._id) { this.$store.swipeUnlock('today_' + t._id); return; }
        if (this.longTimer) { clearTimeout(this.longTimer); this.longTimer = null; }
        const dx = this.dragX;
        const win = this.dragWin; this.dragWin = null;
        this.dragging = false; this.dragId = null; this.dragX = 0;
        if (this.longFired) { this.$store.swipeUnlock('today_' + t._id); return; }
        if (this.moved) this.suppressClick = true;
        const TH = this.$store.SWIPE_TRIGGER_PX;
        if (dx < -TH) this.markDone(t, win);          // 左滑 = 标记已完成
        else if (dx > TH) this.markUndone(t, win);    // 右滑 = 标记未完成
        // 操作完成后释放锁（同步操作立即释放，异步操作在回调中释放）
        if (Math.abs(dx) <= TH) this.$store.swipeUnlock('today_' + t._id);
      },
      onRowClick(t) {
        if (this.suppressClick) { this.suppressClick = false; return; }
        // 父任务（含子任务，今日页淡黄色底色条目）：单击进入全屏子任务页（与待归档列表保持一致）
        if (this.$hasSub(t)) { location.hash = '#/subtask/' + t._id; return; }
        // 其余（无子任务主任务 / 临时任务）：单击打开详情弹窗，维持原交互
        this.detailId = t._id;
      },
      // 今日页任务均为「副本视图」：周期 / 区间任务打开详情时按副本处理（允许直接改周期结束日 / 区间起止日，终止周期仅母本视图可操作）
      isCopyTask(id) {
        const t = id ? this.$store.findTask(id) : null;
        return !!(t && (t.cycle || (t.date_mode === 'range' && t.date_start)));
      },
      rowStyle(t) {
        if (this.dragId !== t._id) return {};
        const dx = this.dragX;
        const TH = this.$store.SWIPE_TRIGGER_PX;
        let bg = 'transparent';
        if (dx < -TH) bg = 'rgba(46,204,113,0.15)';
        else if (dx > TH) bg = 'rgba(231,76,60,0.15)';
        return { transform: `translateX(${dx}px)`, transition: this.dragging ? 'none' : 'transform .18s ease', background: bg };
      },
      markDone(t, win) {
        // 状态校验：过滤无效请求（已归档/子任务副本走 SubTaskCopyCard）
        if (!t || t.is_archived || t._isSub) { this.$store.swipeUnlock('today_' + (t ? t._id : '')); return; }
        if (t.category_id === this.$store.getQuickViewCatId()) { this.$store.archiveTask(t._id); this.$store.swipeUnlock('today_' + t._id); return; }
        // 副本卡片：仅标记本条完成（今日=选中日窗口，本周/本月=所在周期窗口），绝不归档母本
        const ws = (win && win.ws) || this.selectedDate, we = (win && win.we) || this.selectedDate;
        this.$store.markCopyDone(t._id, ws, we);
        this.$store.swipeUnlock('today_' + t._id);
      },
      markUndone(t, win) {
        if (!t || t._isSub) { this.$store.swipeUnlock('today_' + (t ? t._id : '')); return; }
        if (t.category_id === this.$store.getQuickViewCatId()) { this.$store.setArchived(t._id, null, false); this.$store.swipeUnlock('today_' + t._id); return; }
        const ws = (win && win.ws) || this.selectedDate, we = (win && win.we) || this.selectedDate;
        this.$store.markCopyUndone(t._id, ws, we);
        this.$store.swipeUnlock('today_' + t._id);
      },
      // 任务是否逾期（单点过期日 / 区间结束日已过 / 周期该次出现已过期且未打卡）→ 标记「延期未完成」
      isOverdue(t) {
        // 单点 / 区间：执行日期或结束日已早于当前视图日期 → 延期未完成
        if (this.$store.isOverdueTask(t, this.selectedDate)) return true;
        // 周期：仅当「当前视图日期」对应的那一次出现已过期（早于今天）且未打卡，才标记延期未完成
        // 未到来的出现日不挂延期标签（按副本执行日期校验，修复每周周期副本默认挂载延期）
        if (t.cycle) {
          const d = this.selectedDate, today = this.$store.util.todayStr();
          return d < today && !this.$store.cycleArchivedToday(t, d);
        }
        return false;
      },
      // —— 阅读习惯打卡 → 书籍进度同步 ——
      onReadingSync({ habitId, date }) {
        this.pendingReading = { habitId, date, books: this.$store.getBookTasks() };
      },

        if (!this.pendingReading) return;

      onSubUnarchive(subId, parentId, ws, we) { this.$store.subCopyUndone(parentId, subId, ws || this.selectedDate, we || this.selectedDate); },

    },

  /* =====================================================================
   * CategoryManageModal —— 分类管理（系统分类不可删，可改名）
   * ===================================================================== */
  C.CategoryManageModal = {
    name: 'CategoryManageModal',
    // 第 3 层模块 2：支持一级 + 二级双层分类管理
    data() {
      return {
        newName: '', subName: '', dragId: null,
        expanded: {},          // 一级 _id -> 是否展开二级
        addingSubFor: null,    // 正在为某一级添加二级时的一级 _id
        confirmDelCat: null,   // 删除分类二次确认目标
      };
    },
    computed: {
      categories() { return this.$store.state.categories; },
      // 仅一级分类（parent 为空）
      topCats() { return this.categories.filter(c => !c.parent); },
      quickToQuickView() { return this.$store.state.settings.quickToQuickView; },
      autoExtend() { return this.$store.state.settings.autoExtend; },
    },
    methods: {
      subs(pid) { return this.categories.filter(c => c.parent === pid); },
      toggle(pid) { this.$set(this.expanded, pid, !this.expanded[pid]); },
      rename(c, e) { this.$store.updateCategory(c._id, e.target.value); },
      del(c) {
        if (c.is_system) return;
        this.confirmDelCat = c;
      },
      confirmDeleteCat() {
        if (!this.confirmDelCat) return;
        this.$store.deleteCategory(this.confirmDelCat._id);
        this.confirmDelCat = null;
      },
      add() { if (!this.newName.trim()) return; this.$store.addCategory(this.newName.trim()); this.newName = ''; },
      startAddSub(pid) { this.addingSubFor = pid; this.subName = ''; },
      addSub(pid) {
        if (!this.subName.trim()) return;
        this.$store.addCategory(this.subName.trim(), pid);
        this.subName = ''; this.addingSubFor = null;
        this.$set(this.expanded, pid, true);
      },
      setQuick(v) { this.$store.setQuickToQuickView(v); },
      setAuto(v) { this.$store.setAutoExtend(v); },
      reorder(toId) {
        if (!this.dragId || this.dragId === toId) return;
        const ids = this.categories.map(c => c._id);
        const from = ids.indexOf(this.dragId), to = ids.indexOf(toId);
        if (from < 0 || to < 0) return;
        ids.splice(to, 0, ids.splice(from, 1)[0]);
        this.$store.setCategoriesOrder(ids);
        this.dragId = null;
      },
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal">
        <div class="modal-head"><h3>分类管理（一级 / 二级）</h3><button class="x" @click="$emit('close')">✕</button></div>
        <div class="modal-body">
          <label class="fld check switch"><input type="checkbox" :checked="quickToQuickView" @change="setQuick($event.target.checked)" /> 奇想自动归入临时任务</label>
          <label class="fld check switch"><input type="checkbox" :checked="autoExtend" @change="setAuto($event.target.checked)" /> 过期任务自动延期</label>
          <div class="cat-manage" v-for="c in topCats" :key="c._id" draggable="true"
               @dragstart="dragId=c._id" @dragover.prevent @drop="reorder(c._id)">
            <span class="drag">⠿</span>
            <input :value="c.name" @change="rename(c,$event)" :class="{sys:c.is_system}" />
            <span class="cat-tag">{{ c.is_system ? '系统' : '一级' }}</span>
            <button class="btn-mini" v-if="!c.is_system" @click="toggle(c._id)">{{ expanded[c._id] ? '收起' : '二级' }}</button>
            <button class="btn-mini" v-if="!c.is_system" @click="startAddSub(c._id)">＋子</button>
            <button class="btn-mini danger" v-if="!c.is_system" @click="del(c)">删</button>
            <button class="btn-mini" v-else disabled>删</button>
          </div>
          <!-- 二级子分类 -->
          <div class="sub-cat" v-for="c in topCats" :key="'s'+c._id" v-if="expanded[c._id]">
            <div class="sub-cat-row" v-for="s in subs(c._id)" :key="s._id">
              <span class="sub-drag">└</span>
              <input :value="s.name" @change="rename(s,$event)" />
              <button class="btn-mini danger" @click="del(s)">删</button>
            </div>
            <div class="sub-add" v-if="addingSubFor===c._id">
              <input v-model="subName" @keyup.enter="addSub(c._id)" placeholder="二级分类名" />
              <button class="btn-mini" @click="addSub(c._id)">确定</button>
            </div>
          </div>
          <div class="cat-add">
            <input v-model="newName" @keyup.enter="add" placeholder="新增一级分类名称" />
            <button class="btn" @click="add">＋ 新增一级</button>
          </div>
          <p class="tip">拖动 ⠿ 调整一级顺序；每个一级可展开管理二级（仅两级，禁止三级）；临时任务为系统分类不可删</p>
        </div>
      </div>
      <!-- 删除分类二次确认（居中圆角样式） -->
      <div class="chart-confirm" v-if="confirmDelCat" @click.self="confirmDelCat=null">
        <div class="idea-choice-box" @click.stop>
          <div class="idea-choice-title">{{ confirmDelCat.parent ? ('确定要删除二级分类「' + confirmDelCat.name + '」？') : ('确定要删除一级分类「' + confirmDelCat.name + '」？') }}</div>
          <p style="font-size:13px;color:var(--sub);margin:0 0 12px">{{ confirmDelCat.parent ? '其下任务将退回一级分类' : '其下二级与任务将变为无分类' }}</p>
          <div class="modal-actions">
            <button class="btn ghost" @click="confirmDelCat=null">取消</button>
            <button class="btn danger" @click="confirmDeleteCat">确定删除</button>
          </div>
        </div>
      </div>
    </div>`,
  };

  /* =====================================================================
   * CategoryEditModal —— 标签编辑详情页（重命名 / 排序 / 新增 / 删除）
   * 交互：长按标签打开；底部 取消 / 保存 / 删除 三键；删除走二次确认
   * ===================================================================== */
  C.CategoryEditModal = {
    name: 'CategoryEditModal',
    props: { catId: { type: String, required: true }, folder: { type: String, default: '' } },
    data() {
      const c = this.$store.state.categories.find(x => x._id === this.catId) || { name: '', parent: null, is_system: false };
      return { name: c.name || '', isSys: !!c.is_system, parent: c.parent || null, showChoice: false, showTarget: false, showConfirm: false, showReparent: false };
    },
    computed: {
      cat() { return this.$store.state.categories.find(x => x._id === this.catId) || null; },
      // 层级深度：沿 parent 向上步数（L1=0, L2=1, L3=2+）
      catDepth() {
        let d = 0, c = this.cat;
        while (c && c.parent) { d++; c = this.$store.state.categories.find(x => x._id === c.parent); }
        return d;
      },
      isL1() { return this.catDepth === 0; },
      isL2() { return this.catDepth === 1; },
      isL3() { return this.catDepth >= 2; },
      // L2 的直属一级标签 id（迁移目标）
      parentL1Id() { return this.cat ? (this.cat.parent || null) : null; },
      // L1「迁移至其他文件夹」候选：同文件夹域内、其它一级标签（排除自身与系统分类）
      otherFolders() {
        const selfFolder = this.folder || this.$store.folderOfCat(this.catId);
        return this.$store.state.categories.filter(c =>
          !c.parent && !c.is_system && c._id !== this.catId && this.$store.catInFolder(c._id, selfFolder)
        );
      },
    },
    methods: {
      save() {
        const n = this.name.trim();
        if (!n) { alert('请填写标签名称'); return; }
        // 同文件夹（同 parent 分组）内不允许完全同名的一级/同级标签（精确、区分大小写）
        const folder = this.folder || this.$store.folderOfCat(this.catId);
        if (this.$store.dupeNameInFolder(n, this.parent, folder, this.catId)) {
          alert('当前文件夹已存在同名标签，请修改名称');
          return;
        }
        this.$store.updateCategory(this.catId, n);
        this.$emit('close');
      },
      // 排序：在同级（同 parent）内上移 / 下移
      move(up) {
        const cats = this.$store.state.categories;
        const ids = cats.map(c => c._id);
        const i = ids.indexOf(this.catId);
        if (i < 0) return;
        const myParent = cats[i].parent || null;
        let j = -1;
        if (up) { for (let k = i - 1; k >= 0; k--) { if ((cats[k].parent || null) === myParent) { j = k; break; } } }
        else { for (let k = i + 1; k < cats.length; k++) { if ((cats[k].parent || null) === myParent) { j = k; break; } } }
        if (j < 0) return;
        ids.splice(j, 0, ids.splice(i, 1)[0]);
        this.$store.setCategoriesOrder(ids);
      },
      // 删除入口：L1/L2 先弹选项弹窗；L3 直接弹二次确认弹窗（无选项弹窗）
      askDel() {
        if (this.isL3) { this.showConfirm = true; }
        else { this.showChoice = true; }
      },
      closeDel() { this.showChoice = false; this.showTarget = false; this.showConfirm = false; this.showReparent = false; },
      // 选项弹窗 → 迁移（直接执行，无需二次确认）
      migrateToUncat() { this.$store.migrateCategoryTasks(this.catId, null); this.$emit('close'); },
      migrateToParent() { this.$store.migrateCategoryTasks(this.catId, this.parentL1Id); this.$emit('close'); },
      migrateToOther() { this.showTarget = true; },
      pickTarget(id) { this.$store.migrateCategoryTasks(this.catId, id); this.$emit('close'); },
      // 一级标签 → 降级为另一个一级标签的二级子标签（保留子树与任务归属）
      reparentToOther() { this.showReparent = true; },
      pickReparent(id) { this.$store.reParentCategory(this.catId, id); this.$emit('close'); },
      // 选项弹窗 → 批量删除任务（追加二次确认）
      toBatchDelete() { this.showChoice = false; this.showConfirm = true; },
      // 二次确认 → 执行删除（不可逆）
      confirmDelete() { this.$store.batchDeleteCategoryTasks(this.catId); this.$emit('close'); },
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal">
        <div class="modal-head"><h3>编辑标签</h3><button class="x" @click="$emit('close')">✕</button></div>
        <div class="modal-body">
          <label class="fld">名称<input v-model="name" @keyup.enter="save" placeholder="标签名称" :class="{sys:isSys}" :disabled="isSys" /></label>
          <p class="tip" v-if="isSys">系统分类不可改名 / 删除，仅可调整顺序。</p>
          <div class="fld-row">
            <span class="fld-label">排序</span>
            <button class="btn-mini" @click="move(true)">↑ 上移</button>
            <button class="btn-mini" @click="move(false)">↓ 下移</button>
          </div>
        <div class="modal-actions">
          <button class="btn danger" v-if="!isSys" @click="askDel">删除</button>
          <button class="btn ghost" @click="$emit('close')">取消</button>
          <button class="btn primary" @click="save">保存</button>
        </div>
        </div>
        <!-- 删除一级/二级标签：先弹选项弹窗（三选一） -->
        <div class="chart-confirm" v-if="showChoice" @click.self="closeDel">
          <div class="idea-choice-box" @click.stop>
            <div class="idea-choice-title">删除标签「{{ name }}」</div>
            <p style="font-size:13px;color:var(--sub);margin:0 0 10px">{{ isL2 ? '其下任务将迁移或一并删除' : '其下二级与任务将迁移或一并删除' }}</p>
            <template v-if="isL1">
              <button class="choice-btn" :disabled="!otherFolders.length" @click="migrateToOther">迁移至其他文件夹</button>
              <button class="choice-btn" :disabled="!otherFolders.length" @click="reparentToOther">转为其他一级标签的子标签（二级）</button>
              <button class="choice-btn alt" @click="migrateToUncat">迁移至未分类</button>
              <button class="choice-btn danger" @click="toBatchDelete">批量删除任务</button>
            </template>
            <template v-else>
              <button class="choice-btn" @click="migrateToParent">迁移至直属一级标签</button>
              <button class="choice-btn alt" @click="migrateToUncat">迁移至未分类</button>
              <button class="choice-btn danger" @click="toBatchDelete">批量删除任务</button>
            </template>
            <button class="choice-cancel" @click="closeDel">取消</button>
          </div>
        </div>
        <!-- 迁移至其他文件夹：选择目标一级标签 -->
        <div class="chart-confirm" v-if="showTarget" @click.self="closeDel">
          <div class="idea-choice-box" @click.stop>
            <div class="idea-choice-title">迁移「{{ name }}」至</div>
            <div class="proj-move-list">
              <button v-for="f in otherFolders" :key="f._id" @click="pickTarget(f._id)">📁 {{ f.name }}</button>
            </div>
            <button class="choice-cancel" @click="showTarget=false;showChoice=true">返回</button>
          </div>
        </div>
        <!-- 转为其他一级标签的二级子标签：选择目标一级标签 -->
        <div class="chart-confirm" v-if="showReparent" @click.self="closeDel">
          <div class="idea-choice-box" @click.stop>
            <div class="idea-choice-title">将「{{ name }}」转为以下一级标签的子标签（二级）</div>
            <div class="proj-move-list">
              <button v-for="f in otherFolders" :key="f._id" @click="pickReparent(f._id)">📁 {{ f.name }}</button>
            </div>
            <button class="choice-cancel" @click="showReparent=false;showChoice=true">返回</button>
          </div>
        </div>
        <!-- 二次确认（批量删除任务 / 三级标签删除）：删除不可逆 -->
        <div class="chart-confirm" v-if="showConfirm" @click.self="closeDel">
          <div class="idea-choice-box" @click.stop>
            <div class="idea-choice-title">确定要删除标签「{{ name }}」及其全部任务？</div>
            <p style="font-size:13px;color:var(--sub);margin:0 0 12px">此操作不可撤销，标签与下属任务将永久删除。</p>
            <div class="modal-actions">
              <button class="btn ghost" @click="closeDel">取消</button>
              <button class="btn danger" @click="confirmDelete">确定删除</button>
            </div>
          </div>
        </div>
      </div>
    </div>`,
  };

  /* =====================================================================
   * AiTaskPreviewModal —— AI 自然语言解析结果预览（绝不自动写库）
   * 表单字段与任务详情【高级设置】面板保持完全对齐
   * ===================================================================== */
  C.AiTaskPreviewModal = {
    name: 'AiTaskPreviewModal',
    // 第 3 层模块 1：批量解析预览。items = 解析后的结构化候选数组；truncated = 是否超出 50 条上限
    // 分支逻辑（需求）：
    //   识别 = 1 条 → 复用 TaskFormCore 弹出完整可编辑详情（含全部高级设置），AI 解析标题/描述/标签/时间/地点，无法识别默认空白
    //   识别 > 1 条 → 简化批量编辑视图：列表[复选框 + 任务文字 + 删除叉号]；下方新增任务输入 + 归属标签输入
    //               批量任务统一存入待归档 Tab（顶层任务），按归属标签打标；所有高级设置默认空白，后续可在待归档长按编辑
    props: { items: { type: Array, required: true }, truncated: { type: Boolean, default: false } },
    components: { TaskFormCore: C.TaskFormCore },
    data() {
      // 单条 AI 任务默认归入「任务夹」；多条（>1）默认归入「收藏夹」（需求规则）
      const defFolder = this.items.length === 1 ? 'task' : 'collection';
      // 仅单条模式才用自然语言解析标签/日期/描述等；批量（>1）模式 AI 只识别名称，避免误带标签与产生空分类
      const isSingle = this.items.length === 1;
      // 每条初始化为 TaskFormCore 所需的完整草稿形状（缺省字段安全兜底），勾选态默认全选
      const drafts = this.items.map((it) => {
        const cy = it.cycle ? (typeof it.cycle === 'string' ? { type: it.cycle, rule: '' } : it.cycle) : null;
        // 标签预览：仅单条模式解析（优先用 AI 返回的 tags 链，否则按 category_id 兜底）；批量模式不解析
        let parsedTags = [], tagInput = '', hasLevel3 = false, level3Chain = null;
        let category_id = it.category_id || null, parent_category = it.parent_category || '';
        if (isSingle && it.tags) {
          const pr = window.MPStore.parseTagString(it.tags, defFolder === 'collection');
          parsedTags = pr.parsed; tagInput = it.tags;
          category_id = pr.category_id; parent_category = pr.parent_category;
          hasLevel3 = pr.hasLevel3; level3Chain = pr.level3Chain;
        } else if (isSingle && it.category_id) {
          const cat = (window.MPStore.state.categories || []).find(x => x._id === it.category_id);
          if (cat) { parsedTags = [{ l1: { _id: cat._id, name: cat.name }, l2: null }]; tagInput = '#' + cat.name; }
        }
        // 名称来源：批量(>1)模式直接采用原始输入行（raw），不剥离时间/地点词块；
        //          单条模式沿用 AI 提炼后的核心标题（it.title）
        const rawTitle = (it.raw || it.title || '').trim();
        const aiTitle = (it.title || '').trim();
        return {
          title: (isSingle ? aiTitle : rawTitle) || '未命名任务',
          desc: it.desc || '',
          material_notes: it.material_notes || '',
          material_link: it.material_link || '',
          parent_category, category_id,
          isHabit: !!it.isHabit,
          folderType: defFolder, tagInput, parsedTags, hasLevel3, level3Chain,
          date_mode: it.date_mode || (it.date_start ? 'range' : (it.execute_date ? 'day' : '')),
          week_offset: (it.week_offset != null) ? it.week_offset : null,
          plan_year: it.plan_year || null, plan_month: it.plan_month || '', execute_date: it.execute_date || null, date_start: it.date_start || '', date_end: it.date_end || '',
          enable_remind: !!(it.remind || it.enable_remind),
          remind_time: it.remind_time || '',
          cycle: cy,
          progress_info: it.progress_info ? JSON.parse(JSON.stringify(it.progress_info)) : { enable: false, media_type: 'book', progress_value: '' },
          isEmergency: !!it.isEmergency, // 紧急标记：默认不勾选
        };
      });
      const checked = drafts.map(() => true);
      return { drafts, checked, folderType: defFolder, newTitle: '', batchTagInput: '', batchParsedTags: [], batchLevel3Chain: null };
    },
    // 浮层栈：作为弹窗登记 dismiss，系统返回优先关闭本弹窗（返回来源页，不改写路由）
    created() {
      this._overlayDismiss = () => this.$emit('close');
      this.$root.pushOverlay(this._overlayDismiss);
    },
    beforeUnmount() {
      if (this._overlayDismiss) { this.$root.popOverlay(this._overlayDismiss); this._overlayDismiss = null; }
    },
    computed: {
      single() { return this.items.length === 1; },
      selectedCount() { return this.drafts.filter((_, i) => this.checked[i]).length; },
    },
    methods: {
      selectAll(v) { this.drafts.forEach((_, i) => this.checked[i] = v); },
      // 多条：列表内删除某条（drafts 与 checked 同步下标收缩）
      removeItem(i) { this.drafts.splice(i, 1); this.checked.splice(i, 1); },
      // 多条：列表下方「新增任务」输入框 → 追加一条
      addNew() {
        const t = (this.newTitle || '').trim();
        if (!t) return;
        this.drafts.push({ title: t });
        this.checked.push(true);
        this.newTitle = '';
      },
      // 归属标签解析（#一级 ##二级 ###三级）：统一委托 Store.parseTagString（解析模块独立封装，所有录入入口共用，行为一致）
      parseBatchTags() {
        const text = (this.batchTagInput || '').trim();
        if (!text) { this.batchParsedTags = []; this.batchLevel3Chain = null; return; }
        const pr = this.$store.parseTagString(text, false);
        this.batchParsedTags = pr.parsed;
        this.batchLevel3Chain = pr.level3Chain;
      },
      // 单条：完整可编辑详情确认 → 在待归档生成 1 条（含全部高级设置）
      confirmSingle() {
        const U = this.$store.util;
        const d = this.drafts[0];
        if (!d.title.trim()) { alert('请填写标题'); return; }
        const c = d.cycle;
        if (c && (c.type === 'week' || c.type === 'month')) {
          const r = U.parseCycleRule(c.rule || '', c.type);
          if (!r.ok) { alert('周期规则有误：' + r.error); return; }
        }
        let cycle = d.cycle || null;
        if (cycle && (cycle.type === 'week' || cycle.type === 'month')) cycle = Object.assign({}, cycle, { rule: U.normalizeCycleRule(cycle.rule) });
        const fields = Object.assign(dateFieldsFromDraft(d), {
          title: d.title.trim(),
          desc: d.desc || '',
          material_notes: d.material_notes || '',
          material_link: d.material_link || '',
          category_id: d.category_id || null,
          parent_category: d.parent_category || '',
          is_template: d.folderType === 'template',
          is_collection: d.folderType === 'collection',
          enable_remind: !!d.enable_remind,
          remind_time: d.remind_time || '',
          cycle: cycle,
          cycle_end_date: d.cycle_end_date || '',
          progress_info: d.progress_info,
          isEmergency: !!d.isEmergency,
        });
        // 每日 → 转为习惯（RECORD_HABIT）；忽略周期 / 三级标签
        if (d.isHabit) {
          const h = this.$store.convertTaskToHabit({
            title: d.title.trim(), desc: d.desc || '',
            enable_remind: !!d.enable_remind, remind_time: d.remind_time || '09:00',
          }, null);
          this.$emit('confirm', [h._id]);
          return;
        }
        if (d.hasLevel3 && d.level3Chain) {
          const r = this.$store.addTaskUnderLevel3(fields, d.level3Chain);
          this.$emit('confirm', [r.parentId]);
        } else {
          const t = this.$store.addTask(fields);
          this.$emit('confirm', [t._id]);
        }
      },
      // 多条：批量确认 → 在待归档生成顶层任务（或三级标签下绑定父任务的子任务）
      // 需求：识别条数 > 1 时，AI 仅识别「任务名称」，绝不带入自然语言解析出的
      //       日期 / 提醒时间 / 描述 / 标签 / 周期 / 紧急等高级设置。
      //       仅保留用户手动填写的「批量归属标签」（batchCat/batchParent），其余一律留空。
      confirmBatch() {
        const chain = this.batchLevel3Chain || null;
        const last = this.batchParsedTags[this.batchParsedTags.length - 1];
        // 批量归属标签（可选，仅用户手动填写）：用户填了则作为统一标签；否则无标签
        const batchParent = chain ? (chain.l1 ? chain.l1._id : '') : (last && last.l2 ? last.l1._id : '');
        const batchCat = chain ? (chain.l2 ? chain.l2._id : chain.l1._id) : (last ? (last.l2 ? last.l2._id : last.l1._id) : null);
        const created = [];
        this.drafts.forEach((d, i) => {
          if (!this.checked[i]) return;
          const title = (d.title || '').trim();
          if (!title) return;
          // 批量（>1）模式：AI 只识别名称，丢弃全部 AI 派生的高级设置，仅保留手动批量标签
          const fields = {
            title,
            desc: '',
            material_notes: '',
            material_link: '',
            category_id: batchCat || null,
            parent_category: batchParent || '',
            is_template: this.folderType === 'template',
            is_collection: this.folderType === 'collection',
            enable_remind: false,
            remind_time: '',
            cycle: null,
            cycle_end_date: '',
            progress_info: { enable: false, media_type: 'book', progress_value: '' },
            isEmergency: false,
            date_mode: 'single', plan_year: null, plan_month: null, plan_week: null,
            execute_date: null, date_start: '', date_end: '', week_offset: null, time_mode: null,
          };
          if (chain) {
            const r = this.$store.addTaskUnderLevel3(fields, chain);
            created.push(r.parentId);
          } else {
            const t = this.$store.addTask(fields);
            created.push(t._id);
          }
        });
        this.$emit('confirm', created);
      },
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal modal-lg">
        <div class="modal-head"><h3>{{ single ? 'AI 解析预览' : 'AI 解析预览（已识别 ' + items.length + ' 条）' }}</h3><button class="x" @click="$emit('close')">✕</button></div>
        <div class="modal-body">
          <p class="tip" v-if="truncated">⚠️ 内容过多，已解析前 50 条内容；如需更多请分批解析。</p>

          <!-- 单条：完整可编辑详情（含全部高级设置） -->
          <div v-if="single" class="ai-single">
            <TaskFormCore :draft="drafts[0]" />
            <div class="modal-actions">
              <button class="btn ghost" @click="$emit('close')">取消</button>
              <button class="btn primary" @click="confirmSingle">生成任务</button>
            </div>
          </div>

          <!-- 多条：简化批量编辑视图 -->
          <template v-else>
            <p class="tip">勾选要生成的条目，确认后在待归档主页生成独立任务（高级设置默认空白，可后续在待归档长按编辑）。</p>
            <div class="batch-bar">
              <label class="fld check"><input type="checkbox" :checked="selectedCount===drafts.length" @change="selectAll($event.target.checked)" /> 全选（{{ selectedCount }}/{{ drafts.length }}）</label>
            </div>
            <div class="ai-batch-list">
              <div class="row ai-batch-row" v-for="(d,i) in drafts" :key="i">
                <label class="ai-check"><input type="checkbox" v-model="checked[i]" /></label>
                <div class="row-main"><input class="ai-batch-text" v-model="d.title" placeholder="任务内容" /></div>
                <button class="icon-btn" @click="removeItem(i)" title="删除">✕</button>
              </div>
            </div>
            <div class="ai-batch-add">
              <div class="fld" style="flex:1;margin-bottom:0"><input v-model="newTitle" @keyup.enter="addNew" placeholder="新增任务…" /></div>
              <button class="icon-btn" @click="addNew" title="新增">＋</button>
            </div>
            <div class="ai-batch-folder">
              <label class="fld"><span class="lbl">👉 归属文件夹</span>
                <select v-model="folderType" class="folder-select">
                  <option value="task">任务夹</option>
                  <option value="collection">收藏夹</option>
                  <option value="template">模版夹</option>
                </select>
              </label>
            </div>
            <div class="ai-batch-tag">
              <div class="fld" style="margin-bottom:4px"><input v-model="batchTagInput" @blur="parseBatchTags" @keyup.enter="parseBatchTags" placeholder="归属标签（#一级 ##二级，空格分隔；批量任务统一打该标签）" /></div>
              <div class="tag-edit" v-if="batchParsedTags.length">
                <span class="ptag" v-for="(p,idx) in batchParsedTags" :key="idx">#{{ p.l1.name }}<template v-if="p.l2"> ##{{ p.l2.name }}</template></span>
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn ghost" @click="$emit('close')">取消</button>
              <button class="btn primary" @click="confirmBatch">生成 {{ selectedCount }} 条任务</button>
            </div>
          </template>
        </div>
      </div>
    </div>`,

  /* =====================================================================

  C.InboxPage = {

        // —— 标签筛选（思维导图式展开/收起；默认收起，不持久化） ——

        folderView: 'task',      // 默认进入即选中第一个文件夹（任务夹），不再展示全部任务
        uncatOpen: false,        // 「未分类」分组是否展开（无一级标签的任务，移除全部任务视图后仍需可见）
        subExpand: {},           // 二级分类 _id -> 是否展开
        catEditId: null,         // 标签编辑详情页目标分类

        _catTimer: null, _catLong: false,

    },
    computed: {
      categories() { return this.$store.state.categories; },
      // 收藏夹一级：仅取 parent===null 的顶层收藏分类（含 is_collection 标记或四大固定名）。
      // 关键修复：不要把带 is_collection 的「二级/三级」分类当成顶层一级，避免其在树中

      collectionCats() { return this.$store.state.categories.filter(c => !c.parent && (c.is_collection || ['好物', '影片', '书籍', '旅游'].indexOf(c.name) >= 0)); },
      // 第 3 层模块 2：一级 / 二级分类
      topCats() { return this.categories.filter(c => !c.parent); },
      curYear() { return new Date().getFullYear(); },
      // 先按分类筛选（支持一级/二级：二级筛选其自身，一级筛选该一级及其下所有二级）
      list() { return this.$store.getInboxTasks(this.activeCat); },
      active() { return this.list.filter(t => !t.is_archived && this.matchMode(t)); },
      // 当前文件夹内的已归档任务（每个文件夹独立一份，按 folderView 范围过滤；用于底部「📦已归档」折叠栏）
      folderArchived() {
        if (!this.folderView) return [];
        return (this.$store.state.tasks || []).filter(t => t.is_archived && this.inScope(t, this.folderView) && this.matchMode(t));
      },
      // 当前文件夹内的「已归档子任务」：扁平化所有父子任务中 is_archived 的子任务，携带父任务信息以支持溯源
      // 与子任务页【📦已归档子任务】共用同一份 inline 数据（sub_tasks[].is_archived），天然双向同步；范围与 folderArchived 一致（按 folderView + 模式）
      folderArchivedSubs() {

      // 第 4 层：看板任务池（只含带执行日期/区间、未归档的任务；已归档、无日期隐藏）
      boardTasks() {
        // 看板任务池：仅含归类为「月计划 / 周计划」的未归档任务

        const today = this.$store.util.todayStr();
        const list = (this.$store.state.tasks || []).filter(t => {
          if (t.is_archived) return false;
          if (this.isCollection(t)) return false; // 收藏夹任务不参与看板副本同步
          if (t.cycle) return false; // 周期类任务（母本 + 副本）禁止进入周/月看板（仅【今日Tab】/【习惯】展示）
          if (t.date_mode === 'range' && t.date_start) return false; // 非周期自定义区间任务副本禁止进入周/月看板（仅【今日Tab】展示）
          const cm = this.$store.classifyMode(t);
          if (cm === 'month') return !!(t.plan_year && t.plan_month); // 仅年月 → 月看板
          if (cm === 'week') {
            if (t.time_mode === 'week') return !!(t.plan_year && t.plan_week) || (t.week_offset != null); // 指定周（本周/下周/下下周）进周看板
            return !!(t.execute_date || t.date_start); // 单点 / 区间（非周期）→ 周看板
          }
          return false;
        });
        // 同源并入「带时间的子任务副本」（月/周计划），与父任务共用母本数据
        // （周期 / 区间任务母本及其子副本已在 getBoardSubTasks 内排除；普通带时间子任务按父任务日期体系同步）
        // 合并后整体按紧急置顶排序（与今日Tab口径一致）：紧急（父任务 + 子副本）统一排到各组最前
        return list.concat(this.$store.getBoardSubTasks())
          .slice().sort((a, b) => (b.isEmergency ? 1 : 0) - (a.isEmergency ? 1 : 0));
      },
      // 月看板分组（固定窗口：最近连续 6 个月 = 本月 + 其后 5 个月；随时间自动前滚；即使无任务也保留该月条目）
      boardMonthGroups() {
        const now = new Date(); const gs = [];
        for (let off = 0; off < 6; off++) {
          const d = new Date(now.getFullYear(), now.getMonth() + off, 1);
          const y = d.getFullYear(), m = d.getMonth() + 1;
          const ws = y + '-' + String(m).padStart(2, '0') + '-01';
          const we = y + '-' + String(m).padStart(2, '0') + '-' + String(new Date(y, m, 0).getDate()).padStart(2, '0');
          gs.push({
            key: y + '-' + m, y, m,
            ws, we,
            label: y + ' 年 ' + m + ' 月' + (off === 0 ? '（本月）' : off === 1 ? '（下月）' : '（下' + off + '月）'),
            tasks: this.boardTasks.filter(t => {
              if (this.$store.classifyMode(t) !== 'month') return false;
              if (this.$store.copyDoneForWindow(t, ws, we)) return false; // 副本「本条完成」后该副本消失，其余副本/母本不变
              // 子任务自身 cycle_end_date 约束：月份窗口完全在结束日之后则不展示
              if (t.cycle_end_date && ws > t.cycle_end_date) return false;
              // 每月周期（初/末/指定日）：命中所属月任意一天即在该月展示（覆盖固定窗口 6 个月；大小月/2月自动适配）
              if (t.cycle && t.cycle.type === 'month') {
                const pad = n => String(n).padStart(2, '0');
                const last = new Date(y, m, 0).getDate();
                // 用统一解析器展开候选日：0=月末、区间 3-5=3/4/5、零散数字；覆盖区间与月末（大小月/2月自动适配）
                const r = this.$store.util.parseCycleRule(t.cycle.rule || '', 'month');
                const days = new Set([1, last]);
                if (r.ok) for (const n of r.nums) { if (n === 0) days.add(last); else if (n >= 1 && n <= last) days.add(n); }
                for (const dd of days) if (this.$store.util.cycleHits(t.cycle, y + '-' + pad(m) + '-' + pad(dd))) return true;
                return false;
              }
              return t.plan_year === y && t.plan_month === m;
            }).sort((a, b) => {
              // 紧急置顶：紧急任务统一排到分组最前（无视日期/周期）；取消紧急后立即按原时间顺序复位
              const ea = a.isEmergency ? 0 : 1, eb = b.isEmergency ? 0 : 1;
              if (ea !== eb) return ea - eb;
              return (this.hasConcreteAnchor(a) ? 0 : 1) - (this.hasConcreteAnchor(b) ? 0 : 1);
            }),
          });
        }
        return gs;
      },
      // 周看板分组（固定窗口：最近连续 3 周 = 本周 + 其后 2 周；随时间自动前滚；即使无任务也保留该周条目）
      boardWeekGroups() {
        const U = this.$store.util; const base = U.parseDate(U.todayStr()); const gs = [];
        const ymd = d => d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
        for (let i = 0; i < 3; i++) {
          const d = new Date(base); d.setDate(d.getDate() + i * 7);
          const w = U.isoWeek(d); const key = w.year + '-' + w.week;
          const r = U.weekRange(w.year, w.week);
          const rs = ymd(r.start), re = ymd(r.end);
          const f = dd => (dd.getUTCMonth() + 1) + '/' + dd.getUTCDate();
          gs.push({
            key, y: w.year, w: w.week,
            ws: rs, we: re,
            label: (i === 0 ? '本周 · ' : i === 1 ? '下周 · ' : '下下周 · ') + w.year + ' 年第 ' + w.week + ' 周（' + f(r.start) + '-' + f(r.end) + '）',
            tasks: this.boardTasks.filter(t => {
              if (this.$store.classifyMode(t) !== 'week') return false;
              if (this.$store.copyDoneForWindow(t, rs, re)) return false; // 副本「本条完成」后该副本消失，其余副本/母本不变
              // 子任务自身 cycle_end_date 约束：周窗口完全在结束日之后则不展示
              if (t.cycle_end_date && rs > t.cycle_end_date) return false;
              // 指定周（本周/下周/下下周）：不绑定具体日期，按 week_offset 归入对应周分组（0→本周 / 1→下周 / 2→下下周）
              if (t.week_offset != null) return i === t.week_offset;
              // 每周(cycleType==='week')/间隔(interval)周期：命中该周任意一天即归入此周分组（自动收纳所有每周任务；覆盖固定窗口 3 周）
              if (t.cycle && (t.cycle.type === 'week' || t.cycle.type === 'interval')) {
                const pad = n => String(n).padStart(2, '0');
                const r = U.weekRange(w.year, w.week);
                for (let i = 0; i < 7; i++) {
                  const dd = new Date(r.start); dd.setUTCDate(dd.getUTCDate() + i);
                  const ds = dd.getUTCFullYear() + '-' + pad(dd.getUTCMonth() + 1) + '-' + pad(dd.getUTCDate());
                  if (this.$store.util.cycleHits(t.cycle, ds)) return true;
                }
                return false;
              }
              if (t.time_mode === 'week') return t.plan_year === w.year && t.plan_week === w.week;
              // 自动周任务：单点按执行日 ISO 周；区间按与本周相交
              if (t.date_mode === 'single' && t.execute_date) {
                const rw = U.isoWeek(t.execute_date); return rw.year === w.year && rw.week === w.week;
              }
              if (t.date_mode === 'range' && t.date_start) {
                if (!t.date_end) return t.date_start <= re;        // 无结束日：开始日之后无限
                return !(t.date_end < rs || t.date_start > re);    // 相交则本周出现（跨周重复）
              }
              return false;
            }).sort((a, b) => {
              // 紧急置顶：紧急任务统一排到分组最前（无视日期/周期）；取消紧急后立即按原时间顺序复位
              const ea = a.isEmergency ? 0 : 1, eb = b.isEmergency ? 0 : 1;
              if (ea !== eb) return ea - eb;
              // 仅指定周（本周/下周/下下周）：无精确日期，整体置后（已按 week_offset 归入对应周分组末尾）
              const ca = this.hasConcreteAnchor(a) ? 0 : 1;
              const cb = this.hasConcreteAnchor(b) ? 0 : 1;
              if (ca !== cb) return ca - cb;
              // 带具体日期任务：统一优先级 = 提醒时间升序(无提醒后置) → 任务日期由早到晚
              const ra = this.$store.remindMinutes(a), rb = this.$store.remindMinutes(b);
              if (ra !== rb) return ra - rb;
              const ka = this.$store.weekDateKey(a, rs, re), kb = this.$store.weekDateKey(b, rs, re);
              return ka < kb ? -1 : ka > kb ? 1 : 0;
            }),
          });
        }
        return gs;
      },
      // —— 三文件夹视图：任务夹 / 收藏夹 / 模版夹 ——
      folderName() { return ({ task: '任务夹', collection: '收藏夹', template: '模版夹' })[this.folderView] || ''; },
      folderScopeTasks() {
        if (!this.folderView) return [];
        // 母本常驻规则：任务夹/收藏夹/模版夹展示的是「母本」而非当日副本，
        // 因此任意副本打卡都不应让母本消失 —— 仅「手动归档 / 自动归档（全部副本完成）/ 删除」才移出列表。
        // 副本的逐日隐藏由今日页 taskCopyVisibleOnDate 独立负责，二者互不干扰。
        return (this.$store.state.tasks || []).filter(t => {
          if (t.is_archived) return false;
          return this.inScope(t, this.folderView);
        });
      },
      // 一级标签（仅展示本文件夹范围内、含在册任务的一级分类）
      folderTopCats() {
        if (!this.folderView) return [];
        if (this.folderView === 'collection') {
          // 收藏夹任务可能引用「普通一级分类」（如悬浮球 AI 批量归属标签创建的标签，未必带 is_collection 标记）；
          // 只要被任一收藏夹任务引用，就作为一级分组展示，避免任务 / 标签在待归档「消失」。
          const used = new Set();
          this.folderScopeTasks.forEach(t => {
            if (!t.category_id) return;
            const c = this.categories.find(x => x._id === t.category_id);
            if (c) used.add(c.parent || c._id);
          });
          const usedCats = this.categories.filter(c => !c.parent && used.has(c._id));
          return this.collectionCats.concat(usedCats).filter((c, i, a) => a.indexOf(c) === i);
        }
        const qv = this.$store.getQuickViewCatId();
        // 内置「临时任务」仅任务夹展示：通用过滤中剔除 qv，仅任务夹单独置顶；模版夹/收藏夹不出现该内置标签
        let list = this.topCats.filter(c => c._id !== qv && (this.catInScope(c._id) || this.subCats(c._id).some(s => this.catInScope(s._id))));
        if (this.folderView === 'task') {
          const cat = this.topCats.find(c => c._id === qv);
          if (cat) { list = list.filter(c => c._id !== qv); list.unshift(cat); }
        }
        return list;
      },
      // 无一级标签的任务（排除临时任务 quickview），独立分组，避免移除「全部任务」视图后丢失入口
      folderUncatTasks() {
        if (!this.folderView) return [];
        return this.folderScopeTasks.filter(t => !t.category_id && !this.isQuickView(t));
      },
      // 全局搜索结果：跨「任务夹 / 收藏夹 / 模版夹」所有未归档父任务 + 子任务，多字段模糊匹配
      // （标题 / 描述 / 素材备注 / 灵感素材 / 一级#标签 / 二级##标签）；标签关键词直接命中带该标签的任务；
      //  子任务命中则展示该子任务条目。搜索状态不持久化（data 初始化为空、切Tab清空、不写入 saveUiState）。
      searchResults() {
        let kw = (this.searchKeyword || '').trim().toLowerCase().replace(/^#+/, '');
        if (!kw) return [];
        const out = [];
        const folders = ['task', 'collection', 'template'];
        folders.forEach(fv => {
          const tasks = this.scopeTasksOf(fv);
          tasks.forEach(t => {
            if (this.taskMatches(t, kw)) out.push({ isSub: false, task: t, folder: fv });
            (t.sub_tasks || []).forEach(s => {
              if (this.subMatches(t, s, kw)) out.push({ isSub: true, sub: s, parent: t, folder: fv });
            });
          });
        });
        return out;
      },
    },
    created() { this.restoreUiState(); },
    methods: {
      // —— 页面 UI 状态缓存（激活标签 / 分组展开折叠），随路由栈返回时自动还原 ——
      saveUiState() {
        try {
          // 其余时间维度分组（上周 / 下月等）同样不持久化（全局规则：离开页面后全部重置为默认折叠）。
          // folderView / pageTab / boardSub / modeFilter / activeCat 属于导航偏好，保留持久化。
          localStorage.setItem('mindpocket:inboxUi', JSON.stringify({
            folderView: this.folderView, pageTab: this.pageTab, boardSub: this.boardSub,
            modeFilter: this.modeFilter, activeCat: this.activeCat,
            // 一级/二级标签展开树：随路由栈进入子任务页再返回时还原，避免展开态丢失
            catOpen: this.catOpen, uncatOpen: this.uncatOpen,
            catExpand: this.catExpand, subExpand: this.subExpand,
          }));
        } catch (e) {}
      },
      restoreUiState() {
        try {
          const raw = localStorage.getItem('mindpocket:inboxUi');
          if (!raw) return;
          const s = JSON.parse(raw);
          if (s.folderView) this.folderView = s.folderView;
          if (s.pageTab) this.pageTab = s.pageTab;
          if (s.boardSub) this.boardSub = s.boardSub;
          if (s.modeFilter) this.modeFilter = s.modeFilter;
          if (typeof s.activeCat === 'string') this.activeCat = s.activeCat;
          // 一级/二级标签展开树：持久化以支持「进入子任务页 → 返回」原路还原展开视图
          if (typeof s.catOpen === 'boolean') this.catOpen = s.catOpen;
          if (typeof s.uncatOpen === 'boolean') this.uncatOpen = s.uncatOpen;
          if (s.catExpand && typeof s.catExpand === 'object') this.catExpand = s.catExpand;
          if (s.subExpand && typeof s.subExpand === 'object') this.subExpand = s.subExpand;
          // boardOpen（看板本周/本月锚点）仍不持久化：进入看板强制恢复默认展开（见 ensureBoardDefaults）
        } catch (e) {}
        // 看板「本周 / 本月」分组：进入看板页面强制恢复默认展开（覆盖持久化的折叠态）
        this.ensureBoardDefaults();
      },
      // 看板「本周 / 本月」锚点分组：强制恢复默认展开。
      // 仅覆盖这两个锚点分组；其余时间维度分组（上周 / 下月等）折叠逻辑保持不变。
      ensureBoardDefaults() {
        const U = this.$store.util; const now = new Date();
        if (!this.boardOpen || typeof this.boardOpen !== 'object') this.boardOpen = {};
        this.boardOpen[now.getFullYear() + '-' + (now.getMonth() + 1)] = true;  // 本月分组

      },
      // 时间模式筛选（系统标签，可与自定义标签叠加；归档任务同样遵循）
      matchMode(t) {

      },
      openTaskAdd(preset) { this.taskAddPreset = preset || ''; this.showTaskAdd = true; },
      // —— 三文件夹范围判定（收藏夹=COLLECTION_CATS 或 is_collection 标记；模版夹=is_template；任务夹=其余） ——
      isCollection(t) {

      openFolder(f) { this.folderView = f; this.catExpand = {}; this.subExpand = {}; if (f === 'task') this.catExpand[this.$store.getQuickViewCatId()] = true; },
      closeFolder() { this.folderView = null; this.catExpand = {}; this.subExpand = {}; },
      // 分组默认展开状态：未手动设置时，「临时任务」在任务夹下默认展开（不受 tab 切换影响）；其余默认折叠
      catExpanded(id) {

      toggleCat(id) { this.catExpand[id] = !this.catExpanded(id); },
      toggleSub(id) { this.subExpand[id] = !this.subExpand[id]; },
      openCatEdit(cat) { this.catEditId = cat._id; },
      openSubTaskPage(t) { location.hash = '#/subtask/' + t._id; },
      // —— 子任务副本（看板）：左滑打卡该子任务副本、右滑撤销打卡、长按/单击编辑（改动同步母本）——
      onSubArchive(subId, parentId, ws, we) { this.$store.subCopyDone(parentId, subId, ws, we); },
      onSubUnarchive(subId, parentId, ws, we) { this.$store.subCopyUndone(parentId, subId, ws, we); },
      onSubEdit(subId, parentId) { this.editSubPid = parentId; this.editSubSid = subId; this.showSubEdit = true; },
      // 一键「设紧急 / 取消紧急」：仅翻转 isEmergency 标记，原执行时间 / 周期 / 提醒配置全部保持不变；
      // 看板与今日列表会按该标记即时置顶或复位（响应式自动重排，时间数据零丢失）。
      toggleEmergency(t) { this.$store.toggleEmergency(t._id); },
      // 二级标签（本文件夹范围内）
      folderSubCatsOf(pid) { return this.subCats(pid).filter(s => this.catInScope(s._id)); },
      // 某分类（含其下二级）在本文件夹范围内的任务计数
      folderCatCount(c) {

      },
      // 归属某分类（一级 / 二级 / 三级）的任务
      folderTasksOf(catId) { return this.folderScopeTasks.filter(t => t.category_id === catId); },
      // 父任务下的子任务（三级标签语义：新任务归属为父任务的子任务）
      folderSubTasksOf(parentTask) {
        if (!parentTask || !parentTask.sub_tasks) return [];
        return parentTask.sub_tasks.filter(s => !s.is_archived);
      },
      catInScope(catId) { return this.folderScopeTasks.some(t => t.category_id === catId); },
      // —— 全局搜索：跨三文件夹范围取未归档父任务（忽略时间模式筛选，保证「全局」） ——
      scopeTasksOf(folder) {
        return (this.$store.state.tasks || []).filter(t => {

      // 父任务命中判定：标题 / 描述 / 素材备注 / 素材链接 / 灵感素材 / 一级#二级##标签
      taskMatches(t, kw) {
        const hay = [ t.title || '', t.desc || '', t.material_notes || '', t.material_link || '' ];
        // 灵感素材（project_ideas 表，以 task_id 维度隔离；与任务灵感库共用同一份实现）
        const ideas = (this.$store.getTaskIdeas
          ? this.$store.getTaskIdeas(t._id)
          : (this.$store.state.project_ideas || []).filter(i => i.task_id === t._id && !i.deleted_at));
        if (ideas && ideas.length) ideas.forEach(i => { hay.push(i.title || ''); hay.push(i.content || ''); hay.push(i.link || ''); });
        // 标签：根→叶（一级 / 二级 …），直接命中带该标签的任务
        const chain = (this.$store.categoryChainNames ? this.$store.categoryChainNames(t) : []);
        chain.forEach(n => hay.push(n || ''));
        return hay.join(' ').toLowerCase().indexOf(kw) >= 0;
      },
      // 子任务命中判定：子任务自身文本字段（标题 / 描述 / 素材备注 / 素材链接）
      subMatches(parent, s, kw) {
        const hay = [ s.title || '', s.desc || '', s.material_notes || '', s.material_link || '' ];
        return hay.join(' ').toLowerCase().indexOf(kw) >= 0;
      },
      // —— 标签长按手势：长按=编辑，轻点=折叠/展开 ——
      catPress(c, e) { if (this._catTimer) clearTimeout(this._catTimer); this._catLong = false; this._catTimer = setTimeout(() => { this._catLong = true; this.openCatEdit(c); }, 450); try { if (e && e.currentTarget) e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} },
      catRelease(c) { if (this._catTimer) { clearTimeout(this._catTimer); this._catTimer = null; } if (this._catLong) { this._catLong = false; } else { if (c.parent) this.toggleSub(c._id); else this.toggleCat(c._id); } },
      catMove() { if (this._catTimer) { clearTimeout(this._catTimer); this._catTimer = null; } this._catLong = false; },
      modeBadge(t) {
        const m = this.$store.classifyMode(t);
        return ({ collection: { t: '📦收藏', c: 'm-collection' }, month: { t: '📅月', c: 'm-month' }, week: { t: '📆周', c: 'm-week' }, day: { t: '📍日', c: 'm-day' }, quick: { t: '📌临时', c: 'm-quick' } })[m] || { t: '', c: '' };
      },
      // —— 收藏夹任务判定（委托 store，与文件夹分类一致）——
      isCollTask(t) { return this.$store.isCollectionTask(t); },
      // —— 全局标准时间标签（仅展示文本，浅绿色）——
      timeLabel(t) { return this.$store.formatTimeLabel(t); },
      // —— 指定周标签（本周/下周/下下周）——
      weekLabel(t) { return this.$store.weekLabel(t); },
      // 全局标准卡片时间胶囊（母本视角：isCopy=false）
      cap(t) { return this.$store.capsuleOf(t, { isCopy: false }); },
      // 看板排序：带具体日期锚定的条目（单日/区间/周期/带年月）靠前；仅指定周 / 仅年月（无具体日期）后置
      hasConcreteAnchor(t) {
        if (!t) return true;
        if (t.time_mode === 'week' && t.week_offset != null) return false; // 仅指定周
        if (t.plan_year && t.plan_month && !t.execute_date && !t.date_start) return false; // 仅年月
        return true;
      },
      // —— 临时任务标记（📌临时）——
      quickBadge(t) { return this.$store.classifyMode(t) === 'quick'; },
      openDetail(t) { this.detailId = t._id; },
      // —— 滑动手势：与今日页 HandCards 方向定义统一 ——
      // 左滑 = 标记已完成（归档完成）；右滑 = 标记未完成（移到今日待办 / 已归档则撤销归档）；长按 = 详情
      // 全局互斥锁：动画与数据同步期间禁止重复触发，防止快速连续滑动导致手势卡死
      rowDown(e, t, g) {
        // 点击紧急置顶按钮时不触发滑动/长按手势
        if (e.target.closest('.row-emg-btn')) return;
        if (!this.$store.swipeLock('inbox_' + t._id)) return;
        this.dragId = t._id; this.startX = e.clientX; this.dragX = 0;
        this.dragGroup = g || null;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        this.dragging = true; this.moved = false; this.longFired = false; this.suppressClick = false;
        if (this.longTimer) { clearTimeout(this.longTimer); this.longTimer = null; }
        this.longTimer = setTimeout(() => {
          if (this.dragId !== t._id) return;
          this.longFired = true; this.suppressClick = true;
          if (t._parentId && t._isSubArchive) location.hash = '#/subtask/' + t._parentId;
          else this.openDetail(t);
          this.dragId = null; this.dragging = false; this.dragX = 0;

      },
      rowMove(e, t) {
        if (this.dragId !== t._id) return;
        this.dragX = e.clientX - this.startX;

      },
      rowUp(e, t) {
        if (this.dragId !== t._id) { this.$store.swipeUnlock('inbox_' + t._id); return; }

        const dx = this.dragX;
        const g = this.dragGroup; this.dragGroup = null;
        this.dragging = false; this.dragId = null; this.dragX = 0;
        if (this.longFired) { this.$store.swipeUnlock('inbox_' + t._id); return; }
        if (this.moved) this.suppressClick = true;
        const TH = this.$store.SWIPE_TRIGGER_PX;
        if (dx < -TH) this.markDone(t, g);          // 左滑
        else if (dx > TH) this.markUndone(t, g);    // 右滑

      },
      onRowClick(t) {
        if (this.suppressClick) { this.suppressClick = false; return; }

      },
      // 已归档子任务条目：单击 → 跳转至其所属父任务的子任务页（溯源；与子任务页双向同步同一份 inline 数据）
      onSubArchiveRowClick(s) {
        if (this.suppressClick) { this.suppressClick = false; return; }
        location.hash = '#/subtask/' + s._parentId;
      },
      rowStyle(t) {
        if (this.dragId !== t._id) return {};
        const dx = this.dragX;
        const TH = this.$store.SWIPE_TRIGGER_PX;
        let bg = 'transparent';
        if (dx < -TH) bg = 'rgba(46,204,113,0.15)';
        else if (dx > TH) bg = 'rgba(231,76,60,0.15)';

      },
      // 行内样式：拖拽排序（taskStyle）优先于横向滑动（rowStyle），二者互斥，合并输出
      rowDragStyle(t) {
        if (this.taskDragMode) return Object.assign({}, this.rowStyle(t), this.taskStyle(t));
        return this.rowStyle(t);
      },
      // —— 待归档列表父任务：三杠手柄拖拽排序（与子任务行完全统一：长按手柄 350ms 或按住移动 >6px 进入拖拽，松手提交）——
      taskStyle(t) {
        if (!this.taskDragMode || !this.taskDragId || !this.taskDragList) return {};
        const list = this.taskDragList;
        const i = list.findIndex(x => x._id === t._id);
        if (t._id === this.taskDragId) {
          return { transform: 'translateY(' + this.taskDragY + 'px)', transition: 'none', position: 'relative', zIndex: 30, boxShadow: '0 8px 20px rgba(20,24,40,.18)', background: 'var(--card)', borderRadius: '8px' };
        }
        const from = this.taskDragFrom, to = this.taskDragTo;
        if (from < 0 || to < 0 || i < 0) return {};
        let ty = 0;
        if (i < from && i >= to) ty = this.taskDragRowH;        // 上方行整体下移让位
        else if (i > from && i <= to) ty = -this.taskDragRowH;  // 下方行整体上移让位
        if (ty) return { transform: 'translateY(' + ty + 'px)', transition: 'transform .15s ease' };

      },
      startTaskDrag(t, list) {
        if (this.taskDragMode) return;
        this.taskDragMode = true; this.taskDragId = t._id; this.taskDragY = 0;
        this.taskDragList = list;
        this.taskDragFrom = list.findIndex(x => x._id === t._id);
        this.taskDragTo = this.taskDragFrom;
      },
      onTaskHandleDown(t, list, ev) {
        this.taskDragWhich = (list === this.folderArchived) ? 'archived' : 'active';
        this.taskDragStartY = ev.clientY;
        const rowEl = ev.currentTarget.closest('.task-row');
        this.taskDragRowH = rowEl ? rowEl.getBoundingClientRect().height : 56;
        this.taskHandlePressing = t._id;
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
        if (this.taskHandleTimer) clearTimeout(this.taskHandleTimer);
        this.taskHandleTimer = setTimeout(() => { this.startTaskDrag(t, list); }, 350);
      },
      onTaskHandleMove(ev) {
        if (!this.taskDragMode) {
          // 按住即拖：移动超阈值立即进入拖拽（长按手柄=拖拽；长按不动也将在 350ms 后进入）
          if (this.taskHandlePressing && Math.abs(ev.clientY - this.taskDragStartY) > 6) {
            const list = this.taskDragWhich === 'archived' ? this.folderArchived : this.taskDragList;
            const t = list.find(x => x._id === this.taskHandlePressing);
            if (t) { const rowEl = ev.target && ev.target.closest ? ev.target.closest('.task-row') : null; this.startTaskDrag(t, list); }
          }
          return;
        }
        const dy = ev.clientY - this.taskDragStartY;
        this.taskDragY = dy;
        const list = this.taskDragList;

        const order = list.map(x => x._id);
        const from = this.taskDragFrom, to = this.taskDragTo;
        if (from >= 0 && to >= 0 && from !== to && from < order.length && to < order.length) {

        }
        this.taskDragMode = false; this.taskDragId = null; this.taskDragY = 0;
        this.taskDragFrom = -1; this.taskDragTo = -1; this.taskDragList = null; this.taskDragWhich = null; this.taskHandlePressing = null;
      },
      markDone(t, g) {
        if (g) { // 看板【副本】：仅标记本条完成（记录该周/月窗口），绝不归档母本
          this.$store.markCopyDone(t._id, g.ws, g.we);
          this.$store.swipeUnlock('inbox_' + t._id);
          return;
        }
        // 归档库中的子任务条目：已归档，左滑无操作
        if (t._parentId && t._isSubArchive) { this.$store.swipeUnlock('inbox_' + t._id); return; }
        // 模板任务母本左滑 = 统一重置
        if (t.is_template) { this.$store.resetTemplate(t._id); this.$store.swipeUnlock('inbox_' + t._id); return; }
        // 待归档列表【母本】：左滑归档
        if (t.cycle) this.$store.archiveTaskFull(t._id);
        else if (!t.is_archived) this.$store.archiveTask(t._id);

      },
      markUndone(t, g) {
        if (g) { // 看板【副本】：撤销本条完成
          this.$store.markCopyUndone(t._id, g.ws, g.we);
          this.$store.swipeUnlock('inbox_' + t._id);
          return;
        }
        // 归档库中的子任务条目：右滑 = 撤销子任务归档
        if (t._parentId && t._isSubArchive) { this.$store.setArchived(t._parentId, t._id, false); this.$store.swipeUnlock('inbox_' + t._id); return; }
        // 待归档列表【母本】：原撤销逻辑
        if (t.is_archived || (t.cycle && this.$store.cycleArchivedToday(t, this.$store.util.todayStr()))) this.$store.setArchived(t._id, null, false);
        else this.$store.updateTask(t._id, { execute_date: this.$store.util.todayStr() });

      },
      // 分类拖拽排序（与分类管理弹窗共用同一顺序）
      reorderCat(toId) {

      },
      // 本地持久化（刷新后记住标签展开/收起、选中标签、日期筛选）

    },

    watch: {

      // 全局刷新通知：数据变更（含任意页面归档/撤销）后，主动重载本页（列表 + 看板）
      '$store.state.revision'() { this.$forceUpdate(); },
    },
    template: `
    <div class="page">
      <div class="inbox-head">

        <button class="btn-add" @click="openTaskAdd(this.folderView || '')">＋ 新建</button>
      </div>

      <div class="page-tabs">

        <button class="page-tab" :class="{on:pageTab==='board'}" @click="pageTab='board'">📊 看板（周/月计划）</button>
      </div>

      <!-- 全局搜索（切换按钮下方，选项卡上方；跨任务夹/收藏夹/模版夹全量检索，含已归档；不持久化，刷新/切Tab自动清空） -->
      <div class="inbox-search">

          <input v-model="searchKeyword" placeholder="搜索标题/描述/素材备注/灵感素材/标签…" />

        </div>

               @pointerdown="r.isSub ? void(0) : rowDown($event, r.task)"
               @pointermove="r.isSub ? void(0) : rowMove($event, r.task)"
               @pointerup="r.isSub ? void(0) : rowUp($event, r.task)"
               @pointercancel="r.isSub ? void(0) : rowUp($event, r.task)"
               @click="r.isSub ? onSubEdit(r.sub._id, r.parent._id) : onRowClick(r.task)">

  /* =====================================================================
   * TimelineTimeModal —— 统计页 · 全局已归档仓库 · 纵向时间线条目编辑弹窗
   * 仅修改「起始时间 / 结束时间」：保存后写回任务的 remind_time / remind_end
   * （子任务写回 remind_time / sub_remind_end，双写保持与既有提醒字段一致）；
   * 保存即 persist → revision 自增，时间线与当日总耗时实时刷新。
   * ===================================================================== */
  C.TimelineTimeModal = {
    name: 'TimelineTimeModal',
    props: { item: { type: Object, required: true } },
    data() {
      return { start: this.item.start || '', end: this.item.end || '' };
    },
    computed: {
      durH() {
        const pa = /^(\d{1,2}):(\d{2})$/.exec(this.start), pb = /^(\d{1,2}):(\d{2})$/.exec(this.end);
        if (!pa || !pb) return '0.0 h';
        let d = (Number(pb[1]) * 60 + Number(pb[2])) - (Number(pa[1]) * 60 + Number(pa[2]));
        if (d < 0) d += 24 * 60;
        return (d / 60).toFixed(1) + ' h';
      },
    },
    methods: {
      save() {
        const patch = { remind_time: this.start || '', remind_end: this.end || '' };
        if (this.item.type === 'subtask') this.$store.updateSubTask(this.item.parentId, this.item._id, patch);
        else this.$store.updateTask(this.item._id, patch);
        this.$emit('close');
      },
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal-card">
        <h3 class="modal-title">⏱ 编辑时间段</h3>
        <div class="tl-edit-title">{{ item.title }}</div>

        <label class="tl-field">结束时间<input type="time" v-model="end" /></label>

        <div class="modal-actions">

  /* =====================================================================
   * CycleSummaryModal —— 周期/区间任务「汇总用时」面板
   * 入参 tasks：原始任务对象数组（单任务=卡片按钮触发；多任务=底部汇总入口）。
   * 展示：各归档日期清单 + 每条耗时、累计总时长、归档次数、平均单次时长、简易柱状图。
   * 每条耗时 = 该任务 remind_time→remind_end(+30默认) 时长（同任务各日期一致）。
   * ===================================================================== */
  C.CycleSummaryModal = {
    name: 'CycleSummaryModal',
    props: { tasks: { type: Array, required: true } },
    data() { return { drillId: null }; },
    computed: {
      summaries() {
        return this.tasks.map(t => {
          const start = t.remind_time || '';
          let end = t.remind_end || '';
          if (!end && start) {
            const m = /^(\d{1,2}):(\d{2})$/.exec(start);
            if (m) { let mins = Number(m[1]) * 60 + Number(m[2]) + 30; end = String(Math.floor(mins / 60) % 24).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0'); }
          }
          const pa = /^(\d{1,2}):(\d{2})$/.exec(start), pb = /^(\d{1,2}):(\d{2})$/.exec(end);
          let per = 0;
          if (pa && pb) { per = (Number(pb[1]) * 60 + Number(pb[2])) - (Number(pa[1]) * 60 + Number(pa[2])); if (per < 0) per += 24 * 60; }
          const dates = (t.cycle_history || []).filter(h => h.is_archived && h.execute_date).map(h => h.execute_date).sort();
          const count = dates.length;
          return {
            t, name: t.title || '(未命名)', dates,
            perMin: per, count,
            totalMin: per * count,
            avgMin: per,
            bars: dates.map(d => ({ date: d, min: per })),
          };
        });
      },
      maxMin() { return Math.max(1, ...this.summaries.map(s => s.perMin)); },
      // 多任务列表视图时显示清单；单任务或已下钻时显示明细
      current() {
        if (this.tasks.length === 1) return this.summaries[0];
        if (this.drillId) return this.summaries.find(s => s.t._id === this.drillId) || null;
        return null;
      },
      fmtH() { return (min) => (min / 60).toFixed(1) + ' h'; },
    },
    methods: {
      back() { this.drillId = null; },
      barH(min) { return Math.max(6, Math.round(min / this.maxMin * 100)) + '%'; },
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal-card cs-card">
        <h3 class="modal-title">📊 周期/区间任务汇总用时</h3>

        <!-- 多任务列表视图 -->
        <div v-if="!current" class="cs-list">
          <div class="cs-list-item" v-for="s in summaries" :key="s.t._id" @click="drillId = s.t._id">
            <div class="cs-li-name">📌 {{ s.name }}</div>
            <div class="cs-li-meta">累计 {{ fmtH(s.totalMin) }} · 归档 {{ s.count }} 次 · 单次 {{ fmtH(s.avgMin) }}</div>
          </div>
          <p v-if="!summaries.length" class="empty-tip">无周期/区间任务</p>
        </div>

        <!-- 单任务明细视图 -->
        <div v-else class="cs-detail">
          <div class="cs-back" v-if="tasks.length > 1" @click="back">‹ 返回列表</div>
          <div class="cs-name">📌 {{ current.name }}</div>
          <div class="cs-stats">
            <div class="cs-stat"><span class="cs-num">{{ fmtH(current.totalMin) }}</span><span class="cs-lbl">累计总时长</span></div>
            <div class="cs-stat"><span class="cs-num">{{ current.count }}</span><span class="cs-lbl">归档次数</span></div>
            <div class="cs-stat"><span class="cs-num">{{ fmtH(current.avgMin) }}</span><span class="cs-lbl">平均单次</span></div>
          </div>
          <div class="cs-bars">
            <div class="cs-bar-col" v-for="b in current.bars" :key="b.date">
              <div class="cs-bar" :style="{ height: barH(b.min) }"></div>
              <div class="cs-bar-d">{{ b.date }}</div>
              <div class="cs-bar-v">{{ fmtH(b.min) }}</div>
            </div>
            <p v-if="!current.bars.length" class="empty-tip">暂无归档日期</p>
          </div>
          <div class="cs-dates">
            <div class="cs-date-row" v-for="b in current.bars" :key="b.date"><span>{{ b.date }}</span><span>{{ fmtH(b.min) }}</span></div>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn ghost" @click="$emit('close')">关闭</button>
        </div>
      </div>
    </div>`,
  };

  /* =====================================================================
   * StatsPage —— 统计页（本周概览 / 月年视图 / AI 健康助手 / 全局已归档仓库）
   * ===================================================================== */
  C.StatsPage = {
    name: 'StatsPage',

        tlEditItem: null, csTasks: [],

        archYear: new Date().getFullYear(), archMonth: new Date().getMonth() + 1, archView: 'month',

        archType: 'all',

        archDragId: null, archStartX: 0, archX: 0, archMoved: false,

        archLongTimer: null, archSuppressClick: false,

        // 统计板块折叠状态（默认全展开；本地缓存，再次进入保留）
        collapsed: { week: false, habit: false, health: false, arch: true },
        // 归档仓库：项目条目长按操作弹窗（重命名/删除/取消）+ 项目编辑/删除二次确认
