<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MindPocket</title>
  <meta name="theme-color" content="#5b6cff" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="./assets/icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MindPocket" />
  <style>
/* =========================================================================
 * To Do —— 样式 style.css
 * 移动端优先；桌面下居中为手机宽度容器
 * ========================================================================= */
:root {
  --bg: #f5f6fa;
  --card: #ffffff;
  --primary: #5b6cff;
  --primary-d: #4453e0;
  --text: #2b2f3a;
  --sub: #8a90a2;
  --ok: #2ecc71;
  --no: #e74c3c;
  --warn: #f1c40f;
  --line: #eceef3;
  --radius: 16px;
  --shadow: 0 6px 20px rgba(40, 50, 90, .08);
  /* 悬浮球 / 安装条 距底部的安全距离：避让底部 tab 栏（约 50px）+ iOS 安全区（home indicator ~34px） */
  --fab-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  --pill-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
}
#app { min-height: 100vh; }

.app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
.app-main { flex: 1; padding: 16px 16px 90px; }
.boot { padding: 40px; text-align: center; color: var(--sub); }

.page-title { font-size: 22px; font-weight: 700; margin: 4px 0 10px; }
.block { background: var(--card); border-radius: var(--radius); padding: 10px; margin-bottom: 8px; box-shadow: var(--shadow); }
.block-title { font-size: 15px; margin: 0 0 8px; color: var(--sub); font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
.block-title .caret { color: var(--sub); font-size: 13px; }
.collapse-btn { background: transparent; border: none; cursor: pointer; font-size: 16px; line-height: 1; color: var(--sub); padding: 0 4px; }
.collapse-btn:active { color: var(--primary); }

/* ---------- 数据备份（P0 本地备份） ---------- */
.backup-box { padding: 2px 2px 4px; }
.backup-note { font-size: 12px; line-height: 1.6; color: var(--sub); margin: 0 0 10px; }
.backup-note b { color: var(--no); }
.backup-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- 同步 / 云端代发 UI（共享样式） ---------- */
.sync-form { display: flex; flex-direction: column; gap: 8px; }
.sync-form label { font-size: 12px; color: var(--sub); }
.sync-form label.radio { display: inline-flex; align-items: center; gap: 4px; color: var(--text); }
.sync-form input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
.sync-repo { display: flex; align-items: center; gap: 6px; }
.sync-repo input { flex: 1; min-width: 0; }
.sync-slash { color: var(--sub); }
.sync-status { display: flex; flex-direction: column; gap: 10px; }
.sync-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
.sync-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.sync-dot.on { background: var(--ok); }
.sync-dot.off { background: var(--no); }
.sync-meta { font-size: 12px; color: var(--sub); display: flex; flex-direction: column; gap: 2px; }
.sync-err { color: var(--no); word-break: break-all; }
.sync-status code { font-size: 11px; word-break: break-all; background: #f0f1f6; padding: 2px 4px; border-radius: 4px; }

/* ---------- 列表 / 行 ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; background: #fafbff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.row-sub { font-size: 12px; color: var(--sub); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row-sub.good { color: var(--ok); }
.row-sub.bad { color: var(--no); }
/* 今日页：逾期任务「延期未完成」标记（含周期未完成的过期单次出现） */
.row-overdue { background: #fff3e3; color: #e8862b; font-weight: 600; padding: 1px 7px; border-radius: 8px; }
/* 过期任务延期弹窗 */
.extend-opt { display: block; width: 100%; text-align: left; background: #f7f8fc; border: 1px solid var(--line); color: var(--text); font-size: 15px; font-weight: 600; padding: 14px 14px; border-radius: 12px; margin-bottom: 10px; }
.extend-opt-label { margin-bottom: 8px; }
.extend-date-row { display: flex; align-items: center; gap: 8px; }
.extend-date-row input[type=date] { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-family: inherit; }
.btn.ghost.full { width: 100%; margin-top: 4px; }
.empty-tip { color: var(--sub); text-align: center; font-size: 13px; padding: 10px; }
/* 今日页：书籍任务阅读进度小字 */
.row-prog { font-size: 12px; color: var(--sub); margin-top: 3px; }
.row-prog.prog-sync { color: var(--primary); font-weight: 500; display: flex; align-items: center; gap: 4px; }
.cap.cap-prog { background: rgba(108,92,231,0.12); color: var(--primary); border-color: transparent; }
/* 阅读习惯打卡 → 书籍进度同步弹窗 */
.read-sync-modal .fld { display: block; margin-bottom: 14px; font-size: 14px; font-weight: 600; color: var(--text); }
.read-sync-modal .fld select, .read-sync-modal .fld input { width: 100%; margin-top: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-family: inherit; font-size: 14px; }
.read-sync-modal .fld-err { color: var(--no); font-size: 12px; margin: -8px 0 10px; }
/* 养成手牌「完成」按钮（蓝色主按钮） */
.hc-btn.primary { background: var(--primary); color: #fff; border-color: transparent; }

/* ---------- 标签 ---------- */
.tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: #eef0ff; color: var(--primary); }
.tag.cat { background: #e8f6ee; color: #1f9d57; }
.tag.cycle { background: #fff3e0; color: #e08e0b; }
.tag.coll { background: #fdf3e3; color: #b07d21; font-size: 11px; padding: 1px 7px; border-radius: 8px; }
.tag.tpl { background: #eef0ff; color: #5b5bd6; font-size: 11px; padding: 1px 7px; border-radius: 8px; }
.tag.arch { background: #e6f7e6; color: #2e7d32; font-size: 11px; padding: 1px 7px; border-radius: 8px; }
/* .tag.parent-ref 已下线：父任务归属改为并入标签层级链末级（考研│专业课│母任务X） */
/* 紧急任务红色角标：标题旁醒目标识（今日/周看板/项目/待归档/闲趣随机卡统一复用） */
.tag.emergency { background: #ffe5e5; color: #e13c3c; font-weight: 700; font-size: 11px; padding: 1px 7px; border-radius: 8px; flex: 0 0 auto; }
/* 紧急条目底色：轻微浅红 + 左侧红条，强化视觉提醒但不喧宾夺主 */
.emergency-bg { background: #fff6f6 !important; border-color: #ffd9d9 !important; box-shadow: inset 3px 0 0 #ff6b6b; }
/* 非 flex 容器内的角标需要手动补间距（项目子任务名 / 项目卡片名 / 闲趣卡标题） */
.psub-title .tag.emergency, .proj-name .tag.emergency { margin-left: 6px; vertical-align: 1px; }
.lz-card-title .tag.emergency { margin-right: 6px; vertical-align: 1px; }
.gantt-label.emg { color: #e13c3c; }
.gantt-emg { margin-right: 2px; }
/* 胶囊时间标签：日浅红 / 周浅绿 / 月浅蓝，左图标 + 文字 */
.cap { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; line-height: 1.5; padding: 1px 8px 1px 6px; border-radius: 999px; vertical-align: middle; }
.cap-ico { font-size: 11px; line-height: 1; }
.cap-txt { white-space: nowrap; }
.cap-day { background: #fdecec; color: #e0524f; }
.cap-week { background: #e6f7f1; color: #1f9d57; }
.cap-month { background: #e8effe; color: #3a63c8; }

/* ---------- 按钮 ---------- */
button { font-family: inherit; cursor: pointer; border: none; border-radius: 10px; }
.btn { background: var(--primary); color: #fff; padding: 10px 16px; font-weight: 600; }
.btn:hover { background: var(--primary-d); }
.btn.primary { background: var(--primary); }
.btn.ghost { background: #eef0f5; color: var(--text); }
.btn.danger { background: var(--no); color: #fff; }
.btn.warn { background: #fff3e0; color: #e08e0b; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-mini { background: #eef0ff; color: var(--primary); padding: 6px 12px; font-size: 13px; font-weight: 600; border-radius: 9px; }
.btn-mini.danger { background: #ffeaea; color: var(--no); }
/* 删除项目按钮：浅红底色 + 红色文字，与 APP 原有删除按钮（.btn-mini.danger / .choice-btn.danger）色值一致 */
.btn.danger-soft { background: #ffeaea; color: var(--no); }
/* 统一点击反馈：按下即时变暗，给用户明确响应；manipulation 去除移动端 300ms 点击延迟 */
.btn, .btn-mini, .choice-btn, .choice-cancel, .hc-btn, .hn-arrow, .seg button, .sheet-btn, .tag, .ptag, .collapse-btn, .modal button, .row-back-btn, .row-delay-btn, .extend-opt, .btn-mini.more { touch-action: manipulation; }
.btn:active, .btn.primary:active, .btn.ghost:active, .btn-mini:active, .choice-btn:active, .choice-cancel:active, .hc-btn:active, .hn-arrow:active, .seg button:active, .sheet-btn:active, .tag:active, .ptag:active, .collapse-btn:active, .modal button:active, .row-back-btn:active, .row-delay-btn:active, .extend-opt:active, .btn-mini.more:active, .empty-tip.clickable:active { filter: brightness(0.93); }
.proj-card:active, .folder-head:active { background: rgba(20,24,40,.03); }
.proj-card:active .proj-inner, .folder-head:active .folder-inner { background: rgba(20,24,40,.04); }

/* ============ 手牌堆叠卡 ============ */
.handcards { user-select: none; }
.handcards-hint { text-align: center; color: var(--sub); font-size: 12px; margin-bottom: 4px; }
.handcards-empty { text-align: center; color: var(--sub); padding: 30px; }
.handcards-stack { position: relative; height: 156px; touch-action: none; isolation: isolate; }
/* 滑动 / 长按手势容器：禁用 iOS 长按呼出菜单与文本选择，保证长按手势准确灵敏（与全局 contextmenu 拦截互补） */
.handcards-stack,
.row.task-row.swipeable, .row.swipe,
.st-row.swipe-card, .psub.swipe-card, .pidea.swipe-card,
.proj-card, .folder-head, .grp-head, .cat-sub-head,
.habit-grid-btn, .habit-pick-btn, .mc-head { -webkit-touch-callout: none; }
.handcard {
  position: absolute; left: 0; right: 0; top: 0; height: 136px; margin: auto;
  background: linear-gradient(135deg, #6a7bff, #8a5bff); color: #fff; border-radius: 16px;
  padding: 10px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column;
  transition: transform .18s ease; will-change: transform;
}
.handcard.is-holiday { background: linear-gradient(135deg, #95a5a6, #7f8c8d); }
.handcard.done-success { background: linear-gradient(135deg, #2ecc71, #27ae60); }
.handcard.done-fail { background: linear-gradient(135deg, #e74c3c, #c0392b); }
.handcard-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11px; }
.handcard-type { opacity: .85; background: rgba(255,255,255,.2); padding: 2px 7px; border-radius: 7px; }
.handcard-badge { background: rgba(255,255,255,.28); padding: 2px 7px; border-radius: 7px; }
.handcard-name { font-size: 19px; font-weight: 700; margin-top: 8px; line-height: 1.25; }
.handcard-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; opacity: .92; margin-top: auto; padding-top: 6px; }
.handcard-remind { opacity: .8; }
.handcards-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; position: relative; z-index: 200; }
.hn-page { display: flex; align-items: center; gap: 6px; }
.hn-arrow { background: #eef0f5; color: var(--text); width: 30px; height: 30px; font-size: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.hn-arrow:disabled { opacity: .4; }
.hn-ind { color: var(--sub); font-size: 12px; min-width: 40px; text-align: center; }
.hn-actions { display: flex; align-items: center; gap: 8px; }
.hc-btn { background: #f0f1f6; color: var(--text); font-size: 12px; min-height: 30px; padding: 6px 12px; border-radius: 8px; line-height: 1.3; }
.hc-btn:active { background: #e6e8ef; }

/* ============ AI 输入区 ============ */
.ai-box { background: var(--card); border-radius: var(--radius); padding: 12px; margin-bottom: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.ai-box.compact { flex-direction: row; }
.ai-box textarea, .ai-box input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; resize: none; }
.ai-box textarea { min-height: 56px; }

/* ============ 标签筛选（思维导图式展开/收起） ============ */
.cat-panel { margin-bottom: 8px; }
.cat-toggle { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); color: var(--text); font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 12px; }
.cat-toggle .tri { color: var(--primary); font-size: 11px; }
.cat-tree { margin-top: 6px; padding-left: 14px; display: flex; flex-direction: column; gap: 4px; }
.tree-node { display: flex; align-items: center; gap: 8px; text-align: left; background: #f7f8fc; border: 1px solid var(--line); color: var(--text); font-size: 13px; padding: 8px 12px; border-radius: 10px; }
.tree-node.sub { margin-left: 12px; }
.tree-node .dot { width: 7px; height: 7px; border-radius: 50%; background: #c4c9d4; flex: 0 0 auto; }
.tree-node.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.tree-node.on .dot { background: #fff; }
.tree-node.manage { background: #f0f1f6; }
.chip { background: #fff; border: 1px solid var(--line); color: var(--sub); padding: 7px 14px; font-size: 13px; white-space: nowrap; border-radius: 20px; }
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.chip.manage { background: #f0f1f6; }
.chip.new { background: #e8f6ee; color: #1f9d57; }
.btn-mini.ghost { background: #f0f1f6; color: var(--sub); }

/* 待归档页：标题行 + 右上角常驻绿色「＋ 新建」按钮 */
.inbox-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 12px; }
.inbox-head .page-title { margin: 0; }
.btn-add { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; background: var(--ok); color: #fff; font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 22px; box-shadow: 0 4px 12px rgba(46, 204, 113, .28); }
.btn-add:active { transform: translateY(1px); }

/* ============ 时间模式筛选 + 看板入口 ============ */
.mode-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
.board-btns { display: flex; gap: 8px; margin-bottom: 12px; }
.board-btns button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 4px; background: #f0f3ff; color: var(--primary); border: 1px solid #dde4ff; border-radius: 10px; padding: 9px 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.board-btns button:active { transform: translateY(1px); }
/* 任务卡片时间模式角标 */
.mode-badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 8px; margin-left: 4px; vertical-align: 1px; }
.mode-badge.m-collection { background: #fdf3e3; color: #b07d21; }
.mode-badge.m-month { background: #e8effe; color: #3a63c8; }
.mode-badge.m-week { background: #e6f7f1; color: #1f9d57; }
.mode-badge.m-day { background: #fdeaea; color: #c0443c; }
.mode-badge.m-quick { background: #fff2e5; color: #d4691f; }
/* ============ 待归档页：三文件夹入口 + 内联下钻 ============ */
.folder-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
.folder-chips .fchip { flex: 1; min-width: 84px; background: #fff; border: 1px solid var(--line); color: var(--sub); padding: 10px 6px; font-size: 13px; font-weight: 600; white-space: nowrap; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.folder-chips .fchip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.folder-chips .fchip:active { transform: translateY(1px); }
.folder-drill { margin-bottom: 12px; }
.drill-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.drill-bar .back { background: #f0f1f6; color: var(--sub); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.drill-crumb { font-size: 13px; color: var(--sub); }
.drill-crumb b { color: var(--text); }
.folder-drill .row.task-row { margin-bottom: 6px; }
/* ============ 看板弹窗（月计划 / 周计划 / 收藏总览） ============ */
.board-modal { max-height: 88vh; }
.board-add { width: 100%; margin: 0 0 10px; background: var(--ok); color: #fff; font-weight: 600; font-size: 14px; padding: 10px; border-radius: 12px; }
.board-group { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
.grp-head { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; background: #f7f8fc; color: var(--text); font-size: 14px; font-weight: 600; padding: 10px 12px; }
.grp-head .cnt { color: var(--sub); font-weight: 400; font-size: 12px; }
.grp-head.memo { background: #fdf7e8; }
.grp-head .caret, .hist-head .caret { color: var(--sub); font-size: 12px; margin-left: 2px; }
.grp-body { padding: 6px 8px 8px; }
/* 文件夹面板：二级标签可折叠子分组（缩进，沿用看板折叠风格） */
.cat-sub-row { margin: 4px 0 4px 8px; border-left: 2px solid var(--line); padding-left: 8px; }
.cat-sub-head { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; background: #fbfbfe; color: var(--text); font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: 10px; }
.cat-sub-head .cnt { color: var(--sub); font-weight: 400; font-size: 12px; }
.cat-sub-head .caret { color: var(--sub); font-size: 12px; margin-left: 2px; }
.cat-sub-body { padding: 4px 0 2px; }
/* 子任务页面：子任务行（视觉 1:1 对齐主任务条目样式） */
.st-row { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px dashed var(--line); }
.st-row:last-child { border-bottom: none; }
/* 复选框：与主任务完成态视觉一致 */
.st-row input[type=checkbox] { flex: none; width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
.st-row .st-title { flex: 1; font-weight: 600; font-size: 15px; color: var(--text); }
.st-row .st-title.done { text-decoration: line-through; color: var(--sub); }
/* 铅笔编辑 / × 删除：尺寸、圆角、配色、间距、阴影、hover/按压态 1:1 复用 .icon-btn */
.st-row .st-del { flex: none; background: #f0f1f6; color: var(--sub); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(20,24,40,.06); transition: background .15s ease, transform .1s ease, box-shadow .15s ease; }
.st-row .st-del:hover { background: #e9ecf5; }
.st-row .st-del:active { transform: translateY(1px); box-shadow: none; }
/* 子任务行支持滑动手势（左滑=完成/归档选择；右滑=撤销归档）+ 已完成变灰 */
.st-row.swipe-card { touch-action: pan-y; will-change: transform; }
.st-row.swipe-card.dragging { transition: none; }
.st-row.done { opacity: .6; }
/* 三横线拖拽手柄（⠿）：子任务行 / 待归档列表父任务行共用同一款；长按=拖动排序；不触发卡片横向滑动 / 空白区编辑 */
.st-drag { flex: none; color: var(--sub); cursor: grab; user-select: none; font-size: 15px; line-height: 1; padding: 0 2px; opacity: .55; touch-action: none; }
.st-drag:active { opacity: 1; cursor: grabbing; }
.st-list { margin-top: 6px; }
.head-acts { display: flex; align-items: center; gap: 6px; }
.icon-btn { background: #f0f1f6; color: var(--sub); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 14px; }
.icon-btn.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.icon-btn:active { transform: translateY(1px); }
/* 排序菜单弹窗（项目Tab） */
.sort-menu .sort-item.on { background: #eef0ff; color: var(--primary); font-weight: 600; }
.sort-menu .sort-item:hover { background: #f7f8fc; }
.sort-menu .sort-item.on:hover { background: #eef0ff; }
.b-row { border-bottom: 1px dashed var(--line); padding: 8px 4px; }
.b-row:last-child { border-bottom: none; }
.b-title { font-size: 14px; color: var(--text); }
.b-ops { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.b-ops button { background: #f0f1f6; color: var(--sub); font-size: 12px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); }
.b-ops button.ok { background: #e6f7f1; color: #1f9d57; border-color: #cceede; }
.b-ops button.warn { background: #fdeaea; color: #c0443c; border-color: #f5d4d2; }
.grp-empty { font-size: 12px; color: var(--sub); padding: 8px 4px; }
/* —— 统一任务表单 TaskFormCore —— */
.task-form-core { display: block; }
.block-note { width: 100%; display: flex; align-items: center; gap: 6px; background: #f7f8fc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--text); font-weight: 600; margin-bottom: 8px; cursor: pointer; }
.block-note .note-flag { color: var(--ok); font-weight: 400; font-size: 12px; }
.block-note .caret { margin-left: auto; color: var(--sub); font-size: 13px; }
.adv-body { padding: 6px 4px 2px 8px; border-left: 2px solid var(--line); margin: 2px 0 4px; }
.board-group.sub { margin: 6px 0; }
.board-group.sub .grp-head { font-size: 13px; padding: 8px 10px; }
.tag-preview { margin-top: 10px; }
.tag-preview .board-group.sub { margin: 4px 0; }
.board-group.adv > .grp-head { background: #eef1f8; }
.note-flag { }
/* AI 批量预览：逐条可编辑字段（与统一表单字段对齐） */
.ai-title { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 14px; font-family: inherit; color: var(--text); margin-bottom: 6px; }
.ai-desc, .ai-note { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; margin-top: 6px; font-family: inherit; resize: vertical; min-height: 38px; color: var(--text); }

/* ============ 第 4 层：待归档顶部双 Tab + 内嵌看板 ============ */
.page-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
.page-tab { flex: 1; background: #f0f3ff; color: var(--primary); border: 1px solid #dde4ff; border-radius: 10px; padding: 9px 6px; font-size: 13px; font-weight: 600; }
.page-tab.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.board-sub-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
.board-sub-tabs button { flex: 1; background: #f0f1f6; color: var(--sub); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: 13px; font-weight: 600; }
.board-sub-tabs button.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.board-inline { margin-bottom: 12px; }
/* 看板内卡片沿用全局 .row.task-row 标准样式，仅微调间距 */
.board-inline .row.task-row { margin-bottom: 6px; }
/* 看板内联分配面板 */
.assign-pop { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; background: #f7f8fc; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.assign-pop select, .assign-pop input[type="text"] { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
.assign-pop .btn-mini { flex: 0 0 auto; }
/* 今日页：日计划任务「退回周计划」按钮 */
.row-back-btn { flex: 0 0 auto; background: #e8effe; color: #3a63c8; font-size: 12px; padding: 6px 10px; border-radius: 8px; }

/* ============ 已归档分组 ============ */
.archived-group { margin-top: 14px; }
.archived-toggle { width: 100%; text-align: left; background: #f0f1f6; color: var(--sub); padding: 10px 12px; font-size: 13px; }
.row.archived { opacity: .7; }
.archived .row-title { text-decoration: line-through; }

/* ============ 弹窗 ============ */
.modal-mask { position: fixed; inset: 0; background: rgba(20,24,40,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 990; }
.modal { background: #fff; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; border-radius: 20px 20px 0 0; animation: up .2s ease; }
.modal-lg { max-width: 480px; }
@keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
.modal-head h3 { margin: 0; font-size: 16px; }
.modal-head .x { background: #f0f1f6; width: 30px; height: 30px; border-radius: 50%; color: var(--sub); }
.modal-body { padding: 12px; }
.modal-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 2px; }
.modal-actions .btn { flex: 1; }

.fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--sub); margin-bottom: 8px; }
.fld input, .fld textarea, .fld select { border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 14px; color: var(--text); font-family: inherit; }
.fld textarea { min-height: 52px; resize: vertical; }
.fld.check { flex-direction: row; align-items: center; gap: 6px; }
/* 紧急任务勾选：标题输入框右侧同行排列，不独占一行 */
.fld-emergency { flex-direction: column; }
.fld-emergency > input { width: 100%; box-sizing: border-box; }
.fld-cap { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.emg-check { display: inline-flex; align-items: center; gap: 5px; }
.emg-check input[type="checkbox"] { width: 16px; height: 16px; accent-color: #e74c3c; flex: 0 0 auto; }
.emg-label { font-size: 13px; font-weight: 600; color: #e74c3c; white-space: nowrap; cursor: pointer; }
.emg-tip { color: #e08e0b; background: #fff7e8; border-radius: 8px; padding: 6px 10px; margin: 0 0 8px; }
.fld-row { display: flex; gap: 10px; }
.fld-row .fld { flex: 1; }
/* AI 批量解析：多条简化列表（复选框 + 任务文字 + 删除叉号）；仅布局，复用现有输入/按钮样式 */
.ai-batch-list { display: flex; flex-direction: column; gap: 8px; margin: 2px 0; }
.ai-batch-row { margin: 0; }
.ai-batch-text { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 14px; color: var(--text); font-family: inherit; background: #fff; min-width: 0; }
.ai-batch-row .ai-check { flex: 0 0 auto; }
.ai-batch-add { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
.ai-batch-folder { margin-top: 8px; }
.ai-batch-folder .folder-select { width: 100%; box-sizing: border-box; cursor: pointer; }
.ai-batch-folder .lbl { font-weight: 600; color: var(--text); }
.ai-batch-tag { margin-top: 8px; }
.tip { font-size: 12px; color: var(--sub); background: #f7f8fc; padding: 6px 10px; border-radius: 8px; margin: 0 0 8px; }
.copy-lock-tip { color: #b26a00; background: #fff6e6; border: 1px solid #ffe1ad; }
.lock-hint { display: inline-block; margin-left: 6px; font-size: 12px; color: #b26a00; }
.fld input:disabled { background: #f1f2f6; color: var(--sub); cursor: not-allowed; }
h4 { font-size: 14px; margin: 8px 0 5px; }

/* 任务详情：三套功能改为「并排按钮 + 独立浮窗」（高级设置 / AI 解析攻略素材 / 进度记录） */
/* 横向并排一行按钮：浅底色带箭头小按钮 */
.panel-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
.panel-btn {
  flex: 1 1 0; min-width: 96px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: #f0f3ff; color: var(--primary);
  border: 1px solid #dde4ff; border-radius: 10px;
  padding: 9px 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  user-select: none; transition: background .12s ease;
}
.panel-btn:hover { background: #e6ecff; }
.panel-btn .caret { font-size: 10px; opacity: .8; }
.panel-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--no); flex: 0 0 auto; }
/* 独立浮窗（teleport 到 body，遮罩仅关闭自身，不影响底层任务详情弹窗） */
.floating-mask {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(15, 23, 42, .42);
  display: flex; align-items: center; justify-content: center;
  padding: 16px; animation: fade .15s ease;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.floating-modal {
  width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto;
  background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.22);
  animation: pop .18s ease;
}
.floating-modal .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.floating-modal .modal-head h3 { margin: 0; font-size: 16px; }
.floating-modal .modal-body { padding: 14px 16px 16px; }

/* 删除二次确认弹窗 */
.confirm-modal { max-width: 320px; border-radius: 16px; animation: pop .18s ease; }
@keyframes pop { from { transform: scale(.92); opacity: .6; } to { transform: scale(1); opacity: 1; } }
.confirm-text { text-align: center; font-size: 15px; font-weight: 600; margin: 6px 0 4px; }
/* 编辑页删除区：与常规编辑内容间距分隔，区隔普通设置与高危操作 */
.del-zone { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }

/* 习惯新增：类型分段选择 */
.seg { display: flex; gap: 8px; margin: 0 0 12px; }
.seg button { flex: 1; background: #f0f1f6; color: var(--sub); padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600; }
.seg button.on { background: var(--primary); color: #fff; }
/* 设置时间：星期多选 / 每月初末 网格 */
.week-pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.week-pick button { background: #f0f1f6; color: var(--sub); padding: 8px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; }
.week-pick button.on { background: var(--primary); color: #fff; }
.cycle-rule { margin: 6px 0 10px; }
.cycle-rule .err { color: var(--no); font-size: 12px; margin: 4px 0 0; }
.fld input.invalid { border-color: var(--no); background: #fff5f5; }
.month-pick { margin: 8px 0; }
.clear-time { width: 100%; margin-top: 8px; background: #f0f1f6; color: var(--sub); }
/* 每天 → 习惯 二次确认弹层 */
.daily-confirm-mask { position: fixed; inset: 0; z-index: 1200; background: rgba(20,24,40,.45); display: flex; align-items: center; justify-content: center; padding: 24px; }
.daily-confirm { background: #fff; border-radius: 16px; padding: 18px; width: min(92vw, 340px); box-shadow: 0 12px 36px rgba(20,24,40,.28); }
.daily-confirm-tip { font-size: 14px; line-height: 1.6; margin: 0 0 16px; color: var(--text); }
.daily-confirm-acts { display: flex; gap: 10px; }
.daily-confirm-acts .btn { flex: 1; }

/* 习惯「更多」底部弹层 */
.modal-sheet { padding: 8px 0 0; }
.sheet-title { text-align: center; font-size: 13px; color: var(--sub); padding: 8px 16px 12px; border-bottom: 1px solid var(--line); }
.sheet-btn { display: block; width: 100%; text-align: center; background: #fff; padding: 15px; font-size: 16px; border-bottom: 1px solid var(--line); }
.sheet-btn:last-child { border-bottom: none; }
.sheet-btn.danger { color: var(--no); }
.sheet-btn.cancel { color: var(--sub); font-weight: 600; }

/* 可点击空提示 */
.empty-tip.clickable { cursor: pointer; }
.empty-tip.clickable:hover { color: var(--primary); text-decoration: underline; }

/* 习惯条目「更多」按钮 */
.btn-mini.more { background: #f0f1f6; color: var(--sub); padding: 6px 10px; }

/* 习惯模块统一新增头部（右上角 ＋新增习惯） */
.habit-mod-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 2px; }
.habit-mod-title { font-size: 17px; font-weight: 700; color: var(--text); }

/* 习惯网格（记录型 / 戒掉型）：纯文字卡片，靠底色 / 置灰区分打卡状态 */
.habit-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.habit-grid-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  flex: 0 0 auto; width: calc(20% - 8px); min-width: 82px; max-width: 108px;
  padding: 12px 6px; border: 1px solid var(--line); border-radius: 14px;
  background: #fff; cursor: pointer; color: var(--text); text-align: center;
  box-shadow: 0 4px 10px rgba(20,24,40,.05);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
}
@media (max-width: 520px) { .habit-grid-btn { width: calc(25% - 8px); } }
.habit-grid-btn:active { transform: scale(.95); filter: brightness(0.96); }
/* 打卡成功：整颗按钮置灰，一眼区分未打卡 / 已打卡 */
.habit-grid-btn.done { background: #eef0f5; border-color: #e3e6ee; box-shadow: none; }
.habit-grid-btn.done .hg-name { color: var(--sub); }
/* 记录型习惯：打卡后变绿（与戒掉型「已戒」灰、破戒红区分） */
.habit-grid-btn.rec-done { background: #e8f6ee; border-color: #bce8cb; box-shadow: none; }
.habit-grid-btn.rec-done .hg-name { color: #1f9d57; }
.habit-grid-btn.fail { background: linear-gradient(135deg, #e74c3c, #c0392b); border-color: transparent; box-shadow: none; }
.habit-grid-btn.fail .hg-name, .habit-grid-btn.fail .hg-val { color: #fff; }
.hg-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.25; }
.hg-val { font-size: 11px; line-height: 1.2; }
.readonly-row { margin: 10px 0 2px; padding: 8px 10px; background: #f5f6fa; border-radius: 8px; font-size: 12px; color: var(--sub); }

/* 习惯类型选择弹窗（统一新增入口） */
.type-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #f7f8fc; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.type-opt:last-child { margin-bottom: 0; }
.type-opt-ico { font-size: 22px; line-height: 1; }
.type-opt-main { display: flex; flex-direction: column; }
.type-opt-name { font-size: 15px; font-weight: 700; color: var(--text); }
.type-opt-desc { font-size: 12px; color: var(--sub); margin-top: 2px; }

/* 攻略候选 */
.strategy textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 7px; min-height: 44px; font-family: inherit; }
.strategy input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 7px; margin-top: 6px; }
/* 攻略候选：单行（复选框居左、文本紧跟、左对齐自动换行）；候选项过多时仅行列表内局部滚动（确认/取消保持可见） */
.candidates { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.cand-list { max-height: 180px; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-bottom: 4px; }
.cand { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.cand input[type="checkbox"] { flex: 0 0 auto; margin-top: 4px; width: 16px; height: 16px; }
.cand-edit { flex: 1; min-width: 0; width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; font-size: 13px; line-height: 1.4; font-family: inherit; color: var(--text); background: #fff; resize: none; max-height: 72px; overflow-y: auto; }

/* 子任务 */
.sub-list { display: flex; flex-direction: column; gap: 6px; }
.sub { display: flex; align-items: center; gap: 8px; background: #fafbff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
.sub span { flex: 1; font-size: 14px; }
.sub span.done { text-decoration: line-through; color: var(--sub); }
.sub .del, .cand .del { color: var(--no); cursor: pointer; font-weight: 700; }
.sub .edit { flex: 0 0 auto; color: var(--primary); cursor: pointer; font-weight: 700; margin-left: 2px; }
.sub .sub-deadline { flex: 0 0 auto; font-size: 12px; color: var(--sub); background: #eef2ff; border-radius: 8px; padding: 2px 8px; cursor: pointer; }
.sub .sub-deadline.overdue { color: #e8862b; background: #fff3e3; font-weight: 600; }
.sub .sub-deadline.remind { color: var(--ok); background: #e8f6ee; }
.sub-add { display: flex; gap: 8px; }
.sub-add input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 7px; }
.sub-add button { background: var(--primary); color: #fff; width: 40px; }

/* 进度 / 素材 */
.progress { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.progress select, .progress input { border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
/* 进度记录折叠面板内的单位行（预设下拉 + 自定义输入） */
.unit-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.unit-row select { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 14px; color: var(--text); font-family: inherit; background: #fff; }
.unit-row input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 14px; color: var(--text); font-family: inherit; }
.prog-value { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 14px; color: var(--text); font-family: inherit; margin-bottom: 2px; }
.material pre { white-space: pre-wrap; background: #f7f8fc; border-radius: 8px; padding: 10px; font-size: 12px; color: var(--sub); max-height: 120px; overflow-y: auto; }
/* 素材备注（主描述）：可编辑多行文本 */
.material-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.material-head .full-edit { background: #eef2ff; color: var(--primary); font-size: 12px; padding: 5px 10px; border-radius: 8px; }
.material-edit { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-family: inherit; font-size: 13px; line-height: 1.6; color: var(--text); box-sizing: border-box; }
.material-edit:focus { outline: none; border-color: var(--primary); }
/* 全屏编辑浮窗（复用折叠面板逻辑） */
.floating-modal.fullscreen { width: min(920px, 94vw); max-height: 92vh; display: flex; flex-direction: column; }
.floating-modal.fullscreen .modal-body { flex: 1; display: flex; padding: 12px; }
.floating-modal.fullscreen .note-full { flex: 1; width: 100%; min-height: 60vh; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-family: inherit; font-size: 15px; line-height: 1.7; color: var(--text); }
.floating-modal.fullscreen .note-full:focus { outline: none; border-color: var(--primary); }
.cycle-hist { display: flex; flex-wrap: wrap; gap: 6px; }

/* 分类管理 */
.cat-manage { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cat-manage input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 9px; }
.cat-manage input.sys { background: #f7f8fc; }
.cat-tag { font-size: 11px; color: var(--sub); }
.cat-lock { font-size: 11px; color: var(--sub); }
.cat-add { display: flex; gap: 8px; margin-top: 8px; }
.cat-add input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 9px; }

/* 习惯补卡 */
.habit-days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 280px; overflow-y: auto; }
.habit-day { border: 1px solid var(--line); border-radius: 8px; padding: 4px; text-align: center; background: #fafbff; }
.habit-day .hd-date { font-size: 11px; color: var(--sub); }
.habit-day select { width: 100%; border: none; background: transparent; font-size: 10px; }
.habit-day.st-success { background: #e8f6ee; }
.habit-day.st-fail { background: #ffeaea; }
.habit-day.st-holiday { background: #eef0f5; }
.holiday-set { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.holiday-set input { border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.holiday-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.holiday-chip { background: #eef0f5; border-radius: 8px; padding: 4px 8px; font-size: 12px; }
.holiday-chip b { color: var(--no); cursor: pointer; margin-left: 4px; }
.cycle-hist { display: flex; flex-wrap: wrap; gap: 6px; }
.cycle-chip { position: relative; background: #eef0f5; border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: default; }
.cycle-chip.done, .cycle-chip.undone { cursor: pointer; }
.cycle-chip.done:active { background: #e2e5ee; }
.cycle-chip.undone { background: #f5f5f7; color: var(--sub); }
.chip-overdue { display: inline-block; margin-left: 4px; background: #fff3e3; color: #e8862b; font-weight: 600; padding: 0 5px; border-radius: 6px; font-size: 11px; vertical-align: 1px; }
.undo-pop { position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 10; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; white-space: nowrap; }
.undo-pop button { background: #fff; border: none; color: var(--no); font-size: 12px; padding: 6px 10px; border-radius: 6px; width: 100%; text-align: left; }
.undo-pop button:active { background: #fbeaea; }

/* ============ 统计页 ============ */
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tabs button { flex: 1; background: #f0f1f6; color: var(--sub); padding: 9px; font-weight: 600; }
.tabs button.on { background: var(--primary); color: #fff; }
.month-view .mv-head { font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.mv-nav button { background: #eef0f5; width: 28px; height: 28px; margin-left: 4px; }
.week-row, .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.week-row span { text-align: center; font-size: 11px; color: var(--sub); padding: 4px 0; }
.cell { aspect-ratio: 1 / 1; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.cell.empty { border: none; }
.cell-day { font-size: 10px; text-align: center; color: var(--sub); padding-top: 2px; }
.cell-pct { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; font-weight: 600; }
.year-view .year-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; height: 140px; align-items: end; }
.ycell { text-align: center; }
.ybar { width: 70%; margin: 0 auto; border-radius: 6px 6px 0 0; min-height: 4px; }
.ym { font-size: 10px; color: var(--sub); margin-top: 4px; }
.habit-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.hbtn { background: #f0f1f6; color: var(--text); padding: 7px 12px; font-size: 13px; }
.hbtn.sel { background: var(--primary); color: #fff; }
/* 习惯选择按钮 + 弹窗（替代旧彩色日历） */
.habit-pick { position: relative; margin-bottom: 10px; }
.habit-pick-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--text); background: #f0f1f6; border: 1px solid var(--line); border-radius: 10px; }
.habit-pick-btn .caret { color: var(--sub); font-size: 12px; }
.habit-pop { position: relative; margin-top: 6px; display: flex; flex-direction: column; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px; max-height: 220px; overflow: auto; box-shadow: var(--shadow); }
.habit-pop-item { text-align: left; padding: 9px 10px; font-size: 13px; color: var(--text); background: #f7f8fc; border: none; border-radius: 8px; }
.habit-pop-item.sel, .habit-pop-item:active { background: var(--primary); color: #fff; }
.seg { display: inline-flex; gap: 4px; margin-bottom: 4px; }
.seg button { padding: 5px 12px; font-size: 12px; border-radius: 8px; background: #f0f1f6; color: var(--sub); border: 1px solid var(--line); }
.seg button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.chart-head { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 4px; }
.nav-arrow { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: #f0f1f6; color: var(--text); font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.nav-arrow:active { background: #e6e8f0; }
.chart { margin-top: 12px; }
.chart-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.bar { flex: 1; background: linear-gradient(180deg, #6a7bff, #8a5bff); border-radius: 6px 6px 0 0; position: relative; min-height: 4px; }
.bar-v { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--sub); }
.bar-m { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--sub); }
.bars.dense { gap: 2px; padding-bottom: 16px; }
.bars.dense .bar-v, .bars.dense .bar-m { display: none; }
.bars.dense .bar-m.axis-key { display: block; font-size: 9px; line-height: 1; bottom: -15px; color: var(--sub); }
.bars.dense .bar { min-height: 3px; }
/* 打卡日历点阵（编辑习惯弹窗内） */
.habit-cal { margin: 10px 0 2px; }
.hc-head { font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 8px; }
.hc-months { display: flex; flex-direction: column; gap: 9px; max-height: 320px; overflow-y: auto; }
.hc-month { display: flex; align-items: center; gap: 8px; }
.hc-mlabel { width: 44px; flex: 0 0 auto; font-size: 11px; color: var(--sub); }
.hc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; flex: 1; }
.hc-dot { width: 100%; aspect-ratio: 1/1; border-radius: 3px; background: #e9ebf0; }
.hc-dot.on { background: linear-gradient(135deg, #6a7bff, #8a5bff); }
.hc-dot.blank { background: transparent; }
.hc-empty { font-size: 12px; color: var(--sub); margin: 0; }
/* 统计页选中习惯的打卡日期清单 */
.habit-dates { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
.hd-title { font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 8px; }
.hd-list { display: flex; flex-wrap: wrap; gap: 6px; }
.hd-chip { background: #eef0f4; color: var(--text); font-size: 12px; padding: 4px 8px; border-radius: 8px; }
.hd-empty { font-size: 12px; color: var(--sub); margin: 0; }
.health { white-space: pre-wrap; background: #f7f8fc; border-radius: 10px; padding: 12px; font-size: 13px; color: var(--text); line-height: 1.7; }
.health-note { font-size: 11.5px; color: var(--sub); margin: 0 0 8px; line-height: 1.5; }
.health-loading { font-size: 13px; color: var(--sub); padding: 10px 0; }
.health-guide { font-size: 13px; color: var(--sub); background: #f7f8fc; border-radius: 10px; padding: 12px; line-height: 1.7; }
.health-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.health-list li { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--text); line-height: 1.55; background: #f7f8fc; border-radius: 10px; padding: 10px 12px; }
.health-list .hi { flex: 0 0 auto; font-size: 16px; line-height: 1.4; }
.health-list .ht { flex: 1; }
.health-foot { font-size: 11.5px; color: var(--sub); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.arch-filter { display: flex; gap: 8px; margin-bottom: 10px; }

/* ============ 时间导航（习惯图表等） ============ */
.mc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.mc-nav { display: flex; align-items: center; gap: 8px; }
.mc-nav button { width: 28px; height: 28px; border: 1px solid var(--line); background: #f0f1f6; border-radius: 8px; font-size: 16px; line-height: 1; color: var(--sub); }
.mc-title { font-weight: 700; font-size: 13px; }
.mc-title.clickable { cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.mc-title.clickable:hover { background: #f0f1f6; }
.mc-tabs { display: flex; gap: 4px; }
.mc-tabs button { padding: 4px 10px; font-size: 12px; border-radius: 8px; background: #f0f1f6; color: var(--sub); }
.mc-tabs button.on { background: var(--primary); color: #fff; }

/* ============ 本周概览 ============ */
.wo-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; }
.wo-head .caret { color: var(--sub); font-size: 13px; }
.wo-head h3 { font-size: 15px; margin: 0; }
.wo-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
.wo-toggle input { width: 38px; height: 22px; }
.wo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wo-card { background: #f7f8fc; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 110px; }
.wo-card h4 { margin: 0; font-size: 12px; color: var(--sub); font-weight: 600; }
.wo-big { font-size: 22px; font-weight: 700; color: var(--text); }
.wo-sub { font-size: 11.5px; color: var(--sub); }
.wo-bars { display: flex; align-items: flex-end; gap: 4px; height: 46px; }
.wo-bars .wb { flex: 1; background: linear-gradient(180deg, #6a7bff, #8a5bff); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
.wo-bars .wb span { position: absolute; top: -14px; left: 0; right: 0; text-align: center; font-size: 9px; color: var(--sub); }
.wo-ring-wrap { display: flex; align-items: center; gap: 12px; }
.wo-ring { width: 56px; height: 56px; flex: 0 0 auto; }
.wo-cat { display: flex; flex-direction: column; gap: 4px; }
.wo-cat-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
.wo-cat-row .nm { color: var(--text); }
.wo-cat-row .ct { color: var(--sub); }
.wo-empty { font-size: 12px; color: var(--sub); text-align: center; padding: 14px 0; }
.wo-timebars { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.wo-tb-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.wo-tb-row .tb-nm { flex: 0 0 56px; color: var(--text); }
.wo-tb-track { flex: 1; background: #eceef4; border-radius: 6px; height: 14px; overflow: hidden; }
.wo-tb-fill { height: 100%; background: linear-gradient(90deg, #6a7bff, #8a5bff); border-radius: 6px; }
.wo-tb-val { flex: 0 0 auto; color: var(--sub); min-width: 28px; text-align: right; }
.wo-hint { font-size: 11px; color: var(--sub); margin-top: 2px; }

.arch-date-input { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.arch-date-input input { width: 160px; border: 1px solid var(--line); border-radius: 10px; padding: 9px; font-size: 14px; font-family: inherit; }
.arch-date-input input.invalid { border-color: var(--no); background: #fff5f5; }
.arch-sel-tip { font-size: 11.5px; color: var(--primary); margin: 10px 0 8px; }
/* 归档仓库 MiniCal 日历点阵 */
.arch-cal { margin-bottom: 8px; }
.arch-cal .mc-head { margin-bottom: 10px; }
.arch-month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
.arch-month-grid .wkday { font-size: 10px; color: var(--sub); text-align: center; padding: 4px 0 2px; font-weight: 600; }
.arch-cell { aspect-ratio: 1/1; border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; font-size: 12px; color: var(--text); background: #fafbfc; transition: background .15s, border-color .15s; }
.arch-cell.empty { border: none; background: transparent; cursor: default; }
.arch-cell.has-data { background: #e8ecff; border-color: #c4cbff; font-weight: 600; }
.arch-cell.sel { border-color: var(--primary); background: #eef0ff; box-shadow: 0 0 0 2px rgba(106,123,255,.25); }
.arch-cell.today { border-color: var(--primary); border-style: dashed; }
.arch-cell .arch-cell-day { font-size: 12px; line-height: 1; }
.arch-cell .arch-cell-count { font-size: 9px; color: var(--primary); font-weight: 700; margin-top: 1px; }
/* 年视图：12 月热力图 */
.arch-year-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.arch-ym { text-align: center; padding: 8px 4px; border-radius: 10px; background: #f7f8fc; cursor: pointer; font-size: 12px; color: var(--text); transition: background .15s; }
.arch-ym.has-data { background: #e8ecff; font-weight: 600; }
.arch-ym.sel { background: #eef0ff; box-shadow: 0 0 0 2px rgba(106,123,255,.25); }
.arch-ym .arch-ym-num { font-size: 18px; font-weight: 700; color: var(--primary); display: block; }
.arch-filter input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 9px; }
/* 待归档全局搜索（复用 .arch-filter 输入框样式；仅补充搜索区与清除按钮布局） */
.inbox-search { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.inbox-search .search-clear { flex: none; background: #f0f1f6; color: var(--sub); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font-size: 15px; cursor: pointer; }
.search-count { font-size: 12px; color: var(--sub); margin: 10px 2px 4px; }
/* 项目搜索结果：子任务条目显示其归属项目作为上下文 */
.sub-prefix { color: var(--sub); margin-right: 2px; }
.sub-parent { color: var(--sub); margin-right: 6px; }

/* ============ 通用弹窗卡片（时间线/周期汇总等模态复用） ============ */
.modal-card { width: 92%; max-width: 440px; background: #fff; border-radius: 16px; padding: 16px; margin: 0 auto 12px; box-shadow: 0 10px 40px rgba(20,24,40,.25); }
.modal-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; color: var(--text); }

/* ============ 纵向时间线面板（统计页 · 全局已归档仓库） ============ */
.tl-panel { margin: 4px 0 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tl-head { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 10px; }
.tl-list { position: relative; }
.tl-item { display: flex; gap: 10px; align-items: stretch; cursor: pointer; padding: 4px 0; }
.tl-axis { flex: 0 0 52px; display: flex; flex-direction: column; align-items: center; position: relative; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); margin-top: 4px; z-index: 2; flex: 0 0 auto; }
/* 浅灰竖线：串联全部条目（除最后一条外向下延伸） */
.tl-item:not(:last-child) .tl-axis::after {
  content: ''; position: absolute; top: 14px; bottom: -4px; width: 2px; background: #e6e8ef; left: 50%; transform: translateX(-50%);
}
.tl-time { font-size: 11px; color: var(--sub); margin-top: 2px; text-align: center; }
.tl-card { flex: 1; background: #f7f8fc; border-radius: 10px; padding: 8px 10px; border: 1px solid var(--line); }
.tl-item.tl-subtask .tl-card { background: #eef4ff; }
.tl-item.tl-copy .tl-card { background: #e8f8ee; }
.tl-item.tl-subtask .tl-dot { background: #3aa0ff; }
.tl-item.tl-copy .tl-dot { background: #34c759; }
.tl-item.tl-task.tl-copy .tl-dot, .tl-item.tl-subtask.tl-copy .tl-dot { background: #34c759; }
.tl-title { font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.3; }
.tl-period { font-size: 12px; color: var(--sub); margin-top: 2px; }
.tl-tags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.tl-summary-btn { margin-top: 6px; font-size: 11.5px; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 5px 9px; }
.tl-summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.tl-total { font-size: 13px; color: var(--text); }
.tl-total b { color: var(--primary); font-size: 15px; }
.tl-summary-entry { font-size: 11.5px; background: #eef0f5; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }

/* 时间线编辑弹窗 */
.tl-edit-title { font-size: 13px; color: var(--text); margin-bottom: 10px; font-weight: 600; }
.tl-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--sub); margin-bottom: 8px; }
.tl-field input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 14px; }
.tl-edit-dur { font-size: 12px; color: var(--sub); margin: 4px 0 0; }

/* 周期/区间任务汇总面板 */
.cs-list { display: flex; flex-direction: column; gap: 8px; max-height: 56vh; overflow: auto; }
.cs-list-item { background: #f7f8fc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.cs-list-item:active { filter: brightness(.97); }
.cs-li-name { font-size: 13.5px; font-weight: 600; color: var(--text); }
.cs-li-meta { font-size: 12px; color: var(--sub); margin-top: 3px; }
.cs-back { font-size: 12.5px; color: var(--primary); margin-bottom: 8px; cursor: pointer; }
.cs-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.cs-stats { display: flex; gap: 8px; margin-bottom: 12px; }
.cs-stat { flex: 1; background: #f7f8fc; border-radius: 10px; padding: 10px 6px; text-align: center; }
.cs-num { display: block; font-size: 16px; font-weight: 700; color: var(--primary); }
.cs-lbl { display: block; font-size: 11px; color: var(--sub); margin-top: 2px; }
.cs-bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; overflow-x: auto; padding: 4px 2px 0; border-bottom: 1px solid var(--line); }
.cs-bar-col { flex: 0 0 auto; width: 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.cs-bar { width: 22px; background: linear-gradient(180deg, #6a7bff, #8a5bff); border-radius: 5px 5px 0 0; min-height: 4px; }
.cs-bar-d { font-size: 9px; color: var(--sub); margin-top: 3px; white-space: nowrap; }
.cs-bar-v { font-size: 9px; color: var(--sub); }
.cs-dates { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; max-height: 30vh; overflow: auto; }
.cs-date-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text); }

/* ============ 组件页 ============ */
.widget { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; box-shadow: var(--shadow); }
.widget-title { font-weight: 700; margin-bottom: 10px; }

/* ============ 底部导航 ============ */
.app-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(40,50,90,.06); z-index: 900; padding-bottom: env(safe-area-inset-bottom, 0px); }
.app-nav button { flex: 1; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; color: var(--sub); }
.app-nav button.on { color: var(--primary); }
.nav-ico { font-size: 20px; }
.nav-txt { font-size: 11px; }

/* ============ 安装到主屏幕（PWA） ============ */
#install-pill {
  position: fixed; right: 14px; bottom: var(--pill-bottom); z-index: 80;
  background: var(--primary); color: #fff; border: none; border-radius: 22px;
  padding: 10px 16px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 18px rgba(40,50,90,.25);
}
#install-pill[hidden] { display: none; }

/* ============ 全局悬浮快速录入（紫色；支持长按拖动） ============ */
.quick-entry { position: static; }
.fab {
  position: fixed; z-index: 850;
  width: 56px; height: 56px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
  background: linear-gradient(135deg, #a06bff, #7b5bff); color: #fff; font-size: 24px; line-height: 1;
  box-shadow: 0 8px 22px rgba(123, 91, 255, .45);
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none; touch-action: none;
  transition: transform .12s ease, box-shadow .12s ease;
}
.fab:active { transform: scale(.92); }
.fab.dragging { transition: none; box-shadow: 0 12px 28px rgba(123, 91, 255, .6); }
/* 弹层外部透明遮罩：点击关闭（输入不丢） */
.quick-mask { position: fixed; inset: 0; z-index: 1099; background: transparent; }
.quick-pop {
  position: fixed; right: 16px; bottom: 152px; z-index: 1101;
  width: min(92vw, 360px); box-sizing: border-box;
  background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px;
  box-shadow: 0 12px 32px rgba(40, 50, 90, .22);
  display: flex; flex-direction: column; gap: 10px;
}
.quick-pop input, .quick-pop textarea {
  width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 10px; font-size: 14px; font-family: inherit; color: var(--text); background: #fff;
}
.quick-pop textarea { min-height: 58px; resize: vertical; }
.quick-pop .qp-actions { display: flex; gap: 8px; margin-top: 8px; }
.quick-pop .qp-actions .btn { flex: 1; }
.quick-pop .qp-divider { display: flex; align-items: center; gap: 8px; color: var(--sub); font-size: 12px; }
.quick-pop .qp-divider::before, .quick-pop .qp-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.pop-enter-active, .pop-leave-active { transition: opacity .15s ease; }
.pop-enter-from, .pop-leave-to { opacity: 0; }

/* ============ 预期回顾标记 ============ */
.row.task-row.hint { background: #fff7e0; }
/* 父任务含子任务：复用系统已有淡黄底色（#fff7e0），与预期回顾标记同色，仅触发条件不同 */
.row.task-row.has-sub { background: #fff7e0; }
.hint-tag { display: inline-block; background: #ffe6a3; color: #8a6300; font-size: 11px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; }

/* ============ 待归档列表滑动手势（与今日页 HandCards 方向统一） ============ */
/* 仅启用横向滑动交互，触摸设备允许纵向滚动、由 JS 接管横向拖拽；不改变静态视觉 */
.row.task-row.swipeable { touch-action: pan-y; -webkit-user-select: none; user-select: none; will-change: transform; }
/* 一键「紧急置顶」按钮：行首圆形按钮，仅翻转 isEmergency 标记，不动任何日期/周期配置 */
.row-emg-btn { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; margin-right: 2px; }
.row-emg-btn:active { transform: scale(.92); }
.row-emg-btn.on { background: #ffe9e6; border-color: #ff7a59; box-shadow: 0 0 0 2px rgba(255,122,89,.18); }

/* 全局已归档仓库：滑动手势（仅左滑=撤销归档）。形式与项目页「已归档 Tab」一致：
   卡片左移，右侧露出绿色渐变提示，越过阈值直接执行并提示，不再弹二次确认 */
.row.swipe { position: relative; overflow: hidden; padding: 0; border: none; background: transparent; touch-action: pan-y; -webkit-user-select: none; user-select: none; will-change: transform; }
.row.swipe .swipe-hint { position: absolute; top: 0; bottom: 0; right: 0; display: flex; align-items: center; font-weight: 700; color: #fff; font-size: 15px; z-index: 0; padding: 0 18px; justify-content: flex-end; pointer-events: none; white-space: nowrap; background: linear-gradient(270deg, #1f9d57, rgba(31,157,87,0)); }
.row.swipe .swipe-hint.right { right: 0; }
.row.swipe .row-main { position: relative; z-index: 1; background: #fafbff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; transition: transform .18s ease; }
.row.swipe .row-main.dragging { transition: none; }

/* ============ 分类拖拽排序 ============ */
.cat-manage { display: flex; align-items: center; gap: 8px; background: #f7f8fc; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
.cat-manage .drag { cursor: grab; color: var(--sub); user-select: none; }
.cat-manage input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 7px; }
.cat-manage input.sys { font-weight: 600; color: var(--primary); }
.cat-tag { font-size: 11px; color: var(--sub); }
.cat-manage button[disabled] { opacity: .45; cursor: not-allowed; }
.drag-dot { margin-left: 4px; color: var(--sub); cursor: grab; font-size: 11px; opacity: .55; }
.switch { background: #f0f1f6; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; }

/* ============ 项目模块 ============ */
.block-new { width: 100%; margin-bottom: 14px; }

/* ============ 待归档子任务页：顶部常驻快捷创建输入框（进度条下方，滚动时常驻） ============ */
.inbox-sub-page { padding-bottom: 70px; }
.sub-quick-add {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 12px;
  padding: 8px 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 6px 20px rgba(20,24,40,.10);
}
.sub-quick-add input {
  flex: 1; min-width: 0; border: none; background: #f4f6fb;
  border-radius: 12px; padding: 11px 14px; font-size: 15px; color: var(--text); outline: none;
}
.sub-quick-add input::placeholder { color: var(--sub); }
.sub-quick-add-btn {
  flex: none; width: 42px; height: 42px; border-radius: 12px;
  background: var(--primary); color: #fff; border: none;
  font-size: 22px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.sub-quick-add-btn:active { transform: scale(.94); }
.proj-list { display: flex; flex-direction: column; gap: 12px; }
.proj-card { position: relative; overflow: hidden; border-radius: var(--radius); cursor: pointer; touch-action: pan-y; }
.proj-inner { position: relative; z-index: 1; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; transition: transform .18s ease; }
/* —— 项目/文件夹卡片滑动手势（左滑归档 / 右滑撤销归档） —— */
.swipe-hint { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font-weight: 700; color: #fff; font-size: 15px; z-index: 0; padding: 0 18px; pointer-events: none; white-space: nowrap; }
.swipe-hint.left { left: 0; background: linear-gradient(90deg, #ff7a45, rgba(255,122,69,0)); }
.swipe-hint.right { right: 0; background: linear-gradient(270deg, #1f9d57, rgba(31,157,87,0)); justify-content: flex-end; }
.proj-inner.dragging, .folder-inner.dragging { transition: none; }
.proj-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.proj-name { font-size: 16px; font-weight: 700; }
.proj-status { font-size: 11px; padding: 2px 9px; border-radius: 9px; background: #eef0ff; color: var(--primary); }
.proj-status.finish { background: #e8f6ee; color: #1f9d57; }
.proj-status.archive { background: #f0f1f6; color: var(--sub); }
.proj-deadline { margin-top: 8px; font-size: 13px; }
.cd-ok { color: #1f9d57; }
.cd-warn { color: #e08e0b; font-weight: 600; }
.cd-over { color: #e8862b; font-weight: 600; }
.proj-progress { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.pbar { flex: 1; background: #eef0f5; border-radius: 6px; height: 8px; overflow: hidden; }
.pbar-fill { height: 100%; background: linear-gradient(90deg, #6a7bff, #8a5bff); border-radius: 6px; transition: width .25s ease; }
.proj-progress .pct { font-size: 12px; color: var(--sub); min-width: 38px; text-align: right; }
.proj-subs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sub-chip { font-size: 12px; background: #f0f1f6; color: var(--text); padding: 3px 9px; border-radius: 8px; }
.sub-more { font-size: 12px; color: var(--sub); padding: 3px 4px; }
.proj-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.proj-actions-legacy { display: none; }

.detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.detail-head .back { background: #f0f1f6; color: var(--sub); padding: 6px 12px; border-radius: 10px; font-size: 14px; }
.detail-title { flex: 1; font-size: 18px; font-weight: 700; }
.detail-acts { display: flex; gap: 6px; }
.tpl-reset-btn { background: #fff; color: #2d6cff; border: 1px solid #c9d8ff; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.tpl-reset-btn:active { background: #eaf1ff; }
.proj-meta { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
.meta-cd { font-size: 14px; margin-bottom: 8px; }
.meta-prog { display: flex; align-items: center; gap: 8px; }
.meta-none { font-size: 13px; color: var(--sub); }

.sub-list2, .idea-list2 { display: flex; flex-direction: column; gap: 12px; }
.psub { position: relative; overflow: hidden; background: var(--card); border-radius: var(--radius); padding: 13px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.psub-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.psub-title { font-size: 15px; font-weight: 600; }
.psub-unit { font-size: 12px; color: var(--sub); white-space: nowrap; }
.psub-prog { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.psub-prog .pct { font-size: 11px; color: var(--sub); min-width: 150px; }
.psub-span-wrap { margin-top: 8px; }
.psub-span-text { display: inline-block; font-size: 12px; color: var(--sub); background: #eef2ff; border-radius: 8px; padding: 2px 8px; }
.psub-span-text.overdue { color: #e8862b; background: #fff3e3; font-weight: 600; }
.psub-acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.psub-acts .btn-mini { padding: 4px 10px; font-size: 12px; border-radius: 13px; }
.detail-acts .btn-mini { padding: 5px 11px; font-size: 13px; border-radius: 9px; }
.proj-actions .btn-mini { padding: 5px 11px; font-size: 12px; border-radius: 9px; }

.pidea { background: var(--card); border-radius: var(--radius); padding: 13px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.pidea-top { display: flex; align-items: center; justify-content: flex-start; gap: 6px; }
.pidea-title { font-size: 15px; font-weight: 600; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idea-badge { font-size: 11px; padding: 2px 9px; border-radius: 9px; }
.idea-badge.todo { background: #fff3e0; color: #e08e0b; }
.idea-badge.picked { background: #e8f6ee; color: #1f9d57; }
.pidea-content { white-space: pre-wrap; background: #f7f8fc; border-radius: 10px; padding: 10px; font-size: 13px; color: var(--text); line-height: 1.6; margin: 8px 0; max-height: 160px; overflow-y: auto; }
.pidea-preview { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #f7f8fc; border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--text); line-height: 1.5; margin: 8px 0; }
.link-ico { flex: 0 0 auto; width: 28px; height: 28px; border: none; background: transparent; color: var(--primary); font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; border-radius: 8px; }
.link-ico:active { background: rgba(91,108,255,.12); }
.pidea-acts { display: flex; flex-wrap: wrap; gap: 6px; }

/* 列表 / 甘特图 视图切换 */
.view-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
.view-toggle button { flex: 1; background: #f0f1f6; color: var(--sub); padding: 9px; border-radius: 10px; font-size: 14px; font-weight: 600; }
.view-toggle button.on { background: var(--primary); color: #fff; }

/* 子任务完成态按钮 */
.btn-mini.success { background: #e8f6ee; color: #1f9d57; }

/* —— 项目详情：总进程栏右上角甘特图小圆按钮 —— */
.proj-meta { position: relative; }
.gantt-fab { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: #f0f1f6; border: 1px solid var(--line); font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; }
.gantt-fab.on { background: var(--primary); border-color: var(--primary); }
/* 为右上角甘特图 FAB 按钮（absolute 定位）预留右侧空间，避免遮挡进度条 / 倒数日文字 */
.proj-meta .meta-cd, .proj-meta .meta-prog, .proj-meta .meta-none { padding-right: 40px; }

/* —— 项目子任务 / 灵感素材卡片：滑动 + 长按手势（仅项目详情页） —— */
.psub.swipe-card, .pidea.swipe-card { touch-action: pan-y; -webkit-user-select: none; user-select: none; will-change: transform; transition: transform .18s ease; }
.psub.swipe-card.dragging, .pidea.swipe-card.dragging { transition: none; }

/* 子任务状态标签（右上角，跟随完成状态自动切换） */
.psub-status { flex: 0 0 auto; font-size: 11px; padding: 2px 9px; border-radius: 9px; background: #eef0ff; color: var(--primary); white-space: nowrap; }
.psub-status.done { background: #e8f6ee; color: #1f9d57; }
.psub-status.custom { background: #fff4e0; color: #c77800; } /* 自定义非完成状态，琥珀色区分 */
/* 状态选择器（子任务编辑弹窗） */
.status-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.status-chip { font-size: 12px; padding: 5px 11px; border-radius: 14px; border: 1px solid #e3e5ee; background: #fff; color: var(--sub); cursor: pointer; }
.status-chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.status-chip.done.on { background: #1f9d57; border-color: #1f9d57; }
.status-chip.custom.on { background: #c77800; border-color: #c77800; }
.status-add { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.status-add input { flex: 1; }

/* —— 标签体系（项目 / 子任务 #标签） —— */
.proj-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.ptag { font-size: 11px; background: #eef2ff; color: var(--primary); padding: 2px 8px; border-radius: 8px; }
.tag-edit { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
.tag-edit .ptag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.tag-edit .ptag .ptag-x { cursor: pointer; color: var(--sub); font-weight: 700; padding: 0 2px; }
.tag-edit .ptag .ptag-x:hover { color: #e74c3c; }

/* —— 项目首页：可折叠标签筛选栏 —— */
.tagbar { margin-bottom: 12px; }
.tagbar-toggle { width: 100%; text-align: left; background: #f0f1f6; color: var(--sub); padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; }
.tagbar-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 4px 2px; }
.tagbar-list .ptag { cursor: pointer; font-size: 12px; padding: 4px 10px; }
.tagbar-list .ptag.on { background: var(--primary); color: #fff; }

/* —— 已归档项目文件夹 —— */
.folder-card { background: transparent; border-radius: var(--radius); }
.folder-card.sub { margin-left: 12px; margin-top: 2px; }
.folder-head { position: relative; overflow: hidden; border-radius: var(--radius); cursor: pointer; touch-action: pan-y; padding: 0; }
.folder-inner { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); transition: transform .18s ease; }
.folder-name { flex: 1; font-size: 14px; font-weight: 700; }
.folder-cnt { font-size: 12px; color: var(--sub); }
.folder-head .btn-mini { padding: 3px 9px; font-size: 11px; border-radius: 8px; }
.folder-body { padding: 4px 4px 8px; display: flex; flex-direction: column; gap: 10px; }
/* —— 操作反馈 Toast —— */
.toast { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); background: rgba(20,22,30,.88); color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 1600; pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
.proj-move-list { display: flex; flex-direction: column; gap: 8px; max-height: 40vh; overflow-y: auto; margin: 8px 0; }
.proj-move-list button { text-align: left; background: #f7f8fc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.proj-move-list button.cur { border-color: var(--primary); color: var(--primary); font-weight: 600; }

/* —— 灵感素材左滑：悬浮二选一弹窗 —— */
.idea-choice-box { background: #fff; border-radius: 16px; padding: 18px; max-width: 320px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.idea-choice-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.idea-choice-box .choice-btn { width: 100%; margin-bottom: 8px; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 600; background: #eef2ff; color: var(--primary); }
.idea-choice-box .choice-btn.alt { background: #fff3e0; color: #e08e0b; }
.idea-choice-box .choice-btn.danger { background: #ffe9e9; color: #e0443c; }
.idea-choice-box .choice-cancel { width: 100%; padding: 9px; border-radius: 10px; font-size: 13px; background: #f0f1f6; color: var(--sub); }

/* —— 灵感素材：详情笔记全屏输入 —— */
.fld-note-head { display: flex; align-items: center; justify-content: space-between; }
.fs-note-btn { background: #f0f1f6; color: var(--sub); font-size: 12px; padding: 3px 10px; border-radius: 8px; }
.fullnote-mask { position: fixed; inset: 0; background: #fff; z-index: 1200; display: flex; flex-direction: column; }
.fullnote-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.fullnote-head h3 { margin: 0; font-size: 16px; }
.fullnote-acts { display: flex; gap: 8px; }
.fullnote-mask textarea { flex: 1; border: none; outline: none; resize: none; padding: 14px 16px; font-size: 15px; line-height: 1.7; font-family: inherit; }

/* —— 甘特图（只读可视化） —— */
.gantt-scroll { max-height: 62vh; overflow: auto; -webkit-overflow-scrolling: touch; }
.gantt-inner { display: flex; flex-direction: column; }
.gantt-head, .gantt-row { display: flex; align-items: stretch; }
.gantt-label { position: sticky; left: 0; z-index: 2; flex: 0 0 88px; width: 88px; background: #fff; padding: 8px 8px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gantt-corner { color: var(--sub); font-size: 12px; font-weight: 600; }
.gantt-track-head { position: relative; border-bottom: 1px solid var(--line); }
.gantt-tick { position: absolute; top: 6px; font-size: 10px; color: var(--sub); border-left: 1px dashed #e3e6ef; padding-left: 3px; white-space: nowrap; }
.gantt-row { border-bottom: 1px solid var(--line); }
.gantt-track { position: relative; }
.gantt-bar { position: absolute; top: 10px; height: 22px; border-radius: 6px; background: var(--primary); cursor: pointer; display: flex; align-items: center; justify-content: center; min-width: 14px; box-shadow: 0 1px 3px rgba(40,50,90,.18); }
.gantt-bar.done { background: #c2c8d6; }
.gantt-pct { color: #fff; font-size: 10px; font-weight: 600; padding: 0 4px; }
.gantt-bar.done .gantt-pct { color: #4a4f5e; }
.gantt-none { position: absolute; top: 14px; left: 6px; font-size: 11px; color: var(--sub); }
.gantt-empty { padding: 28px 12px; font-size: 14px; }
.gantt-tip { margin: 10px 2px 2px; }

.rec-hist { max-height: 200px; overflow-y: auto; margin: 8px 0; }
.rec-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 7px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
.rec-main { display: flex; align-items: center; gap: 8px; }
.rec-row b { color: var(--primary); }
.hist-time { color: var(--sub); font-size: 12px; }
.rec-undo { margin-left: auto; background: none; border: none; color: var(--sub); font-size: 12px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.rec-undo:hover { color: #e74c3c; background: #ffeaea; }
/* 填报历史中的备注：占满整行换行显示 */
.rec-note { font-size: 12px; color: var(--sub); margin-left: 6px; white-space: pre-wrap; word-break: break-word; }
/* 填报历史标题行 + 图表入口；.hist-head 供「执行历史」折叠标题行复用同一布局
   （不并入 .rec-head 的 h4 margin:0 规则，保证执行历史标题原有间距不变） */
.rec-head, .hist-head { display: flex; align-items: center; justify-content: space-between; }
.rec-head h4 { margin: 0; }
.rec-chart { background: none; border: none; font-size: 17px; line-height: 1; cursor: pointer; padding: 3px 7px; border-radius: 8px; }
.rec-chart:hover { background: #f0f1f6; }
/* 填报统计图表弹窗（只读，左右滑动：周/月统计） */
.chart-confirm { position: fixed; inset: 0; background: rgba(20,24,40,.55); display: flex; align-items: center; justify-content: center; z-index: 990; padding: 20px; }
.chart-box { background: #fff; border-radius: 16px; max-width: 420px; width: 100%; max-height: 86vh; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; touch-action: pan-y; }
.chart-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.chart-head h3 { margin: 0; font-size: 16px; }
.chart-head .x { background: #f0f1f6; width: 30px; height: 30px; border-radius: 50%; color: var(--sub); border: none; cursor: pointer; }
.chart-viewport { overflow: hidden; flex: 1; }
.chart-track { display: flex; transition: transform .28s ease; will-change: transform; }
.chart-page { flex: 0 0 100%; width: 100%; padding: 14px; box-sizing: border-box; }
.chart-sec-title { font-size: 13px; color: var(--sub); margin: 0 0 10px; }
.chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; overflow-x: auto; padding: 4px 2px 0; border-bottom: 1px solid var(--line); }
.chart-bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 28px; flex: 1; }
.bar-val { font-size: 10px; color: var(--sub); margin-bottom: 2px; white-space: nowrap; height: 12px; }
.bar-col { width: 60%; background: linear-gradient(180deg, #6a7bff, #8a5bff); border-radius: 5px 5px 0 0; min-height: 2px; transition: height .25s ease; }
.bar-label { font-size: 10px; color: var(--sub); margin-top: 4px; white-space: nowrap; }
.chart-sum { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.sum-item { font-size: 13px; background: #f7f8fc; border-radius: 10px; padding: 9px 12px; }
.sum-item b { color: var(--primary); }
.chart-dots { display: flex; justify-content: center; gap: 8px; padding: 10px 0 4px; }
.chart-dots .dot { width: 8px; height: 8px; border-radius: 50%; background: #d3d6e0; cursor: pointer; transition: all .2s; }
.chart-dots .dot.on { background: var(--primary); width: 20px; border-radius: 4px; }
.chart-hint { text-align: center; font-size: 11px; color: var(--sub); padding: 0 0 12px; }
/* 撤销填报二次确认 */
.undo-confirm { position: fixed; inset: 0; background: rgba(20,24,40,.55); display: flex; align-items: center; justify-content: center; z-index: 990; padding: 20px; }
