  /* =====================================================================
   * SubTaskEditModal —— 子任务编辑弹窗
   * 时间模块：复刻主任务详情「全部时间字段」（仅年月 / 年月日 / 自定义区间 + 周期），
   *   与主任务编辑页共用同一 TaskFormCore 时间面板、字段种类与数据存储逻辑；
   *   唯二差异：(1) 隐藏「标签」分组（hideTag）；(2) 子任务本身无分类归属。
   *   删除旧「截止时间」单选项，时间数据跟随主任务时间体系联动渲染。
   * ===================================================================== */
  C.SubTaskEditModal = {
    name: 'SubTaskEditModal',
    props: { taskId: { type: String, required: true }, subId: { type: String, default: '' } },
    components: { TaskFormCore: C.TaskFormCore },
    data() {
      return {
        form: null, showDel: false, showTerminateConfirm: false,
        // 执行历史折叠状态（与主任务执行历史一致：仅临时生效、默认折叠，不做持久化）
        execHistOpen: false,
      };
    },
    computed: {
      sub() { const t = this.$store.findTask(this.taskId); return t ? (t.sub_tasks.find(s => s._id === this.subId) || null) : null; },
      isNew() { return !this.subId; },
      // 执行历史：枚举全部生成日期（与主任务 execHistory 口径一致）
      // 周期任务按 cycle_end_date 生成完整区间；区间任务按起止日枚举；每个日期标注完成/延期状态
      finishHist() {
        const s = this.sub;
        if (!s) return [];
        const U = this.$store.util;
        const dates = [];
        if (s.cycle) {
          // 次数模式：执行历史按周期推算前 N 个执行日
          if (s.cycle_end_mode === 'count' && s.cycle_end_count > 0) {
            dates.push(...this.$store.cycleCountDates(s));
          } else {
            const cycle = s.cycle;
            const end = s.cycle_end_date || '';
            const base = s.cycle._base || (s.create_at ? U.fmt(new Date(s.create_at)) : U.todayStr());
            dates.push(...this.$store.cycleOccurrenceDates(cycle, end, { base }));
          }
        } else if (s.date_mode === 'range' && s.date_start) {
          const sDate = s.date_start;
          const eDate = s.date_end || '';
          const finish = eDate || U.addDays(U.todayStr(), 60);
          let cur = sDate, n = 0;
          while (cur <= finish && n < 4000) { dates.push(cur); cur = U.addDays(cur, 1); n++; }
        } else {
          return [];
        }
        const hist = s.cycle_history || [];
        return dates.map(ds => ({
          execute_date: ds,
          is_archived: hist.some(h => h.execute_date === ds && h.is_archived),
          overdue: hist.some(h => h.execute_date === ds && h.overdue),
        }));
      },
      // 执行历史打卡/撤销：双向同步（与主任务 toggleOccurrence 口径一致）
      // 全部日期完成 → 自动归档子任务母本；撤销任一打卡 → 退回待归档
      toggleSubOccurrence(date, done) {
        const s = this.sub;
        if (!s) return;
        if (done) {
          if (!this.$store.cycleArchivedToday(s, date)) {
            s.cycle_history.push({ execute_date: date, is_archived: true, overdue: date < this.$store.util.todayStr() });
          }
        } else {
          const idx = s.cycle_history.map(h => h.execute_date).lastIndexOf(date);
          if (idx >= 0) s.cycle_history.splice(idx, 1);
        }
        // 全部完成 → 自动归档子任务母本
        if (this.$store.allOccurrencesDone(s) && !s.is_archived) { s.is_archived = true; s.autoArchivedByCopies = true; }
        // 撤销后未全完成 → 子任务母本退回待归档（仅自动归档情形）
        if (!done && s.is_archived && s.autoArchivedByCopies && !this.$store.allOccurrencesDone(s)) { s.is_archived = false; s.autoArchivedByCopies = false; }
        this.$store.persist();
      },
      // —— 执行历史模块可见性：与主任务口径一致 ——
      // 仅「周期子任务」或「自定义区间子任务」展示；新建态与普通一次性子任务整块隐藏。
      hasExecHist() {
        const s = this.sub;
        if (this.isNew || !s) return false;
        return !!(s.cycle || (s.date_mode === 'range' && s.date_start));
      },
    },
    created() {
      const s = this.sub;
      const base = { title: '', desc: '', material_notes: '', material_link: '', category_id: null, parent_category: '', date_mode: '', plan_year: null, plan_month: '', execute_date: '', date_start: '', date_end: '', enable_remind: false, remind_time: '', cycle: null, progress_info: { enable: false, media_type: 'book', progress_value: '' }, isEmergency: false, week_offset: null, time_mode: null, cycle_end_date: '', cycle_end_mode: '', cycle_end_count: 0 };
      if (s) {
        this.form = Object.assign({}, base, {
          title: s.title || '',
          desc: s.desc || '',
          material_notes: s.material_notes || '',
          material_link: s.material_link || '',
          category_id: s.category_id || null,
          parent_category: s.parent_category || '',
          date_mode: dateModeOfTask(s),
          plan_month: (s.plan_year && s.plan_month) ? (s.plan_year + '-' + String(s.plan_month).padStart(2, '0')) : (s.plan_month || ''),
          execute_date: s.execute_date || s.sub_deadline || '',
          date_start: s.date_start || '',
          date_end: s.date_end || '',
          enable_remind: !!(s.enable_remind || s.sub_remind),
          remind_time: s.remind_time || s.sub_remind_time || '',
          cycle: s.cycle ? JSON.parse(JSON.stringify(s.cycle)) : null,
          progress_info: s.progress_info ? JSON.parse(JSON.stringify(s.progress_info)) : { enable: false, media_type: 'book', progress_value: '' },
          isEmergency: !!s.isEmergency,
          week_offset: (s.week_offset != null) ? s.week_offset : null,
          time_mode: s.time_mode || null,
          cycle_end_date: s.cycle_end_date || '',
          cycle_end_mode: s.cycle_end_mode || (s.cycle_end_date ? 'date' : ''),
          cycle_end_count: s.cycle_end_count || 0,
        });
      } else {
        this.form = base;
      }
      // 浮层栈：作为弹窗登记 dismiss，系统返回优先关闭本弹窗（返回父任务页，不改写路由）
      this._overlayDismiss = () => this.$emit('close');
      this.$root.pushOverlay(this._overlayDismiss);
    },
    methods: {
      // 完整回写主任务时间体系字段（与主任务 addTask/updateTask 一致）
      extra() {
        const df = dateFieldsFromDraft(this.form);
        return {
          title: this.form.title.trim(),
          desc: this.form.desc || '',
          material_notes: this.form.material_notes || '',
          material_link: this.form.material_link || '',
          category_id: this.form.category_id || null,
          parent_category: this.form.parent_category || '',
          // 周期规则存前归一化分隔符（逗号 → 空格），与 TaskFormCore / 主任务详情保存口径一致；
          // 存储结构 {type, rule} 不变（仅 rule 文本归一化），保留原有周期数值逻辑
          cycle: (() => {
            const c = this.form.cycle;
            if (!c) return null;
            if (c.type === 'week' || c.type === 'month') {
              return Object.assign({}, c, { rule: this.$store.util.normalizeCycleRule(c.rule) });
            }
            return c;
          })(),
          progress_info: this.form.progress_info,
          date_mode: df.date_mode || '',
          plan_year: df.plan_year || null,
          plan_month: df.plan_month || null,
          plan_week: df.plan_week || null,
          execute_date: df.execute_date || null,
          date_start: df.date_start || '',
          date_end: df.date_end || '',
          time_mode: df.time_mode || null,
          week_offset: (df.week_offset != null) ? df.week_offset : null,
          cycle_end_date: this.form.cycle_end_date || '',
          cycle_end_mode: this.form.cycle_end_mode || '',
          cycle_end_count: Number(this.form.cycle_end_count) || 0,
          sub_deadline: df.execute_date || null,
          isEmergency: !!this.form.isEmergency,
          // 子任务提醒字段（独立于父任务，双向同步 enable_remind/sub_remind 与 remind_time/sub_remind_time）
          enable_remind: !!this.form.enable_remind,
          remind_time: this.form.remind_time || '',
        };
      },
      save() {
        if (!this.form.title.trim()) { alert('请填写子任务标题'); return; }
        // 周期规则校验（与 TaskFormCore / 主任务详情保存口径一致）：非法或失焦未校验时阻断保存
        if (this.$refs.tfc && this.$refs.tfc.validateCycleRule && !this.$refs.tfc.validateCycleRule()) return;
        if (this.isNew) {
          this.$store.addSubTask(this.taskId, this.form.title.trim(), this.form.execute_date || null, this.extra());
        } else {
          this.$store.updateSubTask(this.taskId, this.subId, this.extra());
        }
        // 保存后兜底：若编辑了 cycle_end_date 且此时全部日期已打卡完成 → 立即触发自动归档
        const s = this.sub;
        if (s && s.cycle && this.$store.allOccurrencesDone(s) && !s.is_archived) {
          s.is_archived = true; s.autoArchivedByCopies = true; this.$store.persist();
        }
        // 数据已落盘（persist → notifyChange 自增 revision），周/月看板副本池自动重算同步刷新
        this.$emit('close');
      },
      askDel() { this.showDel = true; },
      confirmDel() { this.$store.removeSubTask(this.taskId, this.subId); this.$emit('close'); },
      // 终止周期（归档）：与循环周期任务详情页【终止周期】逻辑、二次确认完全一致；
      // 区间 / 周期子任务归档后其全部副本失效（is_archived，今日/看板不再展示），可在「已归档」撤销恢复
      archiveFull() { this.showTerminateConfirm = true; },
      cancelTerminate() { this.showTerminateConfirm = false; },
      confirmTerminate() {
        this.showTerminateConfirm = false;
        this.$store.setArchived(this.taskId, this.subId, true);
        this.$emit('close');
      },
    },
    beforeUnmount() {
      if (this._overlayDismiss) { this.$root.popOverlay(this._overlayDismiss); this._overlayDismiss = null; }
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal modal-lg">
        <div class="modal-head"><h3>{{ isNew ? '新增子任务' : '编辑子任务' }}</h3><button class="x" @click="$emit('close')">✕</button></div>
        <div class="modal-body" v-if="form">
          <TaskFormCore ref="tfc" :draft="form" :hide-tag="true" />
          <!-- 执行历史：可折叠面板（样式 / 交互与主任务执行历史完全统一） -->
          <!-- 仅周期 / 区间子任务渲染；默认折叠，手动展开仅本次临时生效 -->
          <div class="hist-head" v-if="hasExecHist">
            <h4>执行历史（{{ finishHist.length }}）</h4>
            <button class="rec-chart" :title="execHistOpen ? '收起执行历史' : '展开执行历史'" @click="execHistOpen = !execHistOpen">
              <span class="caret">{{ execHistOpen ? '▼' : '▶' }}</span>
            </button>
          </div>
          <div class="cycle-hist" v-if="hasExecHist && execHistOpen">
            <span v-for="h in finishHist" :key="h.execute_date"
                  class="cycle-chip" :class="{done: h.is_archived, undone: !h.is_archived, overdue: h.overdue}"
                  @click="toggleSubOccurrence(h.execute_date, !h.is_archived)">
              {{ h.is_archived ? '✅' : '⬜' }} {{ h.execute_date }}
              <span v-if="h.overdue" class="chip-overdue">延期未完成</span>
            </span>
            <span v-if="!finishHist.length" class="empty-tip">暂无生成日期</span>
          </div>
          <div class="modal-actions">
            <button class="btn danger" v-if="!isNew" @click="askDel">删除</button>
            <button class="btn ghost" @click="$emit('close')">取消</button>
            <button class="btn primary" @click="save">保存</button>
            <button class="btn warn" v-if="!isNew && ((sub.cycle) || (sub.date_mode === 'range' && sub.date_start)) && !sub.is_archived" @click="archiveFull">终止周期（归档）</button>
          </div>
        </div>
        <div class="chart-confirm" v-if="showDel" @click.self="showDel=false">
          <div class="idea-choice-box" @click.stop>
            <div class="idea-choice-title">确定要删除该子任务？</div>
            <p style="font-size:13px;color:var(--sub);margin:0 0 12px">将移除该子任务</p>
            <div class="modal-actions">
              <button class="btn ghost" @click="showDel=false">取消</button>
              <button class="btn danger" @click="confirmDel">确定删除</button>
            </div>
          </div>
        </div>

        <!-- 终止周期：二次确认（防误触，与循环周期任务详情页完全一致） -->
        <div class="chart-confirm" v-if="showTerminateConfirm" @click.self="cancelTerminate">
          <div class="idea-choice-box" @click.stop>
            <div class="idea-choice-title">确认终止该周期？</div>
            <p class="tip">终止后该周期任务将从列表移除（母本归档、全部副本失效），可在「已归档」中撤销恢复。</p>
            <div class="modal-actions">
              <button class="btn ghost" @click="cancelTerminate">取消</button>
              <button class="btn warn" @click="confirmTerminate">确认终止</button>
            </div>
          </div>
        </div>
      </div>
    </div>`,
  };

  /* =====================================================================
   * TaskIdeaEditModal —— 任务灵感库：灵感素材编辑（镜像 ProjectIdeaEditModal）
   * 区别：以 taskId 维度存储（复用 project_ideas 表，写 task_id）

  C.TaskIdeaEditModal = {

    mixins: [C.MaterialLinkMixin], // 素材链接识别：与待归档任务共用同一实现

      // 浮层栈：作为弹窗登记 dismiss，系统返回优先关闭本弹窗（返回来源页，不改写路由）
      this._overlayDismiss = () => this.$emit('close');
      this.$root.pushOverlay(this._overlayDismiss);
    },
    methods: {
      save() {
        const title = this.title.trim();
        if (!title) { alert('请填写素材标题'); return; }
        const link = (this.link || '').trim();
        if (this.ideaId) this.$store.updateIdea(this.ideaId, { title, content: this.content, link });
        else this.$store.addTaskIdea(this.taskId, { title, content: this.content, link });
        this.$emit('close');
      },
      openFull() { this.fullDraft = this.content; this.showFull = true; },
      confirmFull() { this.content = this.fullDraft; this.showFull = false; },
      cancelFull() { this.showFull = false; this.fullDraft = ''; },
      // 删除素材：复用 APP 通用二次确认弹窗（与项目 / 习惯删除一致）
      del() { this.showDelConfirm = true; },
      confirmDelete() {
        this.$store.removeIdea(this.ideaId);
        this.showDelConfirm = false;
        this.$emit('close');
      },
    },
    watch: {
      // 全屏输入：打开压栈、关闭弹栈；系统返回优先关闭全屏、回到本素材编辑页
      showFull(v) {
        if (v) { this._fullDismiss = () => { this.showFull = false; this.fullDraft = ''; }; this.$root.pushOverlay(this._fullDismiss); }
        else if (this._fullDismiss) { this.$root.popOverlay(this._fullDismiss); this._fullDismiss = null; }
      },
    },
    beforeUnmount() {
      if (this._fullDismiss) { this.$root.popOverlay(this._fullDismiss); this._fullDismiss = null; }
      if (this._overlayDismiss) { this.$root.popOverlay(this._overlayDismiss); this._overlayDismiss = null; }
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal">
        <div class="modal-head"><h3>{{ ideaId ? '编辑灵感素材' : '新增灵感素材' }}</h3><button class="x" @click="$emit('close')">✕</button></div>
        <div class="modal-body">
          <label class="fld">标题<input v-model="title" @keyup.enter="save" placeholder="选题 / 想法标题" /></label>
          <div class="fld">
            <div class="fld-note-head"><span>详细笔记（支持换行）</span><button class="fs-note-btn" @click="openFull">⛶ 全屏输入</button></div>
            <textarea v-model="content" placeholder="如：可参考 XX 方法论；要点…"></textarea>
          </div>

          <!-- 素材外部链接：复用通用输入框；有效时渲染跳转按钮，格式异常沿用现有提示样式 -->
          <label class="fld">素材链接
            <input v-model.trim="link" placeholder="https://example.com" :class="{invalid: link && !isValidMaterialLink(link)}" />
          </label>
          <p class="tip" v-if="link && !isValidMaterialLink(link)">链接格式有误，请以 http(s):// 开头</p>

            <span>🔗 打开素材链接</span>

            <button class="btn ghost" @click="$emit('close')">取消</button>
            <button class="btn primary" @click="save">保存</button>
          </div>
          <!-- 删除素材（仅编辑已有素材时出现；与常规编辑分隔，区隔高危操作） -->

            <button class="btn danger-soft" style="width:100%" @click="del">删除素材</button>
          </div>
        </div>
        <!-- 删除素材二次确认（复用 APP 通用弹窗：圆角/阴影/配色一致；取消 + 确定删除 并排） -->
        <div class="chart-confirm" v-if="showDelConfirm" @click.self="showDelConfirm=false">
          <div class="idea-choice-box" @click.stop>

            <div class="modal-actions">
              <button class="btn ghost" @click="showDelConfirm=false">取消</button>
              <button class="btn danger" @click="confirmDelete">确定删除</button>
            </div>
          </div>
        </div>

            <h3>详细笔记 · 全屏编辑</h3>

  /* =====================================================================
   * TaskIdeaModal —— 任务灵感库悬浮窗（列表 + 新增 + 长按编辑 + 左滑领用）
   * 领用差异：仅「生成为子任务（自动加 #素材）」，无「生成新项目」选项
   * ===================================================================== */
  C.TaskIdeaModal = {
    name: 'TaskIdeaModal',
    mixins: [C.MaterialLinkMixin], // 素材链接识别：与待归档任务共用同一实现
    props: { taskId: { type: String, required: true } },
    components: { TaskIdeaEditModal: C.TaskIdeaEditModal },
    data() {
      return {
        showEdit: false, editIdeaId: '',
        ideaDragId: null, ideaStartX: 0, ideaX: 0, ideaMoved: false, ideaSuppress: false, ideaLongTimer: null,
        ideaChoiceId: null,
      };
    },
    // 浮层栈：作为弹窗登记 dismiss，系统返回优先关闭本弹窗（返回任务来源页，不改写路由）
    created() {
      this._overlayDismiss = () => this.$emit('close');
      this.$root.pushOverlay(this._overlayDismiss);
    },
    beforeUnmount() {
      if (this._overlayDismiss) { this.$root.popOverlay(this._overlayDismiss); this._overlayDismiss = null; }
    },
    computed: {
      task() { return this.$store.findTask(this.taskId); },
      ideas() { return this.$store.getTaskIdeas(this.taskId); },
      ideaChoiceTitle() { const i = this.ideas.find(x => x.idea_id === this.ideaChoiceId); return i ? i.title : ''; },
    },
    methods: {
      openNew() { this.editIdeaId = ''; this.showEdit = true; },
      openEdit(i) { this.editIdeaId = i.idea_id; this.showEdit = true; },
      onIdeaDown(i, ev) {
        this.ideaDragId = i.idea_id; this.ideaStartX = ev.clientX; this.ideaX = 0; this.ideaMoved = false; this.ideaSuppress = false;
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
        if (this.ideaLongTimer) clearTimeout(this.ideaLongTimer);
        this.ideaLongTimer = setTimeout(() => { this.ideaSuppress = true; this.openEdit(i); }, 450);
      },
      onIdeaMove(ev) {
        if (this.ideaDragId == null) return;
        const dx = ev.clientX - this.ideaStartX;
        if (Math.abs(dx) > 8) { if (this.ideaLongTimer) { clearTimeout(this.ideaLongTimer); this.ideaLongTimer = null; } this.ideaMoved = true; this.ideaX = Math.max(-150, Math.min(0, dx)); }
      },
      onIdeaUp() {
        if (this.ideaLongTimer) { clearTimeout(this.ideaLongTimer); this.ideaLongTimer = null; }
        if (this.ideaDragId == null) return;
        const dx = this.ideaX;
        if (dx <= -40) this.ideaChoiceId = this.ideaDragId;
        this.ideaX = 0; this.ideaDragId = null;
        if (this.ideaSuppress) setTimeout(() => { this.ideaSuppress = false; }, 0);
      },
      onIdeaMainClick(i) { if (this.ideaMoved) return; if (!this.ideaSuppress) this.openEdit(i); },
      // 领用：仅生成「同任务下的子任务」（无「生成新项目」选项），并标记已领用
      claimToSub() {
        const i = this.ideas.find(x => x.idea_id === this.ideaChoiceId);
        this.ideaChoiceId = null;
        if (!i) return;
        this.$store.addSubTask(this.taskId, i.title, null);
        this.$store.pickIdea(i.idea_id);
      },
      cancelChoice() { this.ideaChoiceId = null; },
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal">
        <div class="modal-head"><h3>灵感库 · {{ task ? task.title : '' }}</h3><button class="x" @click="$emit('close')">✕</button></div>
        <div class="modal-body">
          <button class="btn primary block-new" @click="openNew">＋ 新增灵感素材</button>
          <div class="idea-list2">
            <div class="pidea swipe-card" v-for="i in ideas" :key="i.idea_id"
                 :style="{ transform: 'translateX(' + (ideaDragId===i.idea_id ? ideaX : 0) + 'px)' }"
                 :class="{ dragging: ideaDragId===i.idea_id && ideaMoved }"
                 @pointerdown="onIdeaDown(i,$event)" @pointermove="onIdeaMove($event)"
                 @pointerup="onIdeaUp()" @pointercancel="onIdeaUp()">
              <div class="pidea-top" @click="onIdeaMainClick(i)">
                <div class="pidea-title">{{ i.title }}</div>
                <span class="idea-badge" :class="i.is_picked ? 'picked' : 'todo'">{{ i.is_picked ? '已领取' : '备选' }}</span>
              </div>
              <pre class="pidea-content" v-if="i.content">{{ i.content }}</pre>
              <!-- 素材链接：识别规则 / 交互样式 / 跳转行为与待归档任务素材链接完全一致；阻断卡片滑动与长按手势 -->
              <button class="block-note" v-if="isValidMaterialLink(i.link)" style="margin:0"
                      @pointerdown.stop @click.stop="openMaterialLink(i.link)">
                <span>🔗 打开素材链接</span>
              </button>
            </div>
            <p v-if="!ideas.length" class="empty-tip">灵感库为空，记录选题 / 学习笔记 / 想法吧</p>
          </div>
        </div>
        <TaskIdeaEditModal v-if="showEdit" :task-id="taskId" :idea-id="editIdeaId" @close="showEdit=false" />
        <!-- 领用选择（任务版：仅生成子任务，无新项目选项） -->
        <div class="chart-confirm" v-if="ideaChoiceId" @click.self="cancelChoice">
          <div class="idea-choice-box">
            <div class="idea-choice-title">将素材「{{ ideaChoiceTitle }}」转换为？</div>
            <div class="modal-actions">
              <button class="btn ghost" @click="cancelChoice">取消</button>
              <button class="btn primary" @click="claimToSub">生成为子任务（自动加 #素材）</button>
            </div>
          </div>
        </div>
      </div>
    </div>`,
  };

  /* =====================================================================
   * InboxSubPage —— 待归档父任务的子任务「全屏页面」（替代原悬浮弹窗）
   * 路由：#/subtask/<taskId>，整体复用「项目页 → 子任务」的 .page + .detail-head 架构
   *  - 单击待归档父任务条目 → 路由跳转至本页；长按 / 滑动仍走 InboxPage 原手势（不变）
   *  - 返回：左上角「‹ 返回」按钮按路由栈原路返回进入本页的上一级页面（今日 / 待归档）；深链无历史兜底回待归档
   *  - 子任务内部功能（新增 / 编辑 / 勾选 / 删除 / 灵感库入口 / 周期配置 / 看板同步）全部保留
   * ===================================================================== */
  C.InboxSubPage = {
    name: 'InboxSubPage',
    props: { tid: { type: String, required: true } },
    components: { SubTaskEditModal: C.SubTaskEditModal, TaskIdeaModal: C.TaskIdeaModal },
    data() {
      return {
        showEdit: false, editSubId: '', showIdea: false, delSub: null,
        // 顶部常驻快捷创建输入框（进度条下方；仅名称；时间默认空白）
        quickTitle: '',
        // 子任务卡片手势（与「项目页 → 子任务」一致：长按=编辑；左滑=直接归档；右滑=撤销归档）
        subDragId: null, subStartX: 0, subX: 0, subMoved: false, subSuppress: false, subLongTimer: null,
        // 子任务拖拽排序（长按三杠手柄进入；与空白区长按=编辑互不干扰）
        dragMode: false, dragId: null, dragY: 0, dragStartY: 0, dragFrom: -1, dragTo: -1, dragRowH: 44, dragWhich: null, handlePressing: null, handleTimer: null,
        // 已归档子任务折叠栏
        showArchivedSubs: false,
        // 模板循环复用：轻提示
        toast: '', toastTimer: null,
      };
    },
    computed: {
      task() { return this.$store.findTask(this.tid); },
      subs() { const t = this.task; return t ? t.sub_tasks : []; },
      // 进行中子任务：紧急子任务强制置顶（与今日Tab / 周看板副本口径一致）；
      // 未完成在前、已完成（is_done）沉到本组末尾，勾选复选框打勾后自动后置
      activeSubs() {
        return this.subs.filter(s => !s.is_archived)
          .slice().sort((a, b) => {
            const ea = a.isEmergency ? 1 : 0, eb = b.isEmergency ? 1 : 0;
            if (ea !== eb) return eb - ea;                  // 紧急置顶
            const da = a.is_done ? 1 : 0, db = b.is_done ? 1 : 0;
            if (da !== db) return da - db;                  // 未完成在前，已完成沉底
            return 0;
          });
      },
      archivedSubs() { return this.subs.filter(s => s.is_archived); },
      doneCount() { return this.subs.filter(s => s.is_done).length; },
      progress() { return this.subs.length ? Math.round(this.doneCount / this.subs.length * 100) : null; },
      // 母本任务对应时间标签（沿用现有胶囊 UI）：展示母本自身排期（单点日期 / 周期）
      taskCap() { return this.task ? this.$store.capsuleOf(this.task, { isCopy: false }) : null; },
    },
    methods: {
      // 子任务自身时间标签：同一 capsuleOf 同时兼容主任务 / 子任务数据结构（含旧字段 sub_deadline 兜底），沿用现有 .cap 胶囊样式
      subTimeCap(s) { return s ? this.$store.capsuleOf(s, { isCopy: false }) : null; },
      // 返回键：按路由栈原路返回上一级页面（进入路径），由根组件 back() 统一处理
      back() { this.$root.back(); },
      // 模板循环复用：一键清空/恢复打卡（清空子任务 + 重置母本时间，= 同步清空父任务时间）
      resetTemplate() {
        if (!this.task || !this.task.is_template) return;
        this.$store.resetTemplate(this.tid);
        this.showToast('已重置打卡，模板可循环复用');
      },
      showToast(msg) {
        this.toast = msg;
        if (this.toastTimer) clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => { this.toast = ''; }, 1400);
      },
      openNew() { this.editSubId = ''; this.showEdit = true; },
      openEdit(s) { this.editSubId = s._id; this.showEdit = true; },
      // 底部输入框：仅保存名称，时间/备注等留空，需长按子任务进编辑页补充
      addQuick() {
        const title = (this.quickTitle || '').trim();
        if (!title) return;
        this.$store.addSubTask(this.tid, title);
        this.quickTitle = '';
      },
      toggle(s) { this.$store.toggleSubTask(this.tid, s._id); },
      askDel(s) { this.delSub = s; },
      confirmDel() { if (this.delSub) { this.$store.removeSubTask(this.tid, this.delSub._id); this.delSub = null; } },
      // —— 子任务卡片手势 ——
      onSubDown(s, ev) {
        this.subDragId = s._id;
        this.subStartX = ev.clientX;
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
        this.subX = 0; this.subMoved = false; this.subSuppress = false;
        if (this.subLongTimer) clearTimeout(this.subLongTimer);
        this.subLongTimer = setTimeout(() => { this.subSuppress = true; this.openEdit(s); }, 500);
      },
      onSubMove(ev) {
        if (this.subDragId == null) return;
        const dx = ev.clientX - this.subStartX;
        if (Math.abs(dx) > 8) {
          if (this.subLongTimer) { clearTimeout(this.subLongTimer); this.subLongTimer = null; }
          this.subMoved = true; this.subX = Math.max(-160, Math.min(160, dx));
        }
      },
      onSubUp(s) {
        if (this.subLongTimer) { clearTimeout(this.subLongTimer); this.subLongTimer = null; }
        if (this.subDragId == null) return;
        const dx = this.subX, TH = 50;
        this.subX = 0; this.subDragId = null;
        if (this.subSuppress) { setTimeout(() => { this.subSuppress = false; }, 0); return; }
        if (s.is_archived) {
        if (dx >= TH) this.$store.setArchived(this.tid, s._id, false); // 右滑 = 撤销归档（统一归档方法）
      } else {
        if (dx <= -TH) this.$store.setArchived(this.tid, s._id, true);   // 左滑 = 直接归档（统一归档方法）
        }
        if (this.subMoved) setTimeout(() => { this.subMoved = false; }, 0);
      },
      onSubMainClick(s) {
        if (this.subMoved) return;
        if (!this.subSuppress) this.openEdit(s);
      },
      // 完成标记仅由左侧复选框负责（toggle → is_done），与归档（is_archived）互相独立
      // 拖拽排序模式：被拖行纵向跟随手指，其余行按目标位置上下让位（轻量 FLIP）
      subStyle(s) {
        if (this.dragMode && this.dragId) {
          const list = this.dragWhich === 'archived' ? this.archivedSubs : this.activeSubs;
          const i = list.findIndex(x => x._id === s._id);
          if (s._id === this.dragId) {
            return { transform: 'translateY(' + this.dragY + 'px)', transition: 'none', position: 'relative', zIndex: 30, boxShadow: '0 8px 20px rgba(20,24,40,.18)', background: 'var(--card)', borderRadius: '8px' };
          }
          const from = this.dragFrom, to = this.dragTo;
          if (from < 0 || to < 0 || i < 0) return {};
          let ty = 0;
          if (i < from && i >= to) ty = this.dragRowH;        // 上方行整体下移让位
          else if (i > from && i <= to) ty = -this.dragRowH;  // 下方行整体上移让位
          if (ty) return { transform: 'translateY(' + ty + 'px)', transition: 'transform .15s ease' };
          return {};
        }
        if (this.subDragId !== s._id) return {};
        const dx = this.subX;
        const bg = dx < -40 ? 'rgba(46,204,113,0.12)' : dx > 40 ? 'rgba(231,76,60,0.12)' : 'transparent';
        return { transform: 'translateX(' + dx + 'px)', transition: this.subMoved ? 'none' : 'transform .18s ease', background: bg };
      },
      // —— 三杠手柄：长按=进入拖拽排序（空白区长按仍走 onSubDown 打开编辑）——
      startDrag(s, rowEl) {
        if (this.dragMode) return;
        this.dragMode = true; this.dragId = s._id; this.dragY = 0;
        const list = this.dragWhich === 'archived' ? this.archivedSubs : this.activeSubs;
        this.dragFrom = list.findIndex(x => x._id === s._id);
        this.dragTo = this.dragFrom;
        this.dragRowH = rowEl ? rowEl.getBoundingClientRect().height : 44;
      },
      onHandleDown(s, ev) {
        this.dragWhich = s.is_archived ? 'archived' : 'active';
        this.dragStartY = ev.clientY;
        const rowEl = ev.currentTarget.closest('.st-row');
        this.dragRowH = rowEl ? rowEl.getBoundingClientRect().height : 44;
        this.handlePressing = s._id;
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
        if (this.handleTimer) clearTimeout(this.handleTimer);
        this.handleTimer = setTimeout(() => { this.startDrag(s, rowEl); }, 350);
      },
      onHandleMove(ev) {
        if (!this.dragMode) {
          // 按住即拖：移动超阈值立即进入拖拽（仍满足"长按手柄=拖拽"；长按不动也将在 350ms 后进入）
          if (this.handlePressing && Math.abs(ev.clientY - this.dragStartY) > 6) {
            const list = this.dragWhich === 'archived' ? this.archivedSubs : this.activeSubs;
            const s = list.find(x => x._id === this.handlePressing);
            if (s) { const rowEl = ev.target && ev.target.closest ? ev.target.closest('.st-row') : null; this.startDrag(s, rowEl); }
          }
          return;
        }
        const dy = ev.clientY - this.dragStartY;
        this.dragY = dy;
        const list = this.dragWhich === 'archived' ? this.archivedSubs : this.activeSubs;
        const n = list.length; if (!n) return;
        let to = this.dragFrom + Math.round(dy / this.dragRowH);
        to = Math.max(0, Math.min(n - 1, to));
        this.dragTo = to;
      },
      onHandleUp() {
        if (this.handleTimer) { clearTimeout(this.handleTimer); this.handleTimer = null; }
        if (!this.dragMode) { this.handlePressing = null; return; }
        const isArch = this.dragWhich === 'archived';
        const list = isArch ? this.archivedSubs : this.activeSubs;
        const order = list.map(x => x._id);
        const from = this.dragFrom, to = this.dragTo;
        if (from >= 0 && to >= 0 && from !== to && from < order.length && to < order.length) {
          order.splice(to, 0, order.splice(from, 1)[0]);
          this.$store.setSubTasksOrder(this.tid, order, isArch);
        }
        this.dragMode = false; this.dragId = null; this.dragY = 0;
        this.dragFrom = -1; this.dragTo = -1; this.dragWhich = null; this.handlePressing = null;
      },
    },
    // 全局刷新通知：任意页面归档/撤销后，主动重载本页（子任务列表 + 母本头部）
    watch: {
      '$store.state.revision'() { this.$forceUpdate(); },
    },
    template: `
    <div class="page inbox-sub-page">
      <div class="detail-head">
        <button class="back" @click="back">‹ 返回</button>
        <div class="detail-title">{{ task ? task.title : '子任务' }}</div>
        <span v-if="taskCap" class="cap" :class="'cap-'+taskCap.kind"><span class="cap-ico">{{ taskCap.icon }}</span><span class="cap-txt">{{ taskCap.text }}</span></span>
        <div class="detail-acts">
          <button class="icon-btn" title="灵感库" @click="showIdea=true">💡</button>
          <button class="tpl-reset-btn" v-if="task && task.is_template" @click="resetTemplate">🔄 一键清空/恢复打卡</button>
        </div>
      </div>

      <div class="proj-meta" v-if="task">
        <div class="meta-prog" v-if="progress !== null">
          <div class="pbar"><div class="pbar-fill" :style="{width: progress + '%'}"></div></div>
          <span class="pct">完成 {{ progress }}%（{{ doneCount }}/{{ subs.length }}）</span>
        </div>
        <div class="meta-none" v-else>暂无子任务</div>
      </div>

      <!-- 顶部常驻快捷创建输入框：进度条下方；仅保存名称，时间默认空白；长按子任务进编辑页补详情 -->
      <div class="sub-quick-add">
        <input type="text" v-model="quickTitle" @keyup.enter="addQuick" placeholder="新增任务……" />
        <button class="sub-quick-add-btn" @click="addQuick" title="新增子任务">＋</button>
      </div>

      <!-- 进行中子任务：左滑=直接归档；长按=编辑；勾选左侧复选框=标记完成 -->
      <div class="st-list">
        <div class="st-row swipe-card" v-for="s in activeSubs" :key="s._id"
             :style="subStyle(s)"
             :class="{ dragging: subDragId===s._id && subMoved, done: s.is_done, 'emergency-bg': s.isEmergency }"
             @pointerdown="onSubDown(s,$event)" @pointermove="onSubMove($event)"
             @pointerup="onSubUp(s)" @pointercancel="onSubUp(s)">
          <span class="st-drag" title="长按拖动排序" @pointerdown.stop="onHandleDown(s,$event)" @pointermove.stop="onHandleMove($event)" @pointerup.stop="onHandleUp($event)" @pointercancel.stop="onHandleUp($event)">⠿</span>
          <input type="checkbox" :checked="s.is_done" @click.stop @change="toggle(s)" />
          <span class="st-title" :class="{done:s.is_done}" @click="onSubMainClick(s)">{{ s.title }}</span><span v-if="s.isEmergency" class="tag emergency">🚨 紧急</span><span v-if="subTimeCap(s)" class="cap" :class="'cap-'+subTimeCap(s).kind"><span class="cap-ico">{{ subTimeCap(s).icon }}</span><span class="cap-txt">{{ subTimeCap(s).text }}</span></span><span v-if="$progressSync(s)" class="cap cap-prog">📊 {{ $progressSync(s) }}</span>
          <button class="st-del" @click.stop="askDel(s)">✕</button>
        </div>
        <p v-if="!activeSubs.length" class="empty-tip">还没有子任务，用上方输入框快速新增（左滑可归档）</p>
      </div>

      <!-- 已归档子任务：右滑=撤销归档（与父任务【📦已归档】一致） -->
      <div class="archived-group" v-if="archivedSubs.length">
        <button class="archived-toggle" @click="showArchivedSubs=!showArchivedSubs">📦 已归档子任务（{{ archivedSubs.length }}）{{ showArchivedSubs ? ' ▼' : ' ▶' }}</button>
        <div class="list" v-if="showArchivedSubs">
          <div class="st-row swipe-card archived" v-for="s in archivedSubs" :key="s._id"
               :style="subStyle(s)"
               :class="{ dragging: subDragId===s._id && subMoved, done: s.is_done, 'emergency-bg': s.isEmergency }"
               @pointerdown="onSubDown(s,$event)" @pointermove="onSubMove($event)"
               @pointerup="onSubUp(s)" @pointercancel="onSubUp(s)">
            <span class="st-drag" title="长按拖动排序" @pointerdown.stop="onHandleDown(s,$event)" @pointermove.stop="onHandleMove($event)" @pointerup.stop="onHandleUp($event)" @pointercancel.stop="onHandleUp($event)">⠿</span>
            <input type="checkbox" :checked="s.is_done" @click.stop @change="toggle(s)" />
            <span class="st-title done" @click="onSubMainClick(s)">{{ s.title }}</span><span v-if="s.isEmergency" class="tag emergency">🚨 紧急</span><span v-if="subTimeCap(s)" class="cap" :class="'cap-'+subTimeCap(s).kind"><span class="cap-ico">{{ subTimeCap(s).icon }}</span><span class="cap-txt">{{ subTimeCap(s).text }}</span></span><span v-if="$progressSync(s)" class="cap cap-prog">📊 {{ $progressSync(s) }}</span>
            <button class="st-del" @click.stop="askDel(s)">✕</button>
          </div>
        </div>
      </div>

      <SubTaskEditModal v-if="showEdit" :task-id="tid" :sub-id="editSubId" @close="showEdit=false" />
      <TaskIdeaModal v-if="showIdea" :task-id="tid" @close="showIdea=false" />

      <!-- 删除子任务二次确认 -->
      <div class="chart-confirm" v-if="delSub" @click.self="delSub=null">
        <div class="idea-choice-box" @click.stop>
          <div class="idea-choice-title">确定要删除该子任务？</div>
          <p style="font-size:13px;color:var(--sub);margin:0 0 12px">将移除该子任务</p>
          <div class="modal-actions">
            <button class="btn ghost" @click="delSub=null">取消</button>
            <button class="btn danger" @click="confirmDel">确定删除</button>
          </div>
        </div>
      </div>

      <div class="toast" v-if="toast">{{ toast }}</div>

    </div>`,
  };

  /* =====================================================================
   * SubTaskCopyCard —— 子任务「副本」标准卡片（今日 / 看板 共用）
   * 仅展示：上层 = 标题 + 🔁循环箭头 + 浅绿色周期标签（同行）；下层 = 灰色描述（无描述填"无描述"）
   * 无复选框 / 删除按钮；保留左滑归档、长按编辑（改动同步母本）
   * ===================================================================== */
  C.SubTaskCopyCard = {
    name: 'SubTaskCopyCard',
    props: {
      sub: { type: Object, required: true },
      parent: { type: Object, default: null },
      isCopy: { type: Boolean, default: true },
      winStart: { type: String, default: '' },
      winEnd: { type: String, default: '' },
      inWeek: { type: Boolean, default: false },
    },
    emits: ['archive', 'unarchive', 'edit'],
    data() {
      return {
        dragId: null, startX: 0, dx: 0, dragging: false, moved: false,
        longFired: false, longTimer: null, suppressClick: false,
      };
    },
    computed: {
      hasCycle() { return !!(this.sub && this.sub.cycle); },
      parentId() { return this.parent ? this.parent._id : (this.sub ? this.sub._parentId : null); },
      // 母本任务对应时间标签（沿用现有胶囊 UI）：展示母本自身排期（单点日期 / 周期）
      parentCap() { return this.parent ? this.$store.capsuleOf(this.parent, { isCopy: false }) : null; },
      capsule() { return this.$store.capsuleOf(this.sub, { isCopy: this.isCopy, windowStart: this.winStart || undefined, windowEnd: this.winEnd || undefined, inWeek: this.inWeek }); },
      // —— 标签链：继承母本分类，并把母本标题并入末级（替代原独立「###母任务」归属标识）——
      // 输出形如「考研│专业课│母任务X」；母本无分类时退化为单级「母任务X」。
      catChips() {
        const base = this.$catTagList(this.parent) || [];
        const pt = (this.parent && this.parent.title ? String(this.parent.title) : '').trim();
        if (!pt) return base;
        if (!base.length) return [pt];
        return base.map(x => (x.split('│').indexOf(pt) >= 0 ? x : x + '│' + pt));
      },
    },
    methods: {
      onDown(e) {
        // 点击紧急置顶按钮时不触发滑动/长按手势
        if (e.target.closest('.row-emg-btn')) return;
        if (!this.$store.swipeLock('subcopy_' + this.sub._id)) return;
        this.dragId = this.sub._id; this.startX = e.clientX; this.dx = 0;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        this.dragging = true; this.moved = false; this.longFired = false; this.suppressClick = false;
        if (this.longTimer) clearTimeout(this.longTimer);
        this.longTimer = setTimeout(() => {
          if (this.dragId !== this.sub._id) return;
          this.longFired = true; this.suppressClick = true;
          this.$emit('edit', this.sub._id, this.parentId);
          this.dragId = null; this.dragging = false; this.dx = 0;
          this.$store.swipeUnlock('subcopy_' + this.sub._id);
        }, 450);
      },
      onMove(e) {
        if (this.dragId !== this.sub._id) return;
        this.dx = e.clientX - this.startX;
        if (Math.abs(this.dx) > this.$store.SWIPE_ACTIVATE_PX && this.longTimer) { clearTimeout(this.longTimer); this.longTimer = null; this.moved = true; }
      },
      onUp() {
        if (this.dragId !== this.sub._id) { this.$store.swipeUnlock('subcopy_' + this.sub._id); return; }
        if (this.longTimer) { clearTimeout(this.longTimer); this.longTimer = null; }
        const dx = this.dx;
        this.dragging = false; this.dragId = null; this.dx = 0;
        if (this.longFired) { this.$store.swipeUnlock('subcopy_' + this.sub._id); return; }
        if (this.moved) this.suppressClick = true;
        const TH = this.$store.SWIPE_TRIGGER_PX;
        if (dx <= -TH) {
          this.$emit('archive', this.sub._id, this.parentId, this.winStart, this.winEnd);
        } else if (dx >= TH) {
          this.$emit('unarchive', this.sub._id, this.parentId, this.winStart, this.winEnd);
        }
        this.$store.swipeUnlock('subcopy_' + this.sub._id);
      },
      onClick() {
        if (this.suppressClick) { this.suppressClick = false; return; }
        this.$emit('edit', this.sub._id, this.parentId); // 单击 = 编辑（改动同步母本）
      },
      // 一键「设紧急 / 取消紧急」：仅翻转子任务 isEmergency 标记，绝不触碰任何日期/周期/提醒字段
      toggleEmg() {
        this.$store.toggleSubEmergency(this.parentId, this.sub._id);
      },
      cardStyle() {
        if (this.dragId !== this.sub._id) return {};
        const dx = this.dx;
        const TH = this.$store.SWIPE_TRIGGER_PX;
        const bg = dx < -TH ? 'rgba(46,204,113,0.15)' : (dx > TH ? 'rgba(231,76,60,0.12)' : 'transparent');
        return { transform: `translateX(${dx}px)`, transition: this.dragging ? 'none' : 'transform .18s ease', background: bg };
      },
    },
    template: `
    <div class="row task-row subtask-copy swipeable" @click="onClick" :style="cardStyle"
         :class="{ 'emergency-bg': sub.isEmergency }"
         @pointerdown="onDown" @pointermove="onMove" @pointerup="onUp" @pointercancel="onUp">
      <button class="row-emg-btn" :class="{on:sub.isEmergency}" @click.stop="toggleEmg" :title="sub.isEmergency ? '取消紧急置顶' : '设为紧急置顶（时间/周期不变）'">{{ sub.isEmergency ? '🚨' : '🚩' }}</button>
      <div class="row-main">
        <div class="row-title">
          <span class="st-title-text">{{ sub.title }}</span><span v-if="sub.isEmergency" class="tag emergency">🚨 紧急</span><span v-if="hasCycle" class="tag cycle">🔁</span><span v-if="capsule" class="cap" :class="'cap-'+capsule.kind"><span class="cap-ico">{{ capsule.icon }}</span><span class="cap-txt">{{ capsule.text }}</span></span>
        </div>
        <div class="row-sub subtask-desc">{{ sub.desc || '无描述' }}<span class="tag cat" v-for="tg in catChips" :key="tg">{{ tg }}</span><span v-if="parentCap" class="cap" :class="'cap-'+parentCap.kind"><span class="cap-ico">{{ parentCap.icon }}</span><span class="cap-txt">{{ parentCap.text }}</span></span></div>
        <div class="row-prog prog-sync" v-if="$progressSync(sub)">📊 {{ $progressSync(sub) }}</div>
      </div>

  /* =====================================================================
   * DateReminderModal —— 统一「添加日期和提醒」日历弹窗（新增 / 详情复用）
   * 第 1 层改造：
   *  - 标题改为「添加日期和提醒」；执行日期改为「非必填」
   *  - 删除「同步系统日历」整行 UI 与代码（原「添加至系统日历」开关已移除）
   *  - 新增双模式：单点执行日期 / 起止时间区间（二选一）
   *  - 执行日期控制是否出现在今日页；提醒仅持久化 remind_option 供消息推送，二者解耦
   *  - 日历 / 精确时点 / 通知提醒（档位）/ 清空 / 确认 按钮全部保留不动
   * ===================================================================== */
  C.DateReminderModal = {
    name: 'DateReminderModal',
    props: {
      date: { type: String, default: '' },          // YYYY-MM-DD（单点）
      time: { type: String, default: '' },           // HH:MM
      remindOption: { type: String, default: 'none' },
      addToCalendar: { type: Boolean, default: false },
      dateMode: { type: String, default: 'single' },  // 第 1 层：single / range
      dateStart: { type: String, default: '' },       // 第 1 层：区间开始
      dateEnd: { type: String, default: '' },         // 第 1 层：区间结束
    },
    data() {
      const d = this.date ? this.$store.util.parseDate(this.date) : new Date();
      return {
        localMode: this.dateMode === 'range' ? 'range' : 'single',
        localDate: this.date || '',
        localStart: this.dateStart || this.date || '',
        localEnd: this.dateEnd || this.date || '',
        localTime: this.time || '',
        localRemind: this.remindOption || 'none',
        localAdd: this.addToCalendar,
        calYear: d.getFullYear(),
        calMonth: d.getMonth() + 1,
      };
    },
    computed: {
      calCells() {
        const y = this.calYear, m = this.calMonth;
        const startWeek = new Date(y, m - 1, 1).getDay();
        const dim = new Date(y, m, 0).getDate();
        const today = this.$store.util.todayStr();
        const cells = [];
        for (let i = 0; i < startWeek; i++) cells.push({ muted: true });
        for (let d = 1; d <= dim; d++) {
          const ds = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
          const sel = this.localMode === 'range'
            ? (ds === this.localStart || ds === this.localEnd)
            : (ds === this.localDate);
          cells.push({ day: d, date: ds, isToday: ds === today, sel });
        }
        return cells;
      },
      remindOptions() {
        return [
          { v: 'none', t: '不提醒' },
          { v: 'ontime', t: '准时提醒' },
          { v: '5min', t: '提前 5 分钟' },
          { v: '30min', t: '提前 30 分钟' },
          { v: '1hour', t: '提前 1 小时' },
          { v: '1day', t: '提前 1 天' },
        ];
      },
    },
    methods: {
      pick(c) {
        if (c.muted) return;
        if (this.localMode === 'range') {
          // 区间选择：第一次点设开始，第二次点设结束（自动排序）
          if (!this.localStart || (this.localStart && this.localEnd)) {
            this.localStart = c.date; this.localEnd = '';
          } else if (c.date < this.localStart) {
            this.localEnd = this.localStart; this.localStart = c.date;
          } else {
            this.localEnd = c.date;
          }
        } else {
          this.localDate = c.date;
        }
      },
      prevM() { let m = this.calMonth - 1, y = this.calYear; if (m < 1) { m = 12; y--; } this.calMonth = m; this.calYear = y; },
      nextM() { let m = this.calMonth + 1, y = this.calYear; if (m > 12) { m = 1; y++; } this.calMonth = m; this.calYear = y; },
      setMode(m) { this.localMode = m; if (m === 'single' && !this.localDate) this.localDate = this.localStart || this.localEnd || ''; },
      save() {
        if (this.localMode === 'range') {
          this.$emit('save', {
            dateMode: 'range', dateStart: this.localStart || null, dateEnd: this.localEnd || this.localStart || null,
            execute_date: this.localStart || null, time: this.localTime || '', remindOption: this.localRemind, addToCalendar: false,
          });
        } else {
          this.$emit('save', {
            dateMode: 'single', dateStart: this.localDate || '', dateEnd: this.localDate || '',
            date: this.localDate || null, time: this.localTime || '', remindOption: this.localRemind, addToCalendar: false,
          });
        }
      },
      clearAll() { this.$emit('clear'); },
      close() { this.$emit('close'); },
    },
    template: `
    <div class="dp-mask" @click.self="close">
      <div class="dp-modal">
        <div class="modal-head"><h3>添加日期和提醒</h3><button class="x" @click="close">✕</button></div>
        <div class="dp-body">
          <!-- 第 1 层：双模式切换（单点执行日期 / 起止时间区间，二选一） -->
          <div class="dp-mode">
            <button class="dp-mode-btn" :class="{on: localMode==='single'}" @click="setMode('single')">单点执行日期</button>
            <button class="dp-mode-btn" :class="{on: localMode==='range'}" @click="setMode('range')">时间区间</button>
          </div>
          <!-- 1 日历拾取区：单点模式选执行日期（非必填）/ 区间模式依次选开始、结束 -->
          <div class="dp-section">
            <div class="dp-label" v-if="localMode==='single'">执行日期（非必填）</div>
            <div class="dp-label" v-else>起止时间区间（先选开始，再选结束）</div>
            <div class="dp-nav">
              <button class="hn-arrow" @click="prevM">‹</button>
              <span class="dp-title">{{ calYear }} 年 {{ calMonth }} 月</span>
              <button class="hn-arrow" @click="nextM">›</button>
            </div>
            <div class="dp-grid">
              <div class="dp-dow" v-for="w in ['日','一','二','三','四','五','六']" :key="w">{{ w }}</div>
              <div v-for="(c,i) in calCells" :key="i" class="dp-cell" :class="{muted:c.muted, today:c.isToday, sel:c.sel, range: localMode==='range' && c.date && c.date>=localStart && c.date<=localEnd && c.date!==localStart && c.date!==localEnd}" @click="pick(c)">{{ c.muted ? '' : c.day }}</div>
            </div>
            <div class="dp-range-hint" v-if="localMode==='range'">已选：{{ localStart || '—' }} ～ {{ localEnd || '—' }}</div>
          </div>
          <!-- 2 时分选择栏：搭配日期确定精确时点 -->
          <div class="dp-section">
            <div class="dp-label">精确时点（可选）</div>
            <input class="dp-time" type="time" v-model="localTime" />
          </div>
          <!-- 3 通知我（提醒配置，非必填；仅负责消息推送） -->
          <div class="dp-section">
            <div class="dp-label">通知我（提醒，可选）</div>
            <select class="dp-remind" v-model="localRemind">
              <option v-for="o in remindOptions" :key="o.v" :value="o.v">{{ o.t }}</option>
            </select>
          </div>
          <!-- 底部按钮 -->
          <div class="dp-actions">
            <button class="btn ghost" @click="clearAll">清空全部</button>
            <button class="btn primary" @click="save">确认保存</button>
          </div>
        </div>
      </div>
    </div>`,
  };

  /* =====================================================================
   * TaskDetailModal —— 任务详情弹窗（含 AI 攻略解析、子任务、进度、归档）
   * ===================================================================== */
  C.TaskDetailModal = {
    name: 'TaskDetailModal',
    props: { taskId: { type: String, required: true }, isCopy: { type: Boolean, default: false } },
    components: { TaskFormCore: C.TaskFormCore },
    data() {
      return {
        form: null,
        // —— 打开时快照，取消时还原 ——
        snapshot: null,
        // —— 执行历史：标记完成 / 撤销完成 确认弹窗（记录选中的 execute_date）——
        confirmDate: null,
        confirmDone: false,
        // —— 执行历史：展开 / 收起（仅本次会话临时生效，不做任何持久化）——
        // 刷新、切换页签、路由返回后弹窗组件会重建，data 重新求值 → 始终恢复为「折叠」。
        execHistOpen: false,
        // —— 删除二次确认 ——
        showDelConfirm: false,
        // —— 终止周期二次确认（防误触：该操作会彻底归档母本并使全部副本失效）——
        showTerminateConfirm: false,
      };
    },
    computed: {
      task() { return this.$store.findTask(this.taskId); },
      today() { return this.$store.util.todayStr(); },
      isArchived() { return this.task ? (this.task.cycle ? this.$store.cycleArchivedToday(this.task, this.today) : this.task.is_archived) : false; },
      // —— 执行历史模块可见性：仅「周期任务」或「自定义区间任务」才有执行历史 ——
      // 无周期、无区间的普通一次性任务整块隐藏（标题行 + 折叠面板一并不渲染）。
      hasExecHist() {
        const t = this.task;
        if (!t) return false;
        return !!(t.cycle || (t.date_mode === 'range' && t.date_start));
      },
      // —— 执行历史：枚举母本全部生成日期（✅已完成 / ⬜待执行），随 form 实时刷新 ——
      // 周期任务：列表取自「实时编辑中的周期规则」；自定义区间：列表取自「实时编辑中的起止日期」；
      // 完成状态取自母本 cycle_history（严格遵循副本隔离，周期仅今日Tab 投射、区间逐日投射）。
      execHistory() {
        const t = this.task;
        if (!t) return [];
        const U = this.$store.util;
        const dates = [];
        if (t.cycle) {
          const cycle = (this.form && this.form.cycle) || t.cycle;
          const mode = (this.form && this.form.cycle_end_mode) || t.cycle_end_mode || '';
          const count = (this.form && this.form.cycle_end_count) || t.cycle_end_count || 0;
          // 次数模式：执行历史按周期推算前 N 个执行日（结束于第 N 次打卡）
          if (mode === 'count' && count > 0) {
            dates.push(...this.$store.cycleCountDates(t));
          } else {
            const end = (this.form && this.form.cycle_end_date) || t.cycle_end_date || '';
            const base = t.cycle._base || (t.create_at ? U.fmt(new Date(t.create_at)) : this.today);
            dates.push(...this.$store.cycleOccurrenceDates(cycle, end, { base }));
          }
        } else if (t.date_mode === 'range' && t.date_start) {
          const s = (this.form && this.form.date_start) || t.date_start;
          const e = (this.form && this.form.date_end) || t.date_end || '';
          const finish = e || U.addDays(this.today, 60); // 无限区间：界定未来展示窗口
          let cur = s, n = 0;
          while (cur <= finish && n < 4000) { dates.push(cur); cur = U.addDays(cur, 1); n++; }
        } else {
          return [];
        }
        const hist = t.cycle_history || [];
        return dates.map(ds => ({
          date: ds,
          done: hist.some(h => h.execute_date === ds && h.is_archived),
          overdue: hist.some(h => h.execute_date === ds && h.overdue),
        }));
      },
    },
    created() {
      const t = this.task;
      const c0 = t.category_id ? this.$store.findCategory(t.category_id) : null;
      const ft = t.is_template ? 'template' : (t.is_collection || (c0 && this.$store.isCollCat(t.category_id)) ? 'collection' : 'task');
      let tagInput = '', parsedTags = [];
      if (c0) {
        const l1c = c0.parent ? this.$store.findCategory(c0.parent) : c0;
        const l2c = c0.parent ? c0 : null;
        if (l1c) {
          tagInput = l2c ? ('#' + l1c.name + '##' + l2c.name) : ('#' + l1c.name);
          parsedTags = [{ l1: { _id: l1c._id, name: l1c.name }, l2: l2c ? { _id: l2c._id, name: l2c.name } : null }];
        }
      }
      this.form = {
        title: t.title || '',
        desc: t.desc || '',
        material_notes: t.material_notes || '',
        material_link: t.material_link || '',
        category_id: t.category_id || null,
        parent_category: t.parent_category || '',
        folderType: ft,
        tagInput, parsedTags,
        date_mode: dateModeOfTask(t),
        plan_month: t.plan_month || '', execute_date: t.execute_date || '', date_start: t.date_start || '', date_end: t.date_end || '',
        enable_remind: !!t.enable_remind,
        remind_time: t.remind_time || '',
        cycle: t.cycle ? JSON.parse(JSON.stringify(t.cycle)) : null,
        cycle_end_date: t.cycle_end_date || '',
        cycle_end_mode: t.cycle_end_mode || (t.cycle_end_date ? 'date' : ''),
        cycle_end_count: t.cycle_end_count || 0,
        progress_info: t.progress_info ? JSON.parse(JSON.stringify(t.progress_info)) : { enable: false, media_type: 'book', progress_value: '' },
        is_template: !!t.is_template,
        isEmergency: !!t.isEmergency,
      };
      this.snapshot = JSON.parse(JSON.stringify(t));
      // 浮层栈：作为弹窗登记 dismiss，系统返回优先关闭本弹窗（返回来源页，不改写路由）
      this._overlayDismiss = () => this.$emit('close');
      this.$root.pushOverlay(this._overlayDismiss);
    },
    methods: {
      upd(patch) { this.$store.updateTask(this.taskId, patch); },
      commit() {
        if (!this.form.title.trim()) { alert('请填写任务标题'); return; }
        // 周期规则校验（月 / 周）：失焦未校验或非法时阻断保存
        const form = this.$refs.form;
        if (form && form.validateCycleRule && !form.validateCycleRule()) return;
        // 存入前归一化分隔符（逗号 → 空格）
        if (this.form.cycle && (this.form.cycle.type === 'week' || this.form.cycle.type === 'month')) {
          this.form.cycle = Object.assign({}, this.form.cycle, { rule: this.$store.util.normalizeCycleRule(this.form.cycle.rule) });
        }
        this.upd(Object.assign(dateFieldsFromDraft(this.form), {
          title: this.form.title.trim(),
          desc: this.form.desc || '',
          material_notes: this.form.material_notes || '',
          material_link: this.form.material_link || '',
          category_id: this.form.category_id || null,
          parent_category: this.form.parent_category || '',
          enable_remind: !!this.form.enable_remind,
          remind_time: this.form.remind_time || '',
          cycle: this.form.cycle || null,
          cycle_end_date: this.form.cycle_end_date || '',
          cycle_end_mode: this.form.cycle_end_mode || '',
          cycle_end_count: Number(this.form.cycle_end_count) || 0,
          progress_info: this.form.progress_info,
          is_template: this.form.folderType === 'template',
          is_collection: this.form.folderType === 'collection',
          isEmergency: !!this.form.isEmergency,
        }));
        // 保存后兜底：若编辑了 cycle_end_date 且此时全部日期已打卡完成 → 立即触发自动归档
        const t = this.task;
        if (t && t.cycle && this.$store.allOccurrencesDone(t) && !t.is_archived && !t.is_template) {
          t.is_archived = true; t.autoArchivedByCopies = true; this.$store.persist();
        }
        this.$emit('close');
      },
      cancel() {
        if (this.task && this.snapshot) Object.assign(this.task, JSON.parse(JSON.stringify(this.snapshot)));
        this.$emit('close');
      },
      // 「每天」→ 习惯：删除原任务并新增为记录型习惯，关闭并跳转今日（习惯页）
      onConvertHabit(draft) {
        this.$store.convertTaskToHabit(draft, this.taskId);
        this.$emit('close');
        location.hash = '#/today';
      },
      askDel() { this.showDelConfirm = true; },
      confirmDel() { this.$store.deleteTask(this.taskId); this.$emit('close'); },
      // —— 执行历史：点击某日期 → 弹窗确认标记完成 / 撤销完成 ——
      onExecDateClick(d) { this.confirmDate = d.date; this.confirmDone = d.done; },
      cancelExecConfirm() { this.confirmDate = null; this.confirmDone = false; },
      confirmExecToggle() {
        if (!this.confirmDate) return;
        this.$store.toggleOccurrence(this.taskId, this.confirmDate, !this.confirmDone);
        this.confirmDate = null; this.confirmDone = false;
      },

      // —— 二次确认：先弹窗确认，避免误触（效果与待归档列表左滑周期母本完全一致）——
      archiveFull() { this.showTerminateConfirm = true; },
      cancelTerminate() { this.showTerminateConfirm = false; },
      confirmTerminate() {
        this.showTerminateConfirm = false;

        this.$emit('close');

    },

    template: `

  /* =====================================================================
   * LeisureCard —— 闲趣随机卡（今日页底部休闲专属模块）

   * ===================================================================== */
  C.LeisureCard = {
    name: 'LeisureCard',
    data() {
      return {
        collapsed: true,                          // 整卡默认收起；切 tab 重新挂载即回到默认折叠态
        lzTagsExpanded: (() => { try { return localStorage.getItem('mindpocket:leisureTagsExpanded') === '1'; } catch (e) { return false; } })(), filterTag: '', currentId: '',
        recent: [],                                  // 近期已抽到的 id，用于短时间内不重复
        startX: 0, dragX: 0, dragging: false, moved: false,

    computed: {

      // 顶部标签栏：候选池内全部分类名（含一级 / 二级），按出现顺序去重
      tags() {
        const out = [];
        this.pool.forEach(t => this.$store.categoryChainNames(t).forEach(n => {
          if (n && out.indexOf(n) < 0) out.push(n);
        }));
        return out;
      },
      // 标签层级树：一级 # 标签为父、二级 ## 标签为子（供折叠面板做层级视觉区分）
      tagTree() {
        const tree = [], map = {};
        this.pool.forEach(t => {
          const chain = this.$store.categoryChainNames(t); // [一级, 二级, …] 根→叶
          if (!chain.length) return;
          const l1 = chain[0];
          if (!map[l1]) { map[l1] = { name: l1, subs: [] }; tree.push(map[l1]); }
          if (chain.length > 1 && map[l1].subs.indexOf(chain[1]) < 0) map[l1].subs.push(chain[1]);

        return tree;

      // 当前标签下的候选（「全部收藏」= 全域随机）

    },
    created() {

    beforeUnmount() { if (this.toastTimer) clearTimeout(this.toastTimer); },
    watch: {
      // 候选池 / 筛选变化后，若当前卡片已不在池内（被归档、取消收藏、改了标签），自动补抽一条
      filtered() { if (!this.current) this.pickRandom(); },
    },
    methods: {
      // —— 整卡展开/收起：默认收起（标题栏点击切换）；切 tab 重新挂载即回到默认折叠态 ——
      toggleLeisure() { this.collapsed = !this.collapsed; },
      // —— 标签栏展开/收起：默认折叠（仅显示「全部收藏」+「展开▼」），点击切换全部展开/收起；状态本地记忆 ——
      toggleLzTags() {

      // —— 标签筛选：单选，再次点击取消回到「全部收藏」 ——

      // —— 随机抽取：单次仅 1 条，短时间内不重复抽到同一条 ——
      pickRandom() {
        const list = this.filtered;
        if (!list.length) { this.currentId = ''; return; }
        if (list.length === 1) { this.currentId = list[0]._id; return; }
        // 回避窗口最多为「池子大小 - 1」，保证永远有候选可选，绝不会抽空
        const avoidN = Math.min(this.recent.length, Math.max(1, Math.min(3, list.length - 1)));
        const avoid = this.recent.slice(-avoidN);

        if (!cand.length) cand = list;

        // 归档 Toast：5 秒存续，携带待撤销任务 id，支持滑动撤销（约束④：归档业务本身不变）

      // —— 编辑：面板内唤起任务详情弹窗，修改后收藏数据同步 ——
      editCurrent() { if (this.current) this.$emit('edit', this.current._id); },
      // —— 领用项目：复制到项目 Tab，转为可拆解规划的项目任务（原收藏保留） ——
      claimProject() {
        const t = this.current;
        if (!t) return;
        const name = (t.title || '').trim() || '闲趣项目';
        if (this.$store.getProjects('running').some(p => p.name === name)) {
          this.showToast('项目 Tab 已有同名项目，未重复创建');
          return;
        }
        this.$store.addProject({ name, tags: this.$store.categoryChainNames(t), status: 'running' });

      },
      shortName(s) { const x = String(s || ''); return x.length > 10 ? x.slice(0, 10) + '…' : x; },
      showToast(msg, type, undoId) {

        this.toastTimer = setTimeout(() => { this.toast = ''; this.toastType = ''; this.archiveUndoId = ''; }, dur);
      },
      // —— 滑动归档 Toast 撤销：5 秒存续期内，滑动绿色提示条即回滚归档状态（约束①②④）——
      undoArchiveToast() {
        if (this.toastType !== 'archive' || !this.archiveUndoId) return;
        const id = this.archiveUndoId;
        const t = this.$store.findTask ? this.$store.findTask(id) : null;
        this.$store.undoArchive(id); // 回滚归档：母本与副本恢复，候选池响应式刷新（约束④：归档业务不变）
        if (this.toastTimer) clearTimeout(this.toastTimer);
        this.toast = ''; this.toastType = ''; this.archiveUndoId = '';
        const name = t ? this.shortName(t.title) : '';
        this.showToast('已撤销归档' + (name ? '「' + name + '」' : ''), 'info');
      },
      onToastDown(ev) {
        if (this.toastType !== 'archive') return; // 仅归档提示支持滑动撤销
        const d = this.toastDrag;
        d.startX = ev.clientX; d.startY = ev.clientY; d.x = 0; d.y = 0; d.moved = false; d.dragging = true;
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
      },
      onToastMove(ev) {
        const d = this.toastDrag;
        if (!d.dragging) return;
        d.x = ev.clientX - d.startX; d.y = ev.clientY - d.startY;
        if (Math.abs(d.x) > 6 || Math.abs(d.y) > 6) d.moved = true;
      },
      onToastUp() {
        const d = this.toastDrag;
        if (!d.dragging) return;
        d.dragging = false;
        // 水平滑动（|dx| 明显大于 |dy|）超阈值 → 撤销归档；释放后复位手势状态
        if (d.moved && Math.abs(d.x) > 40 && Math.abs(d.x) > Math.abs(d.y)) this.undoArchiveToast();
        d.x = 0; d.y = 0; d.moved = false;
      },
    },
    template: `

  };

  /* =====================================================================
   * WishPool —— 许愿池卡片（今日Tab底部，闲趣随机卡下方）
   * ===================================================================== */
  C.WishPool = {
    name: 'WishPool',
    data() { return {
      cardOpen: false,
      histOpen: false,
      itemCollapsed: {},
      swipeId: null, swipeStartX: 0, swipeX: 0, swipeDragging: false, swipeMoved: false,
      pressId: null, pressStartX: 0, pressStartY: 0, pressTimer: null, pressLongFired: false, pressSuppress: false,
      dragFromId: null, dragOverId: null,
      showDetailModal: false, showEditModal: false, editWishId: null, editName: '', editCost: '', editCountType: 'one_time', editValidity: '',
      showAddModal: false, addName: '', addCost: '', addCountType: 'one_time', addValidity: '',
      showUndoModal: false, confirmUndoId: null, confirmUndoName: '', confirmUndoCost: 0,
      toast: '', toastTimer: null, undoRecordId: null,
      _vizDim: 'week',
    }; },
    created() {
      // 折叠状态不持久化：每次进入页面默认折叠（与全局规则一致）
      // vizDim 保留本地记忆（用户偏好，非折叠状态）
      try {
        const d = localStorage.getItem('mindpocket:wishPool:vizDim');
        if (d) this._vizDim = d;
      } catch (e) {}
    },
    computed: {
      items() { return this.$store.getWishSorted(); },
      points() { return this.$store.availablePoints(); },
      totalEarned() { return this.$store.getPointsEarned(); },
      totalPenalty() { return this.$store.getPointsPenalty ? this.$store.getPointsPenalty() : 0; },
      totalSpent() { return this.$store.getPointsSpent(); },
      editWindowOpen() { return this.$store.wishEditWindowOpen(); },
      editCountThisMonth() { return this.$store.getWishEditCountThisMonth(); },
      editExhausted() { return !this.editWindowOpen; },
      detailGroups() {
        const all = (this.$store.state.wish_records || []).slice().sort((a, b) => new Date(b.time) - new Date(a.time));
        const groups = {
          habit: { label: '习惯', icon: '🔄', records: [] },
          cycle_task: { label: '周期任务', icon: '🔁', records: [] },
          project_sub: { label: '项目-子任务填报', icon: '📝', records: [] },
          project_report: { label: '项目-填报基础分', icon: '✅', records: [] },
          project_finish: { label: '项目-完结加成', icon: '🏆', records: [] },
          study_work: { label: '学习工作', icon: '📚', records: [] },
          study_task: { label: '学习工作', icon: '📚', records: [] },  // 兼容旧 category
          collection: { label: '收藏归档', icon: '📦', records: [] },
          habit_undo: { label: '习惯撤销', icon: '↩️', records: [] },
          redeem_undo: { label: '撤销兑换', icon: '💸', records: [] },
          delete_rollback: { label: '删除回滚', icon: '🗑️', records: [] },
        };
        all.forEach(r => {
          // 已撤销 / 已扣回 / 删除回滚 / 撤销兑换 的明细不展示（余额均已回退或独立留痕，纯展示记录）
          if (r.status === 'reversed') return;
          if (r.category === 'habit_undo' || r.category === 'delete_rollback' || r.category === 'redeem_undo') return;
          const cat = r.category;
          if (cat && groups[cat]) { groups[cat].records.push(r); }
          else if (r.recordType === 'redeem') {
            if (!groups['_redeem']) groups['_redeem'] = { label: '愿望兑换', icon: '🌟', records: [] };
            groups['_redeem'].records.push(r);
          }

        return Object.values(groups).filter(g => g.records.length > 0);
      },
      redemptionRecords() {
        return (this.$store.state.wish_records || [])
          .filter(r => !r.recordType || r.recordType === 'redeem')
          .sort((a, b) => new Date(b.time) - new Date(a.time));
      },
      vizDim() { return this._vizDim || 'week'; },
      barBuckets() {
        const dim = this.vizDim; const map = {}, order = [];
        this.redemptionRecords.filter(r => r.status === 'normal').forEach(r => {
          const date = r.time.slice(0, 10); let k;
          if (dim === 'month') k = date.slice(0, 7);
          else if (dim === 'week') { const d = new Date(date); const dow = (d.getDay() + 6) % 7; const mon = new Date(d); mon.setDate(d.getDate() - dow); k = mon.toISOString().slice(0, 10); }
          else k = date;
          if (!map[k]) { map[k] = 0; order.push(k); }
          map[k] += (r.cost || 0);
        });
        const max = order.reduce((m, k) => Math.max(m, map[k]), 0);
        return order.slice().sort().map(k => {
          const label = dim === 'month' ? (k.slice(0,7) + '月') : (dim === 'week' ? k + ' 周' : k);
          return { key: k, label, min: map[k], pct: max > 0 ? Math.round(map[k] / max * 100) : 0 };
        });
      },
      pieData() {
        const palette = ['#6a7bff', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#06b6d4', '#ef4444', '#84cc16'];
        const map = {};
        this.redemptionRecords.filter(r => r.status === 'normal').forEach(r => { const n = r.wish_name || '未知'; map[n] = (map[n] || 0) + (r.cost || 0); });
        const arr = Object.entries(map).map(([name, min]) => ({ name, min }));
        const total = arr.reduce((a, x) => a + x.min, 0);
        let acc = 0;
        return arr.map((x, i) => {
          const ratio = total > 0 ? x.min / total : 0;
          const slice = { name: x.name, min: x.min, pct: total > 0 ? Math.round(ratio * 100) : 0, color: palette[i % palette.length], ratio };
          acc += ratio; return slice;

      },
      pieGradient() {
        if (!this.pieData.length) return 'conic-gradient(#eef0f5 0deg 360deg)';

        const parts = this.pieData.map(s => { const a0 = acc * 360, a1 = (acc + s.ratio) * 360; acc += s.ratio; return s.color + ' ' + a0.toFixed(2) + 'deg ' + a1.toFixed(2) + 'deg'; });
        return 'conic-gradient(' + parts.join(', ') + ')';

      vizHasData() { return this.redemptionRecords.filter(r => r.status === 'normal').length > 0; },

    methods: {
      toggleCard() { this.cardOpen = !this.cardOpen; this.saveCard(); },
      saveCard() { try { localStorage.setItem('mindpocket:wishPool:vizDim', this._vizDim); } catch (e) {} },
      // 滑动兑换（全局互斥锁：动画与数据同步期间禁止重复触发）
      swipeDown(e, item) {
        if (!this.$store.swipeLock('wish_' + item._id)) return;

          // 确保滑动兑换期间/松手后绝不误弹编辑愿望页（bug 修复）
          if (this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; }

        const moved = this.swipeMoved;              // 是否发生过滑动
        this.swipeDragging = false; this.swipeId = null; this.swipeX = 0;

        // 长按时长达标且全程未发生滑动（纯长按）→ 松手时打开编辑；

        if (wasLongPress && !moved && id && this.pressId !== null) this.openEdit(id);
