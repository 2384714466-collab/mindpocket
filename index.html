.undo-box { background: #fff; border-radius: 16px; padding: 18px; max-width: 320px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.undo-text { font-size: 14px; line-height: 1.6; margin: 0 0 16px; color: var(--text); }
.undo-actions { display: flex; gap: 10px; }
.undo-actions .btn { flex: 1; }

.arch-projects { margin-top: 14px; }
.arch-proj-head { font-size: 13px; color: var(--sub); font-weight: 600; margin-bottom: 8px; }
.proj-arch { cursor: pointer; }

/* ============ 日期 & 提醒：圆形日期按钮 + 统一日历弹窗 ============ */
.date-pill { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
.date-circle {
  width: 46px; height: 46px; flex: 0 0 auto; border-radius: 50%;
  border: 1px solid var(--line); background: #f5f7ff; color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; cursor: pointer; line-height: 1; padding: 0;
}
.date-circle.has { background: var(--primary); color: #fff; border-color: var(--primary); }
.date-pill .dp-text { font-size: 13px; color: var(--sub); }
.date-pill .dp-text b { color: var(--text); }
.date-pill .dp-empty { color: var(--primary); font-weight: 600; }

/* 统一日历弹窗（复用于新增 / 详情） */
.dp-mask { position: fixed; inset: 0; z-index: 1100; background: rgba(15,23,42,.42); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s ease; }
.dp-modal { width: 100%; max-width: 380px; background: #fff; border-radius: 18px; box-shadow: 0 16px 50px rgba(0,0,0,.25); overflow: hidden; animation: pop .18s ease; }
.dp-modal .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dp-modal .modal-head h3 { margin: 0; font-size: 16px; }
.dp-body { padding: 14px 16px 16px; }
.dp-section { margin-bottom: 14px; }
.dp-label { font-size: 13px; color: var(--sub); font-weight: 600; margin-bottom: 6px; }
.dp-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.dp-title { font-size: 14px; font-weight: 600; }
.dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dp-dow { text-align: center; font-size: 11px; color: var(--sub); padding: 4px 0; }
.dp-cell { text-align: center; padding: 8px 0; border-radius: 10px; font-size: 13px; cursor: pointer; border: 1px solid transparent; }
.dp-cell.muted { color: #d3d6e0; cursor: default; }
.dp-cell.today { border-color: var(--primary); color: var(--primary); }
.dp-cell.sel { background: var(--primary); color: #fff; border-color: var(--primary); }
.dp-time, .dp-remind { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 14px; font-family: inherit; color: var(--text); background: #fff; }
.dp-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.dp-switch { position: relative; width: 44px; height: 26px; flex: 0 0 auto; }
.dp-switch input { opacity: 0; width: 0; height: 0; }
.dp-switch .track { position: absolute; inset: 0; background: #d3d6e0; border-radius: 999px; transition: .2s; }
.dp-switch .thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.dp-switch input:checked + .track { background: var(--primary); }
.dp-switch input:checked + .track + .thumb { transform: translateX(18px); }
.dp-actions { display: flex; gap: 10px; margin-top: 8px; }
.dp-actions .btn { flex: 1; }

/* ============ 子任务耗时统计（填报耗时 / 已花费时间进度条） ============ */
/* 已花费时间条：与完成量进度条 .psub-prog 同构，配色改用青蓝以区分「时间」与「完成量」两个维度 */
.psub-time { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.psub-time .tbar { flex: 1; height: 8px; background: #eef0f5; border-radius: 999px; overflow: hidden; }
.psub-time .tbar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #38bdf8, #6366f1); transition: width .25s ease; }
.psub-time .tbar-fill.over { background: linear-gradient(90deg, #fbbf24, #f97316); }
.psub-time .tval { font-size: 11px; color: var(--sub); white-space: nowrap; }
.psub-time .tval b { color: #3b82f6; font-weight: 700; }
.psub-time .tval .over-txt { color: #f97316; font-weight: 700; }
/* 子任务卡片：完成态整体弱化（配合「完成自动置后」，视觉上自然沉底） */
.psub.done-sub { opacity: .72; }
.psub.done-sub .psub-title { text-decoration: line-through; color: var(--sub); }
/* 填报弹窗：耗时输入（时 / 分） */
.spent-row { display: flex; align-items: flex-end; gap: 8px; }
.spent-row .fld { flex: 1; margin-bottom: 0; }
.spent-sum { font-size: 12px; color: var(--sub); background: #f7f8fc; border-radius: 10px; padding: 8px 12px; margin: 10px 0 0; }
.spent-sum b { color: #3b82f6; }
.rec-spent { color: #3b82f6; font-size: 12px; font-weight: 600; }

/* ============ 子任务标签筛选栏（项目详情页，复用项目首页 .tagbar 视觉） ============ */
.subtagbar { margin-bottom: 12px; }
.subtagbar .tagbar-list .ptag.all { background: #eef0f5; color: var(--sub); }
.subtagbar .tagbar-list .ptag.all.on { background: var(--primary); color: #fff; }
.subtag-empty { font-size: 12px; color: var(--sub); padding: 8px 4px 2px; }
.filter-note { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--sub); background: #eef2ff; border-radius: 10px; padding: 7px 10px; margin-bottom: 10px; }
.filter-note button { background: #fff; color: var(--primary); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 8px; border: 1px solid #dbe2ff; }

/* ============ 标签耗时分布（甘特图视图下的可视化区块） ============ */
.tagpie { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 14px; margin-top: 14px; }
.tagpie-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.tagpie-title { font-size: 14px; font-weight: 700; }
.tagpie-crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); margin-bottom: 10px; flex-wrap: wrap; }
.tagpie-crumb .crumb-link { color: var(--primary); font-weight: 600; cursor: pointer; background: none; padding: 0; font-size: 12px; }
.tagpie-crumb .crumb-cur { color: var(--text); font-weight: 700; }
.tagpie-body { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.tagpie-svg { flex: 0 0 auto; }
.tagpie-slice { cursor: pointer; transition: opacity .18s ease; }
.tagpie-slice:hover { opacity: .82; }
.tagpie-center-main { font-size: 13px; font-weight: 700; fill: var(--text); }
.tagpie-center-sub { font-size: 9px; fill: var(--sub); }
.tagpie-legend { flex: 1; min-width: 168px; display: flex; flex-direction: column; gap: 6px; }
.tagpie-item { display: flex; align-items: center; gap: 8px; background: #f7f8fc; border: 1px solid transparent; border-radius: 10px; padding: 7px 9px; text-align: left; width: 100%; cursor: pointer; }
.tagpie-item.drillable:active { border-color: var(--primary); }
.tagpie-item.flat { cursor: default; }
.tagpie-dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 3px; }
.tagpie-info { flex: 1; min-width: 0; }
.tagpie-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tagpie-meta { font-size: 11px; color: var(--sub); margin-top: 1px; }
.tagpie-meta b { color: #3b82f6; }
.tagpie-pct { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--text); }
.tagpie-arrow { flex: 0 0 auto; font-size: 12px; color: var(--sub); }
.tagpie-done { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 7px; background: #e8f6ee; color: #1f9d57; margin-left: 4px; }
.tagpie-tip { margin: 12px 2px 0; }
.tagpie-empty { text-align: center; color: var(--sub); font-size: 13px; padding: 22px 10px; line-height: 1.7; }

/* ============ 闲趣随机卡（今日页底部，低饱和柔和配色，弱化紧迫感） ============ */
/* 与上方正式待办区块统一视觉：复用全局配色变量，不再使用独立暖调配色 */
.leisure-block {
  margin-top: 18px; margin-bottom: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; box-shadow: var(--shadow);
}
.leisure-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; color: var(--text); margin: 0; }
.leisure-title .lz-count { font-size: 11px; font-weight: 600; color: var(--sub); background: #fafbff; border: 1px solid var(--line); border-radius: 8px; padding: 1px 8px; }
.leisure-title .collapse-btn { color: var(--sub); }
.leisure-body { margin-top: 10px; }
/* 标签筛选栏：折叠态仅显示「全部收藏」+「展开▼」；展开态显示全部标签 +「收起▲」（v-if 控制，无需高度截断） */
.lz-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
.lz-tags .collapse-btn { cursor: pointer; user-select: none; margin-left: auto; font-size: 12px; color: var(--sub); background: #f0f1f6; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.lz-tags .collapse-btn:active { filter: brightness(0.95); }
.lz-tag { flex: 0 0 auto; font-size: 12px; padding: 4px 12px; border-radius: 999px; background: #fafbff; color: var(--sub); border: 1px solid var(--line); white-space: nowrap; cursor: pointer; }
.lz-tag.on { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
/* 筛选标签可折叠面板：标题行（复用 collapse-btn 箭头，不新增样式） */
.lz-tags-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; cursor: pointer; }
.lz-tags-head .lz-count { font-size: 11px; font-weight: 600; color: var(--sub); background: #fafbff; border: 1px solid var(--line); border-radius: 8px; padding: 1px 8px; }
.lz-tags-head .collapse-btn { color: var(--sub); font-size: 12px; }
/* 二级 ## 标签：缩进 + 弱底，做出层级视觉区分 */
.lz-tag.sub { margin-left: 14px; background: #f3f5fb; }
/* 随机卡片本体：复用任务卡基础结构，配色与主应用统一 */
.lz-card-wrap { position: relative; overflow: hidden; border-radius: 13px; }
.lz-card-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 18px; background: #e8f6ee; border-radius: 13px; font-size: 13px; font-weight: 600; color: var(--ok); }
.lz-card {
  position: relative; background: #fafbff; border: 1px solid var(--line); border-radius: 13px;
  padding: 12px 13px; touch-action: pan-y; -webkit-user-select: none; user-select: none;
  will-change: transform; transition: transform .18s ease;
}
.lz-card.dragging { transition: none; }
.lz-card-title { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.45; }
.lz-card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.lz-cat { font-size: 11px; padding: 1px 8px; border-radius: 8px; background: #eef0ff; color: var(--primary); }
.lz-desc { font-size: 12px; color: var(--sub); margin-top: 6px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lz-hint { font-size: 11px; color: var(--sub); margin-top: 8px; }
/* 卡片操作区：全部操作在面板内完成，不额外跳页；按钮配色与主应用 .btn-mini 一致 */
.lz-acts { display: flex; gap: 6px; margin-top: 10px; }
.lz-btn { flex: 1; font-size: 12px; font-weight: 600; padding: 8px 4px; border-radius: 10px; background: #eef0ff; color: var(--primary); border: none; white-space: nowrap; }
.lz-btn.main { background: var(--primary); color: #fff; }
.lz-btn.warm { background: #fff3e0; color: #e08e0b; }
.lz-empty { text-align: center; font-size: 13px; color: var(--sub); padding: 22px 12px; line-height: 1.8; }
.lz-toast { margin-top: 10px; font-size: 12px; color: var(--ok); background: #e8f6ee; border-radius: 10px; padding: 8px 12px; text-align: center; touch-action: pan-y; -webkit-user-select: none; user-select: none; will-change: transform; }
/* —— 项目列表：累计专注时长整体时间条（复用子任务时间条 .tbar 蓝紫渐变） —— */
.proj-time { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.proj-time .tbar { flex: 1; height: 8px; background: #eef0f5; border-radius: 999px; overflow: hidden; }
.proj-time .tbar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #38bdf8, #6366f1); transition: width .25s ease; }
.proj-time .tval { font-size: 11px; color: var(--sub); white-space: nowrap; }
/* 重要等级标记（暖色呼应「重要」语义，色值取自应用已有调色板 #fff3e0 / #e08e0b） */
.imp-tag { display: inline-block; margin-top: 8px; font-size: 11px; background: #fff3e0; color: #e08e0b; padding: 2px 8px; border-radius: 8px; }
/* 标签筛选 / 可视化 / 排序 切换条 选中态 */
.tagbar-toggle.on { background: var(--primary); color: #fff; }
/* —— 专注时长可视化模块 —— */
.viz-module { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow); }
.viz-sec-title { font-size: 13px; color: var(--sub); margin: 14px 0 8px; font-weight: 600; }
.viz-sec-title:first-of-type { margin-top: 4px; }
.viz-pie-wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.viz-pie { width: 120px; height: 120px; border-radius: 50%; position: relative; flex: 0 0 auto; }
.viz-pie::after { content: ''; position: absolute; inset: 34px; background: var(--card); border-radius: 50%; }
.viz-legend { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 6px; }
.viz-leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.viz-dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.viz-leg-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viz-leg-pct { color: var(--sub); white-space: nowrap; }
.viz-leg-item.clickable { cursor: pointer; padding: 2px 4px; border-radius: 6px; transition: background .15s; }
.viz-leg-item.clickable:hover { background: #f5f6fc; }
.viz-drill-icon { color: var(--primary); font-size: 14px; flex: 0 0 auto; }
.viz-pie.clickable { cursor: pointer; }
.viz-pie.clickable:hover { opacity: .9; }
.viz-drill-back { margin-left: auto; background: #eef0ff; color: var(--primary); border: none; border-radius: 8px; font-size: 11px; padding: 2px 8px; cursor: pointer; font-weight: 600; }
.viz-drill-back:active { transform: translateY(1px); }
/* —— 子任务剩余天数（复用倒计时 .cd-* 配色） —— */
.psub-cd { margin-top: 6px; font-size: 12px; }

/* ============ 许愿池卡片 ============ */
.wp-block { margin-top: 18px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }
.wp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
.wp-head-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.wp-head-title { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; }
.wp-head-caret { color: var(--sub); font-size: 13px; flex: none; }
.wp-head-points { font-size: 22px; font-weight: 700; color: var(--primary); }
.wp-head-meta { font-size: 11px; color: var(--sub); margin-left: 2px; white-space: nowrap; }
.wp-head-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.wp-detail-btn { font-size: 11px; background: #f0f1f6; color: var(--sub); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
.wp-detail-btn:active { filter: brightness(0.93); }
.wp-body { margin-top: 10px; }
.wp-add-btn { width: 100%; background: #eef0ff; color: var(--primary); font-weight: 600; font-size: 13px; padding: 10px; border-radius: 10px; border: 1px dashed #dde4ff; cursor: pointer; }
.wp-add-btn:active { filter: brightness(0.93); }
.wp-list { display: flex; flex-direction: column; gap: 6px; }
.wp-row-wrap { position: relative; overflow: hidden; border-radius: 12px; }
.wp-row-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 16px; background: #e8f6ee; border-radius: 12px; font-size: 13px; font-weight: 600; color: var(--ok); pointer-events: none; }
.wp-row { position: relative; background: #fafbff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; touch-action: pan-y; user-select: none; will-change: transform; transition: transform .18s ease; }
.wp-row.dragging { transition: none; }
.wp-row-affordable { border-color: #cceede; background: #f6fdf8; }
.wp-row-unaffordable { opacity: 0.65; }
.wp-row-drag { flex: none; color: var(--sub); cursor: grab; user-select: none; font-size: 15px; line-height: 1; padding: 0 2px; opacity: 0.55; touch-action: none; }
.wp-row-drag:active { opacity: 1; cursor: grabbing; }
.wp-row-main { flex: 1; min-width: 0; }
.wp-row-name { font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wp-row-info { display: flex; align-items: center; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
.wp-row-cost { font-size: 12px; color: var(--sub); }
.wp-row-tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
.wp-row-tag.repeatable { background: #eef0ff; color: var(--primary); }
.wp-row-tag.one_time { background: #f0f1f6; color: var(--sub); }
.wp-row-tag.redeemed { background: #e8f6ee; color: #1f9d57; }
.wp-row-caret { flex: none; color: var(--sub); font-size: 11px; cursor: pointer; padding: 4px; }
.wp-toast { margin-top: 8px; font-size: 12px; color: var(--ok); background: #e8f6ee; border-radius: 10px; padding: 8px 12px; text-align: center; cursor: pointer; touch-action: pan-y; user-select: none; }
.wp-hist-section { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
.wp-hist-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); cursor: pointer; font-weight: 600; }
.wp-hist-log { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; max-height: 200px; overflow-y: auto; }
.wp-hist-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.wp-hist-row:last-child { border-bottom: none; }
.wp-hist-name { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wp-hist-cost { color: var(--sub); white-space: nowrap; }
.wp-hist-time { color: var(--sub); font-size: 11px; white-space: nowrap; }
.wp-hist-status { font-size: 10px; padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
.wp-hist-status.pending { background: #fff4e0; color: #c77800; }
.wp-hist-status.verified { background: #e8f6ee; color: #1f9d57; }
.wp-hist-status.expired { background: #f0f0f3; color: #8a8f9c; }
.wp-hist-status.cancelled { background: #ffeaea; color: #c0443c; }
.wp-hist-acts { display: inline-flex; gap: 4px; white-space: nowrap; }
.wp-hist-act { font-size: 11px; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); background: #fff; color: var(--text); cursor: pointer; }
.wp-hist-act.verify { color: #1f9d57; border-color: #bfe6cd; }
.wp-hist-act.verify:hover { background: #e8f6ee; }
.wp-hist-act.undo { color: #c0443c; border-color: #f3c4c0; }
.wp-hist-act.undo:hover { background: #ffeaea; }
.wp-undo-warn { font-size: 14px; line-height: 1.6; color: var(--text); margin: 4px 0 8px; }
.wp-undo-warn strong { color: #c77800; }
.wp-undo-tip { font-size: 12px; color: var(--sub); margin: 0 0 12px; }
.btn.danger { background: #c0443c; color: #fff; border-color: #c0443c; }
.btn.danger:hover { background: #a8382f; }
.wp-balance { text-align: center; padding: 12px; background: #f7f8fc; border-radius: 12px; margin-bottom: 10px; }
.wp-balance-num { font-size: 28px; font-weight: 700; color: var(--primary); }
.wp-balance-label { font-size: 12px; color: var(--sub); margin-top: 2px; }
.wp-detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.wp-detail-row:last-child { border-bottom: none; }
.wp-detail-label { font-size: 12px; color: var(--sub); }
.wp-detail-value { font-size: 13px; font-weight: 600; color: var(--text); }
.wp-detail-value.earn { color: var(--ok); }
.wp-detail-value.spend { color: var(--no); }
.wp-edit-limit { font-size: 12px; color: var(--no); background: #ffeaea; border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; }
.wp-quota { font-size: 11px; color: var(--sub); margin: 0 0 8px; }
.wp-quota strong { color: var(--primary); }
.wp-quota.closed { color: #d9534f; }

/* —— 积分明细分类展示 —— */
.wp-detail-value.penalty { color: var(--no); font-weight: 700; }
.wp-detail-section { margin-top: 14px; }
.wp-detail-cat { font-size: 13px; font-weight: 700; color: var(--primary); padding: 6px 0; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.wp-detail-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 13px; border-bottom: 1px dashed #f0f1f6; }
.wp-detail-item:last-child { border-bottom: none; }
.wp-detail-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wp-detail-pts { font-weight: 700; white-space: nowrap; min-width: 36px; text-align: right; }
.wp-detail-pts.earn { color: var(--ok); }
.wp-detail-pts.penalty { color: var(--no); }
.wp-detail-pts.spend { color: var(--warn, #e67e22); }
.wp-detail-time { color: var(--sub); font-size: 11px; white-space: nowrap; }
.wp-detail-rev { color: var(--sub); font-size: 10px; white-space: nowrap; background: #f0f1f6; padding: 1px 6px; border-radius: 4px; }
.wp-detail-focus { color: var(--sub); font-size: 10px; white-space: nowrap; }

/* —— 娱乐愿望模板按钮 —— */
.wp-templates { margin-bottom: 12px; }
.wp-tpl-label { font-size: 11px; color: var(--sub); margin-bottom: 6px; }
.wp-tpl-btns { display: flex; flex-direction: column; gap: 6px; }
.wp-tpl-btn { width: 100%; text-align: left; background: #f0f3ff; color: var(--primary); border: 1px solid #dde4ff; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.wp-tpl-btn:active { background: #e6ecff; }

/* =========================================================================
 * P3 · 响应式：平板 / 横屏 / PC
 * 默认（手机 ≤480）：max-width 480，底部导航（保持现状）
 * ≥481（平板竖屏 / 大屏手机）：取消 480 限制，底部导航满宽
 * ≥820（PC / 横屏平板）：左侧导航栏 + 居中宽内容列 + 弹窗居中
 * ========================================================================= */

/* 平板竖屏 / 大屏手机：去掉 480 限制，底部导航跟随视口宽度 */
@media (min-width: 481px) {
  .app-shell { max-width: none; }
  .app-nav { max-width: none; }
}

/* PC / 横屏平板：左侧导航栏 + 居中宽内容 */
@media (min-width: 820px) {
  .app-shell {
    max-width: 1200px;
    flex-direction: row;
    align-items: stretch;
    min-height: 100vh;
  }
  .app-nav {
    order: -1;                 /* 移到最左作为侧栏 */
    position: sticky;
    top: 0;
    left: auto;
    transform: none;
    width: 220px;
    max-width: 220px;
    height: 100vh;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    padding: 20px 12px;
    border-top: none;
    border-right: 1px solid var(--line);
    box-shadow: 4px 0 18px rgba(40, 50, 90, .04);
  }
  .app-nav::before {
    content: '\1F4CB MindPocket';
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    padding: 4px 14px 18px;
    white-space: nowrap;
  }
  .app-nav button {
    flex: none;
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    color: var(--sub);
  }
  .app-nav button.on { background: rgba(91, 108, 255, .12); color: var(--primary); }
  .app-nav .nav-ico { font-size: 19px; }
  .app-nav .nav-txt { font-size: 14px; }

  .app-main {
    flex: 1;
    min-width: 0;
    padding: 28px 32px 56px;
  }
  /* 宽屏下单列内容居中，避免过长行；最大 900px 保证可读性 */
  .app-main > * { max-width: 900px; margin-left: auto; margin-right: auto; }

  /* 弹窗在桌面端居中显示（而非底部抽屉） */
  .modal-mask { align-items: center; padding: 24px; }
  .modal { max-width: 560px; border-radius: 18px; margin: auto; }
  .modal-lg { max-width: 820px; }

  #install-pill { bottom: 24px; }
}
</style>
</head>
<body>
  <div id="app">
    <div class="boot">MindPocket 加载中…</div>
  </div>
  <button id="install-pill" hidden>📲 安装到主屏幕</button>
  <script>

/* ===== assets/store.js ===== */
/* =========================================================================
 * To Do —— 数据层 store.js
 * 严格遵循 PRD「全局公共规则」与「数据结构 JSON Schema」
 *  - 归档 ≠ 删除：is_archived 标记，绝不物理删除
 *  - 周期任务：永远只存 1 条主记录，历史全部写入 cycle_history
 *  - 全部数据 localStorage 持久化
 * 暴露 window.MPStore
 * ========================================================================= */
(function () {
  const { reactive } = Vue;
  const STORAGE_KEY = 'mindpocket:v1';

  /* ----------------------------- 工具函数 ----------------------------- */
  function uid(prefix) { return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return fmt(new Date()); }
  function parseDate(s) { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return fmt(d); }
  function dateDiffDays(a, b) { // 返回 b - a 的整天数（可为负）
    return Math.round((parseDate(b).getTime() - parseDate(a).getTime()) / 86400000);
  }
  function weekdayName(n) { return ['日', '一', '二', '三', '四', '五', '六'][n]; }

  // —— 日期输入统一校验/格式化（全局时间输入统一） ——
  // 实时校验：输入值是否为合法 YYYY-MM-DD；空值通过（可选字段）
  function validateDateInput(v) {
    if (!v || v.trim() === '') return { ok: true, msg: '' }; // 空值合法
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v.trim());
    if (!m) return { ok: false, msg: '格式应为 YYYY-MM-DD' };
    const y = +m[1], mo = +m[2], d = +m[3];
    if (y < 2000 || y > 2099) return { ok: false, msg: '年份需在 2000-2099' };
    if (mo < 1 || mo > 12) return { ok: false, msg: '月份需在 01-12' };
    const maxDay = new Date(y, mo, 0).getDate();
    if (d < 1 || d > maxDay) return { ok: false, msg: '日期需在 01-' + pad(maxDay) };
    return { ok: true, msg: '' };
  }
  // 失焦自动补零：2026-8-4 → 2026-08-04
  function autoFormatDate(v) {
    if (!v || v.trim() === '') return '';
    const s = v.trim();
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
    if (!m) return s; // 格式不符不处理，留给校验报错
    return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
  }
  // 年月输入校验：YYYY-MM
  function validateMonthInput(v) {
    if (!v || v.trim() === '') return { ok: true, msg: '' };
    const m = /^(\d{4})-(\d{2})$/.exec(v.trim());
    if (!m) return { ok: false, msg: '格式应为 YYYY-MM' };
    const y = +m[1], mo = +m[2];
    if (y < 2000 || y > 2099) return { ok: false, msg: '年份需在 2000-2099' };
    if (mo < 1 || mo > 12) return { ok: false, msg: '月份需在 01-12' };
    return { ok: true, msg: '' };
  }
  function autoFormatMonth(v) {
    if (!v || v.trim() === '') return '';
    const s = v.trim();
    const m = /^(\d{4})-(\d{1,2})$/.exec(s);
    if (!m) return s;
    return m[1] + '-' + pad(+m[2]);
  }

  // 日期是否落在任意一个请假区间内（含端点）
  function inHolidayRanges(dateStr, ranges) {
    if (!ranges || !ranges.length) return false;
    const t = parseDate(dateStr).getTime();
    return ranges.some(r => {
      const s = parseDate(r.start).getTime();
      const e = parseDate(r.end).getTime();
      return t >= s && t <= e;
    });
  }

  // 周期规则命中判断（视图投射用，不新增 task）
  // 周期数字规范（与高级设置「设置时间」一致）：
  //   每周：1=周初(周一) ... 7=周末(周日)；月末：0=每月末，1=每月初
  function cycleHits(cycle, dateStr) {
    if (!cycle) return false;
    const d = parseDate(dateStr);
    if (cycle.type === 'day' || cycle.type === 'interval') {
      const n = parseInt(cycle.rule, 10);
      if (cycle.type === 'interval') {
        // 自定义区间（每 N 天）：必须有间隔值才命中
        if (!n || n < 1) return false;
        const base = parseDate(cycle._base || dateStr);
        const diff = Math.round((d - base) / 86400000);
        return diff >= 0 && diff % n === 0;
      }
      // 每天：rule 为空 = 每日；为数字 = 每 N 天（自创建日起算）
      if (!n || n <= 1) return true;
      const base = parseDate(cycle._base || dateStr);
      const diff = Math.round((d - base) / 86400000);
      return diff >= 0 && diff % n === 0;
    }
    if (cycle.type === 'week') {
      const r = parseCycleRule(cycle.rule, 'week');
      if (!r.ok) return false;
      const wd = d.getDay() === 0 ? 7 : d.getDay(); // 1=周一 … 7=周日
      return r.nums.includes(wd);
    }
    if (cycle.type === 'month') {
      const r = parseCycleRule(cycle.rule, 'month');
      if (!r.ok) return false;
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return r.nums.some(n => n === 0 ? d.getDate() === last : d.getDate() === n);
    }
    return false;
  }

  function parseWeekday(rule) {
    if (rule === null || rule === undefined || rule === '') return -1;
    const s = String(rule).trim();
    // 周初 = 周一(1)，周末 = 周日(0)。周期数字规范：1=周初 … 7=周末(周日)
    const map = { '0': 0, '日': 0, 'sun': 0, 'sunday': 0, '周日': 0, '星期日': 0, '末': 0, '周末': 0, '7': 0,
      '1': 1, '一': 1, 'mon': 1, 'monday': 1, '周一': 1, '星期一': 1, '初': 1, '周初': 1,
      '2': 2, '二': 2, 'tue': 2, 'tuesday': 2, '周二': 2, '星期二': 2,
      '3': 3, '三': 3, 'wed': 3, 'wednesday': 3, '周三': 3, '星期三': 3,
      '4': 4, '四': 4, 'thu': 4, 'thursday': 4, '周四': 4, '星期四': 4,
      '5': 5, '五': 5, 'fri': 5, 'friday': 5, '周五': 5, '星期五': 5,
      '6': 6, '六': 6, 'sat': 6, 'saturday': 6, '周六': 6, '星期六': 6 };
    if (map[s.toLowerCase()] !== undefined) return map[s.toLowerCase()];
    const n = parseInt(s, 10);
    return isNaN(n) ? -1 : n;
  }

  // 周期规则统一解析（月 / 周共用）：支持「空格 / 逗号分隔的多个数字」「x-y 连续区间」
  // 月：数字 0~31（0 = 当月最后一天）；周：数字 1~7（1=周一 … 7=周日）
  // 返回 { ok, nums:[去重升序数字], error }；非法字符 / 超范围 / 反向区间 一律 ok:false
  function parseCycleRule(raw, kind) {
    const text = String(raw == null ? '' : raw).trim();
    if (!text) return { ok: false, nums: [], error: '请填写周期规则' };
    const isMonth = kind === 'month';
    const min = isMonth ? 0 : 1;
    const max = isMonth ? 31 : 7;
    const unit = isMonth ? '日期' : '星期';
    const norm = text.replace(/,/g, ' ').replace(/\s+/g, ' ').trim();
    const tokens = norm.split(' ').filter(Boolean);
    const set = new Set();
    for (const tok of tokens) {
      if (/^\d+$/.test(tok)) {
        const n = parseInt(tok, 10);
        if (n < min || n > max) return { ok: false, nums: [], error: unit + '需在 ' + min + '~' + max + ' 之间（含 ' + tok + '）' };
        set.add(n);
      } else if (/^\d+-\d+$/.test(tok)) {
        const parts = tok.split('-');
        const a = parseInt(parts[0], 10), b = parseInt(parts[1], 10);
        if (a < min || a > max || b < min || b > max) return { ok: false, nums: [], error: unit + '需在 ' + min + '~' + max + ' 之间（含 ' + tok + '）' };
        if (a >= b) return { ok: false, nums: [], error: '区间需前数字小于后数字（' + tok + '）' };
        for (let n = a; n <= b; n++) set.add(n);
      } else {
        return { ok: false, nums: [], error: '含非法内容（' + tok + '），仅支持数字与「-」区间' };
      }
    }
    return { ok: true, nums: Array.from(set).sort((x, y) => x - y), error: null };
  }

  // 周期规则存入归一化：逗号 → 空格，压缩多余空格（不改写顺序 / 不翻译）
  function normalizeCycleRule(raw) {
    return String(raw == null ? '' : raw).replace(/,/g, ' ').replace(/\s+/g, ' ').trim();
  }

  /* ----------------------------- 系统内置分类 ----------------------------- */
  // 唯一系统内置分类：临时任务。其余业务分类一律不硬编码，由初始化预置 + 用户自定义。
  const QUICK_VIEW_ID = 'cat_quickview';
  const QUICK_VIEW_NAME = '临时任务';
  const SYSTEM_CATEGORIES = [
    { _id: QUICK_VIEW_ID, name: QUICK_VIEW_NAME, is_system: true },
  ];
  // 首次初始化预置的 8 条自定义分类（is_system=false，可删/改名/拖拽排序/用户自由新增）
  const PRESET_CUSTOM_CATEGORIES = ['好物', '影片', '书籍', '旅游', '学习', '生活', '远期', '到期', '无聊'];

  /* ----------------------------- 响应式状态 ----------------------------- */
  const state = reactive({ revision: 0, habits: [], tasks: [], categories: [], settings: { quickToQuickView: true, autoExtend: false },
    projects: [], project_subs: [], project_records: [], project_ideas: [], project_folders: [], sub_custom_statuses: [],
    wish_items: [], wish_records: [] });

  /* ----------------------------- 持久化 ----------------------------- */
  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        habits: state.habits, tasks: state.tasks, categories: state.categories, settings: state.settings,
        projects: state.projects, project_subs: state.project_subs,
        project_records: state.project_records, project_ideas: state.project_ideas,
        project_folders: state.project_folders,
        sub_custom_statuses: state.sub_custom_statuses,
        wish_items: state.wish_items, wish_records: state.wish_records,
      }));
    } catch (e) { console.error('[MP] persist failed', e); }
    notifyChange(); // 数据落盘即广播全局刷新（revision++），所有监听页面自动重载
    // 提醒钩子：若已启用手机提醒推送，本地变更后重新安排 ntfy 延迟推送（P2）
    if (window.MPNotify && window.MPNotify.onChange) { try { window.MPNotify.onChange(); } catch (_) {} }
  }
  // 全局刷新通知：自增响应式版本号，供各页面 watch 监听后主动重载数据
  function notifyChange() { state.revision = (state.revision || 0) + 1; }

  // —— 全局滑动操作互斥锁 ——
  // 所有滑动卡片（任务/子任务/许愿池/闲趣）共用同一把锁，防止动画与数据同步期间重复触发。
  // lock(token)：尝试获取锁，成功返回 true，失败返回 false（token 用于调试追踪）。
  // unlock(token)：释放锁（仅当锁属于该 token 时释放，防止误释放）。
  var _swipeLock = null;
  var _swipeLockTimer = null;
  var SWIPE_LOCK_TIMEOUT = 800; // 锁超时自动释放（防止异常情况导致永久锁死）
  function swipeLock(token) {
    if (_swipeLock !== null) return false;
    _swipeLock = token;
    if (_swipeLockTimer) clearTimeout(_swipeLockTimer);
    _swipeLockTimer = setTimeout(function() { _swipeLock = null; }, SWIPE_LOCK_TIMEOUT);
    return true;
  }
  function swipeUnlock(token) {
    if (_swipeLock === token || _swipeLock === null) {
      _swipeLock = null;
      if (_swipeLockTimer) { clearTimeout(_swipeLockTimer); _swipeLockTimer = null; }
    }
  }
  // 强制清理所有滑动锁（页面离开时调用）
  function swipeCleanup() {
    _swipeLock = null;
    if (_swipeLockTimer) { clearTimeout(_swipeLockTimer); _swipeLockTimer = null; }
  }

  // 统一滑动阈值：区分点击与滑动的像素距离
  var SWIPE_ACTIVATE_PX = 8;   // 超过此距离视为滑动（取消长按）
  var SWIPE_TRIGGER_PX = 80;   // 超过此距离触发操作（左滑完成/右滑撤销）
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const o = JSON.parse(raw);
      state.habits = o.habits || [];
      state.tasks = o.tasks || [];
      state.categories = o.categories || [];
      const s = o.settings || {};
      const n = (s && s.notify && typeof s.notify === 'object') ? s.notify : {};
      state.settings = {

      return true;
    } catch (e) { console.error('[MP] load failed', e); return false; }
  }
