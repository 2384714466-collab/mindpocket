  // —— Project 项目主表 ——
  function addProject(p) {
    const proj = Object.assign({ pid: uid('proj'), name: '', deadline: null, status: 'running', tags: [], folder_id: null, importance: 'normal', createAt: Date.now() }, newSync(), p || {});
    state.projects.push(proj);
    persist();
    return proj;
  }
  function updateProject(pid, patch) {
    const p = state.projects.find(x => x.pid === pid);
    if (!p) return;
    Object.assign(p, patch);
    touch(p);
    persist();
  }
  function archiveProject(pid) {
    // 积分联动：项目完结 = 45基础 + 每小时12分加成
    const totalMin = projectFocusMin(pid);
    const basePts = 45;
    const hourlyBonus = Math.floor(totalMin / 60) * 12;
    const proj = state.projects.find(p => p.pid === pid);
    const projName = proj ? (proj.name || '未命名') : '';
    updateProject(pid, { status: 'archive', archived_at: todayStr() });
    addPoints(basePts + hourlyBonus, 'project_finish',
      '项目「' + projName + '」完结' + (totalMin > 0 ? ' (专注 ' + totalMin + ' 分钟)' : ''), pid);
  }
  function reopenProject(pid) {
    // 积分联动：重开项目，收回完结积分
    reversePoints(pid, 'project_finish');
    updateProject(pid, { status: 'running' });
  }
  // 项目永久删除（含其下全部子任务；不可撤销）
  // 积分回滚：项目本体完结加成（project_finish，refId = pid）
  //         + 内部全部子任务（project_sub refId = sid；study_work refId = sid_study）
  //         合并为一条汇总清算记录，rollbackOf 保留全部原始记录 id 供审计
  // 与 archiveProject 区别：归档是「完结」，反而发放加成积分，绝不回滚
  function deleteProject(pid) {
    const proj = state.projects.find(p => p.pid === pid);
    const subs = state.project_subs.filter(s => s.pid === pid);   // 含软删除子任务，其记录若已清算会被幂等跳过
    rollbackEntityPoints(
      [pid].concat(subs.map(s => s.sid)),
      'project', proj ? proj.name : '',
      subs.length > 0 ? '连带 ' + subs.length + ' 个子任务' : ''
    );
    state.projects = state.projects.filter(p => p.pid !== pid);
    state.project_subs = state.project_subs.filter(s => s.pid !== pid);
    // 级联清理项目灵感库（以 pid 维度隔离），兑现"所有数据、任务无法恢复"
    state.project_ideas = state.project_ideas.filter(i => i.pid !== pid);
    persist();
  }

  // —— ProjectFolder 归档项目文件夹（仅用于给已归档项目分组，不影响项目本身数据）——
  function addFolder(name) {
    const f = Object.assign({ fid: uid('fold'), name: (name || '').trim() || '未命名文件夹', status: 'archive', parent: null, createAt: Date.now() }, newSync());
    state.project_folders.push(f);
    persist();
    return f;
  }
  function renameFolder(fid, name) {
    const f = state.project_folders.find(x => x.fid === fid);
    if (!f) return;
    f.name = (name || '').trim() || f.name;
    touch(f);
    persist();
  }
  function deleteFolder(fid) { // 删除文件夹：其中项目全部移出（folder_id 置空），项目数据不受影响
    state.projects.forEach(p => { if (p.folder_id === fid) { p.folder_id = null; touch(p); } });
    state.project_folders = state.project_folders.filter(f => f.fid !== fid);
    persist();
  }
  function getFolders() {
    try {
      // 防御：过滤掉 null/undefined 或损坏项，避免读取 deleted_at 抛错导致整页白屏
      const clean = (state.project_folders || []).filter(f => f && f.fid);
      return clean.filter(f => !f.deleted_at);
    } catch (e) {
      console.error('[getFolders] 读取失败：', e);
      return [];
    }
  }
  function moveProjectToFolder(pid, fid) { updateProject(pid, { folder_id: fid || null }); }
  // 文件夹归档 / 撤销归档：级联其直属项目（归档→running 项目转 archive；撤销→archive 项目转 running）
  function archiveFolder(fid) {
    const f = state.project_folders.find(x => x.fid === fid); if (!f) return;
    f.status = 'archive'; touch(f);
    state.projects.forEach(p => { if (p.folder_id === fid && p.status === 'running') archiveProject(p.pid); });
    persist();
  }
  function reopenFolder(fid) {
    const f = state.project_folders.find(x => x.fid === fid); if (!f) return;
    f.status = 'running'; touch(f);
    state.projects.forEach(p => { if (p.folder_id === fid && p.status === 'archive') reopenProject(p.pid); });
    persist();
  }
  // 文件夹移动到另一个文件夹（最多两层，禁止更深嵌套）；parentFid=null 表示移回根目录
  function moveFolderToFolder(fid, parentFid) {
    const f = state.project_folders.find(x => x.fid === fid); if (!f) return;
    f.parent = parentFid || null; touch(f); persist();
  }

  // —— ProjectSub 项目子任务表（含可选 sub_deadline）——
  // estMin   预计耗时（分钟，0=未设置，仅作时间进度条参照，不参与完成判定）
  // spentMin 累计已花费时间（分钟，由填报留痕累加；撤销填报同步扣减）
  // done_at  标记完成的时间戳（供「完成自动置后」稳定排序使用）
  function addSub(pid, s) {
    const sub = Object.assign({
      sid: uid('psub'), pid: pid, title: '', unit: '页',
      planDaily: 1, enableTotal: false, total: null, finished: 0,
      sub_start: null, sub_end: null, sub_done: false, status: '进行中',
      tags: [], estMin: 0, spentMin: 0, done_at: null,
      isEmergency: false,
    }, newSync(), s || {});
    state.project_subs.push(sub);
    persist();
    return sub;
  }
  function updateSub(sid, patch) {
    const s = state.project_subs.find(x => x.sid === sid);
    if (!s) return;
    Object.assign(s, patch);
    touch(s);
    persist();
  }
  // 项目子任务删除（软删除保留数据，但对用户即「删除」语义 → 回滚积分）
  // 回滚范围：project_sub（refId = sid）+ study_work（refId = sid_study），由 id 前缀族一次覆盖
  function removeSub(sid) { // 软删除，保留数据
    const s = state.project_subs.find(x => x.sid === sid);
    if (!s) return;
    if (!s.deleted_at) rollbackEntityPoints([sid], 'project_sub', s.title); // 重复删除不重复清算
    s.deleted_at = Date.now();
    touch(s);
    persist();
  }
  // 子任务是否已完成：两种来源任一成立即为完成
  //  · 计数任务：开启总目标且进度达 100%
  //  · 任意任务：被「标记完成」显式置为已完成（sub_done）
  function isSubComplete(s) {
    return !!(s && (s.sub_done || (s.enableTotal && s.total > 0 && (Number(s.finished) || 0) >= Number(s.total))));
  }
  // 标记完成 / 取消完成（所有子任务通用，与是否开启计数目标解耦）
  //  · 标记：计数任务 finished 拉满到 total（一键 100%），简单任务置 sub_done=true
  //  · 取消：sub_done 复位；计数任务按填报留痕重新累加 finished（恢复真实进度）
  function toggleSubDone(sid) {
    const s = state.project_subs.find(x => x.sid === sid);
    if (!s) return;
    if (isSubComplete(s)) {
      s.sub_done = false;
      s.done_at = null; // 复位完成时间戳 → 重新回到未完成分区
      s.status = '进行中'; // 取消完成 → 回到进行中（自定义非完成状态可再手动设回）
      if (s.enableTotal && s.total > 0) {
        const sum = state.project_records.filter(r => r.sid === sid && !r.deleted_at)
          .reduce((a, r) => a + (Number(r.actualNum) || 0), 0);
        s.finished = sum;
      }
    } else {
      if (s.enableTotal && s.total > 0) s.finished = Number(s.total);
      s.sub_done = true;
      s.done_at = Date.now(); // 记录完成时刻 → 完成区内按完成先后排列
      s.status = '已完成';   // 标记完成 → 工作流状态同步为已完成
      s.isEmergency = false;  // 标记完成即清空紧急标记（视为已处理）
    }
    touch(s); persist();
  }

  // —— 项目子任务自定义状态（全局清单，用户自由新增；均为「非完成」状态）——
  function addCustomSubStatus(name) {
    const v = (name || '').trim();
    if (!v) return false;
    if (v === '进行中' || v === '已完成') return false;            // 内置状态不可重复添加
    if (!state.sub_custom_statuses) state.sub_custom_statuses = [];
    if (state.sub_custom_statuses.indexOf(v) >= 0) return false;   // 去重
    state.sub_custom_statuses.push(v);
    persist();
    return true;
  }

  // —— ProjectRecord 填报留痕表 ——
  // spentMin：本次填报花费时间（分钟）。与完成量彼此独立，可只填时间、也可只填完成量
  function addRecord(sid, recordDate, actualNum, spentMin, note) {
    const n = Number(actualNum) || 0;
    const sp = Math.max(0, Math.round(Number(spentMin) || 0));
    const noteStr = (note == null ? '' : String(note)).trim();
    const rec = Object.assign({ rid: uid('rec'), sid: sid, recordDate: recordDate, actualNum: n, spentMin: sp, note: noteStr }, newSync());
    state.project_records.push(rec);
    // 累加子任务 finished（无数字校验，0/大于/小于计划均可）+ 累加已花费时间
    const s = state.project_subs.find(x => x.sid === sid);
    if (s) {
      s.finished = (Number(s.finished) || 0) + n;
      s.spentMin = Math.max(0, (Number(s.spentMin) || 0) + sp);
      touch(s);
    }
    persist();
    // 积分联动：项目填报基础分 —— 每填报一次即 +7（与专注时长 / 标签积分彼此独立，按记录独立计入、可独立撤销）
    addPoints(7, 'project_report', '项目填报: ' + (s ? s.title : sid), rec.rid);
    // 积分联动：子任务专注时长 25min=6分，线性折算（project_sub，与 study_work / 基础分 独立并行）
    if (sp > 0) {
      const pts = Math.round(sp / 25 * 6);
      if (pts > 0) {
        const sub = state.project_subs.find(x => x.sid === sid);
        addPoints(pts, 'project_sub', '子任务专注: ' + (sub ? sub.title : '') + ' (' + sp + '分钟)', sid, sp);
      }
    }
    // 积分联动：学习工作类标签项目子任务 → study_work 积分（仅「有专注时长」时按 25min=7分 线性叠加，与基础分独立并行）
    if (s) {
      const hasStudyTag = (s.tags || []).some(tag => STUDY_WORK_TAGS.includes(tag));
      if (hasStudyTag && sp > 0) {
        // 有专注时长：25min=7分线性（study_work 基准，与 project_sub 的 25min=6分 独立发放）
        const pts = Math.round(sp / 25 * 7 * 10) / 10;
        if (pts > 0) {
          addPoints(pts, 'study_work', '项目子任务专注: ' + s.title + ' (' + sp + '分钟)', sid + '_study', sp);
        }
      }
    }
    return rec;
  }
  function getRecords(sid) {
    return state.project_records.filter(r => r.sid === sid && !r.deleted_at).slice().sort((a, b) => a.recordDate < b.recordDate ? 1 : -1);
  }
  function deleteRecord(sid, rid) {
    const s = state.project_subs.find(x => x.sid === sid);
    const rec = state.project_records.find(r => r.rid === rid);
    if (!s || !rec) return;
    const amt = Number(rec.actualNum) || 0;
    if ((Number(s.finished) || 0) - amt < 0) return;
    // 积分联动：撤销填报，收回积分（project_sub + study_work 各自独立收回）
    const sp = Number(rec.spentMin) || 0;
    if (sp > 0) { reversePoints(sid, 'project_sub'); }
    const hasStudyTag = (s.tags || []).some(tag => STUDY_WORK_TAGS.includes(tag));
    if (hasStudyTag) { reversePoints(sid + '_study', 'study_work'); }
    // 收回「项目填报基础分」（每条记录独立计入、独立撤销）
    reversePoints(rec.rid, 'project_report');
    rec.deleted_at = Date.now();
    touch(rec);
    s.finished = Math.max(0, (Number(s.finished) || 0) - amt);
    s.spentMin = Math.max(0, (Number(s.spentMin) || 0) - sp);
    touch(s);
    persist();
  }

  // —— ProjectIdea 项目灵感素材表 ——
  function addIdea(pid, idea) {
    const o = Object.assign({ idea_id: uid('idea'), pid: pid, title: '', content: '', link: '', createAt: Date.now(), is_picked: false }, newSync(), idea || {});
    state.project_ideas.push(o);
    persist();
    return o;
  }
  function updateIdea(idea_id, patch) {
    const o = state.project_ideas.find(x => x.idea_id === idea_id);
    if (!o) return;
    Object.assign(o, patch);
    touch(o);
    persist();
  }
  function removeIdea(idea_id) { // 软删除，原始素材保留
    const o = state.project_ideas.find(x => x.idea_id === idea_id);
    if (!o) return;
    o.deleted_at = Date.now();
    touch(o);
    persist();
  }
  function pickIdea(idea_id) {
    const o = state.project_ideas.find(x => x.idea_id === idea_id);
    if (!o) return;
    o.is_picked = true;
    touch(o);
    persist();
  }

  // —— 选择器 / 计算 ——
  function getProjects(status) {
    let list = state.projects.filter(p => !p.deleted_at);
    if (status) list = list.filter(p => p.status === status);
    return list;
  }
  function getSubs(pid) { return state.project_subs.filter(s => s.pid === pid && !s.deleted_at); }
  function getIdeas(pid) { return state.project_ideas.filter(i => i.pid === pid && !i.deleted_at); }
  // 任务灵感库：复用 project_ideas 表，以 task_id 维度隔离（pid 置空，不会污染项目列表）
  function addTaskIdea(taskId, idea) {
    const o = Object.assign({ idea_id: uid('idea'), task_id: taskId, pid: null, title: '', content: '', link: '', createAt: Date.now(), is_picked: false }, newSync(), idea || {});
    state.project_ideas.push(o);
    persist();
    return o;
  }
  function getTaskIdeas(taskId) { return state.project_ideas.filter(i => i.task_id === taskId && !i.deleted_at); }
  // 项目整体进度：仅「开启总目标」的子任务按 total 加权平均；无则 null（隐藏进度条）
  function projectProgress(pid) {
    const subs = getSubs(pid).filter(s => s.enableTotal && s.total > 0);
    if (!subs.length) return null;
    let acc = 0, tot = 0;
    subs.forEach(s => { acc += Math.min(Number(s.finished) || 0, Number(s.total)); tot += Number(s.total); });
    return tot > 0 ? Math.round((acc / tot) * 100) : 0;
  }
  // 项目倒数日：deadline - 今天；正=剩余，0=今日到期，负=已过；null=无倒数
  function projectCountdown(deadline) {
    if (!deadline) return null;
    return Math.round((parseDate(deadline).getTime() - parseDate(todayStr()).getTime()) / 86400000);
  }
  // 子任务自身进度（仅 enableTotal 有值）
  function subProgress(s) {
    if (!s.enableTotal || !s.total || s.total <= 0) return null;
    return Math.min(100, Math.round((Number(s.finished) || 0) / Number(s.total) * 100));
  }
  // 子任务列表（已完成自动置后）：未完成保持原有相对顺序；已完成按完成时刻先后排在末尾
  function getSubsOrdered(pid) {
    const list = getSubs(pid);
    const undone = [], done = [];
    list.forEach(s => { (isSubComplete(s) ? done : undone).push(s); });
    done.sort((a, b) => (Number(a.done_at) || 0) - (Number(b.done_at) || 0));
    return undone.concat(done);
  }
  // 分钟 → "xx h xx min" 展示文本（0 分钟返回 '0 min'；不足 1 小时只显示分钟）
  function fmtSpent(min) {
    const m = Math.max(0, Math.round(Number(min) || 0));
    const h = Math.floor(m / 60), r = m % 60;
    if (h > 0 && r > 0) return h + ' h ' + r + ' min';
    if (h > 0) return h + ' h';
    return r + ' min';
  }
  // 子任务累计已花费时间（分钟）：优先取累加字段，缺失则由填报留痕实时兜底汇总
  function subSpentMin(s) {
    if (!s) return 0;
    if (s.spentMin != null) return Math.max(0, Number(s.spentMin) || 0);
    return state.project_records.filter(r => r.sid === s.sid && !r.deleted_at)
      .reduce((a, r) => a + (Number(r.spentMin) || 0), 0);
  }
  // 项目累计专注时长（分钟）：仅统计其下子任务在「项目 Tab 内填报」的 project_records；无记录则为 0
  function projectFocusMin(pid) {
    const sids = {};
    getSubs(pid).forEach(s => { sids[s.sid] = true; });
    return (state.project_records || []).filter(r => !r.deleted_at && sids[r.sid])
      .reduce((a, r) => a + (Number(r.spentMin) || 0), 0);
  }
  // 项目下全部子任务标签（去重，保持首次出现顺序），供标签筛选栏 / 分布图使用
  function getSubTags(pid) {
    const out = [];
    getSubs(pid).forEach(s => (s.tags || []).forEach(t => { if (t && out.indexOf(t) < 0) out.push(t); }));
    return out;
  }

  /* ============================ 统计辅助 ============================ */
  // 某日全部「可判定完成」习惯的整体完成百分比（含 SOP + QUIT，排除请假）
  function dayCompletion(date) {
    const applicable = state.habits.filter(h => h.type !== 'RECORD_HABIT' && !isHoliday(h._id, date));
    if (!applicable.length) return null;
    let done = 0;
    applicable.forEach(h => {
      const rec = getHabitRecord(h._id, date);
      if (h.type === 'SOP_HABIT') { if (rec && rec.status === 'success') done++; }
      else if (h.type === 'QUIT_HABIT') { if (!rec || rec.status !== 'fail') done++; } // 默认成功
    });
    return Math.round((done / applicable.length) * 100);
  }

  // 单习惯 月度/年度 成功次数（SOP 计 success；QUIT 计 非 fail）
  function habitCount(habitId, year, month) {
    const h = findHabit(habitId);
    if (!h) return 0;
    return h.records.filter(r => {
      const d = parseDate(r.date);
      if (d.getFullYear() !== year) return false;
      if (month && d.getMonth() + 1 !== month) return false;
      if (h.type === 'SOP_HABIT') return r.status === 'success';
      if (h.type === 'QUIT_HABIT') return r.status !== 'fail';
      if (h.type === 'RECORD_HABIT') return r.status === 'record';
      return false;
    }).length;
  }

  // 记录型习惯全部记录（供 AI 健康助手）
  function getAllRecordHabitLogs() {
    return state.habits.filter(h => h.type === 'RECORD_HABIT')
      .map(h => ({ name: h.name, records: h.records.slice().sort((a, b) => a.date < b.date ? 1 : -1) }));
  }

  /* ----------------------------- 许愿池 ----------------------------- */
  function addWishItem(obj) {
    const maxOrder = state.wish_items.reduce((m, w) => Math.max(m, w.sort_order || 0), 0);
    // validity_days: 兑换后「待核销」记录的有效期（天）。null/0/缺省 = 永久有效，不会自动过期。
    const vd = obj.validity_days !== undefined ? parseInt(obj.validity_days, 10) : NaN;
    state.wish_items.push({
      _id: uid('wish'),
      name: String(obj.name || '').trim(),
      cost: Math.max(1, parseInt(obj.cost, 10) || 0),
      count_type: obj.count_type === 'repeatable' ? 'repeatable' : 'one_time',
      repeat_count: 0,
      is_archived: false,
      validity_days: (isNaN(vd) || vd <= 0) ? null : vd,
      sort_order: maxOrder + 1,
      created_at: todayStr(),
    });
    persist();
  }
  function updateWishItem(id, patch) {
    const item = state.wish_items.find(w => w._id === id);
    if (!item) return;
    if (patch.name !== undefined) item.name = String(patch.name).trim();
    if (patch.cost !== undefined) item.cost = Math.max(1, parseInt(patch.cost, 10) || 0);
    if (patch.count_type !== undefined) item.count_type = patch.count_type === 'repeatable' ? 'repeatable' : 'one_time';
    if (patch.validity_days !== undefined) {
      const vd = parseInt(patch.validity_days, 10);
      item.validity_days = (isNaN(vd) || vd <= 0) ? null : vd;
    }
    persist();
  }
  function removeWishItem(id) {
    const idx = state.wish_items.findIndex(w => w._id === id);
    if (idx < 0) return;
    state.wish_items.splice(idx, 1);
    persist();
  }
  function redeemWish(id) {
    const item = state.wish_items.find(w => w._id === id);
    if (!item) return null;
    if (item.is_archived) return null;
    const pts = availablePoints();
    if (pts < item.cost) return null;
    const recordId = uid('wrec');
    state.wish_records.push({
      _id: recordId, wish_id: id, wish_name: item.name, cost: item.cost,
      time: new Date().toISOString(), status: 'normal', recordType: 'redeem',
      verify: 'pending',   // 兑换后默认「待核销」：已扣积分、权益尚未核销领取
    });
    if (item.count_type === 'one_time') {
      item.is_archived = true;
      item.completed_at = todayStr();
      // 同步至统计Tab全局归档仓库：创建带 #许愿 标签的已归档任务
      const archiveTaskId = uid('task');
      state.tasks.push({
        _id: archiveTaskId, title: '已兑换愿望: ' + item.name,
        desc: '许愿池一次性愿望兑换完成 (' + item.cost + ' 积分)',
        category_id: null, is_archived: true, execute_date: todayStr(),
        cycle: null, sub_tasks: [], progress_info: { enable: false },
        material_notes: '', cycle_history: [], create_at: Date.now(),
        is_template: false, is_collection: false, isEmergency: false,
        tags: ['#许愿'],
      });
    } else {
      item.repeat_count = (item.repeat_count || 0) + 1;
    }
    persist();
    return recordId;
  }
  // 兑换记录核销状态（与 cancel 标记 status 正交）：
  //   'pending'  待核销（已扣积分、权益尚未领取）→ 可撤销
  //   'verified' 已核销（权益已领取/使用）→ 不可撤销
  //   'expired'  已过期（待核销超有效期未核销）→ 不可撤销；此状态由本函数动态计算，不落库
  //   'cancelled' 已撤销（被 undoRedeem 标记 status='reversed'）
  function redeemState(r) {
    if (!r) return 'pending';
    if (r.status === 'reversed') return 'cancelled';
    if (r.verify === 'verified') return 'verified';
    // 待核销：若所属愿望设了有效期且已超期 → 已过期
    const item = state.wish_items.find(w => w._id === r.wish_id);
    if (item && item.validity_days && item.validity_days > 0) {
      const t = new Date(r.time).getTime();
      if (!isNaN(t) && (Date.now() - t) > item.validity_days * 86400000) return 'expired';
    }
    return 'pending';
  }

  // 手动核销：待核销 → 已核销（权益已领取）。已核销/已过期/已撤销均不可再核销。
  function verifyRedeem(recordId) {
    const rec = state.wish_records.find(r => r._id === recordId);
    if (!rec || rec.status === 'reversed') return false;
    if (rec.verify === 'verified') return false;
    if (redeemState(rec) === 'expired') return false;   // 已过期不可核销
    rec.verify = 'verified';
    persist();
    return true;
  }

  function undoRedeem(recordId) {
    const rec = state.wish_records.find(r => r._id === recordId);
    if (!rec || rec.status === 'reversed') return false;
    // 仅「待核销」可撤销；已核销 / 已过期 / 已撤销 一律拒绝（二次确认由 UI 层负责）
    if (redeemState(rec) !== 'pending') return false;
    const cost = Number(rec.cost) || 0;
    const wishId = rec.wish_id, wishName = rec.wish_name || '未知愿望';
    // 1) 原兑换记录置 reversed → 自动退出 getPointsSpent 汇总，积分即时返还（余额口径只统计 normal）
    rec.status = 'reversed';
    // 2) 写一条「撤销兑换」流水（recordType:'undo'，纯展示、不计入任何余额，与习惯撤销一致）
    const recordId2 = uid('wrec');
    const desc = '撤销兑换｜愿望「' + wishName + '」返还 ' + cost + ' 积分';
    state.wish_records.push({
      _id: recordId2, wish_id: '', wish_name: desc, cost: cost,
      time: new Date().toISOString(), status: 'normal',
      recordType: 'undo',            // 不参与 getPointsEarned/Penalty/Spent 任一统计，纯流水留痕
      category: 'redeem_undo',
      detail: desc, refId: 'redeemundo_' + rec._id, focusMin: 0,
      isRedeemUndo: true, undoNet: -cost,   // 负值=返还（可用积分增加），明细以绿色 '+' 呈现
      redeemName: wishName, undoOf: [rec._id],
    });
    // 3) 还原愿望本身（一次性解除归档 / 循环计数回退）
    const item = state.wish_items.find(w => w._id === wishId);
    if (item) {
      if (item.count_type === 'one_time') {
        item.is_archived = false;
        item.completed_at = '';
        // 移除归档同步条目
        state.tasks = state.tasks.filter(t =>
          !(t.is_archived && t.title === '已兑换愿望: ' + item.name && t.tags && t.tags.includes('#许愿'))
        );
      } else { item.repeat_count = Math.max(0, (item.repeat_count || 1) - 1); }
    }
    persist();
    return true;
  }
  function getWishEditCountThisMonth() {
    const now = new Date();
    const ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    return state.wish_records.filter(r => r.recordType === 'edit' && r.time && r.time.slice(0, 7) === ym).length;
  }
  // 愿望修改开放日：仅每月 1–3 号可修改愿望（不限次数），其余日期禁止修改。
  // 替代原先「每月 N 次」的计数限制（需求：每月 1-3 号方可修改，限这三天）。
  function wishEditWindowOpen() {
    const d = new Date().getDate();
    return d >= 1 && d <= 3;
  }
  function incrementEditCount() {
    state.wish_records.push({
      _id: uid('wrec'), wish_id: '', wish_name: '', cost: 0,
      time: new Date().toISOString(), status: 'normal', recordType: 'edit',
    });
    persist();
  }
  function getPointsEarned() {
    return state.wish_records.filter(r => r.status === 'normal' && r.recordType === 'earn')
      .reduce((a, r) => a + (r.cost || 0), 0);
  }
  function getPointsPenalty() {
    return state.wish_records.filter(r => r.status === 'normal' && r.recordType === 'penalty')
      .reduce((a, r) => a + (r.cost || 0), 0);
  }
  function getPointsSpent() {
    return state.wish_records.filter(r => r.status === 'normal' && r.recordType === 'redeem')
      .reduce((a, r) => a + (r.cost || 0), 0);
  }
  function availablePoints() { return Math.max(0, getPointsEarned() - getPointsPenalty() - getPointsSpent()); }

  // 集中式积分发放/扣除：所有模块统一入口
  function addPoints(amount, category, detail, refId, focusMin) {
    if (!amount || amount === 0) return null;
    const absAmount = Math.abs(amount);
    if (amount < 0) {
      const currentPts = availablePoints();
      if (currentPts <= 0) return null;
      const effective = Math.min(absAmount, currentPts);
      const recordId = uid('wrec');
      state.wish_records.push({
        _id: recordId, wish_id: '', wish_name: detail, cost: effective,
        time: new Date().toISOString(), status: 'normal', recordType: 'penalty',
        category: category, detail: detail, refId: refId || '', focusMin: focusMin || 0,
      });
      persist();
      return recordId;
    }
    const recordId = uid('wrec');
    state.wish_records.push({
      _id: recordId, wish_id: '', wish_name: detail, cost: absAmount,
      time: new Date().toISOString(), status: 'normal', recordType: 'earn',
      category: category, detail: detail, refId: refId || '', focusMin: focusMin || 0,
    });
    persist();
    return recordId;
  }

  // 集中式积分撤销：查找并标记所有相关记录为 reversed
  function reversePoints(refId, category) {
    const records = state.wish_records.filter(r =>
      r.refId === refId && r.category === category && r.status === 'normal'
    );
    if (!records.length) return;
    records.forEach(r => { r.status = 'reversed'; });
    persist();
  }

  /* ============ 删除回滚：实体永久删除时的历史积分净额反向清算 ============
   * 语义边界（务必与「归档」区分）：
   *   · 归档 = 保留历史 → 绝不回滚积分（archiveHabit / archiveTask / archiveSubTask / archiveProject 均不接入本模块）
   *   · 删除 = 实体不复存在 → 其历史所有加分/扣分按「净额」一次性反向清算
   * 设计要点：
   *   1) 原始记录保持 status='normal' 不变（仍可在明细中溯源），仅打 rolledBackBy 展示标记；
   *      回滚通过「新增一条反向记录」实现，而非把旧记录置为 reversed —— 否则会与新增记录重复计算。
   *   2) 净额 = Σ(earn) - Σ(penalty)。净额为正 → 写 penalty 扣回；净额为负（如破戒扣分多）→ 写 earn 返还。
   *   3) 不复用 addPoints：addPoints 对负分有「可用积分不足则截断」的业务保护，
   *      而删除清算要求账目严格平衡、可审计，故独立精确写入（availablePoints 自带 max(0) 兜底，不会显示负分）。
   *   4) 兑换记录（redeem）属于用户消费行为，与实体无关，不参与回滚。
   *   5) delete_rollback 记录自身永不参与二次回滚。
   */
  var POINT_ROLLBACK_CAT = 'delete_rollback';

  // 归集某实体（按 id 前缀族）名下全部仍生效的业务积分记录
  // bases: id 数组。命中规则 refId === base 或 refId 以 base + '_' 开头
  //   （覆盖 习惯 habitId_date、任务子任务 taskId_subId、项目子任务 sid_study 等复合 refId）
  function collectEntityPointRecords(bases) {
    const list = (bases || []).filter(Boolean);
    if (!list.length) return [];
    return state.wish_records.filter(r => {
      if (!r || r.status !== 'normal') return false;
      if (r.category === POINT_ROLLBACK_CAT) return false;   // 回滚记录不可再被回滚
      if (r.rolledBackBy) return false;                      // 幂等：已清算过的记录不再二次回滚
                                                             //（如先删子任务、后删父任务/父项目）
      // 仅真实收支参与清算：排除愿望兑换（用户消费）与 undo 流水（纯展示留痕，不计余额）
      if (r.recordType !== 'earn' && r.recordType !== 'penalty') return false;
      const ref = r.refId || '';
      if (!ref) return false;
      return list.some(b => ref === b || ref.indexOf(b + '_') === 0);
    });
  }

  // 执行删除回滚：计算净额 → 写入一条删除回滚记录（即便净额为 0 也留痕，保证「删除必有记录」）
  // bases      : 实体 id 族（项目删除时含其全部子任务 sid）
  // entityType : 'habit' | 'task' | 'subtask' | 'project' | 'project_sub'
  // entityName : 展示名称
  // extraNote  : 附加说明（如项目连带子任务数量）
  function rollbackEntityPoints(bases, entityType, entityName, extraNote) {
    const hit = collectEntityPointRecords(bases);
    let earn = 0, penalty = 0;
    hit.forEach(r => {
      const v = Number(r.cost) || 0;
      if (r.recordType === 'earn') earn += v;
      else if (r.recordType === 'penalty') penalty += v;
    });
    // 净额：正数=历史净得分（需扣回），负数=历史净失分（需返还）
    const net = Math.round((earn - penalty) * 10) / 10;
    const typeLabel = ({
      habit: '习惯', task: '任务', subtask: '子任务',
      project: '项目', project_sub: '项目子任务',
    })[entityType] || '条目';
    const nm = (entityName || '').toString().trim() || '未命名';
    const recordId = uid('wrec');
    const desc = '删除回滚｜' + typeLabel + '「' + nm + '」'
      + (net > 0 ? '扣回 ' + net + ' 积分' : (net < 0 ? '返还 ' + Math.abs(net) + ' 积分' : '无积分变动'))
      + (extraNote ? '（' + extraNote + '）' : '');
    state.wish_records.push({
      _id: recordId, wish_id: '', wish_name: desc,
      cost: Math.abs(net),
      time: new Date().toISOString(), status: 'normal',
      // 净额为正 → penalty 扣回；为负 → earn 返还；为 0 → 记 earn 且 cost=0（纯留痕，不影响余额）
      recordType: net > 0 ? 'penalty' : 'earn',
      category: POINT_ROLLBACK_CAT,
      detail: desc, refId: 'rollback_' + (bases && bases[0] ? bases[0] : recordId),
      focusMin: 0,
      isRollback: true, rollbackType: entityType, rollbackName: nm,
      rollbackNet: net, rollbackEarn: earn, rollbackPenalty: penalty,
      rollbackCount: hit.length,
      rollbackOf: hit.map(r => r._id),   // 审计溯源：本次清算覆盖的原始记录
    });
    // 原记录保留生效状态（保证账目不双算），仅打展示标记
    hit.forEach(r => { r.rolledBackBy = recordId; });
    persist();
    return { recordId, net, earn, penalty, count: hit.length };
  }

  function getWishSorted() {
    const pts = availablePoints();
    const active = state.wish_items.filter(w => !w.is_archived);
    return active.slice().sort((a, b) => {
      const aAff = pts >= a.cost ? 0 : 1;
      const bAff = pts >= b.cost ? 0 : 1;
      if (aAff !== bAff) return aAff - bAff;
      return (a.sort_order || 0) - (b.sort_order || 0);
    });
  }
  function setWishOrder(id, newOrder) {
    const item = state.wish_items.find(w => w._id === id);
    if (!item) return;
    item.sort_order = newOrder;
    persist();
  }

  /* ----------------------------- 初始化 ----------------------------- */
  // 收藏四类固定名称（声明在 migrate() 之前，defaultModeFor 迁移旧任务时需要）
  var COLLECTION_CATS = ['好物', '影片', '书籍', '旅游'];
  // 老用户兼容迁移：旧版可能把「体重记录 / 戒奶茶」标记为系统内置（不可编辑/删除）。
  // 现统一移除习惯上的 is_system 标记，转为普通用户习惯；历史记录完整保留不清空。
  function migrate() {
    let changed = false;
    // 项目子任务自定义状态清单：旧数据补齐（默认空数组，用户自由新增）
    if (state.sub_custom_statuses === undefined) { state.sub_custom_statuses = []; changed = true; }
    state.habits.forEach(h => {
      if (h && h.is_system) { delete h.is_system; changed = true; }
      // 养成型习惯补齐 plan_time 字段（旧数据可能缺失，缺省置空 -> 排末尾）
      if (h && h.type === 'SOP_HABIT' && h.plan_time === undefined) { h.plan_time = ''; changed = true; }
      // 旧数据可能缺失 holiday_ranges / records，统一补齐为空数组，避免渲染或补卡时访问 undefined
      if (h && h.holiday_ranges === undefined) { h.holiday_ranges = []; changed = true; }
      if (h && h.records === undefined) { h.records = []; changed = true; }
      // 旧数据可能缺失 unit 字段，统一补齐为「次」，避免统计页标签后缀显示异常
      if (h && h.unit === undefined) { h.unit = '次'; changed = true; }
      // 旧数据可能缺失归档标记，统一补齐（默认未归档），支撑「归档习惯」功能
      if (h && h.is_archived === undefined) { h.is_archived = false; changed = true; }
      if (h && h.archived_at === undefined) { h.archived_at = ''; changed = true; }
    });
    // 项目子任务：旧数据仅含单个截止 sub_deadline，升级为时间跨度（开始/结束）
    state.project_subs.forEach(s => {
      if (!s) return;
      if (s.sub_start === undefined) { s.sub_start = ''; changed = true; }
      if (s.sub_end === undefined) { s.sub_end = (s.sub_deadline != null ? s.sub_deadline : ''); changed = true; }
      if (s.sub_done === undefined) { s.sub_done = false; changed = true; }
      // 工作流状态：旧数据按完成态补齐（已完成 ↔ sub_done；其余 ↔ 进行中）
      if (s.status === undefined) { s.status = s.sub_done ? '已完成' : '进行中'; changed = true; }
      // —— 耗时统计 / 标签 / 完成时刻：旧数据补齐，缺失不影响任何既有逻辑 ——
      if (s.tags === undefined) { s.tags = []; changed = true; }
      if (s.estMin === undefined) { s.estMin = 0; changed = true; }
      if (s.spentMin === undefined) {
        // 由历史填报留痕回填累计耗时（老记录无 spentMin 则为 0，不会凭空造数）
        s.spentMin = state.project_records.filter(r => r.sid === s.sid && !r.deleted_at)
          .reduce((a, r) => a + (Number(r.spentMin) || 0), 0);
        changed = true;
      }
      // 已完成但缺完成时刻的旧数据：用最后修改时间兜底，保证「完成置后」排序稳定
      if (s.done_at === undefined) { s.done_at = s.sub_done ? (s.last_modified_at || Date.now()) : null; changed = true; }
      // 项目子任务紧急标记：旧数据补齐
      if (s.isEmergency === undefined) { s.isEmergency = false; changed = true; }
    });
    // 项目填报留痕：旧记录补齐花费时间字段（默认 0，不影响既有完成量统计）
    state.project_records.forEach(r => {
      if (r && r.spentMin === undefined) { r.spentMin = 0; changed = true; }
      if (r && r.note === undefined) { r.note = ''; changed = true; } // 填报备注：旧记录默认空
    });
    // 任务：截止日期 / 提醒新模型兼容迁移（不丢旧数据）
    state.tasks.forEach(t => {
      if (!t) return;
      // 紧急标记：旧数据补齐（默认 false，不影响任何既有排序）
      if (t.isEmergency === undefined) { t.isEmergency = false; changed = true; }
      if (t.deadline_time === undefined) { t.deadline_time = ''; changed = true; }
      if (t.remind_option === undefined) {
        let opt = 'none';
        if (t.enable_remind) {
          opt = 'ontime';
          if (t.remind_time && t.execute_date) {
            const baseT = (t.deadline_time && t.deadline_time.indexOf(':') >= 0) ? t.deadline_time : '09:00';
            const dl = new Date(t.execute_date + 'T' + baseT);
            const rm = new Date(t.execute_date + 'T' + t.remind_time);
            const diffMin = Math.round((dl.getTime() - rm.getTime()) / 60000);
            if (diffMin > 0) {
              const presets = [5, 30, 60, 1440];
              let best = null, bestDiff = Infinity;
              presets.forEach(p => { const d = Math.abs(p - diffMin); if (d < bestDiff) { bestDiff = d; best = p; } });
              if (best === 5) opt = '5min'; else if (best === 30) opt = '30min';
              else if (best === 60) opt = '1hour'; else if (best === 1440) opt = '1day';
            }
          }
        }
        t.remind_option = opt; changed = true;
      }
      if (t.add_to_calendar === undefined) { t.add_to_calendar = false; changed = true; }
      // 时间线结束时间：旧数据补齐（缺省 ''，展示时按 起始+30 分钟推算）
      if (t.remind_end === undefined) { t.remind_end = ''; changed = true; }
      (t.sub_tasks || []).forEach(s => {
        if (s.sub_remind_end === undefined) { s.sub_remind_end = ''; changed = true; }
      });
      // —— 第 1 层改造：分类双层结构兼容迁移（旧数据仅含 category_id）——
      if (t.parent_category === undefined) { t.parent_category = ''; changed = true; }
      if (t.category === undefined) {
        // 旧单层标签：用 category_id 反查分类名，写入 category；parent_category 留空（单层）
        let cn = '';
        if (t.category_id) { const fc = (state.categories || []).find(c => c._id === t.category_id); cn = fc ? fc.name : ''; }
        t.category = cn; changed = true;
      }
      // —— 第 1 层改造：日期双模式兼容迁移（旧数据用 execute_date 表示单点执行日期）——
      if (t.date_mode === undefined) {
        // 历史 execute_date 自动映射为单点执行日期模式，数据无丢失
        t.date_mode = t.execute_date ? 'single' : 'single';
        t.date_start = t.execute_date || '';
        t.date_end = t.execute_date || '';
        changed = true;
      }
      // 书籍进度：旧数据补齐 progress_info.done / total，避免阅读同步累加时报错
      if (!t.progress_info) {
        t.progress_info = { enable: false, media_type: 'book', progress_value: '', done: 0, total: 0 };
        changed = true;
      } else {
        if (t.progress_info.media_type === undefined) { t.progress_info.media_type = 'book'; changed = true; }
        if (t.progress_info.progress_value === undefined) { t.progress_info.progress_value = ''; changed = true; }
        if (t.progress_info.done === undefined) { t.progress_info.done = 0; changed = true; }
        if (t.progress_info.total === undefined) { t.progress_info.total = 0; changed = true; }
      }
      // 时间模式：旧任务兜底归类（收藏四类 / 有日期或周期 → 日 / 其余 → 月未规划）
      if (t.time_mode === undefined) { t.time_mode = defaultModeFor(t); changed = true; }
      // 指定月任务补全 time_mode='month'（历史由表单落库为 null，导致今日Tab「本月」折叠不展示副本）
      if (t.time_mode == null && t.date_mode === 'month' && t.plan_year && t.plan_month) {
        t.time_mode = 'month'; changed = true;

/* =========================================================================
 * To Do —— AI 占位接口 ai.js
 * 对应 PRD 第 5 节。此处【不实现真实模型】，仅预留接口并给出可运行占位逻辑，
 * 出参结构严格与 PRD 一致。所有 AI 输出仅返回预览对象，绝不写库。
 * 接入真实模型时，只需替换 __callAI 内部实现（如 fetch 后端 / 调大模型）。
 * 暴露 window.MPAI
 * ========================================================================= */
(function () {
  const { todayStr, parseDate } = window.MPStore.util;

  // 模拟网络/模型延迟
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* =======================================================================
   * 真实接入点（占位）。返回任意文本给大模型，得到结构化结果。
   * 当前用本地关键词解析模拟，后续可改为：
   *   const res = await fetch('/api/ai', {method:'POST', body: JSON.stringify({type, input})})
   * ===================================================================== */
  async function __callAI(type, input) {
    await delay(450);
      if (type === 'parseTask') return mockParseTask(input);
      if (type === 'parseStrategy') return mockParseStrategy(input);
      if (type === 'healthAdvice') return input; // input 本身就是兜底文本
      return null;
  }

  /* ------------------- 中文时刻 / 日期解析（确定性，前端回填） ------------------- */
  // 无论走 mock 还是豆包，均在此做二次解析，保证「晚上7点→19:00」必定生效、可控、不依赖模型。
  const CN_DIGIT = { 零:0, 一:1, 二:2, 两:2, 三:3, 四:4, 五:5, 六:6, 七:7, 八:8, 九:9, 十:10 };
  function cnHour(str) {
    if (/^\d+$/.test(str)) { const n = +str; return n >= 0 && n <= 23 ? n : null; }
    str = str.trim();
    if (str === '十') return 10;
    if (str.length === 2 && str[0] === '十') return 10 + (CN_DIGIT[str[1]] || 0); // 十一/十二
    if (str.length === 2 && str[1] === '十') return (CN_DIGIT[str[0]] || 0) * 10; // 二十(极少用)
    return CN_DIGIT[str] != null ? CN_DIGIT[str] : null;
  }
  function cnMin(str) {
    if (/^\d+$/.test(str)) { const n = +str; return n >= 0 && n <= 59 ? n : null; }
    str = str.trim();
    if (!/十/.test(str)) return CN_DIGIT[str] != null ? CN_DIGIT[str] : null;
    const parts = str.split('十');
    const tens = parts[0] === '' ? 1 : (CN_DIGIT[parts[0]] || 0);
    const ones = parts[1] ? (CN_DIGIT[parts[1]] || 0) : 0;
    const v = tens * 10 + ones;
    return v >= 0 && v <= 59 ? v : null;
  }
  function periodOffset(word) {
    if (/凌晨|清晨|拂晓/.test(word)) return 0;     // 凌晨2点 → 02:00
    if (/早上|早晨|上午|清早/.test(word)) return 0; // 早上9点 → 09:00
    if (/中午/.test(word)) return 0;               // 中午12点 → 12:00
    if (/下午/.test(word)) return 12;              // 下午3点 → 15:00
    if (/晚上|傍晚|夜晚|夜里|晚间/.test(word)) return 12; // 晚上7点 → 19:00
    return null; // 无时段词（如「7点」默认早上）
  }
  function extractMin(s) {
    if (/半/.test(s)) return 30;
    if (/一刻/.test(s)) return 15;
    if (/三刻/.test(s)) return 45;
    let m = s.match(/(\d{1,2})\s*分/);
    if (m) return parseInt(m[1], 10);
    m = s.match(/([零一二两三四五六七八九十]+)\s*分/);
    if (m) return cnMin(m[1]);
    return 0;
  }
  // 从文本解析「中文时刻 / 数字时刻」→ {hour,min} 或 null（点 / 点钟 / 15:30 写法，支持半/分/刻）
  function parseCnTime(text) {
    if (!/[点时:：]/.test(text)) return null;
    // 数字时刻优先：15:30 / 15：30
    const digM = text.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
    if (digM) { const h = +digM[1], m = +digM[2]; if (h <= 23 && m <= 59) return { hour: h, min: m }; }
    const periodM = text.match(/(凌晨|清晨|拂晓|早上|早晨|上午|清早|中午|下午|晚上|傍晚|夜晚|夜里|晚间)/);
    const period = periodM ? periodM[1] : '';
    let hour = null, src = '';
    const numM = text.match(/(\d{1,2})\s*点(钟)?\s*(半|一刻|三刻|(\d{1,2})\s*分|([零一二两三四五六七八九十]+)\s*分)?/);
    if (numM) { hour = parseInt(numM[1], 10); src = numM[0]; }
    else {
      const cnM = text.match(/(十[一二]?|二十?[一二三四五六七八九]?|[零一二两三四五六七八九十])\s*点(钟)?\s*(半|一刻|三刻|(\d{1,2})\s*分|([零一二两三四五六七八九十]+)\s*分)?/);
      if (cnM) { hour = cnHour(cnM[1]); src = cnM[0]; }
    }
    if (hour == null) return null;
    const min = extractMin(src);
    let offset = period ? periodOffset(period) : 0;
    let h = hour + offset;
    if (h >= 24) h -= 24;
    if (h > 23) h = 23;
    if (h < 0) h = 0;
    return { hour: h, min: Math.max(0, Math.min(59, min)) };
  }
  // 从文本解析「日期」→ YYYY-MM-DD 或 null（复用原规则）
  function parseCnDate(text) {
    const t = text;
    let date = null;
    const m1 = t.match(/(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
    if (m1) date = m1[1] + '-' + String(m1[2]).padStart(2, '0') + '-' + String(m1[3]).padStart(2, '0');
    const m2 = t.match(/(\d{1,2})月(\d{1,2})[日号]/);
    if (m2) {
      const now = new Date();
      let y = now.getFullYear(); const mo = +m2[1]; const d = +m2[2];
      if (mo < now.getMonth() + 1) y += 1;
      date = y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }
    if (/明天/.test(t)) date = window.MPStore.util.addDays(todayStr(), 1);
    if (/后天/.test(t)) date = window.MPStore.util.addDays(todayStr(), 2);
    if (/大后天/.test(t)) date = window.MPStore.util.addDays(todayStr(), 3);
    return date;
  }
  const pad2 = n => String(n).padStart(2, '0');
  // 中文时刻短语正则（用于从标题中剥离，避免冗余）
  const CN_TIME_RE = /(凌晨|清晨|拂晓|早上|早晨|上午|清早|中午|下午|晚上|傍晚|夜晚|夜里|晚间)?\s*([0-9]+|十[一二]?|二十?[一二三四五六七八九]?|[零一二两三四五六七八九十])\s*点(钟)?(\s*(半|一刻|三刻|(\d{1,2})\s*分|([零一二两三四五六七八九十]+)\s*分))?/g;
  // 把中文时刻/日期回填到解析结果：识别到时刻→自动勾选提醒+填时刻；仅时刻无日期→默认今日；识别失败→不勾选不报错
  function enrichTaskTime(input, result) {
    const tm = parseCnTime(input);
    if (!tm) return result;
    result.remind_time = pad2(tm.hour) + ':' + pad2(tm.min);
    result.remind = true;
    if (!result.remind_option || result.remind_option === 'none') result.remind_option = 'ontime';
    if (!result.execute_date) result.execute_date = parseCnDate(input) || todayStr();
    // 顺手清理标题里的时刻词（豆包返回可能未剥离）
    if (result.title) result.title = result.title.replace(CN_TIME_RE, '').replace(/\s+/g, ' ').trim() || result.title;
    return result;
  }

  /* ------------------- 5-1 AI 自然语言解析任务（占位实现） ------------------- */
  // —— 文本归一化（NLU 强制预处理节点）——
  // 标准链路：原始语句 → 文本归一化 → 实体抽取 → 时间计算。
  // 所有时间近义词统一在预处理层收拢（口语 ↔ 标准词形），解析核心规则不再逐个枚举关键词，
  // 后续新增同类口语表述只需在此扩展，不改 mockParseTask 内部逻辑。
  // 中文小数词 → 阿拉伯数字（供归一化层与解析核心共用）
  const cnNum = (s) => { const m = { '一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 }[s]; return m != null ? m : parseInt(s, 10); };

  function normalizeText(raw) {
    let s = (raw || '').trim();
    // 1) 星期 / 礼拜 体系 → 标准「周」（下礼拜→下周、礼拜三→周三、一个礼拜→一个周）
    s = s.replace(/星期/g, '周');
    s = s.replace(/礼拜/g, '周');
    // 2) 去掉数词与时段时间单位之间的量词「个」（一个周→一周、两个天→两天）
    s = s.replace(/([0-9]+|[一二两三四五六七八九十])\s*个\s*(周|天)/g, '$1$2');
    // 3) 口语相对日
    s = s.replace(/明儿|明个/g, '明天');
    s = s.replace(/后儿/g, '后天');
    // 4) 计数短语中的「日 → 天」（连续N日 / 过N日 / 隔N日 / 每N日 → N天）；
    //    仅作用于计数短语，不影响「X月X日」中的日期语义
    s = s.replace(/连续\s*([0-9]+|[一二两三四五六七八九十])\s*日/g, '连续$1天');
    s = s.replace(/过\s*([0-9]+|[一二两三四五六七八九十])\s*日/g, '过$1天');
    s = s.replace(/隔\s*([0-9]+|[一二两三四五六七八九十])\s*日/g, '隔$1天');
    s = s.replace(/每\s*([0-9]+|[一二两三四五六七八九十])\s*日/g, '每$1天');
    // 5) 「N周后 / N天后」→「过N周 / 过N天」（口语近义；中文数词转阿拉伯，复用解析核心的过X周/过X天）
    s = s.replace(/([0-9]+|[一二两三四五六七八九十])\s*(周|天)\s*后/g, (m, n, u) => '过' + cnNum(n) + u);
    return s;
  }

  function mockParseTask(text) {
    const t = normalizeText(text.trim());
    const U = window.MPStore.util;
    const ymd = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    // 下周某星期几（wd: 1=周一 … 7=周日）→ YYYY-MM-DD（不含本周，跨周进位移 7）
    const nextWeekday = (wd) => {
      const today = parseDate(todayStr());
      const cur = today.getDay() === 0 ? 7 : today.getDay();
      let diff = (wd - cur + 7) % 7; if (diff === 0) diff = 7;
      return ymd(new Date(today.getTime() + diff * 86400000));
    };
    // 本周某星期几（wd: 1=周一 … 7=周日）→ YYYY-MM-DD（同周内 0~6 天后；已过仍取本周该日）
    const thisWeekday = (wd) => {
      const today = parseDate(todayStr());
      const cur = today.getDay() === 0 ? 7 : today.getDay();
      const diff = (wd - cur + 7) % 7;
      return ymd(new Date(today.getTime() + diff * 86400000));
    };
    // 通用：N 周后星期几（weeks=0→下周, 1→下下周）
    const nthWeekday = (wd, weeks) => ymd(new Date(parseDate(nextWeekday(wd)).getTime() + weeks * 7 * 86400000));
    // 统一固定输出结构（与手动新建任务表单字段对齐；无法识别默认置空）
    const result = {
      raw: text.trim(), // 原始输入行（未做任何剥离）；批量(>1)模式直接作为任务名称，避免拆解时间/地点词块
      title: t, desc: '', material_notes: '', material_link: '',
      category_id: null, parent_category: '', tags: '',
      date_mode: '', plan_year: null, plan_month: null,
      execute_date: null, date_start: '', date_end: '',
      cycle: null, isHabit: false,
      remind: false, remind_time: '07:00', remind_option: 'none',
      progress_info: { enable: false, media_type: 'book', progress_value: '' },
      expect_hint_date: null,
    };

    // 1) 标签链提取（#一级 ##二级 ###三级）：写入 tags 并绑定分类层级（与手动 / 三级标签统一）
    const tagM = t.match(/#([^#\s]+)(?:##([^#\s]+))?(?:###([^#\s]+))?/);
    if (tagM) {
      let tagStr = '#' + tagM[1];
      if (tagM[2]) tagStr += '##' + tagM[2];
      if (tagM[3]) tagStr += '###' + tagM[3];
      const pr = window.MPStore.parseTagString(tagStr, false);
      result.tags = tagStr;
      result.category_id = pr.category_id;
      result.parent_category = pr.parent_category;
      result.hasLevel3 = pr.hasLevel3;
      result.level3Chain = pr.level3Chain;
    }

    // 2) 地点 / 描述提取：介词 + 地点名词，或独立地点代码（如 y105 / A栋）→ desc，并从标题剥离
    const placeM = t.match(/(?:在|去|到|从)([^\s，。；！？、]+?(?:店|馆|公司|家|室|场|园|中心|楼|站|校|处|超市|医院|健身房|图书馆|咖啡馆|餐厅|区|栋|层))/);
    const codeM = t.match(/(?<![A-Za-z])([A-Za-z]{1,3}\d{1,4}(?:[-_][A-Za-z0-9]+)?)(?![A-Za-z0-9])/);
    let placeToken = '';
    if (placeM) result.desc = (result.desc ? result.desc + ' ' : '') + '地点：' + placeM[1];
    else if (codeM) { result.desc = '地点：' + codeM[1]; placeToken = codeM[1]; }

    // 3) 周期自动分类（每日→习惯；其余设定 cycle）
    let cycleType = null; // 'habit' | 'interval' | 'month' | 'week' | 'range' | 'weekonly'
    let weekOffset = null;
    if (/每天|每日/.test(t)) { result.isHabit = true; cycleType = 'habit'; }
    else if (/隔\s*([0-9]+|[一二两三四五六七八九十])\s*天|每隔\s*([0-9]+|[一二两三四五六七八九十])\s*天|每\s*([0-9]+|[一二两三四五六七八九十])\s*天|间隔\s*([0-9]+|[一二两三四五六七八九十])\s*天/.test(t)) {
      const m = t.match(/隔\s*([0-9]+|[一二两三四五六七八九十])\s*天|每隔\s*([0-9]+|[一二两三四五六七八九十])\s*天|每\s*([0-9]+|[一二两三四五六七八九十])\s*天|间隔\s*([0-9]+|[一二两三四五六七八九十])\s*天/);
      const n = cnNum(m[1] || m[2] || m[3] || m[4]) || 2;
      result.cycle = { type: 'interval', rule: String(n) }; cycleType = 'interval';
    }
    else if (/每月初|月初|月头/.test(t)) { result.cycle = { type: 'month', rule: '1' }; cycleType = 'month'; }
    else if (/每月末|月末|月底|月尾/.test(t)) { result.cycle = { type: 'month', rule: '0' }; cycleType = 'month'; }
    else if (/每月\s*(\d{1,2})/.test(t)) {
      const dm = t.match(/每月\s*(\d{1,2})/); result.cycle = { type: 'month', rule: String(dm ? +dm[1] : 1) }; cycleType = 'month';
    }
    else if (/每周\s*([一二三四五六日天])/.test(t)) {
      const wmap = { '一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','日':'0','天':'0' };
      const wm = t.match(/每周\s*([一二三四五六日天])/); result.cycle = { type: 'week', rule: wmap[wm[1]] }; cycleType = 'week';
    }
    else if (/每周|每星期/.test(t)) { result.cycle = { type: 'week', rule: '1' }; cycleType = 'week'; }
    // 仅指定周：本周 / 下周 / 下下周（必须“单独使用，不带周几、时间点”）
    // 带周几（这周四 / 下周二 / 下下周一）→ 归为单日精准日期，交给步骤 5 处理（禁止混淆两类语义）
    else if (/(?:这周|本周|下周|下下周)/.test(t) && !(/(?:这周|本周|下周|下下周)\s*[一二三四五六日天]/.test(t))) {
      let off = 0;
      if (/下周/.test(t)) off = 1; else if (/下下周/.test(t)) off = 2;
      cycleType = 'weekonly'; weekOffset = off;
    }

    // 4) 日期区间：连续X天 / A号-B号
    if (cycleType !== 'habit' && !result.cycle) {
      const contM = t.match(/连续\s*([0-9]+|[一二两三四五六七八九十])\s*天/);
      const rm = t.match(/([0-9]+|[一二两三四五六七八九十])\s*[日号]?\s*(?:[-~～到至])\s*([0-9]+|[一二两三四五六七八九十])\s*[日号]?/);
      if (contM) {
        const n = cnNum(contM[1]) || 1;
        result.date_mode = 'range';
        result.date_start = todayStr();
        result.date_end = ymd(new Date(parseDate(todayStr()).getTime() + (n - 1) * 86400000));
        cycleType = 'range';
      } else if (rm) {
        const now = new Date(); let m = now.getMonth() + 1;
        const d1 = cnNum(rm[1]), d2 = cnNum(rm[2]);
        if (d2 < d1) m += 1; // 跨月粗略进月
        result.date_mode = 'range';
        result.date_start = now.getFullYear() + '-' + pad2(m) + '-' + pad2(d1);
        result.date_end = now.getFullYear() + '-' + pad2(m) + '-' + pad2(d2);
        cycleType = 'range';
      }
    }

    // 5) 相对 / 绝对日期 → 标准 YYYY-MM-DD（或仅年月）；周期 / 仅周 / 区间 已处理则跳过
    if (cycleType !== 'habit' && cycleType !== 'weekonly' && cycleType !== 'range' && !result.cycle) {
      let date = null;
      const m1 = t.match(/(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
      if (m1) date = m1[1] + '-' + pad2(m1[2]) + '-' + pad2(m1[3]);
      const m2 = t.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/);
      if (m2) {
        const now = new Date(); let y = now.getFullYear(); const mo = +m2[1], d = +m2[2];
        if (mo < now.getMonth() + 1) y += 1;
        date = y + '-' + pad2(mo) + '-' + pad2(d);
      }
      // 仅年月：YYYY年M月（无日）→ 仅识别年月，不带具体日期
      const ym = t.match(/(\d{4})\s*年\s*(\d{1,2})\s*月(?!\s*\d)/);
      if (ym && !m2 && !m1) {
        result.date_mode = 'month'; result.plan_year = +ym[1]; result.plan_month = ym[1] + '-' + pad2(+ym[2]);
      } else if (/今天|今日/.test(t)) date = todayStr();
      else if (/明天|明日/.test(t)) date = U.addDays(todayStr(), 1);
      else if (/后天/.test(t)) date = U.addDays(todayStr(), 2);
      else if (/大后天/.test(t)) date = U.addDays(todayStr(), 3);
      else if (/过\s*([0-9]+|[一二两三四五六七八九十])\s*周/.test(t)) {
        const n = cnNum((t.match(/过\s*([0-9]+|[一二两三四五六七八九十])\s*周/)||[])[1]) || 1; date = U.addDays(todayStr(), n * 7);
      }
      else if (/过\s*(\d+)\s*天|(\d+)\s*天后/.test(t)) {
        const n = parseInt((t.match(/(\d+)\s*天/)||[])[1], 10) || 1; date = U.addDays(todayStr(), n);
      }
      else if (/下下周\s*[一二三四五六日天]/.test(t)) {
        const wmap = { '一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','日':'0','天':'0' };
        const wm = t.match(/下下周\s*([一二三四五六日天])/); date = nthWeekday(wm ? wmap[wm[1]] : 1, 1);
      }
      else if (/(?:这周|本周)\s*[一二三四五六日天]/.test(t)) {
        const wmap = { '一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','日':'0','天':'0' };
        const wm = t.match(/(?:这周|本周)\s*([一二三四五六日天])/); date = thisWeekday(wm ? wmap[wm[1]] : 1);
      }
      else if (/下周\s*[一二三四五六日天]/.test(t)) {
        const wmap = { '一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','日':'0','天':'0' };
        const wm = t.match(/下周\s*([一二三四五六日天])/); date = nextWeekday(wm ? wmap[wm[1]] : 1);
      }
      else if (/周\s*[一二三四五六日天]/.test(t)) { // 裸“周X”（无这/下前缀）→ 本周该日
        const wmap = { '一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','日':'0','天':'0' };
        const wm = t.match(/周\s*([一二三四五六日天])/); date = thisWeekday(wm ? wmap[wm[1]] : 1);
      }
      else if (/下\s*个?\s*月/.test(t)) {
        const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + 1);
        result.date_mode = 'month'; result.plan_year = d.getFullYear(); result.plan_month = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
      }
      else if (/([0-9]+|[一二两三四五六七八九十])\s*月(?!\s*\d)/.test(t) && !m2 && !m1) {
        const bm = t.match(/([0-9]+|[一二两三四五六七八九十])\s*月(?!\s*\d)/);
        const mo = cnNum(bm[1]); const now = new Date();
        let y = now.getFullYear();
        if (mo < now.getMonth() + 1) y += 1;
        result.date_mode = 'month'; result.plan_year = y; result.plan_month = y + '-' + pad2(mo);
      }
      result.execute_date = date;
    }

    // 6) 仅指定周（这周 / 下下周）
    if (cycleType === 'weekonly') { result.date_mode = 'week'; result.week_offset = weekOffset; }

    // 7) 提醒：单次固定日期任务默认 07:00 提醒；周期 / 仅周 / 区间任务默认不提醒（显式提醒词 / 时刻仍生效）
    const tm = parseCnTime(t);
    const explicitRemind = /提醒|通知|闹钟/.test(t);
    if (cycleType === null && result.execute_date) {
      result.remind = true;
      result.remind_time = tm ? pad2(tm.hour) + ':' + pad2(tm.min) : '07:00';
      if (result.remind_option === 'none') result.remind_option = 'ontime';
    } else if (explicitRemind || tm) {
      result.remind = true;
      result.remind_time = tm ? pad2(tm.hour) + ':' + pad2(tm.min) : '07:00';
      if (result.remind_option === 'none') result.remind_option = 'ontime';
    } else {
      result.remind_time = '';
    }

    // 8) 标题提炼：剥离标签 / 时间 / 周期 / 提醒 / 地点词，取核心动作
    let title = t
      .replace(/#[^#\s]+(?:##[^#\s]+)?(?:###[^#\s]+)?/g, '')                          // #标签串
      .replace(/过\s*(?:\d+|[一二两三四五六七八九十])\s*周/g, '')                        // 过X周
      .replace(/过\s*\d+\s*天/g, '')                                                   // 过X天
      .replace(/(\d+)\s*天后/g, '')                                                     // X天后
      .replace(/隔\s*(?:\d+|[一二两三四五六七八九十])\s*天|每隔\s*(?:\d+|[一二两三四五六七八九十])\s*天|每\s*(?:\d+|[一二两三四五六七八九十])\s*天|间隔\s*(?:\d+|[一二两三四五六七八九十])\s*天/g, '') // 隔N天/每N天/间隔N天
      .replace(/连续\s*(?:\d+|[一二两三四五六七八九十])\s*天/g, '')                      // 连续N天
      .replace(/(\d{1,2})\s*[日号]?\s*(?:[-~～到至])\s*\d{1,2}\s*[日号]?/g, '')         // A号-B号
      .replace(/每月\s*\d+\s*[日号]?/g, '')                                            // 每月X日
      .replace(/每月初|每月末|月初|月末|月底|月头|月尾|每月|每个月|月总结|月报/g, '')
      .replace(/每天|每日/g, '')                                                       // 习惯
      .replace(/每周\s*[一二三四五六日天]?|每星期|周初|周末/g, '')
      .replace(/(?:这周|本周|下周|下下周)\s*[一二三四五六日天]?/g, '')                     // 仅周 / 周几（含这周四、下周二、下下周一）
      .replace(/今天|今日|明天|明日|后天|大后天|起/g, '')                              // 相对日
      .replace(/下\s*个?\s*月/g, '')                                                   // 下月
      .replace(/[一二三四五六七八九十]+\s*月(?!\s*\d)/g, '')                            // 中文月（无日）
      .replace(/(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})[日号]?/g, '')
      .replace(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/g, '')
      .replace(/(\d{1,2})\s*月/g, '')
      .replace(/(\d{1,2})\s*[日号]/g, '')
      .replace(/(凌晨|清晨|拂晓|早上|早晨|上午|清早|中午|下午|晚上|傍晚|夜晚|夜里|晚间|睡前|起床后|起床|饭后|饭前|睡前后|熬夜后|一大早|大清早)/g, '') // 时刻描述
      .replace(CN_TIME_RE, '')
      .replace(/\d{1,2}\s*[:：]\s*\d{2}/g, '')                                // 数字时刻 15:30
      .replace(/(?:在|去|到|从)[^\s，。；！？、]+?(?:店|馆|公司|家|室|场|园|中心|楼|站|校|处|超市|医院|健身房|图书馆|咖啡馆|餐厅|区|栋|层)/g, '')
      .replace(/(?:在|去|到|从)(?<![A-Za-z])([A-Za-z]{1,3}\d{1,4}(?:[-_][A-Za-z0-9]+)?)(?![A-Za-z0-9])/g, '') // 去y105
      .replace(/提醒我?去?|通知我?|闹钟/g, '');
    if (placeToken) title = title.split(placeToken).join('');
    result.title = title.replace(/\s+/g, ' ').trim() || t;

    // 9) 标签：未显式 #标签链时，按语义关键词兜底（琐事→#生活 / 复盘规划→#个人 / 课业→#作业），默认 #生活
    if (!result.category_id) {
      let tagName = '生活'; // 默认琐事
      if (/复盘|规划|总结|周报|月报|计划|回顾|反思|复盘会|年度|季度/.test(t)) tagName = '个人';
      else if (/作业|课业|试卷|考试|学习|上课|复习|预习|功课|听课|备考|论文|习题|练习|PPT|报告|答辩/.test(t)) tagName = '作业';
      const tagStr = '#' + tagName;
      const pr = window.MPStore.parseTagString(tagStr, false);
      result.tags = tagStr;
      result.category_id = pr.category_id;
      result.parent_category = pr.parent_category;
      result.hasLevel3 = pr.hasLevel3;
      result.level3Chain = pr.level3Chain;
    }

    return result;
  }

  /* ------------------- 5-2 AI 攻略解析（占位实现） ------------------- */
  function mockParseStrategy(content) {
    // 过滤情绪废话，按行/句号切分提取可执行行动点
    const noise = /(太好了|好开心|终于|哈哈|呜呜|啊啊|希望|期待|感觉|觉得|其实|就是说|这样的话|总之|嗯|哦|唉|好烦|崩溃|哭|爱了|绝了)/g;
    const lines = content
      .replace(/\r/g, '')
      .split(/[\n。；;]/)
      .map(s => s.replace(noise, '').trim())
      .filter(s => s.length >= 2 && s.length <= 40);
    // 仅保留看起来像动作/事项的内容（含动词或清单符号）
    const verbHint = /(去|买|吃|看|做|准备|预订|预约|带|查|写|读|学|练|收拾|打包|规划|联系|确认|办理|参观|体验|乘坐|逛|拍)/;
    const candidates = lines.filter(s => verbHint.test(s) || /^[0-9）)、.\-*]/.test(s));
    // 去重
    return Array.from(new Set(candidates.length ? candidates : lines)).slice(0, 20);
  }

  // 第 3 层模块 1：批量条目拆分（悬浮球 AI 解析专用）
  // 切割规则（需求）：严格按换行拆分，一行 = 一条独立任务；不按顿号 / 分号 / 句号等再切，保留原始语义
  // 单次解析上限 50 条，超出返回 truncated=true（调用方弹「已解析前 50 条」）
  function splitEntries(text) {
    const raw = (text || '').replace(/\r/g, '');
    let parts = raw.split(/\n+/).map(s => s.trim()).filter(s => s.length >= 1);
    const truncated = parts.length > 50;
    if (truncated) parts = parts.slice(0, 50);
    // 去空、去重（保留顺序）
    const seen = {};
    const out = [];
    parts.forEach(s => { if (!seen[s]) { seen[s] = 1; out.push(s); } });
    return { items: out, truncated };
  }
  // 批量解析入口：先拆条（上限 50），再对每条做单条语义解析（任务/习惯/日期/周期/提醒/双层分类）
  async function parseBatch(text) {
    const { items, truncated } = splitEntries(text);
    const parsed = [];
    for (const it of items) {
      const one = await __callAI('parseTask', it);
      parsed.push(one);
    }
    return { items: parsed, truncated };
  }

  /* ------------------- 5-3 AI 健康助手：本地规则引擎 ------------------- */
  // 依据记录型/养成型/戒掉型习惯的「当月」数据，输出确定性的生活化健康小结。
  // 不调用大模型：零成本、离线、可保证不出现空泛套话与医疗建议。
  const REF = {
    defecationDays: 20,         // 月排便记录参考下限（≈隔天一次）
    waterTarget: 8,             // 喝水默认目标（杯）
    sleepLateMin: 23 * 60 + 30, // 入睡晚于 23:30 算偏晚
    sleepMinDur: 7 * 60,        // 睡眠时长下限（分钟）
  };

  function toMin(str) {                 // "23:30" -> 1410；解析失败返回 null
    const m = (str || '').match(/(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return null;
    return h * 60 + mi;
  }
  function firstNum(str) {              // 取字符串里第一个数字（含小数/负数）
    const m = (str || '').match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }

  const ICON = { defecation: '🚽', water: '💧', sleep: '😴', weight: '⚖️', exercise: '🏃', sop: '✅', quit: '🚭', generic: '📝' };

  function analyzeDefecation(name, recs) {
    const out = [];
    const count = recs.length;
    if (count < REF.defecationDays) {
      out.push({ icon: ICON.defecation, text: `本月排便记录偏少（${count} 天），建议日常多喝温水、适当走动，饮食增加点膳食纤维。` });
    }
    const times = recs.map(r => toMin(r.note)).filter(t => t != null);
    if (times.length >= 3) {
      const span = Math.max(...times) - Math.min(...times);
      if (span > 240) out.push({ icon: ICON.defecation, text: `排便时间不太规律（跨度约 ${Math.round(span / 60)} 小时），尽量固定每天同一时间段，帮肠道形成节律。` });
    }
    if (!out.length) out.push({ icon: ICON.defecation, text: `本月排便记录 ${count} 天，节奏不错，保持住。` });
    return out;
  }

  function analyzeWater(name, recs) {
    const vals = recs.map(r => firstNum(r.note)).filter(v => v != null && v >= 0);
    if (!vals.length) return [{ icon: ICON.water, text: `本月记录 ${recs.length} 天，但没看到具体喝水量，记录时带上杯数（如「8 杯」）更好分析。` }];
    const target = REF.waterTarget;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const below = vals.filter(v => v < target).length;
    if (below > vals.length * 0.5) return [{ icon: ICON.water, text: `本月多数日子喝水没达标（日均约 ${avg.toFixed(1)} 杯），优先保证每日足量饮水，对代谢、肠道都有帮助。` }];
    if (avg < target) return [{ icon: ICON.water, text: `本月日均约 ${avg.toFixed(1)} 杯，偶尔没喝够，尽量把每日饮水量稳住。` }];
    return [{ icon: ICON.water, text: `本月日均约 ${avg.toFixed(1)} 杯，喝水达标，保持住。` }];
  }

  function analyzeSleep(name, recs) {
    const arr = [];
    recs.forEach(r => {
      const note = r.note || '';
      const times = [...(note.matchAll(/(\d{1,2}):(\d{2})/g) || [])]
        .map(m => ({ idx: m.index, min: (+m[1]) * 60 + (+m[2]) }));
      const inK = note.indexOf('入睡');
      const upK = note.indexOf('起床');
      let inT = null, upT = null;
      // 入睡时间：优先取「入睡」一词前最近的时间，其次取其后最近的时间
      if (inK >= 0) {
        const before = times.filter(t => t.idx < inK);
        const after = times.filter(t => t.idx > inK);
        inT = before.length ? before[before.length - 1].min : (after.length ? after[0].min : null);
      }
      // 起床时间：优先取「起床」一词后最近的时间，其次取其前最近的时间
      if (upK >= 0) {
        const after = times.filter(t => t.idx > upK);
        const before = times.filter(t => t.idx < upK);
        upT = after.length ? after[0].min : (before.length ? before[before.length - 1].min : null);
      }
      // 无明显关键词时：两个时间按「入睡→起床」处理；只有一个时间当作入睡
      if (inK < 0 && upK < 0 && times.length >= 2) { inT = times[0].min; upT = times[1].min; }
      if (inT == null && times.length === 1) inT = times[0].min;
      if (inT != null && upT != null) { let d = upT - inT; if (d < 0) d += 1440; arr.push({ inT, dur: d }); }
      else if (inT != null) arr.push({ inT, dur: null });
    });
    if (!arr.length) return [{ icon: ICON.sleep, text: `本月记录 ${recs.length} 天，但没解析到入睡/起床时间，记录时带上如「23:30 入睡 07:00 起床」更好。` }];
    const late = arr.filter(s => s.inT >= REF.sleepLateMin || s.inT < 6 * 60).length;
    const out = [];
    if (late > arr.length * 0.5) out.push({ icon: ICON.sleep, text: `本月很多天入睡偏晚（约 ${late} 天在 23:30 之后），长期晚睡容易疲劳，可以尝试每天提前一点睡觉时间。` });
    const durs = arr.map(s => s.dur).filter(d => d != null);
    if (durs.length >= 3) {
      const avg = durs.reduce((a, b) => a + b, 0) / durs.length;
      if (avg < REF.sleepMinDur) out.push({ icon: ICON.sleep, text: `本月平均睡眠时长约 ${(avg / 60).toFixed(1)} 小时，普遍偏少，优先保证 7 小时左右睡眠。` });
    }
    if (!out.length) out.push({ icon: ICON.sleep, text: `本月睡眠记录 ${arr.length} 天，入睡时间和时长都还稳，保持住。` });
    return out;
  }

  function analyzeWeight(name, recs) {
    const vals = recs.map(r => ({ date: r.date, v: firstNum(r.note) })).filter(x => x.v != null);
    vals.sort((a, b) => a.date < b.date ? -1 : 1);
    if (vals.length < 2) return [{ icon: ICON.weight, text: `本月记录 ${vals.length} 天，样本偏少，多记录几天就能看趋势。` }];
    const first = vals[0].v, last = vals[vals.length - 1].v, diff = last - first;
    // 仅客观描述趋势，禁止任何减肥/减重/医疗建议
    if (diff !== 0) return [{ icon: ICON.weight, text: `观察到近期体重有持续变化（约 ${diff > 0 ? '+' : ''}${diff.toFixed(1)}），建议结合自身饮食运动感受，波动大建议咨询医生。` }];
    return [{ icon: ICON.weight, text: `本月体重在 ${first} 附近波动，整体平稳，可继续观察。` }];
  }

  function analyzeExercise(name, count) {
    if (count < 10) return [{ icon: ICON.exercise, text: `本月运动记录很少，每天可以抽出十几分钟简单活动身体。` }];
    return [{ icon: ICON.exercise, text: `本月运动 ${count} 天，继续保持，每周动几次身体更轻松。` }];
  }

  function analyzeGeneric(name, recs) {
    return [{ icon: ICON.generic, text: `【${name}】本月记录 ${recs.length} 天，继续保持记录，便于观察趋势。` }];
  }

  function habitCategory(name) {
    if (/排便|大便|如厕/.test(name)) return 'defecation';
    if (/喝水|饮水/.test(name)) return 'water';
    if (/睡眠|睡觉|入睡|作息|觉/.test(name)) return 'sleep';
    if (/体重|斤|kg|公斤/.test(name)) return 'weight';
    if (/运动|跑步|健身|锻炼|瑜伽|骑行|游泳|打球|跳绳|撸铁/.test(name)) return 'exercise';
    return 'generic';
  }

  // 对外：根据某年某月数据生成健康小结（结构化，供 UI 渲染图标 + 月度缓存）
  function analyzeHealth(store, year, month) {
    const ym = String(year) + '-' + String(month).padStart(2, '0');
    const dim = new Date(year, month, 0).getDate();
    const habits = (store && store.state && store.state.habits) || [];
    const recOf = h => (h.records || []).filter(r => (r.date || '').startsWith(ym));
    const items = [];

    habits.filter(h => h.type === 'RECORD_HABIT').forEach(h => {
      const recs = recOf(h);
      if (!recs.length) return;
      const n = h.name || '';
      const cat = habitCategory(n);
      if (cat === 'defecation') items.push(...analyzeDefecation(n, recs));
      else if (cat === 'water') items.push(...analyzeWater(n, recs));
      else if (cat === 'sleep') items.push(...analyzeSleep(n, recs));
      else if (cat === 'weight') items.push(...analyzeWeight(n, recs));
      else if (cat === 'exercise') items.push(...analyzeExercise(n, recs.length));
      else items.push(...analyzeGeneric(n, recs));
    });

    habits.filter(h => h.type === 'SOP_HABIT').forEach(h => {
      const n = h.name || '';
      const done = recOf(h).filter(r => r.status === 'success').length;
      if (habitCategory(n) === 'exercise') { items.push(...analyzeExercise(n, done)); return; }
      if (!done) return;
      const rate = Math.round(done / dim * 100);
      let txt;
      if (done >= dim * 0.8) txt = `本月打卡 ${done} 天，完成率约 ${rate}%，很稳，保持住。`;
      else if (done >= dim * 0.5) txt = `本月打卡 ${done} 天，完成率约 ${rate}%，过半了，再稳一点更理想。`;
      else txt = `本月打卡 ${done} 天，完成率约 ${rate}%，偏低，可以把目标拆小一点更容易坚持。`;
      items.push({ icon: ICON.sop, text: `【${n}】${txt}` });
    });

    habits.filter(h => h.type === 'QUIT_HABIT').forEach(h => {
      const n = h.name || '';
      const relapses = recOf(h).filter(r => r.status === 'fail').length;
      items.push(relapses === 0
        ? { icon: ICON.quit, text: `【${n}】本月 0 次破戒，做得很好，继续保持。` }
        : { icon: ICON.quit, text: `【${n}】本月破戒 ${relapses} 次，别苛责自己，复盘下多在什么场景下破戒，下次提前规避。` });
    });

    // 多项指标异常时最多 4 条，避免信息轰炸；记录型习惯优先保留
    const capped = items.slice(0, 4);
    return { period: ym, guide: capped.length === 0, items: capped };
  }

  /* ----------------------------- 对外接口 ----------------------------- */
  // 入参 user_input:string → 预览对象 {title, execute_date, cycle, remind, remind_time}
  async function parseTask(user_input) {
    const result = await __callAI('parseTask', user_input);
    // 中文时刻在前端确定性回填：无论走 mock 还是豆包，保证「晚上7点→19:00」生效
    return enrichTaskTime(user_input, result);
  }
  // 入参 content:string → 候选子任务字符串数组 string[]
  async function parseStrategy(content) {
    return __callAI('parseStrategy', content);
  }

  window.MPAI = { parseTask, parseStrategy, parseBatch, analyzeHealth, isPlaceholder: false };
})();

  /* =====================================================================

  C.HandCards = {
    name: 'HandCards',
    props: { habits: { type: Array, default: () => [] } },
    data() {
      return { currentIndex: 0, dragX: 0, dragging: false, startX: 0 };
    },
    computed: {
      today() { return this.$store.util.todayStr(); },
      hasCards() { return this.habits && this.habits.length > 0; },
    },
    watch: {
      // 列表因新增/删除/改时间而重排或缩容后，钳制 currentIndex 防止越界
      habits(v) { if (this.currentIndex > v.length - 1) this.currentIndex = Math.max(0, v.length - 1); },
    },
    methods: {
      statusOf(h) { const r = this.$store.getHabitRecord(h._id, this.today); return r ? r.status : null; },
      isHoliday(h) { return this.$store.isHoliday(h._id, this.today); },
      cardStyle(i) {
        const off = i - this.currentIndex;
        if (off < 0) return { transform: 'translateX(-60%) scale(0.92)', opacity: 0, zIndex: 0, pointerEvents: 'none' };
        if (off === 0) return { transform: `translateX(${this.dragX}px) rotate(${this.dragX * 0.02}deg)`, zIndex: 100, opacity: 1 };
        // 仅展示前 3 张预览卡，超出部分隐藏并禁用指针事件，避免手牌过多时卡片向下溢出覆盖导航「右切」按钮
        if (off > 3) return { transform: 'translateY(60px) scale(0.6)', zIndex: 1, opacity: 0, pointerEvents: 'none' };
        const capped = off; // off ∈ {1, 2, 3}
        return { transform: `translateY(${capped * 12}px) scale(${1 - capped * 0.05})`, zIndex: 100 - capped, opacity: Math.max(0, 1 - capped * 0.18) };
      },
      cardClass(i) {
        const h = this.habits[i];
        return {
          'is-front': i === this.currentIndex,
          'is-holiday': this.isHoliday(h),
          'done-success': this.statusOf(h) === 'success',
          'done-fail': this.statusOf(h) === 'fail',
        };
      },
      onDown(e) {
        if (!this.hasCards) return;
        if (!this.$store.swipeLock('handcards')) return;
        this.dragging = true; this.startX = e.clientX;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      },
      onMove(e) { if (!this.dragging) return; this.dragX = e.clientX - this.startX; },
      onUp() {
        if (!this.dragging) return; this.dragging = false;
        const t = this.dragX; this.dragX = 0;
        this.$store.swipeUnlock('handcards');
        const TH = this.$store.SWIPE_TRIGGER_PX;
        if (t > TH) this.swipe('right'); else if (t < -TH) this.swipe('left');
      },
      swipe(dir) {
        const h = this.habits[this.currentIndex]; if (!h) return;
        const holiday = this.isHoliday(h);
        if (dir === 'right') {
          // 右滑 = 未完成：标记后自动右切到下一张待完成手牌
          if (!holiday) this.$store.markHabitRecord(h._id, this.today, 'fail');
          this.goNextPending();
        } else {
          // 左滑 = 完成
          this.completeCurrent();

      },
      // 标记当前习惯完成：阅读习惯且存在书籍任务时弹出同步弹窗，完成后仍自动右切到下一张待完成手牌
      completeCurrent() {
        const h = this.habits[this.currentIndex]; if (!h) return;
        if (this.isHoliday(h)) { this.goNextPending(); return; }   // 请假中不可打卡，直接右切
        if (this.$store.requestReadingSync(h._id, this.today)) {
          this.$emit('reading-sync', { habitId: h._id, date: this.today });
          this.goNextPending(); // 等待弹窗确认 / 跳过后再标记习惯，手牌先切到下一张
          return;
        }
        this.$store.markHabitRecord(h._id, this.today, 'success');
        this.goNextPending();
      },
      // 是否「今日待完成」：非请假、且尚未打卡（未完成也未跳过）
      isPending(h) {
        if (!h || this.isHoliday(h)) return false;
        const st = this.statusOf(h);
        return st !== 'success' && st !== 'fail';
      },
      // 自动右切到下一张待完成手牌：从当前之后找第一张未打卡的；后续无则停在末张（保持右切方向收尾）
      goNextPending() {
        for (let i = this.currentIndex + 1; i < this.habits.length; i++) {
          if (this.isPending(this.habits[i])) { this.currentIndex = i; return; }
        }
        if (this.currentIndex < this.habits.length - 1) this.currentIndex = this.currentIndex + 1;
      },
      prev() { this.currentIndex = Math.max(0, this.currentIndex - 1); },
      next() { this.currentIndex = Math.min(this.habits.length - 1, this.currentIndex + 1); },
      openManage() { if (this.hasCards) this.$emit('manage', this.habits[this.currentIndex]); },
      openEdit() { if (this.hasCards) this.$emit('edit', this.habits[this.currentIndex]._id); },

    template: `

        <div v-for="(h,i) in habits" :key="h._id" class="handcard" :class="cardClass(i)" :style="cardStyle(i)">

  C.HabitManageModal = {
    name: 'HabitManageModal',

    data() {

      doneCount() {

      chartData() {
        const h = this.$store.findHabit(this.habitId);
        if (!h) return null;
        if (this.tab === 'year') {
          const byMonth = [];
          for (let m = 1; m <= 12; m++) byMonth.push(this.$store.habitCount(this.habitId, this.year, m));
          const annual = byMonth.reduce((a, b) => a + b, 0);
          return { name: h.name, mode: 'year', byMonth, annual };
        }
        const dim = new Date(this.year, this.month, 0).getDate();
        const byDay = [];
        for (let d = 1; d <= dim; d++) {
          const ds = this.year + '-' + String(this.month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
          byDay.push(this.dayHabitCount(h, ds));

      dayHabitCount(h, dateStr) {

          if (r.date !== dateStr) return false;
          if (h.type === 'SOP_HABIT') return r.status === 'success';
          if (h.type === 'QUIT_HABIT') return r.status !== 'fail';

      maxMonth() { return this.chartData && this.chartData.byMonth ? Math.max(1, ...this.chartData.byMonth) : 1; },

      navChart(dir) {

  // —— 日期类型 → 存储字段映射（统一「添加任务」三类型：仅年月 / 年月日 / 自定义区间）——
  // draft 需含 date_mode(''|'month'|'day'|'range')、plan_month('YYYY-MM')、execute_date、date_start、date_end
  function dateFieldsFromDraft(d) {
    const mode = d.date_mode || '';
    if (mode === 'month') {
      const ym = (d.plan_month || '').match(/^(\d{4})-(\d{2})$/);
      const y = ym ? Number(ym[1]) : null, m = ym ? Number(ym[2]) : null;
      return { date_mode: 'month', plan_year: y, plan_month: m, plan_week: null, execute_date: null, date_start: '', date_end: '', week_offset: null, time_mode: 'month' };
    }
    if (mode === 'day') {
      return { date_mode: 'single', plan_year: null, plan_month: null, plan_week: null, execute_date: d.execute_date || null, date_start: '', date_end: '', week_offset: null, time_mode: null };
    }
    if (mode === 'range') {
      const s = d.date_start || '', e = d.date_end || '';
      return { date_mode: 'range', plan_year: null, plan_month: null, plan_week: null, execute_date: s || null, date_start: s, date_end: e, week_offset: null, time_mode: null };
    }
    if (mode === 'week') {
      // 指定周：仅绑定归属周（本周/下周/下下周），不绑定具体日期；time_mode='week' 进入周看板
      return { date_mode: 'week', time_mode: 'week', week_offset: (d.week_offset == null ? 0 : d.week_offset), plan_year: null, plan_month: null, plan_week: null, execute_date: null, date_start: '', date_end: '', cycle: null };
    }
    // 未设置日期：保持已有 execute_date（若有），不清空用户已设的日期数据
    return { date_mode: 'single', plan_year: null, plan_month: null, plan_week: null, execute_date: d.execute_date || null, date_start: d.date_start || '', date_end: d.date_end || '' };
  }
  // 由已有任务推导编辑态 date_mode（用于初始化 draft）
  function dateModeOfTask(t) {
    if (!t) return '';
    if (t.plan_year && t.plan_month) return 'month';
    if (t.date_mode === 'range' || (t.date_start && !t.execute_date)) return 'range';
    if (t.execute_date || t.date_mode === 'single') return 'day';
    return '';
  }

  C.TaskFormCore = {

  C.TaskAddModal = {
    name: 'TaskAddModal',
    props: { defaultDate: { type: String, default: '' }, categoryId: { type: String, default: '' }, presetMode: { type: String, default: '' }, folderType: { type: String, default: '' } },
    components: { TaskFormCore: C.TaskFormCore },
    data() {
      return {
        draft: {
          title: '', desc: '', material_notes: '', material_link: '',
          category_id: this.categoryId || '',
          parent_category: '',
          folderType: this.folderType || 'task',
          tagInput: '', parsedTags: [], level3Hint: '',
          date_mode: this.defaultDate ? 'day' : '',
          plan_month: '', execute_date: this.defaultDate || '', date_start: '', date_end: '',
          week_offset: null, cycle_end_date: '',
          cycle_end_mode: '', cycle_end_count: 0,
          enable_remind: false, remind_time: '09:00',
          cycle: null,
          progress_info: { enable: false, media_type: 'book', progress_value: '' },
          isEmergency: false,
        },
      };
    },
    // 浮层栈：作为弹窗登记 dismiss，系统返回优先关闭本弹窗（返回来源页，不改写路由）
    created() {
      this._overlayDismiss = () => this.$emit('close');
      this.$root.pushOverlay(this._overlayDismiss);
    },
    beforeUnmount() {
      if (this._overlayDismiss) { this.$root.popOverlay(this._overlayDismiss); this._overlayDismiss = null; }
    },
    methods: {
      save() {
        if (!this.draft.title.trim()) { alert('请填写任务标题'); return; }
        // 周期规则校验（月 / 周）：失焦未校验或非法时阻断保存
        const form = this.$refs.form;
        if (form && form.validateCycleRule && !form.validateCycleRule()) return;
        // 存入前归一化分隔符（逗号 → 空格）
        if (this.draft.cycle && (this.draft.cycle.type === 'week' || this.draft.cycle.type === 'month')) {
          this.draft.cycle = Object.assign({}, this.draft.cycle, { rule: this.$store.util.normalizeCycleRule(this.draft.cycle.rule) });
        }
        const fields = Object.assign(dateFieldsFromDraft(this.draft), {
          title: this.draft.title.trim(),
          desc: this.draft.desc || '',
          material_notes: this.draft.material_notes || '',
          material_link: this.draft.material_link || '',
          category_id: this.draft.category_id || null,
          parent_category: this.draft.parent_category || '',
          is_template: this.draft.folderType === 'template',
          is_collection: this.draft.folderType === 'collection',
          enable_remind: !!this.draft.enable_remind,
          remind_time: this.draft.remind_time || '',
          cycle: this.draft.cycle || null,
          cycle_end_date: this.draft.cycle_end_date || '',
          cycle_end_mode: this.draft.cycle_end_mode || '',
          cycle_end_count: Number(this.draft.cycle_end_count) || 0,
          progress_info: this.draft.progress_info,
          isEmergency: !!this.draft.isEmergency,
        });
        if (this.draft.hasLevel3 && this.draft.level3Chain) {
          this.$store.addTaskUnderLevel3(fields, this.draft.level3Chain);
        } else {
          this.$store.addTask(fields);
        }
        this.$emit('close');
      },
      // 「每天」→ 习惯：新增为记录型习惯（不创建任务），关闭并跳转今日（习惯页）
      onConvertHabit(draft) {
        this.$store.convertTaskToHabit(draft, null);
        this.$emit('close');
        location.hash = '#/today';
      },
    },
    template: `
    <div class="modal-mask" @click.self="$emit('close')">
      <div class="modal modal-lg">
        <div class="modal-head"><h3>新增待办</h3><button class="x" @click="$emit('close')">✕</button></div>
        <div class="modal-body">
          <TaskFormCore :draft="draft" ref="form" @convert-habit="onConvertHabit" />
          <div class="modal-actions">
            <button class="btn ghost" @click="$emit('close')">取消</button>
            <button class="btn primary" @click="save">确定</button>
          </div>
        </div>
      </div>
